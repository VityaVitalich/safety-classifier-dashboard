const D={"FineWeb-2": {"deu_Latn": {"0": [{"id": "<urn:uuid:890004fd-4d76-4f82-83fb-0f2c840ec970>", "text": "iVideo Cocktails – ihr Barkeeper auf dem iPad, iPhone – Video\nHier ein Beispiel-Video aus der heute vorgestellten App iVideo Cocktails, der iVideo Cocktails: Carabean Doodoo\nGestern stellte die Bundesministerin Ilse Aigner zusammen mit dem Spitzenkoch Christian Rach die App zur BMELV Initiative ‘Zu gut für die Tonne’ vor. Mit dieser sehr lobenswerten Aktion möchte das Bundesministerium für Ernährung,... weiterlesen\nDer erste Kälteschock und Wintereinbruch liegt bereits hinter uns. Glaubt man den"}, {"id": "<urn:uuid:4cd2db15-ae0c-482a-8688-d023d4b19f60>", "text": "Automarkt Altötting\nWohnmobile & Wohnwagen in Altötting\nUrlaub machen – egal wo, egal wann. Mit einem Wohnwagen haben Sie unbegrenzte Möglichkeiten. Genießen Sie einen Urlaub im Freien, ohne ganz auf den alltäglichen Komfort verzichten zu müssen. Finden Sie jetzt Ihren idealen Caravan.\nWohnmobil finden\nMotorradmarkt Altötting\nHier finden Sie neue und gebrauchte Motorräder sowie Mofas, Roller, Quads, Chopper und Ersatzteile für Motorräder. Sie können auch Ihr eigenes Motorrad kostenlos inserieren"}, {"id": "<urn:uuid:7878752c-a6b2-43ab-861b-92d094cfa9f1>", "text": "Willkommen auf B-Stadt.com / The Finest in German Rap\nam Donnerstag, 17 Januar 2013.\ngepostet in Rap\nNachdem es die letzte Zeit etwas ruhiger um Amar geworden ist, hat er heute einen neuen Freetrack mit dem Titel \"I. A. K. Exclusive\" (feat. Midy Kosov & Son Saifa) veröffentlicht. Freetrack anhören!\nSie kommentieren als Gast."}, {"id": "<urn:uuid:9c30467c-b7fa-4239-a9a2-2d67938489e1>", "text": "Wir, die #bonnerschule, bieten jungen Kreativen eine Plattform, ihr kreatives Schaffen zu veröffentlichen. Von Fotografie über Prosa, Videos bis hin zu Audio-Material könnt Ihr alles einreichen – Wir setzen Eurem Ideenreichtum keine Grenzen.\nDieser Blog ermöglicht einen Blick über den Tellerrand und gibt Antwort auf die Frage, wie facettenreich Fantasie sein kann.\nSchickt uns Eure Beiträge, zeigt der Welt Eure Arbeiten und tretet mit anderen Künstlern in Verbindung.\nStellt Euer Schaffen unter BE"}, {"id": "<urn:uuid:6e68519b-cdb6-4c47-a462-12c6bcf974cc>", "text": "Bücher sind mein Leben. Am liebsten lese ich zeitgenössische Literatur und zwar alles, was ich in die Finger bekommen kann. Ich lese jedoch nicht nur, sondern schreibe auch noch gerne über das, was ich gelesen habe. Das möchte ich hier tun. Auf den Namen \"Buzz Aldrin\" bin ich durch ein Buch von Johan Harstad gekommen, das mich sehr beeindruckt hatte."}, {"id": "<urn:uuid:cea74af8-b908-455c-baac-a4254d684e90>", "text": "Rollover to Magnify\n\n\nPostCarden Grußkarten\n12,00 €\n5,90 €\ninkl. MwSt zzgl. Versandkosten\nDie liebenswerteste Grusskarte seit Langem...\nSchau Dir dies mal an: PostCarden ist das universellste Geschenk - eine Grusskarte - komplett neu erfunden. Die wunderbaren Denker und Designer von 'Another Studio for Design' in England dachten sich, dass konventionelle Grusskarten an Spitzigkeit und Einfallsreichtum vermissen lassen. Erhältst Du eine Grusskarte mit Deiner Tagespost, wird diese immer Deine sons"}, {"id": "<urn:uuid:2df6c77f-ad82-4caa-9d25-c01465f423d2>", "text": "Microsoft hebt seinen neuen E-Mail-Dienst Outlook.com aus dem Beta-Stadium. Die Umstellung bedeutet für den bisherigen Dienst Hotmail.com das Aus. Demnächst würden alle Hotmail-Nutzer auf Outlook.com umgestellt werden, heißt es in einem Blogeintrag. An der E-Mail-Adresse ändere das nichts, verspricht Microsoft. Die @hotmail.com-Adressen dürfe man so lange behalten, wie man möchte. Auch Ordner, Kontakte und Nachrichten bleiben ohne Einschränkung erhalten.\nNeu ist dafür die Nutzeroberfläche, die i"}, {"id": "<urn:uuid:86fce9f7-d5a8-49ff-85c4-e10b9ce5fdd2>", "text": "Der fNordeingang ist absofort ein eingetragener Verein!\nfNordeingang evolves\n24. Dezember 2011\nEs tut sich einiges im Hintergund. Wir sind mittlerweile mitten in der Vereinseintragung und es sollte früh im Januar soweit sein. Sobald das alles durch ist kommt das Konto damit Ihr uns auch alle schön spenden und eure Mitgliedsbeiträge auf einfache Weise zahlen könnt.\nAußerdem haben wir eine neue Mitgliederverwaltung inkl. Buchhaltungs Foo, der Bürokrat zieht dann auch so ein bisschen in den fNordei"}, {"id": "<urn:uuid:572388f0-0637-4c6a-9f4f-f1f1f8252cf2>", "text": "jugendfest.de - Zugabe\nSpielen mit SchlammbaSchlammba hat Spiele für dich: Virusbuster, Galgenraten, Memory, Liebesbrief-Werfen, Such-den-Ort, Dampfer-Versenken und Mau-Mau! weiter\nNewsletterPer Email oder SMS über alle Veranstaltungen informiert werden - damit du nichts verpasst. weiter\nKauf Dir WasT-Shirts, Eschdorf-Klamotten, MauMau-Karten, Aufkleber, CDs - hier günstig bestellen! weiter\nDownloadsBanner, Videos, Hintergründe, Wallpapers - so viel kannst du hier herunterladen. weiter\nRätselFli"}, {"id": "<urn:uuid:1fadca47-9b53-44c4-9fbd-18b5321a627e>", "text": "Dieser Newseintrag ist älter als 30 Tage und daher nur für Abonnenten des kressreport zugänglich. Wenn Sie den Artikel ganz lesen und uneingeschränkten Zugang zu unserem Archiv haben wollen, hinterlegen Sie doch bitte im Kontrollzentrum Ihre Abonummer unter dem Punkt \"Archivzugang freischalten\". Dort können Sie nun Ihre Abonummer eintragen und unser XXL-Archiv, das bis ins Jahr 1966 zurückreicht, steht Ihnen offen.\nSie arbeiten in der Medien- und Kommunikationsbranche? Dann registrieren Sie sich"}, {"id": "<urn:uuid:80cf27ae-81ac-4704-8732-92c110a24d63>", "text": "Letztes Update am 22.06.2012, 15:25\nAußerordentliche Chefs sind immer ganz viel Mensch bei ihrem Tun. Eine Renaissance des Humanismus? Schön wäre das.\nWer glaubt, alleine durchzukommen, verliert. Das gilt in allen Bereichen des Lebens. Und im Geschäftsleben heute mehr denn je.\nBank-Manager Herbert Stepic drückt das treffend so aus (siehe Interview auf der letzten Seite): \"Ich habe diesen Posten nie angestrebt. Das kann man gar nicht. Weil wenn man das tut, wird man so verbissen, dass man zu eine"}, {"id": "<urn:uuid:63dc1ecb-139f-46fe-80ff-a24051f197b1>", "text": "Wenn ich zum Einkaufen gehe, schaue ich zuerst in der Obstabteilung vorbei, ob frische Mangos angeliefert worden sind. Wenn frische Mangos geliefert worden sind, dann suche ich mir 2 Mangos aus. Ich nehme sie in die Hand, und fühle ob die Mango noch hart sind.\nWenn die Mangos schön sind und nach dem typischen Mangoduft riechen, kaufe ich die 2 frischen Mangos. Zuhause angekommen, lege ich dann meine Mangos in die Obstschale und warte ein paar Tage.\nWarnung: Lassen sie sich nicht dazu verführen, "}, {"id": "<urn:uuid:96dfb030-0b33-4946-8117-1ddd9cdbb8cf>", "text": "|Start About The Resort Rates Gallery Guestbook Contact|\n\n\n·Secret Garden Guestbook·Leave us a note.\nBarbara und Christian [Vienna]\nHallo ihr Lieben!\nWir waren bei euch letztes Jahr im November. Wir möchten uns bei euch für die tolle Zeit und das wunderbaren Essen von Pai bedanken. Wir hoffen , dass es uns die Zeit erlaubt euch und Chiang Mai noch einmal zu sehen:)) Peter wir hoffen, dass du und Pai inzwischen auch Zeit habt um euren wunderschönen Secret Garden zu genießen.\nLiebe Grüsse und bis "}, {"id": "<urn:uuid:2bb49ef0-f3ae-4b94-830b-cb6c08d65857>", "text": "08.05.2013\nFifa 14: Game\nErleben Sie in FIFA 14 kompletten Fussball und die Faszination großartiger Tore. Das Game jetzt vorbestellen und pünktlich am 25.09.2013 erhalten!\n30.04.2013\nWanderlust\nEndlich ist der Frühling da und los gehts in den Bergen. Entdecken Sie jetzt unser grosses und qualitativ hochwertiges Sportsortiment im Bereich Wandern."}, {"id": "<urn:uuid:85f94f05-09ca-414c-ad6a-d3b0324da380>", "text": "jQuery-Mobile-Erweiterung\nProgramm:\nSendung veröffentlichen\nWählen Sie die passende Einbettungsgröße aus, und fügen Sie den obigen Embed–Code über die Zwischenablage ein.\n442 x 256\n515 x 296\n640 x 367\nBenutzerdefinierte Größe\nBreite: px Höhe: px\nÜber Diese Sendung\nJetzt gibt's ein eigenes Fenster für die Entwicklung von Designvorlagen für jQuery Mobile: Hier gibt's einen kurzen Einblick, was Sie dort alles anstellen können.\nDauer : 00:02:07 Hinzugefügt am : 05/06/2012\nÜber dieses Programm\nLerne "}, {"id": "<urn:uuid:9eac1ebc-9cf0-4533-ae0c-8334f9793b0a>", "text": "Draufkleben und überall hin verschicken\nWenn Sie ein Online-Geschäft betreiben und Ihre Ware z.B. auf Etsy oder auf Ihrer eigenen Website verkaufen, verbringen Sie die Hälfte der Zeit mit Verpacken und Verschicken. Daher brauchen Sie unbedingt ein auffälliges Absenderetikett, um Ihren Kunden zu vermitteln, dass Sie Wert aufs Detail legen.\nAdressetiketten von MOO können Sie mit Ihrem Logo, auffälligen Farben oder Bildern ganz nach Wunsch gestalten. Je professioneller Ihre personalisierte Verpacku"}, {"id": "<urn:uuid:642e408f-994c-4135-8958-669e15c381b7>", "text": "Dieser Positionierer eignet sich für Anwendungen mit zwei Stationen (Arbeits- und Einlegestation), bei denen das Werkstück um zwei Achsen gedreht werden muss. Die Anordnung gestattet es dem Bediener, alle Be- und Entladevorgänge ergonomisch auszuführen. Dabei ist der Bediener gleichzeitig durch den integrierten Blendschutz vom Schweißvorgang abgeschirmt.\nDer IRBP D ist in zwei Varianten erhältlis, die bis zu 600 kg handhaben können. Der Positionierer ist ideal für Anwendungen, bei denen das Werk"}, {"id": "<urn:uuid:f0859661-7f08-44c8-9616-ad0cfdc4f185>", "text": "Wenn Sie nach einem günstig liegenden Hotel in Berlin suchen, dann sollten Sie das Gold Hotel am Wismarplatz in Erwägung ziehen. Das aufregende Stadtzentrum liegt lediglich 5.5 km entfernt. Seine wohlgepflegte Umgebung als auch die Nähe zu U-Bahnhof Samariterstraße, Skatehalle Berlin, U-Bahnhof Frankfurter Tor verleihen diesem Hotel einen ganz besonderen Charme.\nIm Gold Hotel am Wismarplatz wird kein Aufwand gescheut, um es dem Gast recht zu machen. Um das zu erreichen, stellt das Hotel einen ta"}, {"id": "<urn:uuid:56fe633f-7c1b-4dc8-9564-2f0bd3ab567f>", "text": "Wir verwenden Cookies, um diese Webseite zu betreiben und ihre Benutzerfreundlichkeit zu verbessern. Vollständige Details darüber, was Cookies sind, warum wir sie verwenden und wie Sie sie verwalten können, finden Sie auf unserer Seite Datenschutz & Cookies. Bitte beachten: Durch Benutzung dieser Seite stimmen Sie der Verwendung von Cookies zu.\nSkip to main content"}, {"id": "<urn:uuid:8f660a2c-070b-4de1-a807-fc12bc94c4d2>", "text": "Bremenhalle\nDie Bremenhalle auf dem Dach des Terminals kann für Veranstaltungen und Events aller Art gemietet werden. Sie bietet einen herrlichen Ausblick auf das Rollfeld und gleichzeitig ein außergewöhnliches Ambiente. Ein kleiner Tagungsraum ist direkt an die Halle angeschlossen. An Tischen können bis zu\n120 Gäste empfangen werden, ohne Bestuhlung bietet die Bremenhalle Platz für 300 Gäste.\nGröße\n- über 800 m² einschließlich Nebenräume\nMögliche Bestuhlungsformen\n- Bankettbestuhlung bis 120 Pe"}], "1": [{"id": "<urn:uuid:9a1ad857-5f62-4fd0-95bf-55d90122bbdc>", "text": "Ich glaube nicht an Konzepte, nur an Menschen. Deswegen war es ein Glück, dass ich den neuen Marketing-Direktor für Enter- tainment (und damit Xbox) bei Microsoft kennen lernen konnte, bevor heute das Magazin Horizont über ihn berichtet. Ich habe Jens Tinapp am Rande eines Events in München zu 50 Jahren Microsoft (Foto) eine Weile gesprochen und verfolge seitdem gespannt, wie er in der deutschen Xbox-Einheit loslegt.\n“New Xbox Experience”\nHorizont ist ein Fachmagazin für Werber und Medienagentur"}, {"id": "<urn:uuid:67c2dd12-c4a8-4506-b0d8-83ce1fa46da5>", "text": "Video\nKennt Ihr die \"Coke Zero Werbung\" in der die Kinogäste sich ihren teuren Becher Cola kaufen und sich dann ins Kino setzen? Statt informativer Vorschauen und den endlos wirkenden Werbespots taucht auf einmal dieser Cola-Typ auf und verkündet, dass die Kunden nicht wie gewünscht ihre zuckertriefende Cola bekommen haben, sondern das entzuckerte Produkt \"Coke Zero\". Zu allem Überfluss ist der Typ auch noch stolz auf seinen Beschiss und gibt seinen Betrug (meine Meinung, meine nicht-juristische"}, {"id": "<urn:uuid:87bcaf62-6ad9-4bee-83c2-0885d877ace4>", "text": "Nachdem ich ein Faible für Underdogs habe, dem Unperfekten offen gegenüberstehe, ein Tablet von Apple aufgrund deren Produktimperialsmus nicht in Frage kam, ich dafür aber ein mit Linux angetriebenes Gerät wollte, habe ich mir Ende letzten Jahres ein WeTab gekauft. Gut, ein Android-Tablet von Samsung stand kurz auch zur Debatte, schied dann aber aus, weil ich mir davon keine neue Nutzererfahrung versprach – schließlich habe ich bereits ein Smartphone mit Android und ich weiß,was ich daran habe.\n"}, {"id": "<urn:uuid:8e0de917-68cd-4e9a-81e9-e2cb1ec69cf9>", "text": "Der Pencilskirt kommt niemals aus der Mode - auch in der kommenden Saison wird er als Stil-Evergreen unverzichtbar sein.\nWir haben unser Lieblingsstück, von Just Cavalli, herausgesucht und zeigen Euch wie ihr diesen Klassiker ganz einfach für den Büroalltag und die rockige Nacht kombinieren könnt.\nFür den Tag: kombinieren wir den Rock mit einer weissen Hemdbluse, minimalistische Accessoires und ladylike hohe Schuhe fürs Business-Outfit.\nFür die Nacht: Mach doch mal ein bisschen rockig und setzen"}, {"id": "<urn:uuid:bafb976f-bd16-41d2-8c79-f5409d4f1238>", "text": "Ja, so langsam wird es doch Winter.\nDa geht mit frischem Gartengemüse und Salat leider fast nichts mehr. Also heißt es die Vorräte aus dem Gefrierschrank nach und nach abzuarbeiten. Diese Mal standen Bohnen auf der Liste.\nIch entschied mich für eine Quiche. Oder sollte ich besser sagen, für einen belegten Mürbeteig, da ich es nicht so üppig wollte.\nBeim Teig entschied ich mich für das Rezept von Ariane. Ein salziger Mürbeteig der nicht blind vorgebacken werden muss. Der Teig hat fast was von Blä"}, {"id": "<urn:uuid:fabd587e-e86a-4689-b857-3aa5a5009cd2>", "text": "Lapislazuli Ohrringe in Antik-Bronze\n\n\nKlicke auf das Bild, um es zu vergrößern\n\n\nHallo,\nHier habt ihr ein paar Allgemeine Infos.\n<<< Dein Schmuck wird sofort nach Zahlungseingang versendet. Bitte beachte aber, dass wir auf die Versandzeit keinen Einfluss nehmen können. Mit Glück erreicht Dich dein Päckchen am nächsten Tag, mit ein wenig Pech kann es bis 3 Tage dauern. Natürlich kann es aber wie in jedem anderen Unternehmen, auch bei der Post zu Verzögerungen kommen, die noch länger dauern. So k"}, {"id": "<urn:uuid:854ecc0e-f57d-4b99-8601-110303dc1c39>", "text": "In Athener Schulen lässt die griechische Regierung mittlerweile Nahrungsmittel verteilen, um die Kinder vor Unterernährung zu schützen. Das ist nur ein Zeichen dafür, wie verheerend die Lage bereits ist. Wenn Familien eines Eurolandes nicht mehr in der Lage sind, die Grundbedürfnisse ihrer Kinder zu decken, zeigt das auch ziemlich nachdrücklich, dass nicht alle Griechen von den Unmengen an Geld profitiert haben, das dem Land seit dem Euro-Beitritt zur Verfügung steht. Vielmehr hat ein Großteil d"}, {"id": "<urn:uuid:856d3d01-6afa-4e9f-adfd-6e5044173772>", "text": "Die Europäische Zentralbank (EZB) hat am Montag damit begonnen spanische und italienische Staatsanleihen zu kaufen. Die Sparpläne Italiens und Spaniens führten in der EZB zu der Einschätzung, dass es \"legitim\" sei, beiden Ländern zu helfen, sagte der französische Finanzminister Francois Baroin am Montag in der Früh im Radiosender Europe 1. EZB-Präsident Jean-Claude Trichet hat die Anleihen-Käufe europäischer Notenbanken im Interview mit dem ZDF verteidigt.\nDie EZB hatte am Sonntag angekündigt, S"}, {"id": "<urn:uuid:8d7ebd5c-c872-4b5a-a48c-d370c9fc3648>", "text": "Eselwandern in den Cevennen - Gruppentour\nAuf den Spuren von R. L. Stevenson\nDie Cevennen bieten eine erstaunliche Vielfalt an Landschaftsbildern: Heidelandschaften, Hochebenen und der Mont Lozère; eine von Generationen von Tierzüchtern und Landwirten geprägte Landschaft. Die Cevennen, das sind: Berge, Wälder, Steppen, Bäche und vom Menschen geschaffene Landschaften wie Almen, Terrassen, Weiden und kleine Dörfer. Bereits 1878 machte Robert Louis Stevenson die Cevennen bekannt. Sein Reisebericht "}, {"id": "<urn:uuid:59de410c-1877-41fc-bcad-18add264caf8>", "text": "Welcher farbtyp bin ich? Wissen Sie es?\nDie Farbtypenlehre kennt vier verschiedene Farbtypen:\n-Frühling\n-Sommer\n-Herbst\n-Winter\nFarben die Wintertypen auszeichnen sind sehr kräftig. Z.B. ein leuchtendes Rot aber auch ...\nSie möchten im privaten oder geschäftlichen Umfeld erfolgreicher werden?\nDann entdecken Sie Ihre natürlich Schönheit und lernen Sie Stilsicher aufzutreteten!\nDie Natur hat jedem Menschen perfekt aufeinander ..."}, {"id": "<urn:uuid:764ffcbe-356b-473b-a377-c2e4df6c8f82>", "text": "Noch ist der Mai da und dieser Monat lädt dazu ein, sich eine leckere Waldmeister-Bowle anzusetzen. Bekannt ist dieses frühlingshafte Getränk auch als Maibowle. Ob aus frischem Kraut oder getrocknetem Waldmeister-Kraut, mit diesem Getränk läuten Sie den Frühling ein. Und wie wird sie nun zubereitet? Ganz einfach: Das Verhältnis Weißwein – Sekt sollte 2:1 sein. [...]\nWer im späten Frühjahr einen Spaziergang macht riecht seinen Duft schon von Weitem. Der blühende Holunder hat ein süßes und angeneh"}, {"id": "<urn:uuid:03f43e6d-cfa6-4ffd-b4f7-5dedeef8cf15>", "text": "Beiträge mit-Tag\nZelda-inspiriertes Kartenspiel\nBereits seit über einem halben Jahr findet ihr im Internet Konzeptgrafiken für ein „The Legend of Zelda“-Kartenspiel bei deviantArt. Der Schöpfer dieser witzigen Pokerkarten-Alternative hat seine Vision nun in ein echtes Produkt umgesetzt und verkauft dieses für schmale 15 US-Dollar.\nDie Karten, die sich freilich auch für andere Spiele wie Skat, Mau-Mau oder gar Rommé eignen, lehnen sich an diverse Figuren aus dem beliebten Nintendo-Universum an. B"}, {"id": "<urn:uuid:cb03aba2-8b40-4770-b133-b72c0e3b509f>", "text": "Wie ist die korrekte Schreibweise für zusammengesetzte Wörter. Werden diese mit einem Bindestrich getrennt oder nicht? Mir geht es vor allem um Leichtathletik-Verein / Leichtathletikverein oder Leichtathletik-Zentrum / Leichtathletikzentrum.\nBei Wikipedia finde ich beide Schreibweisen gemixt. Auch auf Korrekturen.de (http://www.korrekturen.de/regelwerk/schreibung_mit_bindestrich.shtml) oder Duden.de habe ich nichts gescheites gefunden.\nAuch habe ich gelesen, dass Wörter zur besseren Lesbarkeit i"}, {"id": "<urn:uuid:99a448c3-5982-484e-9790-84f38f84466e>", "text": "Datum:\nSamstag, 19.05.2012\nDoors:\n22:00 Uhr\nShow:\n23:00 Uhr\nOrt:\nFoyer\nKonzert: Elektro-Rock\nParty: Elektro, Disco & House\nEintritt: 20.-\nFIJI BAND - LIVE\nEL TIGRE SOUND\nGYPSY BROS\nHochstehender Elektro-Rock vom Durchstarter-Trio Fiji, auserlesener Disco und House von unserem Luzerner Lieblingstiger, raffinierte Liaison aus Swing- und Indierock-Tracks mit Elektro von den Gypsy Bros. Matrose Klose weiss, was mit Feiern bis zum Umfallen gemeint ist.\nWenn sich ein Seemann landgangsfein macht, auf K"}, {"id": "<urn:uuid:3278a728-d95e-427b-85ea-da1fb7caa798>", "text": "Re: Problem mit texdoctk\nFrank Küster <email@example.com> wrote:\n> Nein, es ist genau umgekehrt. \"von dpkg gemanagt\" sind die normalen\n> \"conffiles\", also die welche bereits im Paket drin sind, genauso wie\n> /usr/bin/texdoctk und /usr/share/man/man1/texdoctk.1.gz. Und bei denen\n> wird, wenn sie ein anderes Paket übernimmt, sehr wohl \"notiert\" wem die\n> Datei jetzt gehört, so dass sie eigentlich eben beim purge nicht\n> gelöscht wird.\nSoweit stimmt es.\nDas Problem, das mir erst jetzt bewusst wurde"}, {"id": "<urn:uuid:ad01b3dd-170f-4de7-b1d3-75797e95cf7e>", "text": "You are currently using our new player\nAm Freitag der Megaevent Woche des Swatch Skiers Cup war es so weit, der letzte Contesttag stand an, der Backcountry Slopestyle. Seit tagen war die Schneelage schon nicht sehr vielversprechend und auch kein ergibiger Schneefall angesagt. Die Shaper der Skiers Cup Belegschaft schaufelten nichts desto trotz einen Freestyle Run in das Backcountry von Vale Nevado, direkt am berüchtigten Hotel Puerta Del Sol vorbei. Die Kameras waren bereit, die Helis auch, als "}, {"id": "<urn:uuid:6c1eaf54-aa50-448b-99f3-80d31c231451>", "text": "Angeregt durch ein paar Einträge in mein blog:\nWie sieht es mit Gott und und Naturwissenschaften aus?\nDas ist natürlich ein unendliches Thema.\nDaher ein bisserl Fokussierung:\nDie Vorstellung eines Schöpfergottes ist klarerweise nicht in Konflikt mit den Naturwissenschaften. Aber ist ein Gott denkbar, der, wie es die meisten Religionen annehmen, nach wie vor in die Welt eingreift, jedoch ohne mit den Naturwissenschaften in Konflikt zu geraten?"}, {"id": "<urn:uuid:051bde09-f143-4d8c-81f4-4d1761936dbe>", "text": "Unser Thema des Tages\n9 Beiträge\nTop Themen im Schwangerschafts- magazin\nWährend der Schwangerschaft bei Mc Donald´s\nvon: assel82\nSchwangerschafts- forum\nErnährung\nDarf man eigentlich während der Schwangerschaft zu Mc Donald´s gehen?\nWährend der Schwangerschaft bei Mc Donald´sÄhnliche Fragen / Diskussionen\nHallo meine Lieben, ich bin jetzt in der 5. Woche schwanger - Das habe ich letzte Woche herausgefunden :) Bin überglücklich, aber kann mich nicht ganz entspannen, weil ich in meiner ersten und"}, {"id": "<urn:uuid:3ac78c2a-f8fc-471f-956d-fb252ca27a1e>", "text": "|Spieletest für das Spiel : FADEN\nVERLOREN\n\n\nHersteller: MB\nPreis: n.b.\nempf.Alter: 8-\nAnzahl Spieler: 1-\nErscheinungsjahr: 1984\nnoch erhältlich: Nein\nAutor:\nBesonderheit:\nKategorie: Denkspiel\nAusstattung: 12 Quadrate\nmit einem Aufdruck eines Seils\nAufmachung: In der kleinen Verpackung befindet sich ein Plastikeinsatz, in dem die 12 Quadrate sicher und rutschfest liegen können. Die Spielanleitung zu diesem Spiel ist auf dem Boden der Verpackung abgedruckt. Die Quadrate sind recht stabil und zeig"}, {"id": "<urn:uuid:1849421f-fa17-40ec-b075-f25cac981be6>", "text": "Ultimate und Discathon\nUltimate:\nUltimate ist ein Mannschaftssport mit Frisbee. Ganz wichtig dabei: Der „Spirit of the Game“, der diesen körperlosen Sport zu einem der fairsten überhaupt macht.\nFair Play wird nämlich groß geschrieben beim Ultimate: Es gibt keinen Schiedsrichter, die Spieler zeigen Fouls selber an. Das Spielfeld ist in der Regel 100 mal 37 Meter groß, davon nimmt die Endzone – deren Erreichen das Ziel ist – auf beiden Seiten jeweils 18 Meter ein. Es spielen sieben Akteure in gemi"}], "2": [{"id": "<urn:uuid:d089a68f-6700-4a15-ba5f-b10ea2305838>", "text": "Archive for März, 2012\nDass Salz immer in Maßen konsumiert werden sollte, dürfte jedem ernährungsbewussten Verbraucher bekannt sein. In welchen Mengen ist Salz aber tatsächlich empfehlenswert?\nDie Deutsche Gesellschaft für Ernährung empfiehlt eine Höchstmenge von 6 Gram\nm Salz pro Tag für Erwachsene. Diese Menge entspricht etwa einem gestrichenen Teelöffel Salz. Der tägliche Bedarf des Körpers an Salz liegt in der Regel zwischen 3 und 6 Gramm. Der menschliche Körper benötigt Salz unter Anderem f"}, {"id": "<urn:uuid:9eb6286f-05c2-464a-be58-ed1d42b5749b>", "text": "Wer mit seinen Großeltern aufwachsen darf, ist gesegnet. Von ihnen kann man lernen, sie lassen viel mehr durchgehen und sie lieben einen über alles. Auch Andreas Gabalier (aktuelles Album: „Volks-Rock ’n’ Roller“) hatte dieses Glück. Sein Opa ist leider verstorben, aber Gott sei Dank hat er noch seine Oma Maria.\nWir begleiteten Andreas Gabalier und seine geliebte Großmutter bei einem Ausflug auf eine Jagdhütte in der Steiermark (Österreich). Auf 1.800 Metern Höhe hatten die zwei eine wunderschön"}, {"id": "<urn:uuid:297ba0ac-6563-463a-83b9-a75f301e7294>", "text": "Nachrichten in aller Kürze\nAlles zur Community\nNachrichten, die zu Ihnen kommen: Newsletter, Feeds und SMS\nAlles zu unseren mobilen Angeboten: Apps, Mobilversion und SMS\nUnsere Radio- und TV-Angebote\nDie Zeitung im Internet: Abo, E-Paper, Anzeigen und mehr\nAlles über die Redaktion von derStandard.at\nAlles über Onlinewerbung, Stellenanzeigen und Immobilieninserate\nDer Schweizer SVP-Abgeordnete Dominique Baettig fordert allen Ernstes, die Voraussetzungen zu schaffen, dass Vorarlberg, Baden-Württem"}, {"id": "<urn:uuid:75b00fb4-c57e-44d5-94ef-b700ec24f617>", "text": "Täglich sterben ganze Wälder für Papier. Papier, mit dem überall auf der Welt sinnlos Dokumente ausgedruckt werden: Websites, E-Mails, sogar komplette Bücher. Und das, obwohl man Dokumente, statt sie zu drucken, einfach als PDF speichern könnte. Aber auch ein PDF kann man oft noch drucken. Um das unnötige Ausdrucken zu stoppen und den bewussten Umgang [...]"}, {"id": "<urn:uuid:82e0f7ce-9018-4d03-ac98-c598576e4add>", "text": "Straffälligenhilfe – damit die Resozialisierung leichter fällt\nDie diakonischen Werke in Stadt und Landkreis Osnabrück haben sich dieses Frühjahr zu einem gemeinsamen Diakonischen Werk zusammengeschlossen. Seit diesem Zeitpunkt ist die Straffälligenhilfe ein eigenständiger Geschäftsbereich. Dazu gehören die Anlaufstelle für Straffällige, die Wohngemeinschaft für Haftentlassene und das Fachzentrum gegen Gewalt. Die Straffälligenhilfe hat jetzt ihren Jahresbericht für 2011 herausgegeben. Am auffäl"}, {"id": "<urn:uuid:3a9e1a53-f47b-461e-86a6-4a51cab807d6>", "text": "Von:\nUwe\nWarum verwaltet unser Staat das Geld nicht selbst.?\nIn einem echten demokratischen Staat, in dem alle Macht vom Volk ausgeht, müssten die gewählten Volksvertreter auch die Hoheit über das Geld haben.\nDer Geldwert müsste an realistischen Werten, die ein Staat auch leisten oder erbringen kann, fest gemacht werden.\nAls Beispiel :\n1kg Mehl ist 1€ wert. Staatlich hergestellter Wohnraum kostet als Beispiel 3 €/m² usw.\nDenn Gold und Silber oder ähnliches ist überhaupt nichts wert und kann von "}, {"id": "<urn:uuid:0d230659-8593-4182-9bbd-de785afedb66>", "text": "Warum entscheiden sich die Leute nicht gleich für Network Marketing?\nWäre in den Familien ein Network Marketing Einkommen, würden die Mütter und/oder Väter viel lieber die Entscheidung treffen, zuhause bei den Kindern zu bleiben.\nDa heute leider nur eine kleine Zahl erfolgreicher und gut verdienenden Network Marketing Unternehmer in Deutschland präsent sind, müssen sich die meisten Familien mit dieser Situation herumschlagen und ägern sich, dass es keine Krippenplätze und keine Kindertagesstätte"}, {"id": "<urn:uuid:9aea1f05-b981-4692-b18c-f855b498e268>", "text": "Die ersten im Heidedorf Bargfeld entstandenen Erzählungen Arno\nSchmidts zeigen einen Erzähler mit völlig verändertem Lebensgefühl.\nKein Zugvogel mehr, unruhe- und liebegetrieben, Wunschzielen\nnachschweifend. An die Stelle von Flüchtlings-Unterschlupf,\nRefugium im Moorversteck, Verwandtenquartier oder wohlberechnetem\nEinnisten bei Zufallsbekannten tritt das kleine Eigenhaus auf dem\nLande, gegen Eindringlinge abwehrend umzäunt, Seßhaftigkeit\nsichernd. Statt des freien Sturms der Liebe die Anmutung"}, {"id": "<urn:uuid:fefdb93e-221a-4887-87bd-d8a9e0849042>", "text": "http://news.bpholdingsmngt.de/\nSteuerbetrug tritt auf, wenn einzelne, Inhaber der Unternehmen oder Unternehmen absichtlich Informationen bezüglich ihrer Steuererklärungen fabriziert, um ihre Steuerschulden Betrag zu begrenzen. Steuerbetrug ist im Grunde beinhaltet falsche Angaben oder die Unterlassung von Daten über die Steuererklärung die gesamte Steuerverpflichtung Zahlen zu vermeiden. Die Nichteinhaltung auf gesetzlichen Pflichten, Fälschung oder das Zurückhalten von Informationen ist gegen d"}, {"id": "<urn:uuid:d78bd605-f3c9-41cd-863e-ae7cb3a4e608>", "text": "\n\nWohnhilfe für Obdachlose und Haftentlassene\nWir helfen\nAllen, die gemäß dem Sozialgesetzbuch SGB XII §67 leistungsberechtigt sind, z.B. Menschen, die von Obdachlosigkeit bedroht oder betroffen sind, Menschen, die nach einem Haftaufenthalt Schwierigkeiten bei der Wiedereingliederung in die Gesellschaft haben, Menschen, die verschuldet sind und Menschen mit Suchtproblematik.\nWohnhilfe nach §67 SGB 12\n• ist ein individuelles, auf die jeweilige Person zugeschnittenes, Hilfeangebot\n• ist freiwillig"}, {"id": "<urn:uuid:b313b369-12e3-468f-98bf-b301e4e3ced4>", "text": "Der in Berlin ansässige Verein Digitale Gesellschaft wagt in Sachen Störerhaftung im Internet den Vorstoß: vergangene Woche veröffentlichte man einen Gesetzentwurf für die haftungsrechtliche Gleichstellung von normalen Bürgern sowie Gewerbetreibenden, die einen Internet-Zugang via WLAN anbieten, mit kommerziellen Internetprovidern.\nDas Institut der Störerhaftung hat seinen Ursprung im Sachenrecht, regelt inzwischen jedoch maßgeblich die Haftung im Internet. Im Mittelpunkt steht die Frage, wann u"}, {"id": "<urn:uuid:d5fec9fb-d14b-4852-95ef-9f03257ac6ea>", "text": "Hier kommt die Braut!\nEine Woche nach der Hochzeit von Jack Osbourne und Lisa Stelly veröffentlichte das Hello!-Magazin nun ein offizielles Hochzeitsfoto der Familie!\nDer Bräutigam lächelt im Anzug neben seiner Braut, die in einem weißen, ärmellosen Kleid mit Schmuck besetztem Kragen und einem schlichten Bob strahlte. Die beiden halten ihre fünf Monate alte Tochter Pearl Clementine, die auch ein weißes Kleid trägt, auf dem Arm.\nAn der Seite das Brautpaares befinden sich außerdem noch Jacks Elter"}, {"id": "<urn:uuid:535d7231-bfca-49ab-8d0a-26df01079ea9>", "text": "\n\nSternzeichen\nauch Tierkreiszeichen genannt, teilen den Jahreslauf der Sonne in zwölf Abschnitte zu 30 Grad. Ihre Namen beruhen auf den 12 Sternbildern des Zodiaks (Tierkreis).\nEin aufrichtiger Gedanke kann Himmel und Erde bewegen.\nChinesisches Sprichwort\nSeit über 25 Jahren lege ich die Skatkarten. Vergangenheit und Gegenwart beziehe ich in die Zukunft ein. Unterstützt durch meine Hellsicht berate ich ehrlich und korrekt. Hellsehen, Kartenlegen, Lebensberatung\nTrotz allem, morgen ist ein neuer"}, {"id": "<urn:uuid:81d15188-f082-403c-b1c3-ae36c6acddb2>", "text": "Ein herzliches Willkommen an alle Gelegenheitsspieler und Gamer aus der ganzen Welt, welche auf der Suche nach dem besten Portal mit den meisten gesammelten Spielen sind.\nDu findest hier puren Spielspaß beim Onlinespielen für Spieler jeder Art. Jeden Tag fügen wir neue Spiele hinzu, schau doch einfach regelmäßig auf Games1.com um zu sehen, was es alles so Neues gibt.\nRennspiele, Sportspiele, Actionspiele der andere Spiele für Jungs? Wir haben sie!\nMake-Up-Spiele, Kochspiele, Tierspiele und ander"}, {"id": "<urn:uuid:2c8d022d-af13-4a56-b3e8-be05f31c772a>", "text": "Crysis 2 – Patch 1.1 erschienen\nDie Grafikbombe Crysis 2 hat ihren ersten Patch spendiert bekommen. Schon paar Tage nach der Veröffentlichung berücksichtigt Crytek die Probleme der Spieler.\nder Patch 1.1 für Crysis 2 erschienen, der einige Bugs beheben soll. Die Community kritisierte vor allem das Auto-Aim-System. Mit dem neuen Patch verschwindet dieses völlig. Außerdem soll der Chat nun schneller laufen.\nHier eine genaue Übersicht:\n- Server-Browser zeigt die korrekten Pings an\n- Problem mit nic"}, {"id": "<urn:uuid:22cba161-dc57-40bb-9aed-0b162fd919f2>", "text": "Ich hatte bereits schon einen Artikel geschrieben, wie du mit Tipps – schnell und effektiv den Schnupfen/Erkältung bekämpfen kannst. In diesem Artikel möchte ich jedoch noch intensiver auf ein Produkt eingehen, da es meiner Meinung nach absolut empfehlenswert ist. Es geht um das Produkt Nasic Nasenspray zur nasalen Anwendung.\nIm anderen Artikel hatte ich bereits über die schnelle und effektive Wirkung berichtet. Kaum zu glauben, aber bereits nach einer Anwendung über Nacht konnte ich wieder frei"}, {"id": "<urn:uuid:98fbdab2-a75b-4044-970d-83655c6298e9>", "text": "\n\nVerantwortlicher im Sinne des Teledienstegesetzes (TDG) bzw. des Medienstaatsvertrages (MDStV):\ninme.cs\nBrian Heyse\nHohle Straße 2a\nD- 25462 Rellingen\nURL: http://www.inmecs.de\nMail: firstname.lastname@example.org\nTel: +49 4101 538 50 72\nFax: +49 4101 538 50 73\nGeschäftsführung:\nBrian Heyse\nUSt-IdNr.: DE235634454\nCopyright\nDie inme.cs erteilt hiermit unter den nachfolgend eingehaltenen Bedingungen das Recht, die Inhalte aus der Website von inme.cs aufzurufen, zu speichern und zu duplizieren.\nD"}, {"id": "<urn:uuid:505d71d6-dbd6-406c-ab5b-515ab620de1e>", "text": "unsere Serviceleistungen\n- kostenloser Sehtest\n- Führerscheinsehtst\n- Augenglasbestimmung\n- Reparaturannahme\n- Rezeptausstellung\n- kostenlose Ultraschallreinigung\n- außer-Haus Auswahl\n- Auslieferung von Brillen\n- Zahlung mit EC-Karte\nallgemein:\nServiceleistungen Kontaktlinsen:\n- kostenloses Probetrage aller am Markt erhältlichen Systeme\n- kostenlose Nachkontrollen\n- fachkundige Beratung durch Kontaktlinsenspezialisten\nAugenglasbestimmung\nMit modernster Technik ermitteln wir präzise und schnell I"}, {"id": "<urn:uuid:81270d13-2435-4e07-a531-d77a256ffc2a>", "text": "Präsentiert eure Band!\nWillkommen bei der Soundrubrik von mei.infoeck.at!\n\"mei-sound\" gibt allen Tiroler Bands die Möglichkeit, sich den Tiroler Jugendlichen vorzustellen. Du hast eine Band, eine Hip- Hop Crew oder willst als DJane aktiv werden? Dann füll das Formular aus und registrier Dich auf diese Weise bei uns!\n\"mei-sound\" soll Dir aber auch helfen, Auftritte und Festln zu organisieren, Bandmitglieder anzuwerben, Workshops zu organisieren, usw... Wir arbeiten mit einigen namhaften Veranstal"}, {"id": "<urn:uuid:5c7c3707-e030-4f98-a240-8928fe3e4a37>", "text": "Instant Snow\nMit Instant Snow verwandeln Sie Wasser augenblicklich in Schnee!\nInstant-Snow-Pulver wandelt einen Glas Wasser in ein paar Sekunden in künstlichen Schnee. Der Becher \"überschäumt\" mit einem feinen Schnee.\nDer entstehende Kunstschnee sieht aus wie Schnee und fühlt sich auch so an. Damit kann man über Tage hinweg mit diesem künstlichen Schnee dekorieren.\nInstant-Snow ist wie Super Gel ein spezielles Polymer, dass die Fähigkeit hat ein Mehrfaches seines Gewichts an Wasser zu speichern."}], "3": [{"id": "<urn:uuid:9ac40fde-7881-4472-b755-7eb74eb47ddd>", "text": "\n\n23.06.02\n| Out of the Blue - Explodierende Träume\n\n\nCa 1980 (16mm, 93min)\n| Übersicht\n\n\n(zurück zur Übersicht)\nIMDb :\n(mehr externe Filminfos)\n|R: Dennis Hopper|\nB: Gary Jules Jouvenat, Brenda Niel\nD: Linda Manz, Dennis Hopper, Sharon Farrell, Don Gordon, Raymond Burr\nMy my, hey hey / Rock and roll is here to stay ... CeBe ist 14, als ihr alter Herr wieder aus dem Gefängnis rauskommt. Er hat vor 5 Jahren angesoffen und mit CeBe auf dem Beifahrersitz seinen Laster in einen Schulbus gefahren; da"}, {"id": "<urn:uuid:28605230-fd1c-4d5a-9b09-47173eb5ba3b>", "text": "Nachrichten in aller Kürze\nAlles zur Community\nNachrichten, die zu Ihnen kommen: Newsletter, Feeds und SMS\nAlles zu unseren mobilen Angeboten: Apps, Mobilversion und SMS\nUnsere Radio- und TV-Angebote\nDie Zeitung im Internet: Abo, E-Paper, Anzeigen und mehr\nAlles über die Redaktion von derStandard.at\nAlles über Onlinewerbung, Stellenanzeigen und Immobilieninserate\nGeorg Grabherr kurz vor Weihnachten in seinem Garten in Königstetten. Der Botaniker und Ökologe ist Österreichs \"Wissenschafter des Ja"}, {"id": "<urn:uuid:8a4af1a1-462b-4a61-9e67-64d3d3a4770c>", "text": "auf deutsch, glaube ich, der Ritter. Wie kann man diesen Verbrecher nur immer wieder mit einem solch \"ehrenvollen\" Titel bezeichnen. In einem weniger korrupten Land säße dieser \"Ritter\" längst in einem tiefen Burgverlies.\nREUTERSBersani, Monti, Grillo oder doch der Cavaliere? Die Italiener haben einen völlig verrückten Wahlkampf erlebt. Den Vogel schoss wieder einmal Berlusconi ab: Er versprach, Bürgern die Immobiliensteuer aus eigener Tasche zu bezahlen - und fragte eine Frau vor laufender Kame"}, {"id": "<urn:uuid:44f20ba9-bc1a-4f1f-923d-ca447df27aa2>", "text": "Angela Merkel angeblich beliebt wie nie zuvor, Inflation weiter auf einem niedrigen Stand, Beschäftigungsgrad in Deutschland so gut wie nie und die EU als Bereicherung für alle. Dieser und weit mehr Unsinn wird tagtäglich durch öffentliche Medien propagiert und der Bürger schlicht für dumm verkauft. Wie die Stimmung des Volkes tatsächlich aussieht zeigt der folgende Videobericht eines Users der uns diesen per Email zukommen lies. weiterlesen\nangela merkel\nEs ist wie die ständige Wiederholung ein"}, {"id": "<urn:uuid:1a224afb-7d0d-4e0c-b9f6-085fb70f17de>", "text": "v1.6.4: preliminary Google TV support ... v1.6.1: better fret number sizes, possible fix for Galaxy Nexus (untested) v1.6.0: support for left handed guitarists, better preferences Coming next: access to settings for devices without hardware menu button\nDiese App kann auf Folgendes zugreifen:\nNetzwerkkommunikation\nuneingeschränkter Internetzugriff\nErmöglicht einer Anwendung, Netzwerk-Sockets einzurichten.\nNetzwerkstatus anzeigen\nErmöglicht einer Anwendung, den Status aller Netzwerke anzuzeigen.\nV"}, {"id": "<urn:uuid:c762c6fa-acfc-4bd1-8862-57a71114c076>", "text": "Lage in Nahost eskaliert: Luftalarm in Tel Aviv\nGaza/Tel Aviv Die Furcht vor einem neuen Nahost-Krieg wächst. Erstmals seit dem Golfkrieg 1991, als der Irak Scud-Raketen auf Israel abschoss, heulten am Donnerstag die Luftalarm-Sirenen in Tel Aviv. Zugleich war eine dumpfe laute Explosion zu hören.15.11.2012 22:51:45\nNach Medienberichten ging eine Gaza-Rakete im Mittelmeer nieder. Nach den Raketenangriffen verstärkte die israelische Luftwaffe ihre Bombardements im Gazastreifen. Binnen einer Stund"}, {"id": "<urn:uuid:b41c92fd-8fdb-4851-b5ca-db3be650cf6e>", "text": "It´s over now- but next to come...Moers im Plural\ndas moers festival 2012 war ein voller Erfolg! Auch in diesem Jahr war das knapp 2.500 Menschen fassende Zelt am Pfingstsonntag ausverkauft. Insgesamt begrüßte das Festival an den drei Pfingsttagen im Festivalzelt, im Bollwerk 107, in der Röhre und den vielen anderen Spielstätten knapp 13.000 Besucher aus dem In- und Ausland.\nDie Klickzahlen auf der Website www.moers-festival.de waren noch einmal deutlich höher als im Vorjahr. Den Live-Stream ver"}, {"id": "<urn:uuid:3e1a8253-b988-4cfc-8964-add62e250c07>", "text": "Nicolas Stemann steht ganz vorn: In «Die Kontrakte des Kaufmanns», Elfriede Jelineks nagelneuem, kurz vor der Uraufführung noch aktualisiertem Stück und Stemanns fünfter Jelinek-Arbeit, spielt der Regisseur selbst mit. Und nicht nur das: Einmal singt er auch, liest Regieanweisungen, erscheint in Masken und Elfriede-Jelinek-Perücke – ganz wie alle anderen im demokratisch omnipräsenten Ensemble (darunter Therese Dürrenberger, Ralf Harster, Franziska Hartmann und Maria Schrader). Das Spiel mit dem "}, {"id": "<urn:uuid:de9205f2-89dc-4a21-a919-72c870eb0f92>", "text": "Bericht über das SDXG-Treffen am 18. Nov. 2000 in Karlsruhe-Stupferich\nUm 14 Uhr MEZ eröfffnete DJ5JH die Tagung, zu der 25 Mitglieder und Gäste im Nebenzimmer der Gaststätte Akropolis am Sportzentrum in Karlsruhe-Stupferich erschienen waren. Das Tagungslokal fand allgemeine Anerkennung, ein für die Teilnehmerzahl gut bemessener und abtrennbarer, durch eine wintergartenähnliche Glasüberdachung hell und freundlich wirkender Nebenraum. Nach Selbstvorstellung der Teilnehmer und Übermittlung der Grü"}, {"id": "<urn:uuid:970209da-c2d8-4c78-b9e8-09f0d6b9eab8>", "text": "„Mit 66 Jahren, da fängt das Leben an“, hat einst Udo Jürgens gesungen. Und es mag viel Wahres dran sein, an dem Schlagertext. Doch was ist 33 Jahre später?\nBerthold Beitz ist heute 99 Jahre alt geworden - 59 davon verbrachte er bislang im Dienste von Krupp. Anlass genug, die Erfolge, den Mut und die Zivilcourage dieses außergewöhnlichen Mannes zu würdigen. Beitz selbst jedoch sträubt sich gegen verklärende Blicke in die Vergangenheit, redet nicht gern darüber, dass er während der Nazi-Diktatur "}, {"id": "<urn:uuid:152801bd-2dce-407f-8d44-56ad32149ecb>", "text": "BugattiDer Bugatti Veyron hat 1200 PS, bei Vollgas ist der 100-Liter-Tank nach zwölf Minuten leer, und mit der Wärme des Motors könnte man 40 Einfamilienhäuser heizen. Wie macht man so ein Auto noch krasser? Man kappt das Dach. Ein Bericht aus der Pilotenkanzel des extremsten Roadsters der Welt.\nhttp://www.spiegel.de/auto/aktuell/0...837466,00.html\n..das nicht toll ist..32 solcher autos in seiner garage stehen zu haben..warum kaufen die 0,0001% elitären superreichen eigentlich nicht die ganze we"}, {"id": "<urn:uuid:b3b77428-b446-4693-b614-80fb16bce6cf>", "text": "Ex-Bundespräsident: Wulff will Büro und Mitarbeiter für 280.000 Euro im Jahr\ndapdZusätzlich zu den 199.000 Euro Ehrensold könnte Christian Wulff die Steuerzahler künftig weitere 280.000 Euro im Jahr kosten: Nach SPIEGEL-Informationen will der ehemalige Bundespräsident das gleiche Recht wie seine Vorgänger - und fordert ein Büro inklusive Mitarbeiter.\nZusätzlich zu den 199.000 Euro Ehrensold könnte Christian Wulff die Steuerzahler künftig weitere 280.000 Euro im Jahr kosten: Nach SPIEGEL-Informat"}, {"id": "<urn:uuid:dab9bd26-670b-408a-8c7c-8000db303b6c>", "text": "Türkische Delegation von Journalisten randaliert auf Berliner Vergnügungsschiff. Oder Cem Özdemir -Eine grüne Karriere\nWieder eine unerfreuliche Story. Eine Gruppe türkischer Journalisten wurde von der Robert Bosch Stiftung nach Deutschland eingeladen und traf sich in Düsseldorf mit dem Integrationsminister von NRW, Armin Laschet (CDU).\nAnschliessend fuhr die Gruppe nach Berlin.\nDort randalierten die türkischen Journalisten auf einem Vergnügungsschiff so sehr, dass der Kapitän die Gruppe per Mik"}, {"id": "<urn:uuid:ebb8a265-4091-4f60-a289-6f7439a67203>", "text": "Anselm Wagner\nTonHöhe\nEine Installation von Bernhard Leitner in der Kollegienkirche\nSeit den späten 60er Jahren arbeitet Bernhard Leitner im Grenzbereich von Architektur, Plastik und Musik. Anders als ein Musiker, der Klänge in den Raum stellt, läßt Leitner den Raum erst durch Töne erzeugen; das Tonmaterial besitzt sozusagen plastisch-architektonische Qualität. Leitner macht nicht-musikalisch konzipierte Klangaufnahmen, welche durch computergestützte Klanggestaltung zum werkspezifischen Tonmater"}, {"id": "<urn:uuid:df85a4f3-1152-401c-b2d4-bc06deb8bafe>", "text": "Rede von Außenminister Michael Spindelegger anlässlich 20 Jahre Österreichische Gesellschaft für Europapolitik\nEs gilt das gesprochene Wort!\nSehr geehrter Herr Präsident,\nExzellenzen,\nSehr geehrte Damen und Herren!\nIch danke herzlich für die Einladung, Herr Präsident Liebscher, bei dieser besonderen Feier heute die Festrede halten zu dürfen.\nEs ist mehr als angebracht, die Österreichische Gesellschaft für Europapolitik (ÖGfE) für ihr 20 jähriges Bestehen besonders zu würdigen. Ich möchte vor all"}, {"id": "<urn:uuid:7fb062a9-d498-40cb-bdc3-eeb9713f5ffb>", "text": "Da Platzen mir doch die Schuhe auf. Wie kann man mit solchem Dumfug eine ganze Generation zu potenziellen Amokläufern diskriminieren?\nWie im Artikel schon geschrieben, wer überprüft bei den Spenden denn WER das Geld Überwiesen hat? Kann mir nicht vorstellen das die sich da gedanken drüber machen. Vor allem würde mich mal Interessieren was die Potenziellen Empfänger der möglichen Spenden davon halten? Da verhungern Kinder im eigenen Land, und die habe nichts besseres zu tun als Gamer in eine Ecke"}, {"id": "<urn:uuid:7b1f494b-0da1-4a7f-a99c-6b3c4cf7c14a>", "text": "Meldungen vom 21.11.2011\nArtikel-Chronik\n1:0 in Bochum\nCottbus kann doch noch siegen\nMustafa Kucukovic beschert Energie Cottbus in der Zweiten Fußball-Bundesliga einen Auswärtssieg. Die Lausitzer beenden durch einen 1:0-Sieg beim VfL Bochum ihre Serie von zuletzt drei Niederlagen.\nMehr\nWahl in Spanien\nKlares Votum\nDer Wahlsieg Rajoys ist auf dem Weg Spaniens aus der Krise nur ein\nAnfang. Aber ein guter. Mit der spanischen Wende schließt sich im atlantisch-mediterranen Krisenbogen der Kreis.\nMehr"}, {"id": "<urn:uuid:70b15b68-4b2c-4dc7-b699-81bef0a7f3b1>", "text": "Entfernen des ixt0 Virus\nDie meisten Antivirus Programme erkennen ixt0.dll als Schädling.\nDieses offene Datei Informationsforum hilft Ihnen mehr über den ixt0.dll Schädling zu erfahren und ihn zu entfernen. Wenn Sie etwas über diese Datei wissen, schreiben Sie uns bitte Ihre Meinung. Damit helfen Sie auch anderen Hilfesuchenden.\nIxt0.dll Datei Info\nDer Prozess gehört offenbar zur Software C-Media (Version 3D Audio) der Firma unbekannt.\nCharakteristik: ixt0.dll befindet sich im Ordner C:\\Windows\\"}, {"id": "<urn:uuid:1b2c1da1-251a-4917-ad7f-07bf34e0d4bf>", "text": "Samsung GT-I9300 Galaxy S3 garnet-red 16GB\n- Samsung Smartphone ohne Vertrag, ohne Simlock, ohne Branding\n- Energieeffiziente Quad-Core-Performance\n- Brillanter 12,19 cm HD Super AMOLED-Touchscreen\n- Blickgesteuertes Display-Standby\n- Intelligente Kamera-Funktionen\n- Exchange\nActiveSync\nHerstellernr:\nGT-I9300GRDDBT\nVerfügbarkeit: Auf Lager, sofort lieferbar\nAbholungsort: 36037 - Fulda (weitere Details)\nDie Anlieferung der zur Abholung bestellten Ware erfolgt aus unserem Lager. Bestellungen, die "}, {"id": "<urn:uuid:76fad24e-19ef-4680-ac5d-41d3c53356fe>", "text": "Die Poetik der Begegnung (ab morgen auf dem Weltempfang)\nIn diesem Bild hat sich eine kleine “Politik der Identität” versteckt. Kannst Du sie finden?\nDer hellsichtige Joseph Brodsky schrieb einmal in einem Aufsatz über seinen Dichterkollegen Derek Walcott: „Im Gegensatz zu einer weitverbreiteten Auffassung endet die Welt in den Randgebieten nicht – vielmehr franst sie genau dort aus. Die Sprache wird davon nicht weniger beeinflusst als das Auge.“ Das wunderbar krude Englisch des auf St. Lucia ge"}], "4": [{"id": "<urn:uuid:a6c8113b-b39a-40ac-a5e3-addcc996bad7>", "text": "Nachrichten in aller Kürze\nAlles zur Community\nNachrichten, die zu Ihnen kommen: Newsletter, Feeds und SMS\nAlles zu unseren mobilen Angeboten: Apps, Mobilversion und SMS\nUnsere Radio- und TV-Angebote\nDie Zeitung im Internet: Abo, E-Paper, Anzeigen und mehr\nAlles über die Redaktion von derStandard.at\nAlles über Onlinewerbung, Stellenanzeigen und Immobilieninserate\nHorn - Ein schwerer Verkehrsunfall hat in der Nacht auf Samstag im Waldviertel zwei Todesopfer gefordert. Zwei Pkw waren gegen 1.00 Uh"}, {"id": "<urn:uuid:6dde6fab-b354-4d4f-ab51-29e627b0369b>", "text": "Inspiring people to share\nUrsprünglich von einer einzigen Person - nämlich dem Erfinder von TYPO3 - Kasper Skårhøj - gegründet, besteht die heutige TYPO3 Community aus mehreren zehntausend Entwicklern weltweit, die sich mit der stetigen Weiterentwicklung und Verbesserung des Open Source CMS beschäftigten.\nUm die Mission von Kasper Skårhøj -\nMeine Idee der TYPO3 Community war: \"Gemeinsam freie Software zu innovieren, die es Menschen ermöglicht zu kommunizieren\"\n- mit Leben zu füllen und die gemei"}, {"id": "<urn:uuid:9c54f72c-9f9a-4a4c-9026-a02d6f7c3923>", "text": "\n\nArgentinian Explorer, Ihre Reiseagentur in Argentinien und Südamerika stellt Ihnen einen neuen Abschnitt, \"Reisen in Argentinien\" vor, eine bunte und ausführliche Reisebroschüre, vom Norden Argentiniens, durch Mendoza und Buenos Aires, in der Mitte, bis zum Süden, Patagonien. Einfach zu benutzen, nur mit einem Klick der Mouse können Sie sich schon die verschiedenen Reiserouten einsehen und genießen. Hierbei finden Sie in kurzen und spannende Beschreibungen die bekanntesten Örtern, Regionen und"}, {"id": "<urn:uuid:ae5a75d3-db28-4f09-803a-354dcdf7f016>", "text": "Archiv verlassen und diese Seite im Standarddesign anzeigen : Welches Kabel für TWI (I2C) verwenden? Hilfe bei TWI Routine\nSauginius\n08.07.2004, 15:15\nHallo,\nich möchte mit einem LM75 die Öl- bzw. Wassertemperatur über TWI vom Auto messen.\nDie Platine wird im Innenraum eingebaut und die Sensoren an der entsprechenden Stelle (ist ja klar).\nAber welche Leitung sollte ich dafür verwenden?\nDer LM75 braucht:\n-Ub\n-Masse\n-Data\n-Clock\nIch denke mal das hier abgeschirmtes Kable nötig ist oder? Wie sieht "}, {"id": "<urn:uuid:5a3127f7-ad33-4665-b5c2-7e1d35a3d389>", "text": "Schulische Integration\nSchulische Integration bezeichnet in der Pädagogik das Einbinden von Menschen mit Behinderungen in den Schulunterricht von Nichtbehinderten. Hier geht es darum, dass Behinderte durch direkte Nachahmung sich alle Fertigkeiten autodidaktisch beibringen, welche sie von den Nichtbehinderten abgucken. Das grenzt die Lernmethode von der integrativen Pädagogik ab, denn dort sollen die übrigen Kinder den „körperlich oder geistig Benachteiligten“ durch gezieltes Training und Kooper"}, {"id": "<urn:uuid:86ee090b-cb34-4067-b804-8ac19c3c697a>", "text": "(1) Die Vorschriften dieses Gesetzes gelten für Bauprodukte, für die\n|1.||die Kommission der Europäischen Gemeinschaften die Fundstellen der harmonisierten oder anerkannten Normen im Amtsblatt der Europäischen Gemeinschaften veröffentlicht hat,|\n|2.||Leitlinien für die europäische technische Zulassung erarbeitet sind,|\n|3.||europäische technische Zulassungen, ohne daß Leitlinien erarbeitet sind, nach § 5 Abs. 4 Satz 2 in Verbindung mit § 6 Abs. 4 Satz 2 erteilt werden können,|\n|4.||die wesentlic"}, {"id": "<urn:uuid:efa16b1a-a0d8-48aa-92ff-9a312189aaa2>", "text": "Nachrichten in aller Kürze\nAlles zur Community\nNachrichten, die zu Ihnen kommen: Newsletter, Feeds und SMS\nAlles zu unseren mobilen Angeboten: Apps, Mobilversion und SMS\nUnsere Radio- und TV-Angebote\nDie Zeitung im Internet: Abo, E-Paper, Anzeigen und mehr\nAlles über die Redaktion von derStandard.at\nAlles über Onlinewerbung, Stellenanzeigen und Immobilieninserate\nWien - In der Telekom-Affäre hat die Staatsanwaltschaft Wien nun Anklage gegen den Lobbyisten Peter Hochegger, den Ex-Telekom-Manager "}, {"id": "<urn:uuid:62cb9213-5f30-4e67-9a6c-0579294364be>", "text": "EU-Richtlinie 2002/96/EG\nAus FED-Wiki\nFakten\nTitel (Deutsch) : Elektro und Elektronik-Altgeräte Titel (Englisch) : Waste Electrical and Electronic Equipment Titel (Kurz) : WEEE Verabschiedet : am 27. Januar 2003 Veröffentlicht : am 13. Februar 2003 im Amtsblatt Nr. L 37 S. 0024 der EU Tritt in Kraft : am Tag der Veröffentlichung Geändert durch : EU-Richtlinie 2003/108/EG\nLinks zu den Richtlinien\n- EU-Richtlinie 2002/96/EG (Originaltext in PDF)\n- EU-Richtlinie 2003/108/EG (Originaltext in PDF)\n- "}, {"id": "<urn:uuid:0b2764f4-e559-4188-8b27-bd97378740a3>", "text": "Beschreibung\nCortina d'Ampezzo\nSommer:\nFür die echten Bergliebhaber ist der Sommer in Cortina der Himmel auf Erden.\nDer Naturpark der Ampezzaner Dolomiten\nist das ganze Jahr über geöffnet und kann auch in Begleitung der Bergführer, der \"Guide Alpine\", besichtigt werden.\nBike Resort:\nLassen Sie doch einfach Ihr Auto stehen und steigen Sie auf ein Fahrrad um, Radfahren bereitet allen größte Freude.\nMit einem Fahrrad können Sie die schönsten Winkel Cortinas auf eine völlig andere, spannende Art und"}, {"id": "<urn:uuid:001bd812-134d-4f0e-bc98-bbf11e5e0ded>", "text": "14.3\nMitarbeitergeschäfte\nDas Bundesaufsichtsamt für das Kreditwesen hat Leitsätze bekanntgegeben, nach denen die Kreditinstitute Regelungen für Mitarbeitergeschäfte zu treffen haben. Damit soll sichergestellt werden, daß Geschäfte der Mitarbeiter in Wertpapieren, Devisen, Edelmetallen und Derivaten nicht gegen die Interessen des Instituts und deren Kunden verstoßen. Sowohl Personalräte als auch einzelne Beschäftigte baten mich, die von ihren Instituten getroffenen Regelungen für Mitarbeitergesc"}, {"id": "<urn:uuid:6e8bae41-af62-44f0-921d-a6bf27d4fe0a>", "text": "- SSV Jahn Regensburg\n- Übersicht\n- Kader\n- Transfers\n- Gerüchte\n- Daten und Fakten\n- Begegnungen\n- Stadion\n- Historie\n- News\n- Fanshop\n- Forum\n-\nTransfermarkt.de auf Facebook\nGoogle+\nAuf Google+ folgen:\nTransfermarkt auf Google+\n12.05.2013 - 18:59 Uhr | News | Quelle: dpa 1. FC Kaiserslautern erreicht Relegation - Kuntz mahnt\nNoch jubelt der 1. FC Kaiserslautern nicht lauthals: Vorstandschef Stefan Kuntz will sich nach dem Erreichen des Relegationsplatzes zwar ein gutes Essen und eine «Genusszi"}, {"id": "<urn:uuid:43c24d54-6f25-4919-b127-e4ca76b7855b>", "text": "\n\nUmsatzsteuer Teil 1Grundzüge der gesetzlichen Regeln\nEinleitung\nDie Umsatzsteuer ist eine Gemeinschaftssteuer, d.h. sie steht Bund, Ländern und Gemeinden zu unterschiedlichen Teilen zu und stellt mit rund 140 Mrd. Euro neben der Lohnsteuer die ertragsreichste Steuerquelle dar.\nDas 1967 eingeführte Mehrwertsteuersystem wird auch als \"Nettoallphasensteuer mit Vorsteuerabzug\" bezeichnet, da die Steuer auf jeder Wirtschaftsstufe (z.B. Produktion, Großhandel, Einzelhandel) erhoben wird und durch de"}, {"id": "<urn:uuid:7d4d1073-0b62-4324-a064-b8defc632325>", "text": "Vaterschaftsanerkennung\nWenn Sie der Vater eines nicht ehelichen Kindes sind, können Sie die Vaterschaft anerkennen. Die Anerkennung der Vaterschaft muss öffentlich beurkundet werden.\nBei welcher zuständigen Stelle sie dies erklären und beurkunden lassen, bleibt Ihnen überlassen.\nGenerelle Zuständigkeit:\n- das örtliche Standesamt oder\n-\ndas örtliche Jugendamt\nJugendamt ist,\ndie Städte Konstanz, Rastatt, Villingen-Schwenningen und Weinheim nehmen die Aufgaben als örtlicher Träger der Jugendhilfe "}, {"id": "<urn:uuid:f74bb5d1-c00f-4f3a-a6fb-4e83c6f57522>", "text": "Sicherheitsdienst\nSicherheitsdienste sind eine wichtige Dienstleistung für den Objektschutz, für Veranstaltungen und den Personenschutz. Über öffentliche Wachdienste wie den Polizeidienst hinaus werden sie heute zunehmend durch Outsourcing an Privatfirmen vergeben.\nModernes Facility Management unterscheidet zwischen drei Kernbereichen: infrastrukturelles, technisches und kaufmännisches Gebäudemanagement. Im ersten Bereich sind die Sicherheits-Dienstleistungen neben den Reinigungsdiensten die bed"}, {"id": "<urn:uuid:ef77188a-432f-4139-97bb-99c757818096>", "text": "The Sweet\n\n\nInhaltsverzeichnis\nWeg zum Erfolg [Bearbeiten]\nDie Band stammte aus dem englischen Middlesex, nannte sich ursprünglich „Sweet Shop“ und trat bis 1970 sowohl in Clubs als auch in Diskotheken auf. Nach ersten erfolglosen Plattenaufnahmen wie Lollipop Man (September 1969), All You'll Ever Get from Me (Januar 1970) sowie einer Cover-Version der Gruppe \"The Archies\", Get on the Line (Juni 1970) und einem gekündigten Plattenvertrag holte der Produzent und ehemalige Drummer Phil Wainman die"}, {"id": "<urn:uuid:7a6617f0-9348-4f6a-a962-5ee5a2d81452>", "text": "Privacy Policy der Heise Zeitschriften Verlag GmbH & Co. KG\nDer Heise Zeitschriften Verlag nimmt den Schutz personenbezogener Daten sehr ernst. Wir möchten, dass Sie wissen, wann wir welche Daten speichern und wie wir sie verwenden. Als privatrechtliches Unternehmen unterliegen wir den Bestimmungen des Bundesdatenschutzgesetzes (BDSG) und des Telemediengesetzes (TMG). Wir haben technische und organisatorische Maßnahmen getroffen, die sicherstellen, dass die Vorschriften über den Datenschutz sowo"}, {"id": "<urn:uuid:212a6446-b852-40eb-8417-3002a8b7f9b7>", "text": "Informationen für Grundstückeigentümer (Dachgeber)\nEin Dach kann tatsächlich verpachtet werden, ähnlich wie eine Wohnung. Viele Investoren suchen die geeignete Dachfläche, um darauf eine Photovoltaikanlage (PV-Anlage) zu betreiben. Allerdings geschieht dies nur über eine festgelegte Pachtvertragszeit von mindestens 20 Jahren, denn so lange dauert die gesetzlich garantierte Abnahme des produzierten Stromes.\nAuf den meisten Dächern wird dann viel mehr Strom erzeugt, als im Haus verbraucht wird. Di"}, {"id": "<urn:uuid:ebf7f708-1dae-48ea-9e27-bcd8ca7a7bcf>", "text": "raue kocht raue, 2/3\nsowas hat es vor mir noch nie gegeben: dass zwischen suppe und fischgang ganze 14 tage vergehen! neben neuem herd und backofen (über den ich mich gerade vorhin furchtbar geärgert habe, aber das ist eine andere geschichte) ist gestern auch noch die therme tschari gegangen. dazwischen war ich ausser bei einer bio-lamm-bäuerin auch noch bei einer bio-obst-bäuerin in der steiermark, bei einer bio-getreide-bäuerin im burgenland und habe ein interview mit martina hörmer, der gesch"}, {"id": "<urn:uuid:feee2c24-716e-4dec-a177-eab638aaefec>", "text": "dStore POS ist zwar die klassische Kasse, aber das moderne „look and feel“ der Touchkassen ist überhaupt nicht traditionell. Sie finden hier ein paar Stichworte zu den Funktionen der Kassa.\nVerkauf\nDie Verkaufsfunktion von dStore POS bietet Ihnen alle denkbaren Möglichkeiten. Natürlich 24178fd6d07>", "text": "\n\nDeutsche Ärzte und Doping\n>>> Historie westdeutscher Sportärzte, Überblick\nJoseph Keul\nProf. Dr. Joseph Keul leitete die Abteilung Sportmedizin an der Universitätklinik Freiburg seitdem sie 1974 eine selbstständige Einrichtung wurde.\nAb 1960 fungierte Joseph Keul als Sportarzt bei den Olympischen Spielen, bis 1980 als Assistenzarzt, danach als Chefarzt. Er war Mitglied des NOK und ab 1998 bis zu seinem Tod im Jahr 2000 dessen Vorsitzender, war Anti-Doping-Beauftragter des Nationalen Olympische"}, {"id": "<urn:uuid:2d7334cb-1e79-43a8-9b85-ff39b2034f90>", "text": "In unserem Kunststoff-Kompetenzzentrum in Salzburg erwartet Sie eine abwechlsungsreiche Tätigkeit als\n|-||Einstellen und Bedienen von Kunststoffspritzgussanlagen|\n|-||Optimierung der Anlagen|\n|-||Kontinuierliche Verbesserung am Arbeitsplatz|\n|-||Qualitätssicherung|\n|-||Abgeschlossene Ausbildung als Kunststofftechniker bzw. im Kunststoffbereich und Erfahrung im Spritzgießen|\n|-||Bereitschaft für 3-Schichtbetrieb|\n|-||Genaue und selbstständige Arbeitsweise, Teamgeist und Flexibilität|\nDas jährlich"}, {"id": "<urn:uuid:dd98a829-8b20-4505-8c18-1d87ab32a2e6>", "text": "Avda Sunnair s/n 35100 Maspalomas Gran Canaria/Spanien\nHotelbewertungen Hotel Dunas Suites & Villas Hotel bewerten\nArchivierte Bewertung für Hotel Dunas Suites & Villas\nToller Kurzurlaub\nHotel allgemein\nDas Hotel ist als Bungalowanlage gebaut. Hier spricht man aber nicht von Bungalows sondern von Suiten. Die Zimmer in der Juniorsuite haben einen Wohnraum, Schlafzimmer und ein geräumiges Badezimmer. Der Wohnraum hat eine Couch für 3 Personen und einen Sessel, einen Wohnzimmertisch, einen Schreibt"}, {"id": "<urn:uuid:d3acdf1f-f3d1-46a4-ad38-ad39d55677c8>", "text": "Medieninhaber:\nITP Innovative Technologie Projekte GmbH\nKarwendelstrasse 39\n12203 Berlin\nGeschäftsführer: Dr. Andreas Szinovatz\nAmtsgericht Charlottenburg, HRB 124473 B\ne-mail: email@example.com\nfon : +49 30 20 65 94 35\nLayout, grafische Elemente, Bilder und insbesondere der Text dieser Website dürfen ohne ausdrückliche schriftliche Genehmigung der ITP weder im Ganzen, noch in Teilen übernommen, vervielfältigt oder verteilt werden.\nDie ITP stellt die Informationen auf dieser Website „as is” zur "}, {"id": "<urn:uuid:4310bb2c-0b2a-4f36-b703-5925cd822a8b>", "text": "Bezaubernde Yorkshire Terrier Welpen aus seriöser Hobbyzucht\nGerne erfüllen wir die strengen Richtlinien an uns als kontrollierte Hobbyzüchter, denn nur so haben Sie die größtmögliche Sicherheit, einen gesunden und rassetypischen Welpen zu erwerben.\nBeide Elterntiere besitzen VDH-Papiere und die Zuchtzulassungen mit den erforderlichen Untersuchungen.\nUnsere Welpen sind mehrfach entwurmt, altersentsprechend geimpft, gechipt und tierärztlich untersucht.\nDie Welpen erhalten Papiere/Ahnentafel, eine"}, {"id": "<urn:uuid:c892fc0e-53d3-4649-bd63-8b86b13fa729>", "text": "Alle Nutzerkonten des Support Forums wurden zum MyPhilips migriert.\nWenn du ein Nutzerkonto im Supportforum hast, klick bitte auf „I have forgotten my password“ / „Ich habe mein Passwort vergessen“, auf der rechten Seite um dein Passwort zurückzusetzten.\nDanach kannst du dich mit deiner e-Mailadresse und deinem Passwort wieder hier im Forum anmelden.\nBitte entschuldigt eventuelle Unannehmlichkeiten."}, {"id": "<urn:uuid:564b733d-98e1-4221-a722-74bb1e8d12d6>", "text": "Stellenangebote Hollywood Media Hotel Berlin\nStarten Sie Ihre Karriere im Hollywood Media Hotel und planen Sie Ihre Zukunft bei und mit uns!\nZur Verstärkung unseres Sales-Teams suchen wir zum nächstmöglichen Zeitpunkt:\nSales Manager (m/w) Bereich CORPORATE und MICE\nUnser Sales Manager trägt die Verantwortung für den gezielten Verkauf der Hotelzimmer und wirkt bei der Formulierung von Verkaufszielen sowie der Erstellung eines Revenueplans mit.\nIhre Aufgaben:\n■ Neukundenakquise sowie Betreuung des"}, {"id": "<urn:uuid:320c17b9-073d-4872-98c2-0b97eae72aa6>", "text": "Schließen\nHier finden Sie Einstellungen zur Barrierefreiheit. Wenn Sie diesen Bereich schließen, erreichen Sie ihn später durch Klick auf \"Einstellungen\".\nHelfen Sie anderen Patienten dabei, den richtigen Arzt zu finden und schreiben Sie eine Empfehlung für Hannelore Labentsch.\nIhre Empfehlung wird anonym veröffentlicht.\nWie schnell haben Sie einen Termin bekommen?\nWie lange haben Sie im Wartezimmer warten müssen?\nFühlten Sie sich von Ihrem Arzt gut beraten? War Ihr Arzt in Ihren Augen kompetent"}, {"id": "<urn:uuid:b8199318-9191-4be8-93a2-77cd7b2e76fe>", "text": "Ihr Aufgabengebiet umfasst:\nAktiver Verkauf von innovativen Calciumsulfatbasierten Bindemittel für die Herstellung von konventionellen und fließfähigen Estrichsystemen Ausbau und Pflege der Kontakte zu Fachbetrieben und Industrie Betreuung und Beratung von Estrichlegern, Architekten, Planern und Generalunternehmen Begeistern Sie sich für das Estrichhandwerk? Wollen Sie etwas bewegen und haben eigene Ideen, sind flexibel und engagiert bei der Arbeit? Haben Sie idealerweise sogar langjährige Erfah"}, {"id": "<urn:uuid:1aa440a8-ea3c-443c-89b8-8829fe2dc0d6>", "text": "Zugriff oder Beitrag nicht akzeptiert!\nIhr Zugriff oder Beitrag wurde nicht akzeptiert, da Ihre IP-Adresse für das Schreiben von Beiträgen auf Das ultimative TopDog - Forum gesperrt wurde.\nWenn Sie unschuldig Opfer des mangelhaften Benehmens eines anderen wurden, kontaktieren Sie bitte den Administrator,\ndamit er feststellen kann, ob er die Sperre rückgängig machen kann.\nSollten Sie Fragen haben, senden Sie bitte eine Nachricht an firstname.lastname@example.org.\nDer Browser wird automatisch\nzur "}, {"id": "<urn:uuid:c1a5094f-125c-4b58-838f-d68fb76599be>", "text": "Pavis eG ist in Deutschland einer der führenden IP- Dienstleister für Patentanwälte und Schutzrechtsabteilungen der Industrie:\nSeit 1980 garantieren unsere erfahrenen Patentanwälte weltweit Zuverlässigkeit und Kompetenz im Umgang und der Bearbeitung von sensiblen Schutzrechtsdaten.\nSo sind es für uns gera lega a todos los sectores económicos, y el turismo no podía permanecer al margen de las nuevas tendencias. Aquí le presentamos algunas ideas para sus vacaciones.\nTodas las Ideas para sus vacaciones\nEstá buscando unas vacaciones que se ajusten a su pr"}]}, "spa_Latn": {"0": [{"id": "<urn:uuid:85e1aa56-6833-4cb4-876f-95709ed428ae>", "text": "En fín, Cruz ….. Porque después de muchas negociaciones maritales, mi panadero, como yo le llamo, ha terminado convenciéndome de que no es buen momento para comprar la thermomix, y era algo de lo que yo tenía muchas ganas; así es la vida, toca esperar.\nY Cara ….. porque como casi todo en la vida, tiene un lado bueno; mi panadero para intentar subirme el ánimo, hasta que pueda comprarme la maquinita, pues me ha regalado una panificadora.\nHace unos días, Cris en su blog “Kanela y Limón”, uno de lo"}, {"id": "<urn:uuid:9ab5cb54-1fc3-4d42-aed2-2eb586140b81>", "text": "Estas fotografías corresponden al segundo día del festival internacional Altavoz 2011 en el cual se presentaron los géneros Hardcore y Metal.\nEternal, Descomunal (Ecuador), Vitam Et Mortem y las excelentes bandas Morbid Macabre (Medellín) y Avulsed (España) fueron las bandas encargadas de representar el Metal en esta edición del festival.\nLos invito a ver más fotografías visitando el siguiente enlace:"}, {"id": "<urn:uuid:843cd0b6-ff94-4643-9bdd-d62ae80a1269>", "text": "Las siguientes condiciones y disposiciones se aplican estrictamente a la participación en las visitas guiadas, seminarios, así como al ingreso a las exhibiciones y eventos organizados por la asociación.\nSe necesita el programa de Adobe Acrobat Reader (disponible sólo en inglés) para ver algunos de los documentos enlazados a esta página. Descargar Acrobat Reader si no lo tiene instalado."}, {"id": "<urn:uuid:36f75b5d-e3a4-473b-99bf-da2abac1e798>", "text": "SUP es el nombre que recibe este deporte debido a sus siglas en inglés Stand Up Paddle. Se trata de un deporte originario de Hawai que fusiona al surf y al remo, ya que consiste avanzar mediante el remo mientras estamos de pie sobre una tabla de surf.\nEs ideal para aguas calmas o para días en que el mar no tiene suficientes olas para sufear y por supuesto, además de requerir un gran trabajo de nuestros brazos, necesita de nuestra coordinación y equilibrio en donde sabemos es de gran importancia,"}, {"id": "<urn:uuid:d4ea3fa2-9bf5-4dc4-9926-be6102fa1418>", "text": "El concepto de cenar de la granja a la mesa cada vez gana más seguidores alrededor del mundo, y Los Cabos no es la excepción. Aunque vivimos en el desierto, nuestro suelo es muy rico; y junto con la oferta del Pacífico y el Mar de Cortez tenemos gran abundancia de productos locales frescos.\nRecientemente, Marco Bustamante Chef Ejecutivo de Capella Pedregal me invitó a acompañarlo en una visita a una granja orgánica local, llamada Los Tamarindos. Esta es una granja de la cual Marco obtiene la may"}, {"id": "<urn:uuid:73517881-ea2e-438d-a530-3e52e3543037>", "text": "Como organizar una boda\nLa boda es una de las celebraciones más importantes de nuestra vida, en muchos casos algunas parejas prefieren realzar una boda muy original en donde además de la decoración y el salón de bodas también se desea festejar de una manera diferente, algunas ideas para bodas puede ser celebrar la misma en una casa rural en un entorno ecológico.\nTambién si eres fanático de algún grupo musical o grupo de rock, puedes realizar tu boda de forma temática o sea, ambientada según tu m"}, {"id": "<urn:uuid:ec167bcd-5195-4404-bd33-d6f493948b80>", "text": "Conferencia de Antropología Forense entre los homenajes a José Martí\nPor Francisco Martínez Chao\nFoto Internet\nLa Habana, Cuba.- Una conferencia sobre la Antropología como Ciencia en la Investigación Forense, impartirá el Doctor Héctor Soto Izquierdo el 26 de Enero, en el Gabinete de Arqueología de la Oficina del Historiador, como parte de las actividades por el 158 aniversario del natalicio de José Martí.\nCon su proverbial sencillez y profundo conocimiento, el notable experto cubano explicará e"}, {"id": "<urn:uuid:13ceecfe-be0b-46fc-9566-4fa909d398d6>", "text": "Decora la mesa en verano!\nCon la llegada del verano y las vacaciones empiezan las comidas y cenas en casa, terrazas o jardines con amigos y es muy importante tanto la comida como la decoración de la mesa. Aqui os dejo unas fotos para que os inspireis!\nLlena la mesa de flores, pon manteles de colores, de rayas, de tejidos naturales…un camino de mesa o un bajo plato de rafia. Crea centros de mesas con pequeños jarrones o botellas de diferentes alturas y colores, decora las servilletas con flores y"}, {"id": "<urn:uuid:d7a81bf2-d28d-45d7-ab9e-0082e7089683>", "text": "11:35 | Prorrogan acuerdos de precios y lanzan nuevas advertencias a las petroleras por el gasoil\nDos de las mayores preocupaciones del Gobierno compartieron espacio esta mañana en la Casa de Gobierno. El presidente Néstor Kirchner firmó un nuevo acuerdo de precios, esta vez con los mayoristas y distribuidores de quesos, fiambres y afines. Y en la conferencia de prensa posterior al compromiso hubo nuevas advertencias oficiales a las petroleras por el abastecimiento de gasoil.\nEl acuerdo con los "}, {"id": "<urn:uuid:f3efc406-9919-487a-aa31-a391fe75c640>", "text": "La Miss Santa Cruz, Olivia Pinheiro, fue coronada como la Miss Bolivia 2010. María Teresa Roca, quedó con el título, Miss Mundo, Miss Litoral Beatriz Olmos es Miss Turismo 2010 y la Reina del Bicentenario, Yovana O’Brien es Miss Tierra 2010.\nLas cuatro ganadoras manifestaron su alegría por haber obtenido su título y manifestaron su agradecimiento a todo el pueblo boliviano por su apoyo. Las demás misses concursantes las felicitaron y le demostraron su total apoyo a las ganadoras. Por su parte la"}, {"id": "<urn:uuid:bd5a0d73-b31b-4e40-8d34-c4ffd3d328d4>", "text": "Grandes gestas y finales\nLa última jornada en Arabia Saudí, donde el Al Shabab se impuso al poderoso Al Ahli en la lucha por el título, abre nuestro habitual repaso al fútbol de clubes de Asia y Oceanía. FIFA.com informa también de la recta final en las ligas de Emiratos Árabes Unidos, Australia y Nueva Zelanda, se fija en los finalistas continentales de Oceanía y presenta toda la actualidad de los campeonatos nacionales de Japón, la RP China y la República de Corea.\nArabia Saudí: el Shabab se c"}, {"id": "<urn:uuid:19f9e120-5020-4aec-8474-230225fd7428>", "text": "Acento latino en Portugal\nLos goles sudamericanos dictan sentencia en la cima de la clasificación de la Liga Sagres portuguesa, mientras en España no cambia el guión y son Lionel Messi y Radamel Falcao quienes atraen los focos. En su repaso a la actuaciones de los jugadores hispanos en el planeta fútbol, FIFA.com se fija también en dos hombres de la Premier League.\nCuadro de honor\nEl sábado, un gol de penal del paraguayo Óscar Cardozo colaboraba en la victoria por 2-0 del Benfica ante el Olhaens"}, {"id": "<urn:uuid:f2776b44-01b1-4846-888d-d1568602951d>", "text": "Juan Luna\nJuan Luna y Novicio (Badoc, Filipinas, 1857-Hong-Kong, 1899) es el principal pintor hispano-filipino del siglo XIX, y su obra, asociada al periodo de independencia filipina, está influida por el realismo plástico y por la obra de Eduardo Rosales.\nBiografía [editar]\nEstudió pilotaje en la escuela naval de Manila, pero pronto comenzó sus estudios como artista, a las órdenes de Agustín Sáez pintor español radicado en Manila . En la década de los setenta del siglo XIX se trasladó a Madrid,"}, {"id": "<urn:uuid:05e46ac9-88e4-4741-9747-dd06cfbb563d>", "text": "Con la llegada del buen tiempo llegan también las ganas de quitarse capas de ropa. U.S. POLO ASSN. sigue influenciado por el mundo del polo para crear una colección de sandalias en napa y piel para la mujer.\nLa inspiración del deporte de los “caballeros” está presente en detalles como las hebillas frontales del modelo Cheri que recuerda a las anillas de las embocaduras de los caballos. Además, la tendencia “gladiadora” sigue estando de moda este verano con las sandalias Birk.\nLas flip-flop, sand"}, {"id": "<urn:uuid:503cb121-83e4-4900-b4d2-41ee1d3978b3>", "text": "El fundador de Jet Internet, Fernando García, ha puesto en marcha Derten Sistemas, un nuevo holding informático que aspira al liderazgo en el sector en Alava. La nueva compañía contará con una plantilla inicial de 25 trabajadores procedentes de ICD y Egesa, Equipos de Gestión y prevé facturar seis millones de euros anuales a partir de 2007 tanto con consultoría como con ingeniería.\nIncoming search terms:\n- internet constituye"}, {"id": "<urn:uuid:c67d28f4-7060-4772-872c-728b69920146>", "text": "El hilo de adriana es un blog que habla de todo lo que pasa en la vida, habla de carreras y profesiones como abogados y médicos, es un lugar para compartir experiencias y conocer más d ela vida.\nNo solo está limitado a los temas de los que hemos hablado anteriormente sino que también tendrá una parte que está enfocada a la alimentación y tratamientos novedosos, hasta entonces seguiremos informando."}, {"id": "<urn:uuid:ea548f6d-5d97-47b7-8cfb-f7dd81a73e23>", "text": "Acceso Remoto\nLos estudiantes y empleados del Recinto de Mayagüez pueden tener acceso a las Bases de Datos de la Biblioteca General, aún estando fuera del Recinto.\nPara acceder las bases de datos fuera del Recinto, escriba su nombre de usuario y contraseña que utiliza para conectarse a Mi Portal Colegial\n."}, {"id": "<urn:uuid:e79bf642-8709-4cf8-a16a-1f1377cb6ed5>", "text": "Sitios sobre exportadores de uva, abogados de waukegan, consultores de datos del caribe y mayoristas de xerox en colombia.\nSitios sobre abogados de rubi, comerciales de los años 50, consultores de desarrollo s.a y consultores de restaurantes.\nSitios sobre mayoristas de telefonia, fabricantes de aerogeneradores, agencias de loterias y quinielas uruguay y empresas de reformas.\nSitios sobre fabricantes de puertas de cocina, agencias de limpieza en alcala de guadaira, consultores de imagen personal "}, {"id": "<urn:uuid:cf8655fb-bc2b-4509-88e6-4d89ae6379ba>", "text": "Departamento de Ingeniería de Minas\nEl Departamento de Ingeniería de Minas tiene como misión preservar su condición de centro de excelencia a nivel nacional e internacional en las diversas áreas asociadas a la industria minero – metalúrgica. A través de la investigación aplicada esta unidad desarrolla nuevos conocimientos que son luego transferidos al sector productivo. En el ámbito de la docencia sus académicos asumen la responsabilidad de la carrera de Ingeniería Civil de Minas como de dos pro"}, {"id": "<urn:uuid:7204f845-b241-4b66-9bc4-5952c4943ce9>", "text": "Actualizaciones AGOSTO 2012\nEl Presidente del Gobierno ha creado el Departamento de Seguridad Nacional, que sustituye en la practica con algunas funciones añadidas al Departamento de Infraestructura y Seguimiento de Situaciones de Crisis, asumiendo sus atribuciones y el Centro Nacional de Conducción de Situaciones de Crisis.\nSe añade informacion ademas sobre la Unidad Operativa Sanitaria de Presidencia del Gobierno.\nMediante el Real Decreto 1202/2012 se nombra a Secretaria General del Centro Nac"}], "1": [{"id": "<urn:uuid:32167599-7752-4cb5-b233-e9f762d9d15b>", "text": "Me parece una buena idea porque a veces se nos olvida sonreír y al momento de esforzarse por una sonrisa, se te olvida un poco el enojo o el estrés\nme parecen bastante innovadores porque buscan disminuir el impacto al medio ambiente ya que cada vez se consumen más botellas de bebidas en el mundo :(\ne parece bastante innovador porque nunca se ha hecho algo por estilo pero creo que sería incrementar le ruido en la ciudad, así como la tensión en las personas , por lo que no creo que sea algo que se"}, {"id": "<urn:uuid:9c3f4a92-a042-4dfa-bb60-9431cf347234>", "text": "15 de agosto de 2012.- Este foro se estará desarrollando este jueves 16 de agosto a las 9:00 am, en la Casa de Gobierno del Distrito Capital, Salón Simón Bolívar.\nFORO ANDOCOMUNICANDO\nCOMUNICACIÓN POPULAR EN TIEMPOS DE REVOLUCIÓN\nPONENCIAS\nPonencia Nº 1:\nTítulo: ¿Por qué comunicación y no propaganda?\nPonente: Roberto Garcés (Habitante de Ciudad Caribia)\nReseña de la ponencia: Breve exposición de cómo nos hemos involucrado en un accionar propagandístico que no permite al ciudadano y la ciudadana "}, {"id": "<urn:uuid:4d0c03d3-c5b5-4abc-a50c-c19aa29318e0>", "text": "Hace una semana, el famoso actor Will Smith estuvo de visita en el Hormiguero con Pablo Motos. Éste le preguntó sobre unas declaraciones que hizo su mujer sobre cómo se conocieron y se enamoró de él. En el video que veréis abajo, Will aclara muy bien, de manera muy divertida y con gran sentido del humor, algunas claves importantes por las que enamoró a su mujer.\nEn este video se pueden ver plasmados, en unos pocos gestos de Will, tres de los principios que describí en mi libro, Psicología y Sedu"}, {"id": "<urn:uuid:32dba53d-75d6-44eb-822d-f9832545bcad>", "text": "El gobierno de Mariano Rajoy ha rectificado en la propuesta inicial de eliminación de las entidades menores locales que conocemos en muchos casos como parroquias rurales.\nEl argumento de protesta de los afectados ha sido que estas entidades no suponen coste alguno para el estado, ya que únicamente gestionan sus propios recursos. Y así parece habérselo reconocido el Gobierno de España, ya que ha modificado su propuesta y ahora pretende eliminar únicamente las que no cumplen el objetivo de déficit"}, {"id": "<urn:uuid:cc246318-5f03-4e4c-97f7-76182a449d5f>", "text": "Sí, suena a libro erótico con posiciones contorsionistas, pero no es que Benetton haya inventado nuevas posiciones, más bien ha interpretado esta especial conexión humana.\nEl día 06 de septiembre se dará a conocer en 3 concept store de Milán, Berlín y Estambul (y mundialmente via internet) la nueva instalación realizada por Erik Ravelo (el multifacético Director Creativo de nuestra Colors Magazine!).\nLana Sutra es una serie de quince instalaciones creadas como un himno al amor y al deseo de igua"}, {"id": "<urn:uuid:34a8725d-47cb-4ea1-888e-368e37b90d90>", "text": "(21:02) El Memorial de Víctimas de la Violencia que está ubicado a un costado del Campo Marte, en el Distrito Federal, no será inaugurado por Felipe Calderón, indicaron este jueves la activista mexicana Isabel Miranda de Wallace, y el área de Comunicación de Províctima.\n“Nunca me dijo el presidente, ni yo quedé con el presidente, cuando pedí el Memorial, de que él fuera a inaugurarlo”, comentó Miranda de Wallace.\nEn una entrevista con CNNMéxico, en octubre pasado, Miranda de Wallace mencionó que"}, {"id": "<urn:uuid:e64ad535-a290-4e6b-9823-088b2ab99853>", "text": "Se dice que el cómic es el noveno arte y en los años noventas del siglo XX, más que ningún otra época se pensó que así era y se pagó el precio.\nEn los Estados Unidos, cuna del cómic moderno, esta idea de comparar un cómic con un Monet o un Picasso, llevó a la industria norteamericana al borde de la desaparición, a romper los lazos con su auditorio y fieles lectores, alejando a los nuevos.\nPara 1993, la industria del cómic, con la salida de Death of Superman, llegó a una burbuja de la llamada fie"}, {"id": "<urn:uuid:afb2740c-eab1-404d-8683-d4f2db67b7b0>", "text": "Estreno de cine \"Ice Age 4: La formación de los continentes\"\nCine para divertirse en familia\nSabemos que el verano es un buen aliado para entretener a los niños en una calurosa tarde de verano, por ello os queremos proponer pasar un fin de semana muy refrescante y divertido. Este viernes 29 de junio tendrá lugar el estreno de la película de animación Ice Age 4: La formación de los continentes, una película que encanta a grandes y pequeños, recomendada para toda la familia. Manny, Diego, Sid y la"}, {"id": "<urn:uuid:6e0cb2b7-d86a-40e3-8b9e-e9e00e9aee27>", "text": "No es normal que salga a entrenar de corto y vuelva pensando mal del Sol.\nNo es normal que un día laborable no esté trabajando.\nComo tampoco es normal que un día de febrero no salga abrigado y vuelva mojado.\nMal vamos si el tiempo no cambia.\nMal vamos si estos tiempos no cambian.\nNo sé qué es peor.\nSr. Cabeza propone, mi señora Cabeza no deja\nde dar vueltas y dispone"}, {"id": "<urn:uuid:db3bf53a-2dd6-403c-b7a7-1676e5a08fe1>", "text": "Labana (AIP) El gobierno castrista ha autorizado los cursos y círculos de interés sobre tele transportación que de manera informal y clandestina venían produciéndose en la capital por grupos hartos del deterioro e inoperancia del transporte público.\nEl incremento de los tele transportistas, cuyas edades abarcan desde los ocho hasta los ochenta años de edad, prácticamente ha obligado al gobierno a consentir y darle el visto bueno, con la expectativa de que esta modalidad se extienda al resto de l"}, {"id": "<urn:uuid:45b57db2-1981-492a-bc54-c68a21e48607>", "text": "Si estás pensando ir a observar y disfrutar el raid, es importante que tomes en cuenta estas recomendaciones\nDANIEL SAN ROMÁN\n@dasanroman\nHIDRATACIÓN\nVer una prueba en medio del desierto es un reto. No hay sombras cercanas, la temperatura que se despliega dentro de los vehículos es altísima y el sol ataca a todos los espectadores sin compasión. Por eso es vital llevar un cooler con bastante agua. Calcula un litro por hora en la ruta. Es importante tener en cuenta que la ingesta de bebidas alcohó"}, {"id": "<urn:uuid:5a594c1e-afab-4fee-808f-867e65a1414c>", "text": "Barak anuncia que empezará las conversaciones con Siria en semanas\nEl primer ministro israelí Ehud Barak anunció ayer que las negociaciones entre Israel y Siria empezarán dentro de \"algunas semanas\". La declaración del líder laborista, que ayer se entrevistó en Londres con el jefe del Gobierno británico, Tony Blair, fueron ratificadas por el Ejecutivo sirio con un comentario difundido a través de la radio oficial. Mientras los países árabes recogen con entusiasmo la celeridad con que Israel se a"}, {"id": "<urn:uuid:ec5c7deb-a12b-4bd2-b6cc-e4c6b6469529>", "text": "E
