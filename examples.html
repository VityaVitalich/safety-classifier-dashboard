l socialista francés Laurent Fabius amenaza con votar 'no' a la Constitución europea\nUna cuestión de política interior pone en peligro 20 años de europeísmo de Francia\nVeinte años de política europea de Francia corren un serio riesgo a causa del creciente número de figuras de la izquierda que piden el no en el referéndum sobre la Constitución europea. Un hombre tan pragmático y centrista como el ex primer ministro Laurent Fabius amenazó anoche con hacerlo salvo si el presidente Jacques Chirac c"}, {"id": "<urn:uuid:87d099c2-cbf0-4820-8ab9-29526c502486>", "text": "Posted on 13 septiembre 2012 by El Síndrome de Elena\nAlguno de los componentes de la compañía de teatro El Síndrome de Elena hemos estado en Cope Elche presentando nuestra nueva obra ‘Las crónicas de Baker‘. Puedes escuchar nuestra entrevista haciendo clic en parte 1 y parte 2.\nPosted on 06 septiembre 2012 by El Síndrome de Elena\nEl Síndrome de Elena estuvo presentado el jueves 30 de agosto de 2012 su nueva obra ‘Las crónicas de Baker‘ en Onda Cero Elche. Una tragicomedia que será estrenada en l"}, {"id": "<urn:uuid:62cfd28b-255a-4fb5-8727-dbcbbbbf54fc>", "text": "Aumentarían demandas legales de alérgicos\nNueva ley les permite someter quejas por falta de alimentos libres de gluten y otras sustancias\nRedacción, AP | 1/19/2013, 7:45 a.m.\nLas personas que sufren severas alergias disponen de un nuevo medio para encontrar alimentos acordes con su dieta: la ley federal sobre enfermedades. Y ello podría dejar a los centros de enseñanza superior, restaurantes y otros lugares que ofrecen alimentos más vulnerables a las demandas legales.\nUn acuerdo judicial debido "}, {"id": "<urn:uuid:91dd7ef9-f2a9-4173-bcd5-834218ba470e>", "text": "En la práctica psicoterapéutica existen numerosos aspectos subyacentes que la condicionan, marcando los límites dentro de los cuales se va a desenvolver la actuación del terapeuta.\n© PSY'N'THESIS\nTales supuestos implícitos derivan en gran medida de las asunciones que están presentes en unas y otras escuelas psicoterapéuticas, es decir, de lo que se ha denominado como sus \"creencias fundacionales\" sobre el ser humano, sus dinámicas, el concepto de enfermedad mental o la forma en que la terapia ha"}, {"id": "<urn:uuid:34af459e-8f55-4297-a290-2546c3d7487b>", "text": "¿Los supermercados crean empleo?\n[català]\nEsther Vivas | Público\nLa apertura de un gran centro comercial, un supermercado… siempre va asociada a la promesa de creación de empleo, dinamización de la economía local, precios accesibles y, en definitiva, a progreso. Pero, ¿la realidad es así? La gran distribución comercial se sustenta en una serie de mitos que, a menudo, su práctica desmiente.\nLa Asociación Nacional de Grandes Empresas de Distribución (ANGED), la patronal de la gran distribución, qu"}, {"id": "<urn:uuid:d7f18755-aea7-4996-88c5-66448d315e26>", "text": "Mi amigo imaginario dice q esto no existe\njeje\nYo tuve uno se llamaba Luis\nq cosas\njajajajajajajajaajajaja yo una vez me imaginé que tenía un amigo imaginario, se llamaba “C” y funcionaba mucho como la voz en off de “los años maravillosos”, chale, me cae que de chaito uno debrayaba muy gacho!!!\nJA JA JA QUE TERNURA!!!! nunca hubiera creído que Lucho tenía amigo imaginario!\nHola a todos:\nPues con la noveda’ de que acabo de conocer este web comic y estoy fascinado, sobre todo por la sencillez del "}, {"id": "<urn:uuid:5e01c086-3546-47f6-903c-d121dfd073a3>", "text": "La fiebre recurrente transmitida por las garrapatas (TBRF, por sus siglas en inglés) es una enfermedad que puede contraerse a través de una garrapata. Es una infección provocada por una picadura de una garrapata que porta la bacteria Borrelia hermsii. En los Estados Unidos, estas garrapatas, por lo general, se encuentran en los lugares más elevados de los estados del oeste.\nSi tiene TBRF, es probable que tenga fiebre que aparece y desaparece. Algunos otros síntomas de TBRF pueden incluir:\nUsted "}, {"id": "<urn:uuid:01f3d18c-3cb4-43f6-90aa-768607336b64>", "text": "Gracias Natasha\nMLG para nuevos\nHalo México estrena una nueva etapa en cuanto a actividades para la comunidad y es...MLG para nuevos donde semanalmente podrás jugar en esta lista de juego bastante peculiar por ser la usada en los circuitos profesionales, no importa si eres principiante, lo importante es tener una buena actitud y ganas de aprender.\nHalo 4 nuevas imágenes spartan ops, multijugador\nE3 trajo mucha información consigo, especialmente de Halo 4 que finalmente estará en las manos de los"}], "2": [{"id": "<urn:uuid:cf6b460f-35fb-45ed-b3f8-def78ce4b0c4>", "text": "Información general\nEl 11 de agosto tuvieron lugar las segundas elecciones celebradas en el país desde el final del conflicto, en 2002. En septiembre, en la segunda vuelta, Ernest Koroma, candidato del Congreso de Todo el Pueblo, se hizo con el 54,6 por ciento de los votos, mientras que Solomon Berewa, vicepresidente del país y candidato del gobernante Partido Popular de Sierra Leona, obtuvo el 45,4 por ciento de los votos. Ernest Koroma fue investido presidente el 15 de noviembre.\nSe aplazó el "}, {"id": "<urn:uuid:2bea6404-c233-4c3e-8d17-a8c71906aa24>", "text": "Muchos son los que han levantado sus voces para enfatizar lo \"disparatado\" de los reclamos bíblicos sobre la ocurrencia de una inundación universal equivalente a la descrita por el libro de Génesis. De acuerdo con el relato bíblico, Dios decidió juzgar al hombre mediante la destrucción de la raza humana hasta ese momento histórico, y solamente salvando a Noé y a su familia, comenzar de nuevo para limpiar lo que hasta ese momento había sucedido. (Para un fascinante estudio acerca de lo que nosotr"}, {"id": "<urn:uuid:716f07c0-0d19-4240-99f3-87badfdaea4a>", "text": "El joven periodista esloveno Bostjan Videmsek ha rebautizado como “Catastroika” la amenaza, cada vez más posible, de una intervención del Banco Central Europeo, el Fondo Monetario Internacional y la Comisión Europea en el discreto país balcánico, cuyo sistema bancario necesita 900 millones de euros de aquí a julio para salvar uno de sus grandes bancos enfermos. Responsables políticos en Bruselas se niegan a comparar la situación de la banca de Eslovenia con la de Chipre, pero reconocen que va a "}, {"id": "<urn:uuid:d32c2bd2-569c-411d-8533-5bc2ce4d6c14>", "text": "Cada Sitio Web tiene una dirección IP asignada. La misma consiste en una etiqueta con un formato del tipo XXX.XXX.XXX.XXX. Es decir, son cuatro lotes de tres dígitos. De esta manera, para acceder a un Sitio Web podríamos usar su IP (ej. 22.214.171.124).\nEvidentemente es difícil recordar estos números incluso para los sitios que habitualmente visitamos. Así que para esto usamos nombres de dominio del tipo midominio.com. Cada nombre de dominio apunta a una dirección IP y así es más sencillo record"}, {"id": "<urn:uuid:e832ae4e-1d00-4864-9921-df5cba203bf6>", "text": "Hola amigos, esta vez vengo con una guía de herramientas indispensables (y otras no mucho pero = muy útiles) a la hora de hacer modding, algunas siempre las tendremos en casa, otras debemos comprarlas.\nprimero que nada la seguridad, por más experimentado que seas siempre serán útiles:\nGuantes: a veces incomodos para trabajar, pero luego que te acostumbras no son tan malos, ademas evitaras gran parte de accidentes.\nGafas: siempre útiles para proteger tus ojos, así uses anteojos no tienen el mismo"}, {"id": "<urn:uuid:d8ff77be-53bb-4d9d-b9d3-a6ac7311a682>", "text": "Definición\nLa diabetes tipo 1 se produce·cuando el cuerpo no produce suficiente insulina. La insulina es una hormona que ayuda al cuerpo a convertir los alimentos en energía. Sin insulina, la glucosa (azúcar) de los alimentos que ingiere no puede ingresar en las células. De este modo, se acumula en la sangre. El tejido corporal comienza a necesitar energía.\nPor lo general, la diabetes tipo 1 se manifiesta·en niños y adultos jóvenes. A largo plazo, si esta afección no se trata de forma adecuada, "}, {"id": "<urn:uuid:646c6ca0-0d9a-4d93-8804-cd998cc1abc1>", "text": "Hoy es 8 de mayo de 1970, son las 5 de la mañana y su madre despierta con la primera contracción.\nElla sabe que va a nacer y es inevitable.\nSu madre la va a cuidar, va a alimentarla y cantando suavemente calmará los primeros llantos.\nDos años después la salvará del padre y el revólver bajo la almohada. También la llevará a terapia y le creerá cuando a los 7 años ella le cuente que el abuelo de Paco tiene las manos muy ásperas.\nCuando ella tenga 11 llamarán a su madre “madre soltera”, aunque sea "}, {"id": "<urn:uuid:da1df7e8-578d-4dad-b0c1-4c6280c9b7cb>", "text": "La Audiencia Provincial de Valencia ha dictado orden internacional de busca y captura y prisión provisional para un hombre acusado de abusos sexuales continuados a una menor de 12 años, a la que dejó embarazada, al no presentarse a la primera sesión de la vista oral, celebrada hoy en la Ciudad de la Justicia.\nEl acusado, de nacionalidad boliviana, fue detenido por estos hechos en agosto de 2010 y prestó declaración en el Juzgado, pero no se solicitó la prisión preventiva y se sospecha que podría"}, {"id": "<urn:uuid:bd61cc85-e2a6-4852-ada7-c8831343e0e5>", "text": "El IEO de Cádiz oferta 1 contrato como Técnico Superior de Actividades Técnicas y Profesionales para trabajar en el proyecto REMAN_BIODON: Análisis de parámetros biológicos de la población de coquina.\nMás información\n13/05/13\n01/03/13\nEste jueves, en aguas de las islas Cíes y a unos 13 metros de profundidad, hemos encontrado un macho de centolla (Maja brachydactyla) de dimensiones espectaculares. El caparazón medía más de 25 cm, la envergadura total unos 75 cm y el peso quizás podría llegar a lo"}, {"id": "<urn:uuid:df4ba4dd-1eaa-4d6a-988b-d1073c6bd304>", "text": "Experiencia Radial:\nEl Dr. Elmer Huerta comenzó a usar la radio como medio para difundir consejos de salud con especial énfasis en la prevención en 1986 en Lima Perú. En 1989 llegó a la ya desaparecida Radio Borinquen con un proyecto radial que consistía en cápsulas diarias de 5 minutos de duración tituladas “Cuidando su Salud”. El Gerente de la estación Alejandro Carrasco inmediatamente le abrió las puertas y fue así como comenzó una fructífera relación que continúa en la actualidad con un prog"}, {"id": "<urn:uuid:d1bb6856-78eb-452d-9458-bf8fb4cf493d>", "text": "Mi SciELO\nRevista Cubana de Cirugía\nversión On-line ISSN 1561-2945\nRev Cubana cir v.38 n.1 Ciudad de la Habana ene.-abr. 1999\nCentro de Iinvestigaciones Medicoquirúrgicas (CIMEQ)\nLigadura del conducto cístico. Colecistotomía y exTracción de cálculos vesicularesDr. Emigdio Collado Canto,1 Dr. Eliot Martínez Pérez,2 Dr. Juan C. Collado Otero3 y Dr. Raúl A. Rodríguez Sánchez 4\nResumenSe realizó la ligadura del conducto cístico y extracción de cálculos en un paciente operado de urgencia, en el cual "}, {"id": "<urn:uuid:8ff97751-ab08-4042-b96f-22d3c5c68612>", "text": "El nombre \"espino\" se deriva de \"espinoso,\" refiriéndose al árbol espinoso usado como alambrada viva en gran parte de Europa. Además de proteger a los estados de los intrusos, el espino también ha sido usado de forma medicinal desde tiempos ancestrales. Los médicos romanos usaban el espino como medicamento para el corazón en el primer siglo D.C., pero la mayoría de la literatura de ese período se enfoca en su uso simbólico para los ritos religiosos y las ceremonias políticas.\nDurante la Edad Med"}, {"id": "<urn:uuid:af426997-cba7-492e-937f-7d7d92ef7c11>", "text": "BOGOTÁ, Colombia (EFE).- La iniciativa uruguaya de legalizar la marihuana y encargar al Estado la producción y comercialización de la sustancia ilícita más consumida en el mundo no ha tenido apoyo en otros países de América Latina, pese al reconocimiento general de la necesidad de replantear la lucha contra las drogas.\nEl gobierno de Uruguay envió esta semana al Parlamento un polémico proyecto de ley que, de ser aprobado, hará del pequeño país latinoamericano el primero del mundo en el que el Es"}, {"id": "<urn:uuid:bc78ad92-e6ec-4869-8650-22f99ab112d0>", "text": "El senador nacional del Frente Cívico Luis Juez y el diputado de la UCR Oscar Aguad respaldaron este martes el reclamo ante la Corte Suprema del gobernador José Manuel de la Sota para que la Nación salde la deuda previsional de 1.040 millones de pesos que exige la Provincia.\nLos legisladores no sólo apoyaron el reclamo del Ejecutivo provincial sino que pidieron más fondos por Coparticipación Federal y hasta deslizaron que llegó la hora de rediscutir la ley que regula el reparto de los fondos rec"}, {"id": "<urn:uuid:9db26b77-d71e-400b-8969-bf4463f5a7a4>", "text": "Todo listo para el comienzo de clases en SMA\nAseguró Germán Lopinto, a cargo del Distrito Escolar n° 9. Confirmó la llegada de las partidas y la finalización en tiempo de los trabajos de mantenimiento edilicio.\nEl director del distrito escolar n° 9 con asiento en San Martín de los Andes, Germán Lopinto confirmó que se encuentran dadas las condiciones para el inicio del ciclo lectivo 2013 en la ciudad, en cuanto a los edificios escolares y las partidas para la merienda.\nExplicó que desde diciembr"}, {"id": "<urn:uuid:4a58f562-482a-47ce-ad67-2cafdfb3c2c8>", "text": "Si necesitas una base de datos propia de emails cualificados, una vía rápida y eficaz es el patrocinio o sponsorización en nuestros portales, a través del cual compartimos los nuevos usuarios registrados en nuestros soportes con su consentimiento expreso.\nVentajas\nUsuarios de alta calidad.\nSegmentación a medida\nBase de datos en propiedad\nLegalidad: consentimiento expreso del usuario de acuerdo a la legislación vigente\nBajo coste de adquisición\nRapidez de generación\nContacta Con Nosotros\nPuedes c"}, {"id": "<urn:uuid:0f72ebf9-3ec1-4f93-ab2f-be5868e97841>", "text": "Las gallinitas, las joyas, y hoy los millones de dólares\nLa presidenta de Argentina sacudió a la opinión pública mundial con la expropiación del petróleo argentino (La Jornada, 17/4/12).\nLa expropiación busca dar al país libertad sobre su política energética, para luego enviar al Congreso el proyecto, y se espera que su aprobación será bien rápida para que de esta manera quede confirmado el acto nacionalista.\nEs claro que, por asociación de ideas, de inmediato se suscitaron los comentarios que e"}, {"id": "<urn:uuid:2ea22b09-073b-4a98-a958-6b11b5978bbf>", "text": "Drogadicción: Abuso y adicción\nEl uso persistente de drogas ilícitas – tales como anfetaminas, narcóticos, drogas para mejorar el desempeño y drogas por receta obtenidas ilícitamente – constituye el abuso de drogas. Desarrollar una necesidad compulsiva de utilizarlas constituye la drogadicción. Utilice los recursos listados en esta sección para aprender sobre el abuso de drogas y la drogadicción.\n- El abuso de drogas y la drogadicción son problemas de salud serios. Por esto, la mayoría de los me"}, {"id": "<urn:uuid:91d63530-6b5f-4d7b-a036-0ae8df5c688a>", "text": "La semana en el blog.\nLa prudencia y el miedo fueron los temas con los que arrancamos la semana de la mano de Droblo intentando darnos un mensaje positivo frente a tanto pesimismo\nEl miedo no deja de ser una ventaja evolutiva que nos lleva a no arriesgar y en muchas ocasiones, es útil. Pero creo en economía el miedo no es un buen consejero y creo se equivocan los que se empeñan en propagarlo.\nSiendo el comentario más votado el siguiente que intenta mostrar una de las peculiaridades de nuestros p"}, {"id": "<urn:uuid:92d51f25-92f0-43cc-ab58-428496b25188>", "text": "La Justicia confirmó que hay que tener cuenta en dólares para sacar plata del exterior\nLa Justicia Federal de Rosario rechazó una medida cautelar presentada por casi medio centenar de jubilados argentinos residentes en el exterior, contra la disposición del gobierno que obliga a tener una cuenta bancaria en dólares en el país para poder retirar dinero en esa moneda fuera de la Argentina. El fallo, emitido a fines de mayo pero conocido hoy, fue adoptado por la jueza federal de Rosario Silvia Adam"}], "3": [{"id": "<urn:uuid:1147c48c-a540-4e8c-85ac-1ac35b0cb4fa>", "text": "Después de 44 años Venezuela logra una Medalla de Oro en unos Juegos olímpicos, en este caso Londres 2012.\nDesde que llego Chávez al poder se han reconocido las disciplinas deportivas como uno de los principales objetivos de la revolución. Dándole participación a una cantidad de atletas que no se imaginaban que algún gobierno le reconociera sus logros.\nEn esta oportunidad voy a ser critica, porque esa medalla de Oro que sorprende al mundo y a Venezuela la logro un joven bolivarense Rubén Limardo"}, {"id": "<urn:uuid:05d0c3ed-d0f4-4df3-a8dc-938f9f8caabe>", "text": "topbonus & Comfort Log-in\n¿Ha olvidado su contraseña?\nDarse de alta »\nSeleccionar país\nSeleccionar idioma\nUna vez hecha la selección, irás a parar a la página de inicio del país elegido.\nTu navegador no admite JavaScript. Ten en cuenta que algunas funciones de la búsqueda de ofertas sólo están disponibles con JavaScript activado.\nBuscar ofertas como vuelo de ida y vuelta\nCuando quiera regresar de nuevo ...\nVuelos de oferta\nLamentablemente, para el trayecto seleccionado no pudieron encontrarse vu"}, {"id": "<urn:uuid:f66977e9-4023-47f9-809f-10555aa684b5>", "text": "Este juego a algunos les parece insignificante no es por su tamaño ni por lo que mide Algunos creen dominar el juego pero otros todavía no lo hacen el objetivo del juego es conseguir el numero más apropiado en el momento indicado.\nPero vea lo mejor que tiene este juego es decir véale el lado positivo este juego es uno de los mas impredecibles además emocionante estas dos combinaciones le agradaran mucho en ella usted podrá vivir momentos de distintos dicho o frases que los hacen ver o estar rela"}, {"id": "<urn:uuid:0b0e1af5-4931-4d19-9938-ff3423eb59fe>", "text": "Un estado es una asociación política con el dominio eficaz sobre un área geográfica . Incluye generalmente el sistema de las instituciones que demandan la autoridad para hacer las reglas que gobiernan a gente de la sociedad en ese territorio, aunque su estado mientras que un estado depende a menudo en parte del reconocimiento por un número de otros estados como teniendo soberanía interna y externa sobre él. En sociología, el estado se identifica normalmente con estas instituciones: en definición"}, {"id": "<urn:uuid:04a37ff3-96c1-4110-8e06-04b316985263>", "text": "24-may-2012, 09:58\n. Editado por TachibanaUkyo 24-may-2012, 09:59\nEso si es verdad, que humala traiciono a los incautos que votaron el por el. Pero yo diría mas bien que no traiciono sino QUE SE ORINO DE MIEDO AL VER QUE MAS DIFÍCIL GOBERNAR (COMO EL LO ACEPTO) QUE SU FLORO SOCIAL y que su estúpida aventura lo pudo ser pasar a la historia como el peor presidente de la historia republicana.\nEste tipo nunca me cayo en gracia pero su cobardía hace que sigamos la senda del desarrollo. Irónico como s"}, {"id": "<urn:uuid:e888a68e-6022-49d2-a3d1-c6740b42b3f5>", "text": "MS06-015 no está catalogado como virus, gusano, troyano o backdoor. Se trata de una vulnerabilidad crítica en el Explorador de Windows de ordenadores con sistema operativo Windows 2003/XP/2000/Me/98, que permite ejecutar remotamente código arbitrario en el sistema vulnerable.\nSi se explota con éxito, MS06-015 permite a los piratas informáticos conseguir control remoto del ordenador afectado, con los mismos privilegios que el usuario que haya iniciado la sesión. Si dicho usuario poseyera derechos"}, {"id": "<urn:uuid:b0ac5464-6ba2-4cec-9c24-7f77778fdcb2>", "text": "Administrador web hosting\nOfrecemos web hosting totalmente gestionado para todos los VPS, Servidores Dedicados y órdenes que vienen con cPanel instalado.\nIdeal hosting gestionado para empresas que no cuentan con un personal de TI interno o desea liberar su personal de TI para centrarse en otras tareas. Muchas empresas se muestran escépticos acerca de la activación de la gestión y hospedaje de sus servidores a un proveedor de alojamiento web, pero aquellos que utilizan servicios de hosting gestio"}, {"id": "<urn:uuid:478d93cc-ffe6-4ffc-86a8-312d0c2b97de>", "text": "Mejor precio, ¿con respecto a qué?\nCon respecto al precio recomendado en nuestra Tasación Online.\nCon nuestro sistema de Tasación Online, analizamos las características y prestaciones de cada inmueble,\ncomparándolo con otros similares de la misma zona.\nSi activas este filtro, solo te mostraremos\nlos inmuebles cuyo precio se ajusta o está por debajo del valor de tasación."}, {"id": "<urn:uuid:61493450-8f2c-4272-bac8-2dad84dc85d1>", "text": "En el mundo de la publicidad hay una máxima con la que estoy muy de acuerdo que dice la mala publicidad no existe, sobre todo si es gratuita.\nY nada mejor para conseguir publicidad gratuita de una campaña de publicidad que un escándalo. O dos. Y es que la que protagoniza Hailee Steinfeld para la temporada Otoño Invierno 11/12 de Miu Miu (obra de Bruce Weber) ya había tenido su cuota de polémica al hacerse pública que iba a estar protagonizada por esta actriz de 14 años por considerar que era dem"}, {"id": "<urn:uuid:87e9eea3-0828-4576-9b2d-c90c728c4055>", "text": "\n\nEstimados voluntarios,\ninformaros de que habéis calculado en las últimas semanas un total de 640000 WUs con picos de hasta 10GB de RAM, lo que es bastante. Felicidades a todos, ya que no hay muchos proyectos que puedan presumir de unos voluntarios tan dedicados y de tan altas prestaciones.\nDe todos los resultados obtenidos en esta fase, solo uno ha producido una solución interesante, y es el correspondiente a la tarea etiquetada como Prueba10156690.pro, la única capaz de mantener la actividad "}, {"id": "<urn:uuid:1ec70145-b01c-444b-9a6e-bbfa4ec07480>", "text": ".Orlando Guevara Núñez\nDía negro. Con esas dos palabras, sintetizó el Comandante Ernesto Che Guevara su dolor ante la muerte en la guerrilla boliviana, el 25 de abril de 1967, de Eliseo Reyes Rodríguez, el Capitán San Luis, Rolando en esa gloriosa gesta.\nHabía nacido Eliseo en el territorio santiaguero de San Luis -cerca de donde se forjó la familia de los Maceo-Grajales-el 27 de abril de 1940. El quinto entre once hermanos de un humilde hogar que cuando él tenía sólo ocho años de edad fue a res"}, {"id": "<urn:uuid:82bd688f-c308-4ade-a23b-fb418a5612ce>", "text": "Principales patrocinadores\nOtorga subvenciones para hacer frente a los problemas sociales y ambientales más graves que enfrenta la sociedad, donde el capital de riesgo, responsablemente invertido, pueda hacer una diferencia en el tiempo.\nUna agencia federal independiente creada por el Congreso en 1950 para promover el progreso de la ciencia.\nUniversidad Rey Saud busca convertirse en un líder en la innovación educativa y tecnológica así como en el descubrimiento científico y la creatividad median"}, {"id": "<urn:uuid:f34a129d-594e-43f1-8599-e523f3c749b8>", "text": "Se ha puesto de moda ser como \"El Cobra\". Os aseguro que hay cientos de jóvenes en las aulas esperando su momento. Haría bien el Ministro de Educación de irse de vacaciones porque con los últimos espectáculos televisivos de Cobras, GH, etc, no tiene nada que hacer. Si además tenemos a un expresidente aficionado al Cobra pues apaga y vamonos."}, {"id": "<urn:uuid:dac11731-279a-4549-b3c7-e5fcc590702e>", "text": "Estimados lectores, debido a los problemas técnicos de la web, que somos incapaces de subsanar, hemos decidido cerrarla temporalmente, de manera que al menos no le estaremos pagando a nuestro servicio de hosting por un servicio que no está prestando.\nLas entradas de la web y los foros no se perderán, y esperamos poder migrar los contenidos a un nuevo servidor en breve.\nSentimos mucho las molestias ocasionadas.\nDe momento nos podéis encontrar en este blog provisional: http://lacrisisenergetica.wo"}, {"id": "<urn:uuid:0887dcf0-5892-498a-8df6-6d221ae5bc98>", "text": "definición\nAlteración grave, fatal en ocasiones, del tejido adiposo que se produce principalmente en los lactantes pretérmino debilitados que presentan otra enfermedad subyacente, y manifestada por una induración difusa no cicatricial en el tejido afectado. La piel está fría, amarillenta y la enfermedad se localiza sobre muslos y tronco. Asocia una tasa de mortalidad del 50%.\nsinónimos\nEsclerema del recién nacido"}, {"id": "<urn:uuid:5e73abbd-c69a-4015-bf0b-3ff0a961e6c8>", "text": "Juntos en armonía\nSin pretender, ni por un momento, intervenir en la histórica polémica entre católicos y masones, porque no es ése mi deseo ni propósito de este sencillo texto, me gustaría empezar el presente artículo con la siguiente pregunta: ¿Puede un católico pensar en convertirse en masón sin dejar por ello de ser católico, y menos aún, cristiano? En general, pervive entre los católicos una imprecisa y difusa noción de que no es lícito ingresar en la hermandad masónica, noción lo suficient"}, {"id": "<urn:uuid:52069026-b3c6-4428-9cb1-d335896c50f2>", "text": "Quieres escribir en iDA Movil? … si te gustan los dispositivos y productos de Apple tanto como a nosotros ahora puedes escribir en este blog. Para ello te pedimos algunos conocimientos de wordpress y edición básica de fotos con photoshop. Puedes rellenar este formulario y dejarnos un post de ejemplo para ver como escribes. Podemos ofrecerte una pequeña retribución económica."}, {"id": "<urn:uuid:ab811c0d-3c6f-419e-be95-bc4b8ac77b68>", "text": "Desde ahora todos nuestros clientes y nuevos clientes pueden activar el sistema de afiliados de SpaHosting, con el cual podrán ganar el 5% de cada pago hecho por cada cliente que nos envíe.\nCuando Vd. envía un visitante a nuestra web usando su ID único de Afiliado, se almacena una cookie con su ID en el PC del visitante. De esta manera, si esa persona vuelve a visitar nuestra web, nuestro sistema detecta la cookie y asigna la comisión en su cuenta de afiliado.\nPueden activar este servicio desde "}, {"id": "<urn:uuid:126e819c-0ab1-428e-aa4b-4dcd75be9b45>", "text": "Untold stories: Stone and the bomb\nGustavo Silva\nEl cineasta Oliver Stone ha irrumpido, con ayuda del historiador Peter Kuznick, por los flancos del texto y la imagen para contarnos The Untold History of the United States en 784 páginas (Gallery Books) y 10 capítulos (Showtime), respectivamente. El meollo del cuento estriba en que la bomba atómica marca la conversión de EE. UU. en the black hole por donde podría desparecer la humanidad. Stone & Kuznick nadan a contracorriente por el cauce que el"}, {"id": "<urn:uuid:fa72556a-ef22-48c9-be5a-6006cd63cb75>", "text": "19/09/11\n¿Es tu primera vez? Recibiras un e-mail de confirmación tras enviar tu mensaje.\n¿Estás registrado? Introduce tu correo electrónico y contraseña.\nIntroduce tu nombre en AOL o AIM y tu contraseña.\nPor favor, procura que los comentarios estén relacionados con el artículo. Las direcciones de correo electrónico nunca se muestran al público, pero son necesarias para que puedas confirmar tus comentarios.\nCuando pulses el botón \"Añadir comentario\" recibirás un enlace para confirmar tu mensaje e"}], "4": [{"id": "<urn:uuid:d6f287ff-242c-4190-87e5-455add66bf62>", "text": "Red Social de Videojuegos\nComparte tu perfil de jugador con otros usuarios de la Red Blogocio.\nForos Blogocio\nCrea y comparte contenido de calidad con nuestra comunidad de usuarios.\nRadio Blodec\nRadio On-Line sobre videojuegos con emisiones en directo y periodicidad semanal.\nReset\nTiras cómicas sobre videojuegos y temáticas relacionadas con periodicidad diaria.\nSala de juegos\nDisfruta de los mejores juegos de navegador con un importante componente social.\nCentral de Partidas\nCrea y organiza part"}, {"id": "<urn:uuid:f62aae9c-9730-4906-9a98-55d26dab119c>", "text": "Si está trabajando en AX 2012 con una entidad legal de México y se presenta el siguiente escenario:1. Se registra un factura de honorarios de un proveedor, la cual tiene como impuestos: IVA e impuestos retenidos.2. Posteriormente se realiza el pago de la factura, con lo que se hace la reclasificación del IVA (los impuestos retenidos no se mueven porque sólo se registran al facturar).3. Por error en el pago de la factura es necesario cancelar el pago.Con relación a los impuestos, se espera que só"}, {"id": "<urn:uuid:bdec6e44-3480-4701-b94e-4a2d05dae8ed>", "text": "Los hombres que ejecutaron a Bin Laden no actuaron por su cuenta: cumplían órdenes del Gobierno de Estados Unidos. Habían sido rigurosamente seleccionados y entrenados para misiones especiales. Se conoce que el Presidente de Estados Unidos puede, incluso, comunicarse con un soldado en combate.\nHoras después de realizar la acción en la ciudad paquistaní de Abbottabad, sede de la más prestigiosa academia militar de ese país e importantes unidades de combate, la Casa Blanca ofreció a la opinión mun"}, {"id": "<urn:uuid:e2cbdf8f-ef49-4dfe-8771-b28252a95020>", "text": "For Immediate Release\nOffice of the Press Secretary\n19 de marzo de 2004\nDECLARACIONES DEL PRESIDENTE SOBRE LA OPERACIÓN LIBERTAD IRAQUÍ Y LA OPERACIÓN LIBERTAD PERDURABLE\nThe East Room\n11:02 A.M. EST\nEL PRESIDENTE: Buenos días y gracias por asistir. A Laura y a mí nos complace darles la bienvenida a la Casa Blanca. Señor Secretario, gracias por estar aquí. Están presentes miembros de mi Consejo Nacional de Seguridad, miembros de mi gobierno, miembros of nuestras Fuerzas Armadas, miembros del Con"}, {"id": "<urn:uuid:9410bcac-fe97-47cd-b891-3f896c6f032d>", "text": "Átomo\nQuímica. Partículas. Subunidades. Características. Tipos de rayos. Constante de Planck. Rutherford. Modelos atómicos. Böhr\n- Enviado por: Rafael López Azuaga\n- Idioma: castellano\n- País: España\n- 7 páginas\nAPUNTES QUÍMICA\nTema A: El átomo\nSon las partículas por las que están compuestos los elementos, tal como dimos en los anteriores apuntes. Cada átomo tiene unas subunidades:\nProtones: Las que tienen carga positiva\nElectrones: Las que tienen carga negativa\nNeutro: No es ni positiva ni nega"}, {"id": "<urn:uuid:8326116d-eeb5-412f-88ee-8c2ff4ed5419>", "text": "El otro día Misne y yo conocimos a una profunda. De verdad, era clavada: ojos tremendamente saltones, piel áspera, aspecto prematuramente envejecido, y hasta juraría que tenía arrugas en el cuello . Pero pasé la tirada de COR y sigo creyendo que Lovecraft se inventó todo aquello y que era una chica completamente humana poco agraciada por la naturaleza. Lo cual me lleva a una curiosa reflexión.\nLos personajes de la Llamada pueden enloquecer o morir, pero no les asaltan las dudas: saben (de manera"}, {"id": "<urn:uuid:a8072801-2cab-4ace-ab3a-1cc97c0a9946>", "text": "Crimen\nHaití, la Policía: Cuatro detenciones más después de la muerte de cuatro hermanos jóvenes\n- Sábado, 04 de agosto 2012 19:22\nJacmel, Haití (defend.ht) - La policía en el Sud-Est lleva a cabo la detención de cuatro sospechosos en la ciudad de Jacmel viernes por la noche por su participación en la muerte de cuatro niños pequeños en la cercana ciudad de Marbial jueves por la noche. De acuerdo con un detenido, un lwa había pedido para los niños.\nAudio\nSábado 08.04.12 | portavoz de la policía J"}, {"id": "<urn:uuid:2befe51d-a66a-4a45-8744-bab178c9157d>", "text": "Sana -- Por lo menos 13 presuntos integrantes de la red terrorista Al Qaeda murieron en una explosión accidental ocurrida el sábado en la región de Baida, en el sudeste de Yemen, afirmaron el domingo fuentes tribales locales.\n“Unos 13 miembros de Al Qaeda han muerto en la explosión”, dijo una fuente que solicitó el anonimato, quien explicó que el estallido se produjo cuando el grupo de hombres manipulaba bombas.\nEn tanto, la agencia oficial Saba, citando a un funcionario de los servicios de segu"}, {"id": "<urn:uuid:02d6955e-b62c-4eaa-a1b2-55964be45484>", "text": "Domingo, 19 de mayo de 2013\nEl sector de la minería lleva más de 20 días de movilizaciones y hoy se prevé una huelga general con seguimiento masivo en las localidades mineras de Zaragoza y Teruel.\nServicios esencialesEn la Administración de Justicia se considerarán servicios esenciales las actuaciones de Registro Civil de carácter inaplazable; el registro de documentos y todas aquellas actuaciones en las que venza un plazo preestablecido en la ley cuyo incumplimiento pueda suponer pérdida o perj"}, {"id": "<urn:uuid:300e6595-8138-4181-9461-99e5cd722ea2>", "text": "Asesinaron a un taxista para robarle el carro en Caracas\nFecha 22/08/2012 12:11:00 p.m.\nUn taxista fue asesinado de un tiro en cabeza presuntamente para robarle su vehículo. El cuerpo fue abandonado en Los Flores de Catia, en Caracas. El trabajador fue identificado como Carlos Ernesto Ruiz de 20 años. Este martes salió a las 6 de tarde del refugio donde vivía desde hace 2 años para iniciar su jornada laboral.\nSus familiares contaron que esa fue la última vez que lo vieron con vida. Esta madrugad"}, {"id": "<urn:uuid:3fea1e6b-8b57-4a8b-9e72-528f54a26a27>", "text": "\n\n1. ¿Cuáles son los derechos proclamados en la Declaración Universal de los Derechos Humanos?\nEl principio fundamental que sustenta los derechos consagrados en la Declaración es el reconocimiento de la dignidad intrínseca y de los derechos iguales e inalienables de todos los miembros de la familia humana. Estos derechos se pueden dividir en dos grupos:\n- Derechos civiles y políticos: comprenden por ejemplo el derecho a la vida, a la libertad y a la seguridad de la persona; el derecho a no ser s"}, {"id": "<urn:uuid:48975d6c-6f19-4ede-bf35-421c4f13fd99>", "text": "Estudiante: Para hacer pagos de matrÃcula en el Self Service que dirige a la pantalla de pago de Banco Popular, debe tener las siguientes configuraciones en la computadora: utilizar navegador de Internet Explorer, asegurarse que el JavaScript esté habilitado, el Pop-up en el navegador tiene que estar activado y tener instalado Java 1.3 o versiones más recientes para pagar con ATH. En la página web http://lanuevamiupi.uprrp.edu/ sección de Estudiantes encontrarás unas instrucciones para realizar "}, {"id": "<urn:uuid:8d0a0789-b970-4a8c-a108-40f0f52b96e5>", "text": "G3171424 - Practicum (Prácticas) - Curso 2012/2013\nInformación\n- Créditos ECTS\n- Créditos ECTS: 22.00\n- Total: 22.0\n- Horas ECTS\n- Clase Interactiva Seminario: 4.80\n- Horas de Tutorías: 147.00\n- Total: 151.8\nOtros Datos\n- Tipo: Prácticum Grado RD 1393/2007\n- Departamentos: Campus Norte\n- Áreas: Escuela Universitaria de Trabajo Social\n- Centro: Escuela Universitaria de Trabajo Social\n- Convocatoria: 2º Semestre de Titulaciones de Grado/Máster\n- Docencia y Matrícula: null\nProfesores\nHorarios\nProgr"}, {"id": "<urn:uuid:2a17d938-b713-4867-85c9-80a040ad6040>", "text": "\n\nSYNODUS\nEPISCOPORUM\nXIII ASAMBLEA GENERAL ORDINARIA\nLa nueva evangelizació para la transmisión de la fe cristiana\nEste Boletín es solo un instrumento de trabajo\npara uso periodístico.\nEdición española\n\n\n08 - 09.10.2012\n- CUARTA CONGREGACIÓN GENERAL (MARTES, 9 DE OCTUBRE DE 2012 - POR LA TARDE)\nCUARTA CONGREGACIÓN GENERAL (MARTES, 9 DE OCTUBRE DE 2012 - POR LA TARDE)\n- VOTACIÓN PARA LA COMISIÓN PARA EL MENSAJE\n- INTERVENCIONES EN EL AULA (CONTINUACIÓN)\n- RELACIÓN SOBRE LA APLICACIÓN DE LA “VERB"}, {"id": "<urn:uuid:cad512ec-5071-4213-85f1-27ab7c9e9381>", "text": "QuickPlay Media ha creado Pocket Cinema Service for BlackBerry Torch, una aplicación de para poder ver tus peliculas favoritas donde y cuando quieras.\nLa aplicacion esta disponible para la Blackberry Torch por ahora solo en Reino Unido pero se espera su disponibilidad tanto para otros modelos de la familia BlackBerry como para otros paises prontamente.\nCon Pocket Cinema Service es para que los usuarios de smartphones BlackBerry Torch de Reino Unido puedan descargar, alquilar y ver películas popu"}, {"id": "<urn:uuid:d08287fc-d829-4d3d-ae56-729445f98354>", "text": "La selección tarijeña de fútbol de la categoría sub-16 define esta tarde a partir de las 15:30 su pase a la final del campeonato nacional que se desarrolla en esta capital cuando se enfrente a la selección de Pando en el estadio de La Bombonera. Mientras que en el partido preliminar a las 13:30 se medirán en la primera semifinal los equipos de Santa Cruz y Cochabamba, un clásico nacional.\nTarija clasificó a la semifinal tras terminar segundo en la serie A, la misma que fue ganada por Santa Cruz,"}, {"id": "<urn:uuid:350a23ab-fd99-4fb6-8d84-c1be8cc566cf>", "text": "Se puede acceder a este trabajo, que forma parte de la Social Science Research Network (EE.UU), a través del enlace: http://ssrn.com/abstract=1493240\nEn la experiencia internacional, no son muchas las obras públicas con financiamiento privado que hayan sido consideradas de gran relevancia, tanto en el plano social, jurídico y político, como es el caso del túnel que cruza el canal de la Mancha entre Francia y el Reino Unido, el denominado Eurotúnel. Éste caso supuso un nuevo examen de las figuras"}, {"id": "<urn:uuid:e7ac1853-20cf-49b6-9a95-0d2a85edde9b>", "text": "#1· Publicado por Daria79, el 17 de Agosto de 2012 a las 17:42\nHola, a todos. Es la primera vez que escribo en este foro, bueno... eso no es cierto del todo, la segunda, no sé a dónde he enviado el mensaje anterior. Así que me toca escribirlo de nuevo.\nSi os parece bién, os comento mis síntomas.\n-A los quince años (ahora tengo 32) se me cae mucho el pelo, no creáis que estoy calva o que tengo algunas calvicies ni nada de éso pero sí que es asombroso la cantidad que se me cae.\n-A los 17 me diagno"}, {"id": "<urn:uuid:25535f35-fa99-4f94-b13b-44b007be840b>", "text": "Assize\nAssize es una voz inglesa que representa el documento legislativo originado a partir de la Curia regis, que, en 1179, sustrajo a la justicia feudal de gran parte de sus prerrogativas. En Inglaterra dio a conocer el éxito de las reglas del derecho no escrito, castigadas por la costumbre y la jurisprudencia de los tribunales (common law).\n\n\nÍndice\nBélgica [editar]\nEl Tribunal de Assize en Bélgica (Holf van Asissen en holandés, Cour d’Assises en francés) es bastante parecido a su homólogo en"}, {"id": "<urn:uuid:3aab56c6-a24b-440b-a76b-2fffe6a1a81d>", "text": "Hace algunos días vimos dos interesantes experimentos sobre electricidad estática. Lo que haremos ahora es construir un electroscopio caseros. El mismo es un sencillo pero interesante artefacto que nos permite detectar la presencia de cargas electrostáticas.\nMateriales:\n* Un Frasco de vidrio\n* 30 centíemtros de alambre de cobre o acero\n* Gamuza, franela o prenda de lana\n* Papel aluminio (se utiliza para cocinar)\n* Pegamento\n* Tijera\n* Pinza\nProcedimiento:\nHay varias formas de hacer electroscopio"}], "5": [{"id": "<urn:uuid:0d79a05a-d6d2-4c33-9d04-3c4224a27d7b>", "text": "La Rocca HostelCentro lunes, marzo 29th, 2010\nDescripción extraída del sitio oficial\nUbicación Estratégica: con sólo mirar un mapa verás que lo rodean 4 líneas de subterráneos (B, A, D, C), mas 45 líneas de colectivos, universidades, resaurantes, bares, cines, teatros, discotecas, estacionamientos, escuelas de español, comercios…\nLa Rocca Bar: Un lugar donde encontraras tragos+idiomas+amigos\nDía y Noche en Buenos Aires.\nDescripción según nosotros\nLa Rocca es un Hostel donde encontrarás gente ami"}, {"id": "<urn:uuid:a8163787-f9d9-44a0-9821-249008e92b69>", "text": "\n\nContenido\nCapítulo 1 Hechos & Prejuicios\nCapítulo 2 Variacion y selección natural frente a la evolucion\nCapítulo 3 Faltan los eslabones\nCapítulo 4 ¿Evolucionaron las aves?\nCapítulo 5 ¿Evolucionaron las ballenas?\nCapítulo 6 Humanos: ¿Imágenes de Dios o monos desarrollados?\nCapítulo 7 Astronomía\nCapítulo 8 La Edad de la Tierra\nCapítulo 9 ¿Es legítima la explicación del diseño?\nCapítulo 10 Conclusión\nRefutando la Evolución\nUn manual para estudiantes, padres y profesores que responde a los últimos"}, {"id": "<urn:uuid:ca15a40c-0fa8-4296-8dfc-7676d216695b>", "text": "DECLARACIÓN UNIVERSAL DE LOS DERECHOS DE LOS ANIMALES\nEstá en la naturaleza del hombre imponerse sobre el mundo animal, pero esto en sí mismo no guarda relación alguna con tener derechos.\nEn cierto momento de la historia de la humanidad, alguien concibió la noción de «derechos», y es sólo el hombre quien hace uso de este concepto. ¿Por qué entonces nos referimos a derechos de los animales? La respuesta es bien sencilla: los derechos de los animales tienen como objeto poner límites al comportamie"}, {"id": "<urn:uuid:7887784f-7839-445b-9993-9633bcbbd597>", "text": "Si en vida no visitaste este santuario, en el que la tradición popular cuenta que desembarcó el Apóstol San Andrés, cuando llegue la hora de tu descanso eterno deberás ir de muerto para poder alcanzar el paraíso, bien como un alma en pena de la “Santa Compaña” o bien reencarnándote en el cuerpo de algún insecto, lagarto, sapo, culebra o cualquier otro animal ponzoñoso, arrastrándote desde tu propia tumba por veredas y caminos desconocidos.\nAprovechad esta magnifica ocasión que os brindo, bajaros"}, {"id": "<urn:uuid:23f40908-d6a6-4d47-a36c-d46ee3b97fa3>", "text": "\n\nDesde que me enamoré de mi novia gallega, cada fase distinta de mi vida, cada camino, ha tenido nombre, primer apellido y segundo apellido. Desde setiembre a noviembre del 2008 viví Naranja Hogar Venganza. Durante ese tiempo estaba tomando Invega (Paliperidona), Lamotrigina y Alcohol como medicamentos siquiátricos. Una combinación desastrosa.\nEso de los caminos con nombre y apellidos fue un remanente de las vacaciones a Amsterdam que compartí con esta galleguinha. Ella me preguntó en el coche "}, {"id": "<urn:uuid:7354c959-9ee4-4a51-a70c-d9072b6faf19>", "text": "El baloncesto, ese grandísimo deporte inventado por James Naismith, un profesor de educación física, en diciembre de 1891 en la YMCA de Springfield, Massachusetts, Estados Unidos. Debido a la gran repercusión de la red social twitter, ha llegado el momento en el que todo el mundo tiene abierta su cuenta de twitter. En el deporte de la canasta ya hay un gran número de jugadores, entrenadores o clubes que ya tienen su cuenta.\nDespués de recomendaros una docena de webs que deberías conocer si te gu"}, {"id": "<urn:uuid:e2c9d957-a0fb-463e-bd19-b2a20378718c>", "text": "Páginas\n7/31/2010\nBuenos Dias Amigas aqui mi alfiletero.Reto cumplido .Gracias Gaby por esta 7ma oportunidad.Muy contenta de llevarlo acabo.Ya me voy a trabajar las estare visitando en la tarde cuando regrese de mi trabajo.Muchas gracias por sus visitas y comentarios.Muy contenta y muy agradecida por sus atenciones.Que tengan todas un precioso y tranquilo fin de semana.Bendiciones !......Luna.....!\n7/29/2010\nHola Amigas ,otro Intercambio recibido y cumplido con nuestra amiga \" La India \" Alejand"}, {"id": "<urn:uuid:2bfb55eb-56dc-4e89-8974-74c88beb6902>", "text": "Proyecto: Casa Playa Las Palmeras\nArquitectura: rrmr arquitectos\nRoberto Riofrio\nMicaela Rodrigo\nUbicación: Lima, Perú\nConstrucción: 2011\nFotografía: rrmr arquitectos\nA través de Contemporist presentamos esta vivienda localizada en Lima, Peru y que es proyecto del despacho rrmr arquitectos.\nNOTA: La ubicación geográfica de esta obra no es exacta y tan solo representa su localización en la macro escala. Si conoces la localizacion exacta, puedes colaborar con arquiTOUR y hacernosla llegar a través"}, {"id": "<urn:uuid:254ccf57-ca87-4bd8-90e5-02db29a58ad8>", "text": "Bankia le ofrece un servicio de acceso a sus servicios desde su propio teléfono o dispositivo móvil, sin necesidad de usar un ordenador.\nGracias a Oficina Móvil podrá consultar el saldo y los movimientos de sus cuentas y tarjetas, realizar transferencias o pagar recibos, en cualquier lugar y a cualquier hora. Basta con ser cliente de Oficina Internet. Si todavía no lo es, puede rellenar el Formulario de Solicitud de Alta.\n¿Cómo puedo acceder desde mi teléfono móvil?\nSi necesita más información, "}, {"id": "<urn:uuid:95e0ad9c-36df-4ba5-86ce-c5d65410ed73>", "text": "En julio de 1518, una mujer llamada Frau Troffea entró en una estrecha calle de Estrasburgo. Sin más comenzó a bailar de forma ferviente entre cuatro a seis días, al final de la semana se le habían unido otras 34 personas.\nAl cabo de un mes, la multitud que bailaba espasmódicamente alcanzaban las 400 personas. Aunque pueda parecer hasta divertido, se llamó Plaga de la Danza y fue considerada como una extraña enfermedad. Muchos de aquellos infelices bailarines murieron a causa de paros cardíacos "}, {"id": "<urn:uuid:131c4ca3-4fa6-4423-9c4d-b2155e37707b>", "text": "A nombre del presidente del Club Tijuana Jorgealberto Hank, el vicepresidente del Club Tijuana, Gog Alberto Murguía y el director comercial y Mercadotecnia del Club Tijuana, Luis Alberto Zuno recibieron el premio y dieron un mensaje de agradecimiento por la especial distinción.\n“Estamos muy contentos por recibir este premio, estamos tratando de crear a mejores deportistas junto con un gran equipo de trabajo apoyándonos con Ignacio Palou, director deportivo, Luis Zuno en Mercadotecnia, Pedro Pana"}, {"id": "<urn:uuid:dfea26ef-d7c8-42a8-be33-2f043f96edd3>", "text": "MADE-Grupo Invertaresa fabricara 700 seguidores solares FV de dos ejes para la planta fotovoltaica de Lasesa, por un monto de nueve millones de euros, esta es una instalación de 9 MW de potencia, y se esta construyendo en el municipio de Sariñena, en Huesca.\nEstos seguidores son diseñados por la ingeniería SENER, son del tipo monoposte de 112 m2, y tienen capacidad para 80 paneles estándar y producción unitaria de 14 kW.\nEstos se caracterizan por la gran capacidad de carga, fiabilidad y rigidez,"}, {"id": "<urn:uuid:758e22af-be8d-4780-9b6c-368076f0ead5>", "text": "Haz parte de la lista VIP y entérate de lo último en tendencias,\ncupones, ofertas especiales y mucho más.\n¡La delicadeza representada en un brasier! Un diseño con alto contenido de moda, donde el encaje y el tul con flores bicolores bordadas te ofrecen un look femenino y coqueto, además es suave al contacto con la piel. Este brasier con arco te ofrece un realce medio, sus copas triangulares te dan un cubrimiento medio del busto y dejan ver un maravilloso escote profundo. Está elaborado con tela "}, {"id": "<urn:uuid:7c9061b3-5c0f-43dd-bf52-14b84ef24be6>", "text": "Ayuden a que los no experimentados tengamos exito\nLoco, mas trabajo de campo, dejate de joder.\n\"Como conseguir pareja\"... \"Como lograr ponerla\"... \"Como conseguir que te de bola una mujer\"... \"Como hacer para que llegue al orgasmo.\"\nEsforzarse para ser un poco menos triste, para empezar.\nLife does not cease to be funny when people die any more than it ceases to be serious when people laugh. -George Bernard Shaw\nja! pensé que eran una de esas cadenas de mails con consejos medios graciosos, cualqu"}, {"id": "<urn:uuid:34ca6050-c652-48ec-87f0-d12dc3765f59>", "text": "sonicomp3.com es un motor de busqueda que ayuda a los usuarios a localizar archivos\nrelacionados con musica, en internet. Nosotros no alojamos ningun archivo relaciona con musica en nuestros servidores;\nla busqueda la realizan los usuarios directamente desde sus computadoras mediante\nscripts (javascript) que nosotros facilitamos para que busquen en APIs que los siguientes sitios webs\nfacilitan (4shared.com, soundcloud.com, mp3skull.com)."}, {"id": "<urn:uuid:59d88b52-1595-4fc2-8987-fa1964947909>", "text": "Babel\nJavier Hernández Alpízar\nCada año más, he sido de los que piensan, como piensa Edmundo O’Gorman que “La navidad es la venganza de los mercaderes en contra de Jesús, por haberlos expulsado del templo”. Y aunque, cada vez más, me cae gordo Luis González de Alba, creo, como él, que ese aforismo está inspirado por el Espíritu Santo. Me cae. Es más, pienso, como piensa mi compadre, que el espíritu sopla donde quiere… y a quien quiere. Pero mejor cambio de ejemplo, porque ya se sabe que todo se "}, {"id": "<urn:uuid:7f46f11a-d184-4767-8318-8ea9b61cea5e>", "text": "“Motion Capture y CGI : Arte e Ingeniería en Tintin 3D”\nAbstract\nSteven Spielberg, that most American of filmmakers, has chosen to adapt a distinctly un-American property. The classic Hergé comic “The Adventures of Tintin” has been translated into more than 50 languages since its first appearance in a Belgian newspaper in 1929. Spielberg has said that he first discovered Tintin in 1981, when someone told him the retro-styled heroics of Indiana Jones reminded them of the Belgian comic.. The techn"}, {"id": "<urn:uuid:84830925-1a86-4cfa-8930-7a48f0662219>", "text": "Artículos y noticias\n2004-11-01\nPor Juan Antonio Hormigón.\nMucho se viene hablando y especulando tras la victoria de G. W. Bush en las elecciones de los Estados Unidos de América del Norte. Nada de todo ello empaña ninguna de las certidumbres que teníamos en torno al personaje y su gobierno. Obtener más votos que el candidato Kerry no modifica el hecho de que la invasión de Irak fuera un hecho ilegal, ejecutado al margen de las Naciones Unidas y con la manifiesta oposición de la ciudadanía mundi"}, {"id": "<urn:uuid:8390d9eb-698c-4b1f-b0a4-a5c0c9b9e38f>", "text": "Fede Durán | 13 de mayo de 2012 a las 18:28\nLa Real Academia de la Geopolítica (RAG), entidad ficticia creada ad hoc para esta crónica, establece una verdad casi irrefutable: Norte y Sur suelen ser coordenadas antagónicas. Arriba, progreso y orden; abajo, retraso y anarquía. Alemania versus Grecia. Estados Unidos en oposición a México. La pianura padana y Sicilia. ¿Cataluña y Andalucía? La regla se cumple en términos económicos y viene de largo, de hace más de un siglo. Pese a que la revolución "}, {"id": "<urn:uuid:afc7e295-d414-4b02-8231-7c90775ac5e7>", "text": "Categoría Redes\nAdemás de Facebook o Twitter, también existen otras redes sociales muy importantes como es el caso de Tuenti, una red social de origen español con más de 14 millones de usuarios registrados y que acaba de lanzar una nueva versión para sus usuarios.\nAsí es, desde ahora y hasta el próximo otoño verá la luz la nueva versión multiplataforma de Tuenti para Android, Blacberry, iPhone o Windows Phone por ejemplo, una versión que estará disponible hasta en 12 idiomas y que está destinada"}]}, "rus_Cyrl": {"0": [{"id": "<urn:uuid:ce90d7be-e2bd-448c-9fe6-7ca03256a4ed>", "text": "Местоположение.\nПоблизости от отеля InterContinental Danang Sun Peninsula Resort располагаются следующие достопримечательности: Гора Son Tra. Среди других достопримечательностей Пляж Майхе.\nОсобенности курорта.\nОтель InterContinental Danang Sun Peninsula Resort предлагает следующее: открытый бассейн, круглосуточный фитнес-центр и детский бассейн. Беспроводной доступ в Интернет в зонах общественного пользования (за дополнительную плату). Курорт с рейтингом 4,5 зв. предлагает следующие бизнес-услу"}, {"id": "<urn:uuid:d69b3fe9-f20c-4534-8f32-2ae46dd4cf46>", "text": "В фокусе - Нидерланды\nКатастрофическое наводнение\nБольшое количество мостов, дамб, ветряных мельниц и насосных станций создают уникальный нидерландский ландшафт и отражают постоянную борьбу с водной стихией. Одним из наиболее выдающихся гидротехнических достижений в борьбе с водой являются сооружения по проекту “Дельта”. В результате осуществления этого проекта, начатого после катастрофического наводнения 1953 года, были перекрыты дамбами все морские протоки и рукава в провинциях Зеландия и Южна"}, {"id": "<urn:uuid:2f882b85-3098-48f3-a164-2a95f113665b>", "text": "Гостеприимность и сердечность в нескольких шагах от моря!\nРасположенная в непосредственной близости от морской набережной города Виареджо и рядом с сосновой рощей, гостиница \"Vittoria\" - по-семейному уютный отель, владельцы которого искренне заботятся о том, чтобы их гости получали удовольствие от отдыха.\nНаходясь на расстоянии всего 150 метров от знаменитой набережной, отель позволяет нашим гостям в полной мере наслаждаться оборудованными пляжами курортного города, так как незначительное рассто"}, {"id": "<urn:uuid:2db7a122-a506-421a-a0d7-62bd66130acb>", "text": "Меня зовут Любовь\nЯ живу в России (город Москва). Фотография -это мое хобби, которым увлеклась в 2011 году.\nСпасибо большое, друзья, за поддержку и комментарии моих работ. Они приносят мне радость и вдохновение. Я очень их ценю!\nЖелаю Вам шедевров и удачи! :-)\nMy name is Lyubov. (in translation, Love :-))\nI live in Russia (Moscow). Photography is my hobby, which became involved in 2011.\nThank you very much, my friends, for your support and comments of my work. They bring me joy and inspiration. "}, {"id": "<urn:uuid:f61f6a63-ec15-453e-86df-c9ac305dac94>", "text": "Мир, где транспорт везет тебя сам, детей не обязательно вынашивать, а продукты созревают прямо в холодильнике - это не фантастика, а наиболее вероятное ближайшее будущее! Вместе с крупнейшими учеными и инноваторами мы проанализируем факты, новейшие тренды, данные исследований и совершим настоящее путешествие во времени, чтобы увидеть, как изменится наша жизнь всего через несколько десятилетий."}, {"id": "<urn:uuid:bf2b6174-cbe1-4614-8f85-cda3769b8ff7>", "text": "В Москве, столице России, бъётся культурное сердце страны: многчисленные музеи, театры и знаменитые исторические сооружения, такие как Кремль, Большой театр и многие другие, превратят вашу поездку в захватывающее приключение!\nСледующий по значинию и размеру город, Санкт Петербург, также не оставит никого равнодушным своими известными на весь мир культурными и архитектурными достопримечательностями.\nКроме этого, Россия является магнитом для любителей туризма и водного спорта. Точти два миллиона о"}, {"id": "<urn:uuid:e881622d-bb1f-4a7e-a5c8-349ff09a3290>", "text": "Пресс-релиз\nИА «Жахон» - Сегодня во многих странах мира наиболее прогрессивным сектором экономики является туризм. Это справедливо и в отношении Узбекистана, где индустрия туризма стала наиболее перспективной и быстро развивающейся отраслью.\nВ 1999 году был принят Закон Республики Узбекистан «О туризме», основная цель которого – правовое регулирование отношений в области туризма, а также защита прав и законных интересов туристов и субъектов данной сферы. Важным этапом ускоренного роста туристски"}, {"id": "<urn:uuid:6f47e642-808b-433d-8c99-f77879eb6060>", "text": "4-звездочный отель Новотель Москва Центр идеально подходит и для деловой поездки, и для отдыха. Он удобно расположен в деловой части города, в 15 минутах от Кремля и 30 км от международного аэропорта. Рядом с отелем — две станции метро. При отеле находится ресторан средиземноморской кухни и лобби-бар. В отеле работает бесплатный WIFI и высокоскоростной Интернет. Более 500 кв. м площадей для проведения мероприятий.\nКраткое описание\nОтель в самом центре Москвы, идеально подходит для раб. и отдыха."}, {"id": "<urn:uuid:fc7ca972-3f0d-471c-bd41-4294453295ea>", "text": "Компания A La Carte Lapland предлагает своим клиентам ощутить дух и красоту жизни в Лапландии. Мы хотим предложить Bам размещение, традиционную кухню и активный отдых круглый год на наших курортах Луосто и Суому, а также в городе Соданкюля.\nНаш профессиональный и дружелюбный персонал приглашает Вас насладиться тем, что может предложить северная Лапландия!"}, {"id": "<urn:uuid:dc882aad-41a8-4ea9-b671-f5bf692d2696>", "text": "Мы продолжаем работать над тем, чтобы каждый участник MQL5.community чувствовал себя\nна этом сайте, как дома. Когда все необходимое под рукой, все вещи лежат там,\nгде положено, а на видном месте – фотография в рамочке.\nПервым этапом нашей новой кампании стал запуск «Достижений»,\nкоторые демонстрируют ваш вклад в MQL5.community. Теперь мы идем дальше и\nобновляем ваш профиль на сайте – его можно изменять и настраивать на ваш вкус.\nДополнительные скриншоты: редактирование\nобложки, загрузка аватара "}, {"id": "<urn:uuid:b5453d9f-121b-4fae-a7e1-f3bab1d9504a>", "text": "Мы останавливались в этом отеле на одну ночь до нашего круиза. Это хороший отель в хорошем месте, всего через пляж. Номера небольшие, но Хорошо для короткой остановки. Цены номера и завтрак был толковый сравнением с другими местами в визу. У них есть дружелюбное обслуживание клиентов. Я написал заранее гриле какой-то информации о трансфере из аэропорта Гуарульюса до Отеля, и персонал... Ещё\n- Варианты бронирования:\n- TripAdvisor гордится партнерством с ACCOR и Expedia: теперь Вы можете с уверенн"}, {"id": "<urn:uuid:0aca12ac-e69b-4117-90b2-b8c3c0b02630>", "text": "Превосходное Обслуживание. Это хорошо располагается, не в центре города, далеко от пробок в там; близко к аэропорту, дороге к Мехико, и т.д. Я очень рекомендую останавливаться в этом месте, хорошем обслуживании, хорошей цене и прекрасном расположении.\n- Варианты бронирования:\n- TripAdvisor гордится партнерством с IHG, Expedia, Hotels.com, Orbitz, Booking.com, MexVax и Priceline: теперь Вы можете с уверенностью бронировать номера в Holiday Inn Express Toluca. Каждый месяц мы помогаем миллионам пу"}, {"id": "<urn:uuid:2d9573a4-a21d-4577-a4d5-b037b7ceaa9b>", "text": "Узнайте нас, как глобально работающее и ориентированное на будущее предприятие, которое может дать Вам разнообразные возможности для применения Ваших способностей и перспективы карьерного роста. Мы ищем сотрудников, уже имеющих квалифицированный профессиональный опыт и заинтересованных в карьере по специальности, карьере управленца или эксперта.\nОтветственность, готовность работать в команде и ориентированность на успех являются важными качествами наших сотрудников. При этом мы окажем Вам поддер"}, {"id": "<urn:uuid:32953d74-5957-461a-99cd-afd3477676c9>", "text": "28.04.2012, 12:00\n\n\nPanasonic совместно с японской государственной телерадиокомпанией NHK разрабатывает плазменный телевизор с диагональю экрана 145 дюймов и разрешением панели 7680x4320 пикселей, сообщает SlashGear со ссылкой на сайт Panasonic на японском языке.\nОтметим, что разрешение в 7680x4320 пикселей в 16 раз превышает разрешение формата Full HD (1920 x 1080 точек).\nКак сообщается, новый телевизор призван рекламировать технологию Super Hi-Vision, над которой NHK работает в течение несколь"}, {"id": "<urn:uuid:7b5a782b-2a6b-41f2-8aec-a38532c09a99>", "text": "Международный консорциум ученых завершил работу по определению полной последовательности генома томата (Solanum lycopersicum) и его ближайшего дикорастущего родственника Solanum pimpinellifolium. Работа опубликована в журнале Nature, ее описание приводится в пресс-релизе Корнельского университета, а последовательность выложена на сайте консорциума Solgenomics.net\nРабота по определению последовательности генома томата была начата еще в 2003 году и стоила \"миллионы долларов\" - говорится в пресс-ре"}, {"id": "<urn:uuid:eec22e51-d78c-45b5-a714-0fbd95100ffd>", "text": "16 октября 2009 года самый большой пассажирский лайнер - Airbus A380 – впервые приземлился в России, в Московском международном аэропорту Домодедово. Правда это не рейсовый полет, а всего лишь промежуточная посадка на пути в Корею, на выставку. Самолет мог бы без труда преодолеть этот путь и без промежуточной посадки – дальность его полета составляет 15200 км с 552 пассажирами на борту.\nВизит был призван продемонстрировать, что А380 успешно вписывается в существующую инфраструктуру аэропорта \"До"}, {"id": "<urn:uuid:adba29c8-4791-4e6e-8494-6b8c696db168>", "text": "Интересные книги о камнях и минералах.\nКачайте и получайте новые знания о камнях.\nВсе бесплатно и на максимальной скорости закачки.\nБудем благодарны за комментарии.\nP.S Некоторые Книги в формате \"DJVU\". Для них надо программа WinDjView. Если у вас ее нет, можете скачать у нас версию 0.5 с поддержкой русского языка. Размер zip архива 534 kB. Скачать внизу страницы."}, {"id": "<urn:uuid:9e5c2f74-19c1-4dc5-b321-7a74f5d09472>", "text": "Информации Об Объекте:\nПеревод\nОчаровательный отель экономика находится менее чем в миле от международного аэропорта Майами и близко к большинству основных Майами достопримечательностей, включая торговые центры, американский Arena, Orange Bowl, Bayside, South Beach, Dolphin Stadium и конференц-центр. Red Roof предлагает бесплатный трансфер до аэропорта и один трансфер в порт Майами для пассажиров Crusie. Бесплатный Интернет,, бесплатный континентальный завтрак и газеты. Идеально подходит для бюд"}, {"id": "<urn:uuid:6caaa34f-3b8d-42bf-b8b8-5a5b8aff25e4>", "text": "\n\nСимвол возрождения московских традиций\nКафедральный соборный Храм Христа Спасителя — главный храм Русской Православной Церкви - для многих людей является символом возрожденных московских традиций. За прошедшие восемь лет комплекс Храма успел стать неотъемлемой частью жизни горожан. Это не только место паломничества, но и отдыха жителей и гостей столицы.\nОсобую известность и любовь завоевал павильон «Горячий хлеб» расположенный возле станции метро «Кропоткинская». Это небольшой магазинчик-булоч"}, {"id": "<urn:uuid:c228c5c8-dac8-439f-9b21-fc4602100076>", "text": "В ЮНЕСКО пройдет 5-я Всемирная конференция по проблемам океанов, прибрежных зон и островов\nАнонс для прессы ЮНЕСКО No. 2010-19\nПариж, 26 апреля – С 3 по 7 мая в штаб-квартире ЮНЕСКО будет проходить 5-я Всемирная конференция по проблемам океанов, прибрежных зон и островов, девиз которой – «Спасти и сохранить жизнь, улучшить управление». Ее организаторами станут Глобальный форум по океанам, ЮНЕСКО и Франция*. Основными темами конференции будут взаимодействие между изменением климата и океанами, пр"}], "1": [{"id": "<urn:uuid:cf678db6-704a-4f9e-9f63-b63025872529>", "text": "Доброго всем времени суток!\nПосмотрите для начала этот ролик я уверяю вас он займет у вас не больше 3 минут!\nСегодня мы приглашаем вас на сайт «самоучитель для чайников», который поможет вам решить практически все те проблемы, которые возникают у новичков или не совсем опытных пользователей компьютера. Также, регулярно посещая наш сайт, вы сможете выполнить любую работу на компьютере быстрее, затратив при этом меньше сил и энергии.\nВ том случае, если вы совсем недавно стали счастливым обладателе"}, {"id": "<urn:uuid:14d54a2c-dae3-4f8a-ae82-5cfef3d99468>", "text": "DescriptionЯвляется третьим произведением в цикле «Трилогия Крысы», продолжением романов «Слушай песню ветра» и «Пинбол 1973». Роман написан в 1982 году.\nС первой встречи читателя с героем романа, которая произошла в «Слушай песню ветра» прошло десять лет. Теперь он с приятелем владеет рекламной газетой, закадычный Крыса куда-то сгинул, семьи не появилось, даже постоянной подружки нет рядом, впереди — унылое существование одинокого, пока ещё тридцатилетнего мужчины, полное ностальгии по несбывше"}, {"id": "<urn:uuid:5edfa4d5-b96e-41e2-8f16-ee5e972ed287>", "text": "Daily InspirationOne of the hardest feelings to feel is that of helplessness over others - over others being mean, judgmental, rejecting and not seeing you or valuing you. Most people would rather get angry, or judge themselves or others, rather than feel this very painful feeling. This feeling needs your deep compassion, which you can give yourself only when you fully accept that you are powerless over how others' feel and behave. By Dr. Margaret Paul\nСломаться перед лицом возникшей проблемыBy "}, {"id": "<urn:uuid:1e2aed2e-da8d-4504-83d8-9ca51a4b313a>", "text": "Cheburaloid's top songs (2012 year)\nCheburaloid's top albums (2012 year) 1. Beach House - Bloom (561) 2. Norah Jones - Little Broken Hearts (285) 3. Lana Del Rey - Born to Die (223) 4. Elvis Presley - Elvis 75 (210) 5. Alicia Keys - Girl on Fire (207) 6. Beach House - Teen Dream (206) 7. Radiohead - OK Computer (182) 8. U2 - The Joshua Tree (178) 9. Bon Iver - Bon Iver (178) 10. Fiona Apple - The Idler Wheel Is Wiser Than the Driver of the Screw and Whipping Cords Will Serve You More Than Ropes "}, {"id": "<urn:uuid:56f03f60-e067-4471-90b4-da46f936ddc4>", "text": "В минувший прокатный уикенд произошло то, что и требовалось ожидать - триумф жизнерадостного голливудского идиотизма. За первые три дня показа «Морской бой» (экранизация всем известной игры) собрал больше всех киноновинок России вместе взятых. Грустно, конечно, что такое блюдо для гурманов, как «Право на «лево», оказалось не столь востребовано, но тут сработали вполне объективные причины. И «оскароносный» «Артист» (со звездой «Права…» Жаном Дюжарденом) до нашей страны не добрался, и рейтинг филь"}, {"id": "<urn:uuid:50dc0ac6-b7be-46a3-bd50-9892bc3ec2c6>", "text": "24.07.12 г. мне было отказано в гарантийном обслуживании а/м \"Ниссан Qashkai\", заявление №312. Хамство обслуги совковое. \"Загремел\" подшипник ступицы левого колеса. Диски профильные с сертификатом соответствия и паспортом завода изготовителя. Заменил на другой дилерской станции без проблем. Просто бессовестная отписка с наглым предложением обслуги на перспективу. Наглость!\nПочитал отзывы и не понимаю, откуда могут появиться положительные впечатления от этой конторы, а в частности их услуга Trade"}, {"id": "<urn:uuid:a341d58b-b26d-4aaf-9945-4920b89fd278>", "text": "\n\nУслуги\nВыполненные работы\nЦены\nВопросы и ответы\nПолезно знать\nКонтакты\nПоследние работы\nОчередное творение нашло своего хозяина - Гипсокартонный потолок \"Ромашка\" в детской комнате.\nподробнее\nВ Липецке был выполнен очередной проект - оригинальный\nпотолок из гипсокартона\n\"Бронзовая лилия\".\nподробнее\nВ Липецке в районе 10-й Шахты\nбыла сделана работа по созданию гипсокартонного \"Острова влюбленных\" в спальне.\nподробнее\nПартнеры\nФирма \"Имтэкс\"\nОстекление балконов пластиковыми окнами.\nКомпания \"Дос"}, {"id": "<urn:uuid:abc8ea82-5b2a-49a7-99ff-b83b5911e037>", "text": "DELFI Новости\nPar šo profilu\nRus.DELFI.lv - Латвийский информационный портал\n|Sekotāji||103|\nID:13339413\nJaunumi\n- 22. feb 12:49\nВ прошлом году началось знакомство наших детей с классикой мировой детской литературы для младшего школьного возраста — на русском языке начали выходить книги о малыше Николя, написанные французским писателем Рене Госинни и оформленные его другом, художником Жаком Сампэ. Теперь же появилось издание, объединившее под одной обложкой все 5 книг.\nНесмотря на похолодание и "}, {"id": "<urn:uuid:6a273815-60fa-4b89-9414-7099a1be9894>", "text": "Chapter 3\n1\nТакже и вы, жены, повинуйтесь своим мужьям, чтобы те из них, которые не покоряются слову, житием жен своих без слова приобретаемы были,\n2\nкогда увидят ваше чистое, богобоязненное житие.\n3\nДа будет украшением вашим не внешнее плетение волос, не золотые уборы или нарядность в одежде,\n4\nно сокровенный сердца человек в нетленной [красоте] кроткого и молчаливого духа, что драгоценно пред Богом.\n5\nТак некогда и святые жены, уповавшие на Бога, украшали себя, повинуясь своим мужьям.\n6\nТак Са"}, {"id": "<urn:uuid:8f1ad65e-334a-40ca-acc7-4123fca6ea03>", "text": "Всем доброго времени и рад приветствовать вас в российском разделе форумов Massive.\nСражайтесь достойно и не забывайте, кто выиграл вторую мировую )\nНо не забывайте и то, что она была выиграна на поле боя, а не на форумах =) Поэтому оставляйте флейм и флуд (который на самом деле \"флад\") за порогом, а сюда приносите знания и желание играть.\nУдачи всему российскому WiC-сообществу, и надеюсь, что вместе мы достигнем многого.\nИгорь 'BioLogin' Бугаенко,\ncommunity-менеджер, компания Софт Клаб\n[Edited "}, {"id": "<urn:uuid:742add15-26bc-4991-89c9-be55c2dcb570>", "text": "❤ ⓈⓉⒶⓉⓊⓈⓎ ❤ → Позитивные\nПозитивные статусы\nКак мало позитива в современном бытии, и только позитивные статусы для вашей странички способны повеселить вас и заглядывающих в социальные сети верных друзей. Выбирая самые позитивные статусы для девушек с юмором, вы представите себя как отъявленную оптимистку, всегда веселую, несмотря на жизненные сложности. Только самые позитивные статусы в кратком изложении подарят хоть немного хорошего в сложных современных реалиях, позволяя от них отвлечься. Инте"}, {"id": "<urn:uuid:73ea3857-25aa-4cb3-b35d-191af8653929>", "text": "Потрясающие меню, который меняется, в зависимости от сезона, отличное обслуживание вкупе с внимательным и хорошо осведомленным обслуживающим персоналом, немного дороговат, но оно того стоило.\nПотрясающие меню, который меняется, в зависимости от сезона, отличное обслуживание вкупе с внимательным и хорошо осведомленным обслуживающим персоналом, немного дороговат, но оно того стоило.\nВ первый раз развлеченный посетители к на обед в этом ресторане и не были разочарованы. Место, которое будет смотрет"}, {"id": "<urn:uuid:0eb3e022-3124-483d-b427-e4ff887b48d7>", "text": "«Свобода выражения мнений, которая сама по себе является одним из основных прав, также обеспечивает условия для защиты и поощрения всех других прав человека. Однако ее реализация не происходит автоматически; она требует безопасной среды для диалога, в которой все могут говорить свободно и открыто, не опасаясь репрессий».Из совместного послания Генерального секретаря ООН\nи Генерального директора ЮНЕСКО.\nТема Всемирного дня свободы печати 2013 года «Говорить без страха: обеспечить свободу слова во"}, {"id": "<urn:uuid:c00d2540-9448-4b68-8aa1-8cfa83537cf9>", "text": "Sad Man\nВ одной далёкой галактике, где миры населяют маленькие и круглые людишки, жил Бобби. Он был отдалённым от цивилизации и одиноким существом. Жил в лесу и питался местной дичью и растительностью. Однажды он вышел на прогулку в лес, но пошёл дождь, и засверкала молния... Большие камни стали падать с неба и раскалываться на мелкие кусочки! Помогите Бобби пережить эту ужасную грозу!\nРекламные ссылки:"}, {"id": "<urn:uuid:7928a13e-ae97-4b60-b87f-a24864ab6038>", "text": "Лучшие места для отдыха. Шум начинается в 7:00 и не заканчивается до 2:00. Если вы только нуждаетесь во сне 5 часов без неплохого кофе, возможно вы можете перенести его. ВЫ - более обеспеченный платеж немного больше и отдых в старом городе в противоположность этому посредственному месту около действительно плохого пляжа.\n- Варианты бронирования:\n- TripAdvisor гордится партнерством с HostelBookers и HotelsClick: теперь Вы можете с уверенностью бронировать номера в Hotel Toledo. Каждый месяц мы по"}, {"id": "<urn:uuid:c3cfa22f-4aa5-42ca-999f-537e51ab5d9d>", "text": "Хотите получить больше возможностей ? Станьте зарегистрированным пользователем. После прохождения регистрации вам будут достпны: чат, написание комментариев и сообщений на форуме, подбор приложений под ваше Android устройство и помощь от пользователей сайта, а также уменьшение количества отображаемой рекламы.\n09 мая 2013\nНа протяжении многих десятилетий День Победы является самым святым праздником для всех граждан нашей страны. В этот день народ нашей страны окончательно победил фашистскую Герма"}, {"id": "<urn:uuid:c7864bf8-6704-4962-bc8a-a83e4e595f18>", "text": "Белорусский язык и история покоряют мобильный интернет\n9\n10:24, — Культура\nМобильное приложение на белорусском языке, посвященное памятникам истории родного края, вошло в тройку победителей конкурса от “Велком”.\nАвторы получили 5 тысяч долларов.\nКомпания энтузиастов создала мобильное приложения для путешественников-любителей. Это не просто карта с отмеченными на ней достопримечательностями и сопроводительной информацией. Как рассказал “Ежедневнику” автор проекта Максим Ефимов, приложение позволя"}, {"id": "<urn:uuid:d7e0cf70-ad79-4be9-8146-d6d0776ea978>", "text": "Описание :\nСамолет летит игра...Кто не любит сделать документ плоскости и играть с этим... Здесь все, что вам нужно сделать это подготовить документ плоскости и бросить его, как вы можете...Наслаждайтесь бросал бумаги поединки в игре именованные Flight.Have весело...!\nЛюбое использование этого сайта является предметом термины и условияs использования и Политика конфиденциальности из Timuz.com.\nВсе игры на Gameseverytime.com авторским правом или торговой марки их соответствующих владельцев или ав"}, {"id": "<urn:uuid:2a94b2e8-f0f1-450c-9b8e-b9e90c71d913>", "text": "Один\n9 мая 2013 по администратора\nТина знала с самого раннего возраста, что музыка зовет ее жизни, и она является профессиональным саксофонистом в Нью-Йорке. Это заняло больше времени, для Тины, чтобы понять, что она является геем, но определенного периода бездействия от Церкви не остановило ее от уплаты десятины ее каждый месяц. Это была признательность и практику буддизма, которые привели Тину обратно в церковь в своей замечательной назад путешествие в деятельности.\nДоля этой статьи:\n6 марта 2"}, {"id": "<urn:uuid:1cef076f-a085-479e-a1ec-af46816f1d97>", "text": "Mannin Lodge\nИнформации Об Объекте:Перевод\nОбширное меню Завтрак подается в столовой с его великолепными видами на окружающую местность. Другие удобства включают лаундж и сад с зоной отдыха, которая является идеальным местом для отдыха и размышлять в вечернем свете.\nMannin Лодж дает возможность открыть для себя все Коннемаре может предложить, прогуляться вдоль некоторых пляжных бухт, полюбоваться красотой Connemara National Park, Mannin залива и Атлантического побережья. Вы сможете сыграть в гол"}], "2": [{"id": "<urn:uuid:cee96d53-4392-44e8-8141-b6d90c76d5d2>", "text": "Мультфильмы онлайн бесплатно и без регистрации\nНу кто не любит смотреть мультфильмы? Современные дети просто не представляют своей жизни без них. А взрослые, не будем лукавить, также не прочь получить заряд положительной энергии просмотрев смешные мультсериалы.\nБлагодаря прогрессу, появилась возможность смотреть мультфильмы онлайн тогда, когда на это есть время. Именно поэтому, наш портал собрал все возможные мультфильмы для удобного просмотра. Вы отыщите и давно забытые, советские мультфильмы, "}, {"id": "<urn:uuid:0acaa5ca-08f1-452d-9479-0b4d3ee1610a>", "text": "I. Информация о рейсах и бронировании\nПри запросе сведений об авиарейсе или при бронировании рейса через турагентство в Европейском Союзе каждый авиапассажир имеет право на получение непредвзятой и объективной информации: если авиапассажир не требует ничего другого, турагентство обязано предоставить ему объективные сведения, доступные в компьютерной системе бронирования, т.е. ознакомить его с различными возможностями перелета.\nПри этом такая информация предоставляется в следующей последовательно"}, {"id": "<urn:uuid:2df5a995-5fed-4882-9341-d9c41ca5a4c5>", "text": "А я в этом фильме снималась. В эпизоде танцев в клубе, где девушки танцуют с девушками, там у меня мелькают роскошные золотистые волосы. Боже, как давно это было...\nГость_Светлана\n14.05.2009, 22:53\nОчень давно видела этот фильм, оставил самые лучшие чувства и впечатления. Его снимали рядом с моим домом и я это хорошо помню, а моего дома нет уже 20 с лишним лет... Нигда не могу его найти или хотя бы посмотреть по ТВ, а очень хотелось бы...\nГость_Соня\n3.03.2009, 15:27\nУдивительно! Невозможно оторв"}, {"id": "<urn:uuid:8c0d43dc-a634-4637-b0d2-6b18e40d93c4>", "text": "English narrative\nРассказ по-русски\n06-Jun-2005 -- Итак везение не оставляет меня. Следующая точка конфлюенции оказалась на пути моего следования до г. Череповца. Будучи часто в командировках, бывал здесь не раз, знаком каждый поворот дороги от Вологды до Череповца. Отклонение от курса всего 18 км. На моей машине это 18-20 минут. Кто здесь бывал, знает, что такое проселочные дороги Вологодской области. Но на удачу дорога оказалась вполне приличной.\nИ вот впереди заброшенная деревушка. Несколько "}, {"id": "<urn:uuid:1684142d-46cb-4e07-8cb4-fb961a986e7b>", "text": "Пузыревский С.А., начальник Управления контроля рекламы и недобросовестной конкуренции ФАС\nРАЗРЕШЕНИЕ НА УСТАНОВКУ ВЫВЕСКИ ПОЛУЧАТЬ НЕ НУЖНОРазделы:\nКонтроль рекламной деятельности; Антимонопольное регулирование и законодательство; Информация, не являющаяся рекламой; Рекламная деятельность\nВопрос:\nв Законе \"О рекламе\" нет четкого понятия о том, что можно считать вывеской, а что рекламой. В чем их отличия?\nОтвет:\nНа сегодняшний день достаточно сложно провести четкую грань между вывеской и рекламо"}, {"id": "<urn:uuid:74cc7dad-fed7-4d5b-b964-f4df3e9b774c>", "text": "У нас Вы сможете скачать самые красивые и качественные обои для рабочего стола высокого разрешения, а также поделиться своими картинками с другими пользователями. Сайт обновляется ежедневно, количество картинок постоянно растет. А также у Вас есть возможность скачать обои на рабочий стол не только для компьютера, но и для мобильных устройств (iPhone, смартфоны, телефоны, планшеты).\nНа этом сайте Вы сможете найти самые красивые картинки на рабочий стол в высоком разрешении и хорошем качестве. Осн"}, {"id": "<urn:uuid:217f94e6-09cb-42b1-98aa-f305ae070dfd>", "text": "XX век\nРаспространено ошибочное заблуждение, будто 20 век начался 1 января 1900-го года, а закончился 31 декабря 1999-го года .\nОсновные события и понятия:\n- Индустриализация\n- Первая мировая война\n- Распад империй\n- Октябрьская революция, создание СССР, построение социализма и попытка построения коммунизма\n- Великая депрессия\n- Становление тоталитарных и авторитарных режимов\n- Создание революционных лекарств: сульфаниламиды и пенициллин, синтетические анальгетики, массовая вакцинация\n- Вторая м"}, {"id": "<urn:uuid:ff349c16-8b33-4d37-8ba3-e65bd3f66d41>", "text": "Почему клиенты выбирают меня?\nА чем я занят в свободное время?\nРекомендации моих товаров и услуг\n– Эвелина Ц\nБраво! Это моя первая реакция после прослушивания занятия о коучинге. Честно Вам признаюсь, не ожидала. что в такой короткой лекции можно так подробно, чётко изложить такой объёмный материал. Я интересовалась тем, что же такое коучинг. И у меня тоже было мнение, что это множество разных методик. Вы сделали большую работу, проанализировав и систематизировав все эти разные подходы, и изложи"}, {"id": "<urn:uuid:3bd3fb2a-63e2-40dd-b226-2b19f23ba965>", "text": "Это краткое руководство рассчитано не на участников полемики, а на читателей, чтобы они могли хотя бы приблизительно ориентироваться в приемах полемической борьбы. Я говорю о приемах, но никак не о правилах, потому что в газетной полемике в отличие от всех других видов борьбы - поединков, дуэлей, драк, побоищ, схваток, матчей, турниров и вообще состязаний в мужской силе, нет никаких правил - по крайней мере у нас. В классической борьбе, например, не допускается, чтобы противники ругались во врем"}, {"id": "<urn:uuid:3c5ffeb5-9c20-4124-a48c-a963991ab2d9>", "text": "Ася, спасибо большое за вашу консультацию! Это был новый интересный и приятный опыт. Снова почувствовала себя любимой женой, вернулась внутренняя гармония, ощущение радости от жизни. У мужа реальное улучшение в карьере. Надеюсь, в будущем обратиться к вам еще раз и уже с новыми нуждами, когда купим дачу=)\nАлтуков Н. Е\n26.05.10. Прошел полный цикл занятий «Профессиональный фен шуй» пол года назад. Будучи практикующим мастером, могу с уверенностью сказать, что данная методика действительно эффекти"}, {"id": "<urn:uuid:510d13f2-d29f-4b97-b468-8ac9399e827b>", "text": "После 9-го класса дети перестают учиться и натаскивают себя к ЕГЭ, сетуют ректоры вузов\nЗверское убийство исламистами военнослужащего всколыхнуло Англию\nАндрей Паршев, писатель: «Благодаря воспоминаниям Жукова все узнали, что Кузнецов очень достойно проявил себя и привел корабли в боевую готовность. Так что мемуары адмирала я рекомендую к прочтению»\nВ связи с продолжающимся бурным ростом рынка смартфонов и планшетов будущее производителей настольных компьютеров и ноутбуков весьма туманно.\nПерехв"}, {"id": "<urn:uuid:d33ffc31-e58c-4c77-bcfe-b1db48a4541f>", "text": "Русский\nИскусство и Развлечения\nАстрология\nhttp://www.ignio.com\nГороскопы на текущий день по знакам Зодиака, на неделю, год. Юмористический и китайский гороскопы. Возможность бесплатно подписаться на получение ежедневного и еженедельного гороскопа на е-mail.\nТатьяна Полякова\n//http://www1.polyakova.ru\nБиография писательницы (автор авантюрных детективов). Библиография. Электронные версии детективных повестей. Аудио-книги в свободном доступе. Пресс-релизы. Читательский форум.\nМУЗЕИ\n//http://www.mu"}, {"id": "<urn:uuid:6c91df21-e5ca-45fa-8220-4dff2d8006ff>", "text": "Апр 14 2012\nПрошел первый день конференции Стачка в городе Ульяновск. Слушателей пришло много (не каждый день конференции проходят в Ульяновске) в большом зале почти не было свободных мест. Открывали стачку представитель компании Skype в России, а так же поприветствовал гостей Губернатор Ульяновской области Сергей Морозов сказав вступительное слово – Считаем конференцию Стачка в Ульяновске открытой.\nВаш покорный слуга поприсутствовал на двух докладах, Ильи Космодемьянского “Теория и практики
