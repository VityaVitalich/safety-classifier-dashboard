 These include, among others, reducing the use of resource intensive inputs (e.g. energy) and subsequent decrease in pollution levels, fixing market distrortions by making resource prices reflect resource value, and p"}, {"id": "<urn:uuid:fe30cc19-e1d4-4f77-8ea6-0845349555a4>", "text": "BooksPlus - Full program podcast\n\nABC Radio National\n\nArts, Literature\n\n\n\nBooks + - 2014-04-27\n\nApril 27th, 2014\n\nEpisode 33 of 240 episodes\n\nToday three intertwined books tell a story about war and peace. One is a story about women doctors and nurses in the first World War, who set up their own hospital in France; the next tells about women pilots and spies in World War II; and the third is about the aftermath of war on the Australian homefront.\n\nFeatured Podcast"}, {"id": "<urn:uuid:e6dd8b9c-ef3d-4913-a036-233249506260>", "text": "What to Do If Your Pilot Light Goes Out\n\nJanuary 19, 2017\n\nPilot lights are commonly found on older model furnaces, and while they serve a very important purpose, also pose a safety hazard in the event they should go out. Instructions on how to relight the pilot light are typically found affixed to the appliance itself, or in the original owner’s manual. Knowing what to do if your pilot light goes out, and when to call for service or repair, can help keep your home and family safe and comfortabl"}, {"id": "<urn:uuid:c6306f63-08aa-4790-a769-d54be63a20fb>", "text": "The Job of an In-Home Nurse\n\nThe Job of an In-Home Nurse\n\nIn home nursing is a form of nursing where patients get treatment right in their own homes. Some nurses will actually live with their patients in a separate room of the house, and others will visit on a frequent basis to administer medicine and provide general care for people. The job of an in-home nurse is much different than the job of a nurse in the public job sector. Both may have to fill out an RN report sheet, but there is still a b"}, {"id": "<urn:uuid:ab10b298-64a1-433f-9603-2cb283a24bd1>", "text": "Term 3 Week 10\n\nposted 19 Jun 2016, 12:59 by Primary 2 Teacher   [ updated 19 Jun 2016, 13:00 ]\nLiteracy - Information Texts\n\nChildren will continue to practise spelling patterns in their spelling teams.\n\nThis week we will be looking at both fiction and non-fiction books about tigers.\n\nRecognising questions and answers.\nWriting a conversation using questions and answers.\nUsing correct punctuation in a sentence, using question marks.\n\nRead and understand factual sentences.\nWrite factual sentences"}, {"id": "<urn:uuid:f25464c6-eea5-4bf8-918b-71396a3a0b95>", "text": "Benefits of Using Small Plate Movement for Personal Training Clients\n\nToday we asked Personal Trainer in London for there opinion on using the small plate movement and would it benefit there clients in London.\n\nPersonal training clients are looking for results. Generally, they are looking for someone to help and motivate them to exercise, and they are expecting to work hard. They may not be your best friend after you have put them through their paces, but they will thank you for it. Imagine how "}, {"id": "<urn:uuid:3cc5b5a4-86c9-4910-bb27-b7ec6c62b711>", "text": "Mountains of the Tour de France\n\nThe course for the Tour de France varies each year (see more about the course), though there are several mountains and passes that commonly feature in the event, and are famous for those who follow the Tour. The most famous mountains are those in the hors-categorie (HC), which are peaks where the difficulty in climbing is beyond categorization.\n\nSome HC Peaks\n\nThese hors-categorie peaks include:\n\nPolka Dot Tour de France jerseyRelated Pages\n\nfollow Topend Sports\n"}, {"id": "<urn:uuid:bb2bd109-9f93-42b0-af9e-f97b03ed04f4>", "text": "How To Create Mac OS X Lion Install Bootable DVD / USB With Lion DiskMaker\n\nIf you want to upgrade your Mac OS X 10.6.6 or higher to Mac OS X 10.7 (Lion), then it might be a good idea to create a bootable DVD or USB for installation or up gradation purposes.\n\nLion DiskMaker allows you to quickly install Mac Lion on older Mac OS X versions, without the need to use Mac Lion’s redeem code in the App Store. Using Lion DiskMaker, you will not have to find Mac OS X Lion packages in the application fol"}, {"id": "<urn:uuid:e611096b-17f3-4d5b-aa14-3b6045a029c2>", "text": "We gratefully acknowledge support from\nthe Simons Foundation\nand member institutions\nFull-text links:\n\n\nCurrent browse context:\n\n\nChange to browse by:\n\nReferences & Citations\n\n\n(what is this?)\n\nGeneral Relativity and Quantum Cosmology\n\nTitle: Constant-roll Inflation in $F(R)$ Gravity\n\nAbstract: We propose the study of constant-roll inflation in $F(R)$ gravity. We use two different approaches, one that relates an $F(R)$ gravity to well known scalar models of constant-roll and a second that examin"}, {"id": "<urn:uuid:961ce4f4-c214-4c38-80f5-c6eaee1fc47f>", "text": "In just one day and one night - August 24 to 25 - in 79 A.D. a sequence of deadly pyroclastic currents coming from Mount Vesuvius destroyed and buried the cities of Pompeii and Herculaneum. But this volcano, periodically active and despite his modest size considered one of the most dangerous volcanoes of the world, due its vicinity of the urban conglomerate that is the city of Naples, provided also important insights how a volcano \"works\".\n\nFig.1. F. A. Perret with an improvised \"geophone,\" list"}, {"id": "<urn:uuid:2f3e4f4e-04f7-4452-8ecd-c7fc53ffbc2e>", "text": "publisher Rodney Buike and Virtualization\n\nWhen I was in Winnipeg, I had the good fortune to meet Rodney Buike at the Winnipeg IT Pro UserGroup.  I also killed his Dell Laptop harddrive (which he fixed by smacking it on the desk a few times) and shared some pints of the local Fort Gary brew while debating virtualization technologies and various other topics.  Rodney is a Microsoft MVP for Windows Server and the publisher of (Great Site!).  He also provides content for and is working on a book on"}, {"id": "<urn:uuid:18bfa8de-7971-4460-991d-ec0c2c3731c7>", "text": "DEPTFORD QUATRAINS Why are Pterodactyls so called then?\n\nPterodactyl means “Winged Finger”. Their wings were formed by a membrane of skin, muscle, and other tissues stretching from the legs to a dramatically lengthened fourth finger. Well, I never. See below from Wikipedia:\n\nA dactyl (Gr. δάκτυλος dáktulos, “finger”) is a type of metre in poetry. In quantitative verse, such as Greek or Latin, a dactyl is a long syllable followed by two short syllables, as determined by syllable weight. In accent"}, {"id": "<urn:uuid:86f4375c-2cd0-4c8b-a5bf-0b9d0bcc18e3>", "text": "Saltation (geology)\n\nFrom Wikipedia, the free encyclopedia\nJump to: navigation, search\nSaltation of sand\n\nIn geology, saltation (from Latin saltus, \"leap\") is a specific type of particle transport by fluids such as wind or water. It occurs when loose material is removed from a bed and carried by the fluid, before being transported back to the surface. Examples include pebble transport by rivers, sand drift over desert surfaces, soil blowing over fields, and snow drift over smooth surfaces such a"}, {"id": "<urn:uuid:e0f7705c-036c-45a8-867c-24a6c96c14fa>", "text": "One of the best perks of a solar system is having the ability to monitor your system’s energy production. Property owners can see in real-time the productivity on a daily, monthly, and annual basis. What makes monitoring such an important factor of a solar home or business is having the cabability to track how thesystem is generating solar power in relation to the energy that’s coming from the utility company. It’s a great tool to visualize your electricity offset between the two.\n\nHere are some"}, {"id": "<urn:uuid:64a69077-5bf8-43be-b354-0fb0a017698c>", "text": "Falling Into The Digital Black Hole With #de_VICE\n\n\nIn this day and age, social skills are not to be taken for granted. And when I say \"social skills\" I mean live, person-to-person interaction that requires actual eye contact and communication that happens more than 140 characters at a time and does not involve emotocons.\n\nOne of my biggest pet peeves is when I see people falling into the digital black hole. It's not an infrequent occurrence, you find it every time you see people seated at a tab"}, {"id": "<urn:uuid:ac758967-d62e-43b6-905c-ae9b2fbfae9f>", "text": "Creating Windows With Ruby Tk\n\n\nA GUI application may consist of the following types of objects:\n\n  • Widgets – basic GUI objects that can be put directly in the window. Most of them generate events as a response to user actions. A label is a widget, too, but, usually does not generate events.\n  • Shapes – lines, arcs, circles, polygons and other that belong on a canvas.\n  • Timers – threads that perform an action the number of times specified and sleep for the  specified duration. From the defi"}, {"id": "<urn:uuid:19ad9848-aba6-4514-9729-9118dd125f2b>", "text": "Sunday, 10 July 2016\n\nA Cube That Can Jump Up, Balance And 'Walk'\n\nThe Cubli is a cube that can jump up and balance on its corner. The motor torques can also be used to achieve a controlled fall such that the Cubli can be commanded to fall in any arbitrary direction. Combining these three abilities the Cubli is able to 'walk.'\n\nYouTube link\n\n0 comment(s):"}, {"id": "<urn:uuid:14c33946-a68f-46aa-b494-7c6ecc837437>", "text": "The Spirit of the Frescoes: The Uniﬁcation of Light\n\nIn considering the frescoes of Giotto and Taddeo Gaddi from the early 14th century, \nspeciﬁcally in the Peruzzi, Bardi and Baroncelli Chapels to the right of the main chapel of Santa Croce, the beauty of their art is fancied by visitors, students of art history and Italians alike. Both painters are celebrated for their originality in composition, and for evolving the techniques in painting during their time. Giotto and Taddeo Gaddi’s use of li"}, {"id": "<urn:uuid:5f84e0aa-2bdb-4c0c-afb1-5c13ccb32a6f>", "text": "Friday, July 19, 2013\n\nWater timers & drip irrigation: vacay dilemma resolved!\n\nWhy didn't we ever think of this before? Maybe because we thought it would mean an expensive and elaborate irrigation system? Or that setting up the tubes would require more work than it was worth? I wish someone had planted the idea in my head much earlier, because even if we're never away during summer for more than a week at a time, we've always relied on a lawn sprinkler (set on a timer) to water the plants. This"}, {"id": "<urn:uuid:bbc6ebc5-551d-4bf5-a68c-d506fdb197f8>", "text": "The Perception of Sound\n\nBy: Ken Humphreys\n\nSpeaker Engineer\n\nAfter a sound wave reaches your eardrum, the real magic begins. When you’re aware of a sound, your ear and brain are working together on the difficult task of selecting which sound to pay attention to, what might be making it, where it’s located and much more. Here are a few of the important “processing” jobs you routinely but unconsciously accomplish:\n\nDetermining Loudness\n\nYou can hear a sound at 0 dB (but just barely) yet handle so"}], "1": [{"id": "<urn:uuid:4445a3db-6676-4bed-afa7-f12c759b32a3>", "text": "An eye opener for Word Association Test - WAT:-\n\nFriends, As we all know the Day 2 Psychological Tests are the most important factor in determining our Officer Like Qualities.\nIn this, I am going to give you few lines on answering the WAT.  i.e. the second test in Psychology after the TAT - Thematic Appreciation Test.\n\nIn WAT, two type of words are given\n1) Knowledge based.\n2) Character based.\nKnowledge based means, words such as Puzzle, Time, Light, Product etc.\nCharacter based means, words suc"}, {"id": "<urn:uuid:ebcbcc2a-403f-46b4-9e75-9bc05a6995c5>", "text": "FCC to look at overturning unlocking ban\n\n\n    The decision was made last year, and came into force at the end of Jaunary, prompting outrage from users. A petition calling for the ban to be scrapped recently hit 100,000 signatures, meaning the government will be forced to reconsider it.\n\n    The ban means that customers of one carrier can't switch to a different network, even after their contracts have expired. Doing so risks five years in jail and a half-million dollar fine. It's been criticize"}, {"id": "<urn:uuid:72fde6df-a641-4cb0-9a6d-052be53d2b6c>", "text": "Industrial Workers of the World\n\n Industrial Workers of the World (popularly known as \"Wobblies\"), a REVOLUTIONARY INDUSTRIAL UNION fd 1905 in Chicago. The IWW's rapid expansion in the Canadian West demonstrated the influence of American labour ideology on the region's labour movement. Wobblies were mostly unskilled, low-status migrant workers (\"blanket-stiffs\") - miners, loggers, navvies and harvesters - who were recruited to the West primarily from southern and eastern Europe and were brutally"}, {"id": "<urn:uuid:13cbf6f6-2317-4481-a1e7-759944579c48>", "text": "Where Is Kosovo?\n\nKosovo is a landlocked region in the Balkan Mountains in Europe. It borders Central Serbia to the east and Albania to the west. The region is a disputed territory. It declared independence on 17 February, 2008. The case, whether to grant the request for a new nation or not, is still pending with the United Nations. Serbia considers the region a part of the Serbian nation and strongly opposes the independence move of Kosovo.\n\nKosovoThe name of the region comes from the Serbian l"}, {"id": "<urn:uuid:76eab820-8a5b-4d8e-ac29-b225567779b0>", "text": "If you are worried about not speaking Spanish for your upcoming trip to Costa Rica, you’re not alone. We remember those days too and hear from lots of others who are unsure of how they’ll get by without much or any Spanish. The good news is that many Ticos (Costa Ricans) have some English skills, and others, especially those working in the tourism industry, are quite fluent. Costa Rica is a Spanish-speaking country, however, and you are bound to get some blank stares in certain situations. In th"}, {"id": "<urn:uuid:ffba6814-3505-4950-bca7-dd103b830589>", "text": "Tag Archives: Art\n\nThis Ain’t a Trash Story\n\nwith Mia Lauzon\n\n\nThis week, Zero Waste Canada talks with Mia Lauzon, a artist, photographer, environmentalist about her project “This Ain’t a Trash Story”. Mia recently was part of Creatively United for the Planet’s inspirational Earth day event in Victoria B.C.\n\nIn 2010, Mia Lauzon while volunteering in Ecuador came upon the trashed-filled beach of Bunche on the Pacific Ocean and this is where Jenny, Leopol, Isaac, Oscar and Rebecca came to life.\n\nJ"}, {"id": "<urn:uuid:173af8cd-245c-4117-a826-9baf838eda19>", "text": "Life beyond the automobile in Southern California\n\nArchive for the month “July, 2013”\n\nCars and the Environment Pt. 2\n\nIn my review of Tom McCarthy’s Auto Mania (Cars and the Environment pt. 1), we explored the unprecedented environmental harm resulting from the mass production and use of motor vehicles.  Whereas McCarthy argues that consumer decision-making drove the automobile to its apex in modern American life, our next author, Christopher Wells, places those consumer decisions in the contex"}, {"id": "<urn:uuid:61e05d02-1c77-4d97-9ecf-a6159e3a650c>", "text": "Home » X-Ray Full-Body Scanners\n\nX-Ray Full-Body Scanners for Airport Security\n\nX-Ray Full-Body Scanners home\n\nContext - To improve airport security in the light of terrorist threats new full-body scanners have been developed to complement existing metal detectors and hand searches.\n\nScanner types that do not use X-rays - \"millimeter wave scanners\" are already allowed in the EU and deployed in some airports. Other types of scanners already used in the USA expose passengers to low levels of X-ray"}, {"id": "<urn:uuid:dd652b43-e113-4237-89cc-5017f64c0b9d>", "text": "Widely known in Southeast Asia as the “king of fruits”, the Durian fruit  is distinctive for its large size, unique odour, and formidable thorn-covered husk. The fruit can grow as large as 30 centimetres long and 20 centimetres in diameter, and it typically weighs one to four kilograms. Its shape ranges from oblong to round, the colour of its husk green to brown, and its flesh pale yellow to red, depending on the species.\n\nThe edible flesh emits a distinctive offensive odour, strong and penetrat"}, {"id": "<urn:uuid:339c320f-e07c-4000-b533-171e61acd68e>", "text": "Word of the Day: Nondimensional\n\nHow often have you used the word nondimensional in a sentence? There are occasions when I might have used it, had I known that was the word for what I was doing.\n\nFor example, when making calculations that involve physical quantities such as mass, length, time, velocity, and the like, it’s not enough to keep track of the numbers or variables as you calculate, you must also keep track of their units. As students know from bitter experience, it’s easy to confuse, o"}, {"id": "<urn:uuid:e533b898-f804-4188-b2f8-6d4b3c6a026f>", "text": "French: Negatives and using them in the perfect tense, or with infinitives\n\nSome bits of grammar about using negatives in various situations, like with past participles or infinitives. I don't think it's something that you would absolutely need to know, just if you are a bit of a grammar geek like myself ;) Sorry for the amount of times I've used the word 'sandwich' in this, literally couldn't think of a better word haha... Enjoy!!\n\nHideShow resource information\n\nPages in this set\n\nPage 1\n\nPrevi"}, {"id": "<urn:uuid:91354232-8457-495c-ab13-64a42ca0c8f3>", "text": "Music, Arts & Culture » Music\n\nSchool for Soul\n\nNumero Group's 'database of weirdness' now includes kids' songs\n\n\n\n\nThere is no record label in the country today reissuing decades-old soul recordings with more avidity, frequency and sense for archaeology than the Numero Group, an academic and semi-mysterious company possessing the secret added ingredient of impeccable taste. While soul and funk reissue labels have flourished since the turn of the millennium, many of them, particularly of the hig"}, {"id": "<urn:uuid:e4f4c1f0-b6a0-4a58-b87d-8763ed0a53d1>", "text": "Skip to Content\nSevere eczema holding you back? Find the right treatment\n\ntinea capitis\n\n\nDefinition: a common form of fungus infection of the scalp caused by various species of Microsporum and Trichophyton on or within hair shafts, occurring most commonly in children and characterized by irregularly placed and variously sized patches of apparent baldness because of hairs breaking off at the surface of the scalp, scaling, black dots (see black-dot ringworm), and occasionally erythema and pyoderm"}, {"id": "<urn:uuid:13e29432-88ef-4350-9935-e5cf2e30c9e2>", "text": "Japanese Wages Slump Record 7.1% as Companies Slash Bonuses\n\n\n  1. Japanâs wages fell at the fastest pace on record in June as companies cut bonuses to protect dwindling profits, adding to evidence that consumers are unlikely to contribute to an economic recovery.\n\n    Monthly wages including overtime and bonuses dropped 7.1 percent from a year earlier to 430,620 yen ($4,500), the sharpest decline since the survey began in 1990, the Labor Ministry said today in Tokyo. Bonuses shrank 14.5 perce"}, {"id": "<urn:uuid:39bc9e15-4ef1-45cf-8704-01ba5ba5e014>", "text": "\nPhrasal Verbs\n\ngive away\n\nThis page is about the phrasal verb give away\n\nMeaning: If you give away something, you give it to someone without expecting anything in return.\n\nFor example:\n\n  • give away sth Bill Gates gives away most of his money to help poor people in developing countries.\n\n  • give sth away My dog had five puppies, and we gave four of them away and kept one for ourselves.\n\nQuick Quiz:\n\nIf you give away a lot of money, most people will say you are\n\na. a generous person\n\nb. a stra"}, {"id": "<urn:uuid:b7a1d2f1-c412-4728-9e48-e69e1f29502c>", "text": "Why are we there?\n\nGlastonbury Festival enjoys a relatively crime-free existence and some parts still hark back to the early days of peace, love and free milk. However, there will be more than 200,000 people at the festival. This is bigger than plenty of towns across the United Kingdom and no-one would question why those towns had police officers stationed there.\n\nIn a gathering of such size, there are unfortunately one or two bad apples and the police would be remiss not to have a presence at t"}, {"id": "<urn:uuid:489ffec5-ab9f-44f3-a071-13e3d71bfc27>", "text": "Dismiss Notice\nJoin Physics Forums Today!\n\nGustav Daléns Invention\n\n  1. Apr 12, 2004 #1\n    Gustaf Daléns Invention\n\n    He won the Nobel price for Physics for his invention.\n\n\n    How did his invention actually work?\n\n    You could hardly call it a mayor contribution to Physics (with all respect) can you?\n\n    (Changed the name into the correct name, thanks to Chen)\n    Last edited: Apr 12, 2004\n  2. jcsd\n  3. Apr 12, 2004 #2\n    Well, he was blinded in a gas explosion before the award so mayb"}, {"id": "<urn:uuid:92a5337d-7184-4a94-99d7-40e019c961a0>", "text": "Is Frisian a Language or a Dialect?\n\nFrisian (Frysk) is a Germanic language, spoken by an ethnic minority known as the Frisians in the northern regions of the Netherlands and Germany. It is similar to Dutch, German, Danish and most similar to English. In fact, Frisian is, along with Scottish, the closest living language to English. It especially bears a lot of resemblance to Old English.\n\nIn Germany, Frisian is confined to small pockets of the country, with relatively few speakers. The Netherlan"}, {"id": "<urn:uuid:07f414b9-b397-4ce1-8e16-a5bd6cd3cc40>", "text": "The Best Time to Start Learning Anything During the Year\n\nHome/Lifestyle/Education/The Best Time to Start Learning Anything During the Year\n\nThe Best Time to Start Learning Anything During the Year\n\nNever stop learning; because life never stops teaching – Anonymous\n\nAll seasons have something to offer – Jeannette Walls\n\nWas there a time in your school days that you faced challenge studying and understanding new lessons of the curriculum of any subject?\n\nScience bets, that you must have had.\n\nSin"}, {"id": "<urn:uuid:b0ab114b-9ca7-4f97-a4c6-abd4f9a7baed>", "text": "3 years ago\nin English · 34,668 Views\nlikes 11clips 5comments 3\nHow Not to Interview for a Job\nThis video made by Fast Company shows how your cliched, rehearsed speeches aren't going to get you anywhere in a job interview! The interviewer has heard it before, and they'll hear it again after they don't hire you! \"Nobody wants a cliché for an employee.\" There's nothing more true than that! Thankfully, not all jobs will ask these kind of cliche questions, but if they do, do not answer! Like! These!"}], "2": [{"id": "<urn:uuid:ba4ad5f8-69c3-4329-b63e-113a9282d3a2>", "text": "Tony Martin and English Self-Defense Laws\n\nCalling back to a great scene in a classic 80s comedy film:\n\nYou can’t have a discussion about self-defense in the United Kingdom without gun owners pulling Tony Martin out of their asses, but I often wonder how many gun owners have a deep understanding of the case, and what the facts were surrounding it. To understand why takes a bit of delving into self-defense law in both the UK and US. While I’m far from an expert on these topics, I think I do have "}, {"id": "<urn:uuid:e574e4e7-6804-486d-88c0-6fbacebd0d74>", "text": "Plaza Cinema Field Trips\n\nThe Plaza is offering a variety of field trips suitable for grade school children to high school adolescents. If you enjoy films and believe this exceptional art form can be a fun and educational tool to teach history, social sciences, natural sciences, languages, art and culture - then partner with The Plaza.\n\nBy coming to The Plaza students are able to experience the Arthouse Cinema environment and learn about how it differs from the multiplex cinema. Every field trip"}, {"id": "<urn:uuid:0186451c-28e2-4fea-b1db-01dd2699cb31>", "text": "\n\nOne of the major focal points in terms of processing the idea of spiritual teachers is wondering to what extent they are necessary at all in the development of the individual as a spiritual being. How does one define the spiritual life? How does one define a spiritual teacher? These are questions with answers that would likely be as different as the people asking them.\nWhether or not a person feels the need for a spiritual teacher, whether a teacher in the\nflesh or via a philosophical text, is"}, {"id": "<urn:uuid:43b33cda-bb1a-46e3-9371-bea4b5b5dbd7>", "text": "Romance! As Understood By Little Girls\n\nWith Valentine’s Day coming up, and our theme on this month’s Roundtable being romance, I thought it was apt to write a little something about romance. But we don’t need just little old me talking about it. Oh no no, we need some fresh, young perspective! And so I decided to interview my little sister and her friend. Who better to give romantic advice than little girls? Cianna is 6 and her friend Chastity is 9. Let’s see what they have to say about this wh"}, {"id": "<urn:uuid:af5d36d9-9a99-451d-8378-b878e0ed4aaf>", "text": "Summer in the City\n\nby Cristiana Strava\n\nCooling off in the Bronx (2011). Source: Charles Brigand\n\nIn 1927, the Times reported that more than three thousand people had spent the night sleeping on the sand at Coney Island in order to escape the stifling heat of their tenements. Patrolmen had been assigned to stand guard over the sleepers. Many more spent their nights in Central Park, while others piled up on fire escapes to survive the sweltering heat of New York in July. Over the years, the imag"}, {"id": "<urn:uuid:ab23feef-2319-4a54-ab96-aebe8ea5728e>", "text": "Sign in to myUHN Patient Portal\n\nMinor stroke captured on video: Watch as it happens\n\nOn April 2, 2014, while driving home from work, Stacey Yepes sensed a stroke coming on. She pulled over, pulled out her smartphone and recorded what was happening so others could see. (UHNToronto/YouTube)\n\nUPDATE: Stacey Yepes' stroke 'selfie' video goes viral\n\n\nSettled in for the evening on her couch watching TV, 49-year-old Stacey Yepes suddenly felt the left side of her body go numb.\n\nHer face froze.\n\n\n-Dr. "}, {"id": "<urn:uuid:a1f2bb05-c281-470b-8f7b-ffcc7276edb2>", "text": "Dunstable: 01582 608 400 \nLeighton Buzzard: 01525 372 447 \nDunstable: 01582 608 400 \nLeighton Buzzard: 01525 372 447 \n\nPaedatric Podiatry \n\nFlat feet, intoeing, out-toeing, bowing legs and knocked knees are common in children and depending upon age are normal developmental variants. A careful history, examination and knowledge of normal development allow a Podiatrist to treat where necessary or in most cases reassure the parents. \nNormal Development \nThe new-born infant’s skeleton consists of ma"}, {"id": "<urn:uuid:5c39b3e9-8868-40cf-8f91-c7f3a73e316f>", "text": "A Philosopher's Blog\n\nFood & The Future\n\nPosted in Business, Environment, Technology by Michael LaBossiere on January 2, 2012\nEnglish: Description: Concentrated animal feed...\n\nImage via Wikipedia\n\nThroughout most of human history getting enough to eat has been a serious problem. The Green Revolution changed this for many humans. The Junk Revolution also changed things, especially in the United States: now we have significant numbers of people who are both obese and malnourished.  There is curre"}, {"id": "<urn:uuid:b0641fe0-d7bd-4566-af1f-265f338a6457>", "text": "Do Chinese factory workers have higher cancer rates than those workers in developed nations?\n\nI ask because it seems the manufacturing process in China is less well regulated and the workers seemingly would be exposed to more harmful chemicals.\n\n\n\n  1. 0 Votes\n\n    Your guess is very accurate. As an average, Chinese workers are indeed frequently exposed to harmful chemicals and dangerous situations. This is because consumers want everything to be as cheap as possible and that means production co"}, {"id": "<urn:uuid:daecc657-fad8-4661-8c1b-eefaf6b8ab3b>", "text": "Posted by: r.m. | November 11, 2010\n\nLebanese merchants say no to regulated food prices\n\nAgriculture, Food prices, Merchants, and Government — all intricately connected.\n\nAnd in Lebanon the Merchants openly state their decision to ignore a Governmental ruling regarding elevated food prices.\n\nFrom the excellent Al-Akhbar, once again\n\nالتجّار يهددون بتقنين السلع\n\nالمعركة مفتوحة لإبقاء الفوضى في السوق الإستهلاكية\n\nفي 26 تشرين الأول أصدر وزير الاقتصاد والتجارة محمد الصفدي القرار 196/1 الذي يعيد العم"}, {"id": "<urn:uuid:68d6d180-ebf8-44ff-a5ce-a2e5167101e5>", "text": "Deconstructing Government Word Magic\n\n\nTake a word that describes a natural condition, reassign your own meaning while retaining the original defining aspect of the word. This is how the State manages to brainwash so many people.\n\nExample, Law. Gravity is an immutable Law, as are all natural Laws. In the minds of the people, Laws are absolute and therefore can’t be broken or subverted. Make up your own rules, label them Laws, always refer to your rules as Laws and the people will start to believ"}, {"id": "<urn:uuid:b8a4e389-54e6-4b42-b9da-6699e936531e>", "text": "Light infantry\n\nFrom Infogalactic: the planetary knowledge core\nJump to: navigation, search\nFor other uses, see Light infantry (disambiguation).\nPortuguese Army light infantry (caçador) of the Peninsular War\n\n\nHistory of the light Infantry\n\n\n\nModern Age\n\n\n\n\n\n\n\nContemporary Light Infantry Forces\n\nToday the term \"light\" denotes, in the United States table of organization and equipment, units lacking heavy weapons and armor or with a reduced vehicle footprint. Light infantry units lack the greater "}, {"id": "<urn:uuid:0089577f-e284-443e-aebd-420f9303a41a>", "text": "Teeth grinding and snoring\n\nTeeth grinding and Snoring\n\nI am amazed at how many people grind their teeth and are recommended to use mouth guards at night. That’s not my idea of a sexy evening!\n\nNow, it could be there is a problem with teeth alignment and a guard is needed, fair enough. On the other hand stress plays a big part in this. Tension in the body is commonly stored in shoulders, neck and jaw. When jaw muscles tighten up they clamp your teeth and the behaviour of grinding starts. Teeth g"}, {"id": "<urn:uuid:9f7587a9-8749-4ecc-ac7b-211b9211e123>", "text": "Workers’ Compensation: Benefits The Employer Or Employee?\n\nDaniel Stahl was working as a nurse for Hialeah hospital in 2003, just a few months after the state made changes to its workers’ compensation system. During one of his workdays, Stahl lifted a patient and ended up injuring his back from the movement. In October of 2005, his treating physician found he had reached his maximum medical improvement (MMI) and assigned him to a 6 percent impairment rating. At this point, he was entitled to imp"}, {"id": "<urn:uuid:19125580-1051-4b63-aebe-ce64dd046c4f>", "text": "Loading presentation...\n\nPresent Remotely\n\nSend the link below via email or IM\n\n\nPresent to your audience\n\nStart remote presentation\n\n  • Invited audience members will follow you as you navigate and present\n  • People invited to a presentation do not need a Prezi account\n  • This link expires 10 minutes after you close the presentation\n  • A maximum of 30 users can follow your presentation\n  • Learn more about this feature in our knowledge base article\n\nDo you really want to delete this prezi?\n\n"}, {"id": "<urn:uuid:a141775b-2d31-4a93-ab89-1cedf788b3e1>", "text": "Need Help? Want to Talk?\n\n24-hour on-call services\nCall 609-258-3310\n\n\n\nThe students, faculty, and staff of Princeton University have traveled from all fifty states in the nation and from nations around the world to be a part of our community. Because state laws vary greatly and SHARE-related terms can mean a lot of different things to different people, we have provided the following definitions to ensure that we can speak a common language around issues of interpersonal violence and abuse.  \n\nN"}, {"id": "<urn:uuid:618a7851-f30e-4b53-934b-00f3382f5238>", "text": "Workers Compensation\n\nIn Lumberton or elsewhere in North Carolina Workers Compensation injury laws work the same. To collect benefits, first, you must be hurt by accident. Second, the accident must occur while you are on the job in the course and scope of your job duties.\n\nExcept for back injuries an accident which qualifies you for benefits must be an occurrence which is unusual or out of the ordinary. In other words, if you were just doing exactly what you do in the same way you always do it, "}, {"id": "<urn:uuid:fd03e678-1a06-47d9-af67-bd720c9c724b>", "text": "Why this Ginseng is the Right Choice to Fight Fatigue\n\nAre You Tired and Looking to Increase Your Energy?\n\nMore and more people are looking for a way to increase their energy.  At the same time, people are  concerned about over consuming highly-caffeinated energy drinks or supplements. People are just simply looking for a different type of energy that will not give them a jittery feeling, one often associated with taking in an excessive amount of caffeine. That’s why we recommend looking at Gins"}, {"id": "<urn:uuid:cdb65275-5eae-49cc-b7de-5f7e79de3dc0>", "text": "Skip to Content\n\nRivastigmine Hexal\n\nActive Substance: rivastigmine\nCommon Name: rivastigmine\nATC Code: N06DA03\nMarketing Authorisation Holder: Hexal AG  \nActive Substance: rivastigmine\nStatus: Authorised\nAuthorisation Date: 2009-12-11\nTherapeutic Area: Dementia Parkinson Disease Alzheimer Disease\nPharmacotherapeutic Group: Psychoanaleptics\n\nTherapeutic Indication\n\nSymptomatic treatment of mild to moderately severe Alzheimer's dementia.\n\nSymptomatic treatment of mild to moderately severe dementi"}, {"id": "<urn:uuid:4504d9f2-233d-4be6-b224-721e96c78790>", "text": "Working out a repayment plan for your borrowing\n\nIt’s crucial to work out the total cost of the credit you’re taking out, including interest payments, and not just the amount you’re borrowing or how much you can afford to pay every month. Taking the time to work out the full cost of any borrowing lets you plan your finances and ensure that you really can afford it.\n\nWhat affects your borrowing costs\n\nHow much you’ll pay to borrow money depends on how much you need and how quickly you plan to rep"}], "3": [{"id": "<urn:uuid:916a607f-f7aa-47e0-9739-1c211723c907>", "text": "Prevent Direct Execution of EXE\n\n\n\n\n\nThe sample code here is pretty simple:\n\n#include \"mainwindow.h\"\n#include <QApplication>\n\nint main(int argc, char *argv[])\n\tQApplication a(argc, argv);\n\n\tif (argc <= 1)\n\t\treturn 0;\n\t\tif (argv[1] != \"yourpassword\")\n\t\t\treturn 0;\n\n\tMainWindow w;;\n\n\treturn a.exec();\n\nIn the example above, your EXE will simply pop out an error message that says “Please run MyGame.exe instead.” if you double click on it directly. This is because the argc variable is either 0 or 1 (d"}, {"id": "<urn:uuid:9edcccc3-721a-42dd-9f55-5da4ed8d6f48>", "text": "September 15 in history\n\n\n921  At Tetin Saint Ludmila was murdered at the command of her daughter-in-law.\n\n994 Major Fatimid victory over the Byzantine Empire at the Battle of the Orontes.\n\n1254 Marco Polo, Italian explorer, was born (d. 1324).\n\n1616 The first non-aristocratic, free public school in Europe was opened inFrascati, Italy.\n\n1649 Titus Oates, English minister and plotter, was born (d. 1705).\n\n1762 Seven Years War: Battle of Signal Hill.\n\n1820 Constitutionalist revolution in Lisbon.\n\n"}, {"id": "<urn:uuid:04126930-a520-4191-a38a-a312ad609837>", "text": "Always Providing You With Ongoing Information\n\nPosts tagged ‘Tor’\n\nNew Firefox Exploit Can Expose Tor Users\n\n\nThe exploit was delivered through a Tor mailing list that when opened could unveil the MAC address and possibly even the IP address of a user running Tor Browser on Firefox. Researcher Joshua Yabut said it is “100 percent effective for remote code execution on Windows systems, versions 41 to 50 of Firefox are reportedly affected.”\n\nA representative of Mozilla said officials are aware of "}, {"id": "<urn:uuid:aa132bf9-3f98-435d-b392-caff8378ac1c>", "text": "Saturday, December 10, 2016\n\nA Person Who Maybe Motivated More People than Anyone Ever Had\n\nHonestly, I can't think of anyone who had an effect on a greater number of people,\n\nGet that part about the Ev's.  Yea, Maybe no Beatles.\n\nHope you like it,.\n\n\n  1. two tunes at the same time--awesome!!\n\n    1. C-CS, PS, if you have the same stuff on the right sidebar as I do when I click that link I gave you, the top 3 at least are worth the time.\n\n    2. gave them a 'listen' and smiled the entire time -"}, {"id": "<urn:uuid:c0a73f6e-5862-42f6-9af3-d9ceb6d8347e>", "text": "Stephan Grover Cleveland is the fifth of nine children born to Reverend Richard Falley Cleveland and Ann Neal Cleveland. He was born on March 18th of 1837 in Caldwell, New Jersey, although he was raised in Fayetteville, New York. The actual house in which he was born still stands today on 207 Bloomfield Avenue. He was named in honor of Stephan Grover, a minister at a local Presbyterian Church who Reverend Cleveland had recently taken over for. Life as the son of a minister was different than mos"}, {"id": "<urn:uuid:b987b375-bfdb-402d-896b-942c737d9f01>", "text": "Skip to content Skip to navigation\n\nLesbian Historic Motif Project: #110e Borris 2004 - Same-Sex Desire in the English Renaissance (Chapter 5)\n\nFull citation: \n\n\nPublication summary: \n\n\n\nChapter 5: Physiognomics\n\nAnyone who has participated in a palm-reading has taken part in the pseudo-science of physiognomy. For that matter, statistical studies attributing a wide variety of psychological and behavioral traits (including sexual orientation) to the ratio of lengths of the index and ring fingers "}, {"id": "<urn:uuid:8dd66b67-96b3-43e6-984f-df9610b5fc10>", "text": "[EnglishFrontPage] [TitleIndex] [WordIndex\n\nCommand Substitution\n\nCommand substitution is a very powerful concept of the UNIX shell. It is used to insert the output of one command into a second command. E.g. with an assignment:\n\n    $ today=$(date)        # starts the \"date\" command, captures its output\n    $ echo \"$today\"\n    Mon Jul 26 13:16:02 MEST 2004\n\nThis can also be used with other commands besides assignments:\n\n    $ echo \"Today is $(date +%A), it's $(date +%H:%M)\"\n    Today is Monday, "}, {"id": "<urn:uuid:cceb2c2d-a6ff-497e-b444-7bae99038405>", "text": "Saturday, November 29, 2008\n\nHot Springs Village trunk - Chinese tourism scenic spots\n\nChina hot spring located in the trunk 12 km south of County Office. 80 km from the city of Yuxi, Yunnan Province, from the office 148 kilometers, covers an area of 2.3 square kilometers, the construction area of 70,000 m2. Hot Springs is a deep fault zone along the natural water cycle of the outcrop, the flow of 3760m3 /day, the water temperature 39-41 degrees, colorless and tasteless, State Department of Geol"}, {"id": "<urn:uuid:7cc07ec5-d10a-4e07-8abf-56ad906ec97f>", "text": "A Lua Implemention of the SHA-1 Hashing Function\n\nWith the code provided below, you can easily create a new module that provides a Lua implementation of the common SHA-1 hashing algorithm. To create and access this module, you will have to perform the following steps:\n\n  1. In the Translator, create a new module called “sha1”. The new module is added to the shared list:\n  2. Click on the new module to open its contents in the Editor (the page should be blank).\n  3. Copy and paste the code from t"}, {"id": "<urn:uuid:1c3698f5-5caf-4f75-bd98-ba240fc78ec2>", "text": "Dragon Eggs are not as common as they used to be but they are still around. Jenna found Spit Fyre's egg in the tunnels beneath Aunt Zelda's cottage and gave it to Septimus, neither knowing its true identity then.\n\n\nDragon Eggs are impossible smooth and oval shaped. They resemble large stones. They are also said by Septimus to give off a slight luminescent sheen in the light. They can only be hatched in a specific order of unique steps.\n\nSteps to Hatch a Dragon Egg\n\n  1. Sustain heat surrounding "}, {"id": "<urn:uuid:6baf8660-38f6-4a38-b679-753ca2c25598>", "text": "Top Disdain Quotes\n\nBrowse top 146 famous quotes and sayings about Disdain by most favorite authors.\n\nFavorite Disdain Quotes\n\n1. \"...all his longings came out as a kind of disdain for what he longed for.\"\nAuthor: Alan Hollinghurst\n2. \"Action and blood now get the game. Disdain treads on the peaceful name.\"\nAuthor: Amos Bronson Alcott\n3. \"So I pulled a gun on him and demanded his wallet.\"The soda in my mouth becomes the soda in my nose. \"You had a gun?\" I cough and sputter into my napkin.Mom's e"}, {"id": "<urn:uuid:38f0b0c9-e104-49eb-81da-19b8a745a8fa>", "text": "The US and South Korea have now conducted a joint military exercise to respond to North Korea’s launch, firing their own missile into the South’s territorial waters.\n\nNorth Korea announced on Tuesday that it had tested its first intercontinental ballistic missile — potentially its most powerful weapon yet, and one possibly capable of reaching the United States.\n\nThe announcement came hours after US and South Korean defense officials said North Korea had launched a missile from the country’s Nort"}, {"id": "<urn:uuid:a4c495dd-0277-41ed-8e81-683cc650f90b>", "text": "Definition from Wiktionary, the free dictionary\nJump to: navigation, search\nSee also: Hose, hōse, and hőse\n\n\nA US naval officer using a fire hose\nWikipedia has an article on:\n\n\nFrom Middle English hose (leggings, hose), from Old English hose, hosa (hose, leggings), from Proto-Germanic *husǭ (coverings, leggings, trousers), from Proto-Indo-European *(s)kew- (to cover). Compare West Frisian hoas (hose), Dutch hoos (stocking, water-hose), German Hose (trousers). Compare Tocharian A kać (skin), Russ"}, {"id": "<urn:uuid:1a0b4a81-c73c-4896-a7d1-7a726e5d8f8e>", "text": "Open Access\n\nGreen Synthesis, Characterization and Uses of Palladium/Platinum Nanoparticles\n\nNanoscale Research Letters201611:482\n\nReceived: 4 June 2016\n\nAccepted: 19 October 2016\n\nPublished: 2 November 2016\n\n\nBiogenic synthesis of palladium (Pd) and platinum (Pt) nanoparticles from plants and microbes has captured the attention of many researchers because it is economical, sustainable and eco-friendly. Plant and their parts are known to have various kinds of primary and secondary metabolites wh"}, {"id": "<urn:uuid:88b7a003-e4c6-4c85-9fa8-7536a5414503>", "text": "Friday, November 30, 2007\n\nSearch Yourself\n\n\nA simple idea to get the ball rolling on a new scene. Pick your favorite search engine - Yahoo, Google, Whatever - Dogpile is a good one because it combines several different search engines - and look up your name. You've done it before, now you are getting permission to do it. Create a character based on the people who share your name, but aren't you. Then build a scene around that character. If you have an unusual name and a search engine doesn't br"}, {"id": "<urn:uuid:f20d9723-dace-4f66-bcae-c7d45ff2f8ce>", "text": "\n\n\n[spawrt-fish-er-muh n, spohrt-] /ˈspɔrtˌfɪʃ ər mən, ˈspoʊrt-/\na motorboat fitted out for sportfishing.\n\n\nRead Also:\n\n  • Sportfishing\n\n    [spawrt-fish-ing] /ˈspɔrtˌfɪʃ ɪŋ/ noun 1. fishing with a rod and reel for sport, especially for saltwater sport fish from a motorboat.\n\n  • Sportiness\n\n    adjective, sportier, sportiest. Informal. 1. flashy; showy. 2. smart in dress, behavior, etc. 3. like or befitting a sportsman. 4. dissipated; fast: a sporty crowd. 5. designed for or suitable for sport"}, {"id": "<urn:uuid:d708f775-574f-44a1-8334-68ff17951251>", "text": "Tuesday, February 21, 2012\n\n\nEpitaph for Timocritus\n\nAnacreon 101 Diehl = Greek Anthology 7.160, tr. Guy Davenport, Thasos and Ohio: Poems and Translations 1950-1980 (San Francisco: North Point Press, 1986), p. 69:\nHe was a soldier in the wars.\nTimokritos. This is his grave.\nSometimes blood-drinking Ares kills\nNot the cowards but the brave.\nGreek has words for blood-drinking and blood-thirsty, e.g. αἱματοπώτης (alt. αἱμηπότης, αἱμοπότης, αἱμοπώτης, αἱμωπός), αἱματορρόφος, αἱμόδιψος, but after a "}, {"id": "<urn:uuid:9c266f6e-8830-4a55-8e4f-a04ead1661ca>", "text": "Thorumhaim, the Coin of Torum.\n\nA small prosporous town in Raaiderland / Oal-dam county, that had 8 gold- and silversmiths and a coinmaster. It disappeared under water in the storm of 1509, while the people of the town were celebrating. It is there were one now can find the Dollard sea in the North-East cost of the Netherlands. It is said that the floor of the sea is made up of Gold coins.\n\nThese coins are symbolicly represented by the value of TORUM.\n\n\nSoon on an Ardor Sidechain near you.\n\nSouv"}, {"id": "<urn:uuid:30fb8d6c-d2c1-44a6-ba03-3902c1a41436>", "text": "Comment of the Day: History is in the Eye of the Deedholder\n\nCOMMENT OF THE DAY: HISTORY IS IN THE EYE OF THE DEEDHOLDER Historic and Gone“Demolish your great aunt’s soup tureen! Every person wants to preserve her or his family history, yet is bonkers to bulldoze the neighbor’s. BS. All of it is Houston’s history — whether, or not, George Washington or George Bush slept there.” [movocelot, commenting on Texas May Demolish Your Local Preservation LawsIllustration of demolished historic structure:"}, {"id": "<urn:uuid:01e3d94b-bb1a-44af-816b-53d04f7e2bae>", "text": "\n\nA Prisoner of the Boxer Rebellion, 1900\n\nThe Galveston Hurricane of 1900\n\nFarm Wife, 1900\n\nThe Death of Queen Victoria, 1901\n\nThe Assassination of President William McKinley, 1901\n\nThe Roosevelts Move Into the White House, 1901\n\nRiding a Rural Free Delivery Route, 1903\n\nFirst Flight, 1903\n\nThe Gibson Girl\n\nEarly Adventures With The Automobile\n\nImmigrating to America, 1905\n\nSan Francisco Earthquake, 1906\n\nHenry Ford Changes the World, 1908\n\nA Walk with President Roosevelt, 1908\n\nChildren At Wor"}], "4": [{"id": "<urn:uuid:87635d26-4e76-41fe-bc14-f96784cb0957>", "text": "Numerous industries utilize solid metal parts made of powdered metal. Powdered metal components, which are made from powdered metal via powder metallurgy, can be found in applications spanning across industries such as lawn and garden, computer, electronics, hardware, and automotive.\n\nMore specifically, powder metal parts include magnetic assemblies, filtration systems, structural parts, and automobile components. Powder metal gears are inherently porous and they naturally reduce sound, making t"}, {"id": "<urn:uuid:8c3b7310-5e96-4678-b77b-ff3f40c35f25>", "text": "Hi all,\n\nI have a .CGI web page written in PERL language. The CGI script loads the information from a database.\n\nSo when i start the CGI page in my browser and it will only have a value in the whole page.\nAs in when the whole page started in the browser will have only a few characters.\n\nLet say it retrieve Temperature recorded and which is stored in the database.\nSo the whole page when loaded will only show 1 temperature.\nWhich is \"36.6\" and will change when ever the database receive a newer dat"}, {"id": "<urn:uuid:680ede11-75ff-4ea7-8234-67e000e20928>", "text": "Fixing bugs like it's 1988\n\nI grew up in the 80's, the decade home computers went from curiosity to mainstream. In primary school we had several Philips P2000T home computers and a pair of Apple Macintosh — ehm, Macintoshes? Two of those, anyway. A friend had a C64 we used to play games on, and at some point my dad bought a C128 for his financial administration. (What I really love is the fact that, to this day, he is still doing his financial administration on a C128, albeit an emulated one. He"}, {"id": "<urn:uuid:50e8fb6a-1a82-42db-a954-177913d20720>", "text": "Dismiss Notice\nJoin Physics Forums Today!\n\nGroup axioms - Verify?\n\n  1. Sep 25, 2006 #1\n    It is known that \"the integers under addition\" form a group,\n    that is (Z,+).\n    I have always wondered how to actually proof that (Z,+) is a group?\n\n    Definitions for a group from wikipedia:\n\n    I'm especially interested in two things:\n    1) Why does the associative law hold for (Z,+), that is\n    a+(b+c) = (a+b)+c for a,b,c in Z.\n\n    And moreover:\n    2) Why is closure fulfilled?\n    That is, if"}, {"id": "<urn:uuid:d8cb303e-dea7-499f-96cd-539b8e00c9c7>", "text": "\n\n\nLocation: Trzebinia, Poland\nCamp Commandant: SS-Unterscharführer Wilhelm Kowol\n\nIn August 1944, a former British POW camp by the Erdöl Raffinerie GmbH owned refinery in Trzebinia was transformed to accommodate an expected 1,000 prisoners from Auschwitz. This came at the request of the refinery management who were displeased at the rate of production undertaken by the British POW's who were deliberately working to low capacity. Following the removal of the British, the Germans organised the fi"}, {"id": "<urn:uuid:42dbbf37-bd70-40f8-a4fd-8ca39ec8097c>", "text": "Input management with Dependency Injection\n\nObject oriented programming has a lot of patterns that can be very useful for making games. One of those patterns is the Dependency Injection, a pattern that helps to decouple classes that would otherwise be tightly connected. So let’s take something that’s really connected and see how dependency injection can help us: the input management.\n\nWait what’s this Dependency Injection?\n\nUsually if you have a thing (call it client) that uses another thing (ca"}, {"id": "<urn:uuid:3ba54635-24f0-4243-92e2-c56e25ce36f2>", "text": "Norway: If at first you don't succeed..\n\nI bring this story for several reasons:\n1. It brings up an interesting point about the meaning of refugee.  Is somebody embroiled in a blood feud in a country where anarchy rules a refugee?  What would happen if both sides in a blood feud request asylum?\n2. Why did Qaher put so much effort into entering Norway?  He traveled through many European countries, but he did not ask for asylum there.\n\n\nMohammed Qaher (29) is seeking asylum in Norway for the secon"}, {"id": "<urn:uuid:f753dc57-05d6-4daa-af10-6e8f3380e7eb>", "text": "Working with the MEAN stack: Application setup\n\nIn this tutorial I will convert the app I wrote using AngularJS to make it use the MEAN stack. Don’t worry, there’s nothing mean about the MEAN stack.\nThe MEAN stack is a pure JavaScript stack containing:\n\n  • MongoDB: MongoDB is a NoSQL database allowing you to store JSON (actually BSON) documents and query them. This is a great database when going for pure JavaScript applications because it’s easy to put the same object structure that you’re work"}, {"id": "<urn:uuid:f2812d29-b66f-41da-a090-48623e0334b2>", "text": "Black Hat vs White Hat Seo\n\nPosted by Anna Smith | 3:03 AM | 0 comments »\n\nBlack Hat vs White Hat Seo\n\nThere is a cogent bisect in the SEO industry over the blush of a SEOs Hat. The agitation about the ethical or bent attributes of SEO can abide till world's end. But, there are assertive SEO techniques labeled beneath Atramentous Hat SEO which accession the ire of seek engines. And assertive White Hat SEO techniques may aswell could cause some trouble.\n\ncontent and ambience - Now you see it, now"}, {"id": "<urn:uuid:b7faf282-cc6d-4b30-835d-a8d5539d3493>", "text": "Saturday, April 28, 2007\n\nSīdī Muhammādī Bil-Hājj\n\nHis father was from the tribe of Banī Sa‘īd but moved later on to the tribe of Banī Shikār. His father was a follower of the Qādirī order. He was highly respected by the heads of this order in the zāwiya of Wark. The followers would come and visit him in his home and he would host them and show them great generosity. He was made a representative (muqaddam) of the order and they married him. He had many children and one of them was Sīdī Muhammādī"}, {"id": "<urn:uuid:aceb4aa7-cd57-471c-b225-da014ebe9930>", "text": "Stampa Pagina\n\nC) Gravity and the other “forces”. (Second part).\n\nC) Gravity and the other “forces”. (Second Part).\n\n\n\nArticle from:\n\nTempo nuovo, Naples 1973, nn.5-6: The unigravitational field\n\n\nby Renato Palmieri\n\nIn the modern physics the methods for the measure of mass are the most improper one could imagine on the theoretical plan. The apparent precision of the determinations derives only by the usage of a certain conventional meter which usually leaves almost unchanged the relations with "}, {"id": "<urn:uuid:623323fe-2d60-4822-bb4c-590b623fc318>", "text": "Wednesday, November 4, 2015\n\nContainers 101\n\nAbout six months ago, I started to notice that there is a lot of hubbub going around in the tech-o-sphere about containers as a new way to approach virtual computing. I like exploring new technology, so I've spent the last few months getting the ins and outs of them. Here's what I can tell you: Containers are an important technology that is not going away anytime soon. There are a lot of players in the space, and new ones enter all the time. If you ar"}, {"id": "<urn:uuid:11e52e6c-0498-4457-84dc-7f3449c43d63>", "text": "JTE - Jigdo Template Export\n\nJTE Introduction | Download | How to use JTE | How JTE works | How fast is JTE? | How to use mkimage | How to use iso-image.pl | How to use jigit | External integration | What's left to do?\n\n\n\nJigdo is a useful tool to help in the distribution of large files like CD and DVD images. See Richard Atterer's site for more details. Debian CDs and DVD ISO images are published on the web in jigdo format to allow end users to download them more efficiently.\n\nJigdo is generic "}, {"id": "<urn:uuid:27e25839-675d-4d03-a73d-77ec7233e6e5>", "text": "Posted by: Barry Bickmore | October 11, 2014\n\nThe Monckton Files: Vote for Monckton!!!\n\nAt last, a candidate I can really get behind! There is an interesting site called Quora, on which people ask all sorts of questions, other people answer, and readers vote on the best answer. Sometimes these are pretty fun to read. One question that was posted was, “What are some examples of experts who in the end were not real experts?” I noted that one of the responders had nominated Lord Monckton, but I did"}, {"id": "<urn:uuid:7a23dba4-1ffb-4b6c-b23c-d486b2b14660>", "text": "Explore BrainMass\n\nHolocaust & Auschwitz\n\nDiscuss Auschwitz in terms of location, structure, and implications for the Jews and others.\n\nSolution Preview\n\nThe United States Holocaust Memorial Museum\n\nprovides excellent photographs of the atrocities of the Holocaust. Soon after liberation, surviving children of the Auschwitz camp walk out of the children's barracks (Poland, after January 27, 1945 see attachment). Refer to this same attachment for various maps depicting the defeat of Nazi Germany ("}, {"id": "<urn:uuid:21adbc34-c5b6-448e-8041-580604d41eb2>", "text": "• The Crop Reconciliation\n\n    The Crop Reconciliation is an optional module that you can access through the Cashflow screen. It enables you to record and review budget income and expenses for cash and feed crops and produce reports that are specific to the Crop Reconciliation.\n\n    Before you can use the Crop Reconciliation\n\n    There needs to be crop category codes and extended codes loaded into your Code List.\n\n    If you need to, you can load the crop codes from an already created template, "}, {"id": "<urn:uuid:3b55cdd0-927e-48af-b115-c4b69f0b2c1a>", "text": "The ASC 606 transition: Recognizing revenue as each performance obligation is satisfied\n\nAuthored by: Philip Santarelli\n\nSo far in our series, we have discussed four of the five elements of revenue recognition. We have identified a contract, determined the performance obligations, estimated the transaction price, and allocated that transaction price to the various performance obligations. In this article we examine the final element, recognizing revenue as the entity satisfies the performance ob"}, {"id": "<urn:uuid:bcd2d635-87a7-46e1-be33-65d73e1a7772>", "text": "\n\n\n[guhn-ter] /ˈgʌn tər/\n\nnoun, Nautical.\na jib-headed sail fastened to a vertical spar that is attached to a short mast, usually by two rings, in such a way that the spar can slide up the mast to spread the sail.\n[guhn-ter] /ˈgʌn tər/\nEdmund, 1581–1626, English mathematician and astronomer: inventor of various measuring instruments and scales.\nEdmund. 1581–1626, English mathematician and astronomer, who invented various measuring instruments, including Gunter’s chain\n\n\nRead Also:\n\n  • Gunter gr"}, {"id": "<urn:uuid:488b054e-e225-40d9-8629-b7bb216aa208>", "text": "The question of the validity of ordinations today, and the problems of the fraternity of Saint Pius X\n\n- New -\n\n\nThe tragic mistake which is fallen Bishop Marcel Lefebvre, certainly for a subtle trick of the devil, was formed in his mind an adamant as mistaken belief, that the teachings of the Council, He appeared to be polluted by a secularist mentality, anthropocentric and modernist, They consequently compromise the high, traditional dignity of Holy orders, degrading it and asservendola to pro"}, {"id": "<urn:uuid:f46d7b3d-95d2-4836-ac5c-cdec129c0b63>", "text": "Birthplace: Mistmantle Island\nFamily: Juniper\n\nYou have always be my son. - Damson\n\n- And you are my mum! - Juniper\n\nDamson was a female squirrel and Juniper's foster mother.\n\nUnlike most squirrels who lived in Anemone Wood, Damson's home was by a waterfall far from Mistmantle Tower. It was by the waterfall and streams that she singlehandedly raised Juniper. Consequently, Juniper grew up mostly among otters instead of squirrels, and he became an excellent swimmer and stone skimmer. Not having an"}], "5": [{"id": "<urn:uuid:95fcbdcf-d7df-4445-b414-e44d8066b128>", "text": "How True Capitalism Kills Racism\n\nBigotry carries a cost.\n\nFor decades, agitators aligned with the Democratic Party have argued that the only way to right the \"historic wrong\" of slavery is to enforce affirmative action - that is, to give unearned preferences to blacks or other minorities simply because they are black or minority.  The thought is that, because black people were oppressed for hundreds of years primarily because of their skin color, it's only right for them to enjoy the opposite t"}, {"id": "<urn:uuid:4651eb4d-e155-4722-99e2-405876adf69d>", "text": "Enterprise Software\n\nSolutionBase: Using the Dsquery command in Windows Server 2003\n\nMicrosoft includes some handy GUI tools with Windows Server 2003 to help you manage Active Directory. Sometimes, however, command-line tools such as Dsquery can give you more flexibility and control. Here's a detailed look at the Dsquery command.\n\nIn the article \"Getting started with Windows Server 2003's directory service command-line tools,\" I introduced you to the six basic directory service command-line tool"}, {"id": "<urn:uuid:e17d9a86-ef58-45e2-842f-511ca9cc2818>", "text": "The power of math can be exponential\n\n\nWhen I was in elementary school, my parents made sure that I learned. They knew that all of my subjects were important, certainly. But I have special memories of discussing literature and history over the dinner table. They made sure that I really LEARNED my math. I had some terrific teachers in all of those subjects.\n\nSomewhere along the line, though, I developed a special appreciation for math. As a result, I majored in business in college. It is certainl"}, {"id": "<urn:uuid:37d94b05-bbce-4af3-aae3-ce33e0d3b611>", "text": "Just another site\n\nArchive for the ‘Spassky’ Category\n\nAre We What We Have Been Influenced By?\n\nwith 4 comments\n\nHave you ever thought about the past influences you show in the way you play Chess?. Think about it for a while.\n\nMy early Chess influences were , in this order, Karpov-Petrosian-Nimzowitsch (and the Hypermodern movement)-Botvinnik-Fischer and Spassky . I have learnt many things from all of them. If I reduce the list it would read: Karpov-Nimzowitsch et alii-Fischer-Spassky. Now you m"}, {"id": "<urn:uuid:c9d043dd-740c-430a-9ac7-5a9d65a5229a>", "text": "Leaves of Grass/Book XXXIV\n\nFrom Wikisource\nJump to: navigation, search\n\n\n\nMy city's fit and noble name resumed,\nChoice aboriginal name, with marvellous beauty, meaning,\nA rocky founded island—shores where ever gayly dash the coming,\n      going, hurrying sea waves.\n\n\nSea-beauty! stretch'd and basking!\n      steamers, sails,\nAnd one the Atlantic's wind caressing, fierce or gentle—mighty hulls\n      dark-gliding in the distance.\nIsle of the salty shore and breeze and brine!\n\nFrom Montauk Point[ed"}, {"id": "<urn:uuid:92b504b9-d33f-4595-b0f9-f7128cb902bc>", "text": "Ctrl-W, the key sequence used to delete a word at a time in many UNIX environments. Strangely enough, tcsh just makes this a euphemism for ^U, and many programs don't even bother to implement it. Too bad, since it's really useful. At least tinyfugue uses it, and some people grok its meaning.\n\nMostly, it's useful for showing \"accidental\" long sections of text which need to be deleted without having a buttload of ^Hs.\n\nA lot of fucking idiots^W^WWindows l^Husers could do to fuck off and die^W^W^W^"}, {"id": "<urn:uuid:fc407fa0-a5f5-4577-b069-36c038799466>", "text": "YY Chat- The Development of Online Chat Platform\n\n\nAs the online technology has been developing in high speed, online video chat platform, which is one of the most useful functions of IT tools, has been used in many different ways. The distance between becomes shorter and shorter, which increases the speed of globalization. From E-mail texts to Internet phone, that owns to the development of wide band. Most video chat apps and websites, are free, people can easily use them now, based on which pl"}, {"id": "<urn:uuid:077c049d-04d4-44c1-9a39-5b2b76636069>", "text": "Thursday, February 27, 2014\n\nthe Junians\n\n\n\n\n\nMonday, February 17, 2014\n\nthe Athomians\n\nAthomian lives are rigidly dictated by social status, measured by both strength and artistic talent. Athomians are presumed to be descended from the Noblei, as their clans migrated north along with the Junians and the Eldragoths. Their society spread further north following the last Turning. Forced to compete with the Beastmen of the northern hills and plains, they have become fiercely barbaric and truly anar"}, {"id": "<urn:uuid:a0b25363-b28c-426c-bdb2-cab68e4c3837>", "text": "Loading presentation...\n\nPresent Remotely\n\nSend the link below via email or IM\n\n\nPresent to your audience\n\nStart remote presentation\n\n  • Invited audience members will follow you as you navigate and present\n  • People invited to a presentation do not need a Prezi account\n  • This link expires 10 minutes after you close the presentation\n  • A maximum of 30 users can follow your presentation\n  • Learn more about this feature in our knowledge base article\n\nDo you really want to delete this prezi?\n\n"}, {"id": "<urn:uuid:7edda77e-5f57-42d5-abde-eb1bef125a77>", "text": "Loading presentation...\n\nPresent Remotely\n\nSend the link below via email or IM\n\n\nPresent to your audience\n\nStart remote presentation\n\n  • Invited audience members will follow you as you navigate and present\n  • People invited to a presentation do not need a Prezi account\n  • This link expires 10 minutes after you close the presentation\n  • A maximum of 30 users can follow your presentation\n  • Learn more about this feature in our knowledge base article\n\nDo you really want to delete this prezi?\n\n"}, {"id": "<urn:uuid:1e19b8df-fb44-43a0-a64e-609ad1e85dc0>", "text": "Terrorism and The Government\n\n\nTerrorism is a vast topic to be debated on. And for those in South Asia, it is a regular scenario. They see terrorism quite often. People getting abducted, executed and tortured. As Small Scale Incidences don’t reach the world so easily. The Peshawar attack, Mumbai 9/11, Gujarat Attacks, Samjhauta Express Attacks and the list never ends. But what we see is a one-sided world. A side of world where people’s belief is well faked, the world where citizens are nothing b"}, {"id": "<urn:uuid:3930a227-15f5-4804-b42d-ea6ba8fe6402>", "text": "tag:www.econsultancy.com,2008:/topics/email Latest Email content from Econsultancy 2017-05-02T14:01:00+01:00 tag:www.econsultancy.com,2008:BlogPost/69035 2017-05-02T14:01:00+01:00 2017-05-02T14:01:00+01:00 How Lenny Letter used email newsletters to cultivate an online community Nikki Gilliland <p>With 500,000 subscribers and a reported 70% open rate, it has rapidly grown in popularity since its launch in 2015. So, what makes readers race to read it? <\/p> <p>Here’s a bit more on how Lenny has evo"}, {"id": "<urn:uuid:1ad5f13b-5a8b-41a3-bf77-b2921cd5aac2>", "text": "Kim Jong-nam carried $120,000 in cash when assassinated – report\n\nKim Jong-nam, the half-brother of North Korean leader Kim Jong-un, was holding US$120,000 cash when he was killed at Kuala Lumpur airport in February, the Asahi Shimbun reports, citing unnamed Malaysian officials close to the investigation.\n\nThe investigation team reportedly recovered four bundles of mostly new $100 notes in stacks of 300, as well as a laptop and two mobile phones. Since Kim Jong-nam held a diplomatic passport, hi"}, {"id": "<urn:uuid:c64c861d-59e9-4056-ba9d-4fd3f3d8d25b>", "text": "Tuesday, August 2, 2016\n\nMaking Dromaeosaurids Nasty Again Part IV: New Hypotheses on Dromaeosaurid Feeding Technique & Role of Tail in Movement\n\nHey now... I really thought about splitting this post into two posts for both respective hypotheses, but for the sake of brevity and wrapping this series up I decided to combine them. Additionally, as I will elaborate on further, the two aspects I will focus in on here - biting & locomotion - are not mutually exclusive and one dovetails into the other."}, {"id": "<urn:uuid:3db4a621-bd69-4547-baea-b63f25d2167a>", "text": "Serbs, Croats and unhealed wounds Serb recalls how his parents were killed by Croats.\n\nOctober 01, 1991|By Carl Schoettler | Carl Schoettler,Evening Sun Staff\n\nThis man who is a Serbian Yugoslav recites his litany of the awful hurts of World War II as if they happened yesterday.\n\nAnd as you listen, you realize that in the long history of animosity between Serbs and Croats, the 1940s were yesterday.\n\n\"I am born in Bosnia in a village called Blagaj,\" Vosjislav Velkjo says.\n\nVelkjo owns a foundry i"}, {"id": "<urn:uuid:3cf98b0c-53a1-4488-a1a6-f57a07f9e621>", "text": "Monday, October 30, 2006\n\nThe gentler sex?\n\nRecently, reader Eriqua left a comment, asking:\n\n\"do we have any modern examples of women dictators? I just wonder if the gender gap has been bridged\"\n\nThis is a fairly good question. The answer is, somewhat surprisingly, not really. Even though it's a man's world, there have certainly been some notable female tyrants, but nearly all of them have been monarchs from centuries past. From Queen Ravanalona I (\"The Cruel\") of Madagascar to Empress Catherine"}, {"id": "<urn:uuid:daf5bf86-9a81-4bd6-ac89-ff22946d5596>", "text": "Monday, January 28, 2013\n\nPlant trees, disband the army, work together: the Tuscan way of escaping the growth trap\n\nYou probably know the story of the man who invented the game of chess. It is said that he presented the game to the king and that he asked in exchange a grain of rice on the first square of the board, two on the second, four on the third and so on, for all the 64 squares. The story says that the king agreed to the deal, only to find out, later on, that the amount of rice he was sup"}, {"id": "<urn:uuid:4cc294b7-07ae-4eb0-b5d7-486743fa291c>", "text": "Wednesday, 24 August 2016\n\nChanging culture, not easy but the prize is huge!\n\nWant to Change culture? Then change habits.\n\nI get asked a lot, “how can I change the culture in my organisation?” This is probably because I’m obsessed by change in the workplace (see previous posts) and I studied cultural theory along with other things as part of my MA. In a nutshell I believe If you want to change the culture of an organisation you have to change its habits. That is the habitual behaviour of it’s in"}, {"id": "<urn:uuid:10bbc037-0cf3-4e04-9c6c-c9520ccd1898>", "text": "Inside a Religious Movement\n\nA
