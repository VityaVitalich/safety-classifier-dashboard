our le titre)\nComme de nombreux rôlistes aujourd’hui trentenaires, je les ai découverts à l’époque où le jdr subissait les attaques conjuguées de la dream team Dumas-Pradel-DeCarolis, avec en guest star le fameux Dr. Abgrall. Les Fédérés s’étaient érigés en défenseurs du jdr, surtout sur le côté juridico-institutionnel et c’est vrai que leurs communiqués étaient aussi sexy qu’une déclaration du tribunal administratif de Jouy-en-josas. Mais il se lâchaient quan"}], "5": [{"id": "<urn:uuid:398a5485-b97e-401d-a43c-3d755e0fd4e7>", "text": "Camp de concentration d'Auschwitz-Birkenau, mai 1945\n© Deutsches Historisches Museum\nNul oiseau ne survole Birkenau\nRéflexions personnelles sur un lieu de mort\npar Tamar Kevonian\nThe Armenian Reporter, 08.09.2007\n© Deutsches Historisches Museum\nNul oiseau ne survole Birkenau\nRéflexions personnelles sur un lieu de mort\npar Tamar Kevonian\nThe Armenian Reporter, 08.09.2007\n« Pourquoi Cracovie ? », me demande le douanier.\nJe lui réponds : « Pourquoi pas ? » Il s’agit d’un petit aéroport secondaire a"}, {"id": "<urn:uuid:1240ccec-c6ca-4ed7-96e3-d857902970a9>", "text": "Le Capitaine Fracasse/Chapitre XVII\nXVII\nLA BAGUE D’AMÉTHYSTE\nMontant les degrés quatre à quatre, Malartic, Bringuenarilles, Piedgris et Tordgueule accoururent dans la chambre d’Isabelle pour soutenir l’assaut et porter aide à Vallombreuse, tandis que La Râpée, Mérindol et les bretteurs ordinaires du duc, qu’il avait amenés avec lui, traversaient le fossé dans la barque afin d’opérer une sortie et de prendre l’ennemi en queue. Stratégie savante et digne d’un bon général d’armée !\nLa cime de l’ar"}, {"id": "<urn:uuid:82302f6e-546e-46b9-9ad5-64c2d80e0daa>", "text": "\" Pendant les troubles [Irlandais], le JSG opérait sous le nom de couverture de Forces Research Unit (FRU), qui entre le début des années 80 et la fin des années 90 s’est débrouillé pour pénétrer au cœur même de l'IRA. En ciblant puis en ‘retournant’ les membres de l’organisation paramilitaire grâce à une variété ‘d’incitations’ allant du chantage aux pots-de-vin, les opérateurs du FRU ont produit des agents à pratiquement chaque niveau de commandement de l’IRA, \" explique Sean Rayment.\nMême un "}, {"id": "<urn:uuid:156c8ec5-0269-41ca-835f-09fa9af58dc5>", "text": "belle rencontre\nchocolatvalou femme qui aime aller voir un concert\nje suis ici pour faire une belle rencontre et peut etre trouver l homme qui me correspondra les hommes qui recherchent une relation d un soir passer votre chemin je ne suis pas interesser merci\nfemme serieuse\nTATATIE femme qui aime aller voir un concert\nFemme 65ans sérieuse recherche homme meme profil bien dans sa tete\ncarpe diem\nlaeti76 femme qui aime aller voir un concert\npourquoi pas ?\ntout est possible\njocedu57 femme qui aime"}, {"id": "<urn:uuid:629c1e38-b997-4d5f-8bc3-9f42881fff16>", "text": "I just migrated the old blog on wordpress. I know that this blog is pretty much dead, but at least I will keep the engine up to date!\nMaybe I will start being an active blogger again. I’ll post in english this time.\nI just migrated the old blog on wordpress. I know that this blog is pretty much dead, but at least I will keep the engine up to date!\nMaybe I will start being an active blogger again. I’ll post in english this time.\nJuste un petit billet pour signaler que je suis encore en vie!\nVoici"}, {"id": "<urn:uuid:8da1cf53-af3e-491a-b43f-ec9a16c756cb>", "text": "Connectez-vous à l’aide du compte Microsoft que vous utilisez pour MSN, Hotmail, Messenger et d’autres services Microsoft.\nConnectez-vous à l’aide de l’identifiant utilisateur qui vous a été attribué par votre organisation ou votre école pour pouvoir utiliser les services Microsoft.\nEn savoir plus\nIl y a un problème avec cette page, essayez d’y accéder à nouveau ultérieurement. Si vous souhaitez acheter un module linguistique Office 2010, vous pouvez le faire sur la page du module linguistique O"}, {"id": "<urn:uuid:0bd6d091-d023-4379-af26-0a42268d7eca>", "text": "LE KIRCHBERG DE BARR SELON…\nLe choix de ma onzième étape fut très simple : après avoir fait le tour des crus de la Couronne d’Or, il m’a suffi de mettre le cap au sud pour arriver jusqu’au prochain lieu-dit classé Grand Cru, le Kirchberg de Barr.\nUn peu facile me direz-vous… j’assume pleinement, même si les raisons de mon choix sont un peu plus complexes.\nEn effet, de récentes sessions de dégustation avec le club A.O.C. ou avec l’Oenothèque Alsace, m’ont permis de découvrir quelques très belles "}, {"id": "<urn:uuid:85274894-b0ba-4343-aed8-18206774da9d>", "text": "vendredi 22 février\nPour ceux et celles qui suivent, j’aime ma nouvelle ville. Voici un exemple de choses que j’aime à Lille. Avec les enfants nous avons passé l’après midi au Colisée de Lambersart ou maison folie. L’ABC, Art Basic for Children, une structure bruxelloise a investi les lieu. Si vous habitez Lille et ses environs, et que vous n’y avez pas encore emmené vos enfants, alors vite profitez de ces vacances pour le faire. C’est génial. Les enfants abordent la création artistique de façon"}, {"id": "<urn:uuid:b89a9efb-26c1-4951-8ef6-13ada978a503>", "text": "Le code postal saisi correspond à plusieurs villes. Sélectionnez celle qui vous correspond:\nLe code postal saisi est erroné. Veuillez entrer un nouveau code postal.\nVous avez déjà un compte associé à cette adresse email. Veuillez retourner sur la page d'accueil etvous identifier dans l'encart Déjà Membre en haut à droite de la page.\nEnvoyer mon mot de passe par email\n** Publiez des photos et obtenez jusqu'à 5x plus de réponses! **\nDon't worry! Just fill out the box below with your email address "}, {"id": "<urn:uuid:612f088b-c73a-42e6-8b4b-7f689c8a0c5a>", "text": "Une erreur s'est produite lors de l'envoi des données vers le site Appartager. Veuillez cliquer sur le bouton 'Page précédente' de votre navigateur afin de poursuivre votre navigation sur le site. Si le problème persiste, n'hésitez pas à contacter le service client au 01.84.88.09.85 ou à firstname.lastname@example.org."}, {"id": "<urn:uuid:64ffd134-8b6f-40ce-bd0d-f58c5b52d661>", "text": "Témoignage de Melle FADDAH AGHLAMENHOUM lors des auditions publiques alternatives des victimes des années de plomb organisées par l'Association marocaine des droits humains, AMDH, le 12.03.05 à Rabat.\nMelle FADDAH AGHLAMENHOUM est membre du Comité de soutien à la campagne internationale pour la protection des défenseurs des droits de l'homme au Sahara Occidental et ex-disparue sahraouie.\nMelle AGHLAMENHOUM a été enlevée en octobre 1992 à Laâyoune à l'occasion d'une manifestation organisée par de"}, {"id": "<urn:uuid:b370808b-8ee2-4d3c-ab78-9ca25b3b2760>", "text": "«B Marie louise Dominique\nLe vingt huit avril mil sept cent quarante huit par nous pretre soussigné a été baptisée dans l'Eglise paroissiale de quebec et sous condition Marie louise agée denviron quatre ans prisoniere angloise fille de defft george dominique du lieu d'albanie et de marie Samni son épouse le parrain a été pierre de Cheveri La Marraine Marie louise gaignon lesquels ont declare ne savoir signer. Cet enfant est engagé a Joseph Caillabet et Magdeleine legrand son epouse jusqua lage d"}, {"id": "<urn:uuid:4314c1c2-87a9-4e45-b297-4de50080a55f>", "text": "Une erreur s'est produite lors de l'envoi des données vers le site EasyWG. Veuillez cliquer sur le bouton 'Page précédente' de votre navigateur afin de poursuivre votre navigation sur le site. Si le problème persiste, n'hésitez pas à contacter le service client au +33-184880985 ou à email@example.com."}, {"id": "<urn:uuid:12de68af-b6e9-4dad-8635-6e829299ff6a>", "text": "Salut tout le monde ! Pour ce nouvel épisode de CULTUREGAME on s'attaque pour la première fois à une licence emblématique : les Crash Bandicoot ! Si vous voulez tout savoir sur le marsupial de Naughty Dog c'est par ici que ça se passe ! Bon visionnage ! Comme je le souligne à la fin de la vidéo, n'hésitez pas à partager vos impressions sur cette série.\nPersonnellement, je préfère les Crash Bandicoot sur PlayStation 1 car les suites sur next-gen n'avaient malheureusement pas le génie de Naughty D"}, {"id": "<urn:uuid:ec717056-bec0-4e5f-82d1-773832f16473>", "text": "\n\nChtisdumonde change de nom\nA compter du 1er février 2013, Chtisdumonde étend son concept à l'ensemble des régions et prend le nom de Nos Régions Web. Le site est animé par la même équipe. Seule modification : vous pouvez désormais si vous le souhaitez, échanger avec l'ensemble des membres inscrits quelque soit leur région de rattachement.\nVous allez être redirigé vers la page demandée\nA très vite. L'équipe de Chtisdumonde."}, {"id": "<urn:uuid:0aba0d69-3535-4bbb-b7f4-aa44d2cb8bc8>", "text": "\n\nBruxelles, Botanique, Boutik Rock, 18 février 2005\n\n\nPhilippe Carly : \"Personne ne devinait à quel point Joy Division deviendrait énorme\"\nInterview\nmercredi 16 mars 2005, par\n\n\nDANS LA MEME RUBRIQUE :\n\n\nLe photographe Philippe Carly fait partie de ces hommes qui ont vécu les années d’or de la new wave de l’intérieur. Témoin privilégié de l’explosion de cette scène, dès 1977, il assiste à l’éclosion de groupes comme Joy Division, The Cure, Bauhaus ou encore U2. Entre les soirées Factory au Plan"}, {"id": "<urn:uuid:4f67985b-1244-495a-9ad2-3df06cd43235>", "text": "Cette vieille grosse ferait fantasmer plus d’un amateur de formes rondes. Elle exhibe sa chatte au mec chargé de la démonter sans hésiter. Voyant quelques poils sur son pubis, le gars décide alors de les lui raser. Il étale de la mousse en profitant bien pour lui caresser le minou, et passe délicatement le rasoir jusqu’à ce que sa fente soit parfaitement lisse. Cela l’excite tellement qu’il se rue ensuite sur la femme mûre pour lui lécher l’anus, pendant qu’elle s’applique à bien lui pomper le d"}, {"id": "<urn:uuid:c7f04641-0982-43eb-ba5e-788abf852a17>", "text": "Place de l'Hôtel de Ville\nBP 90419\n01012 Bourg-en-Bresse cedex\nTél. : 04.74.45.72.07\nSIRET : 2 101 005 33 000 12\nEmail : firstname.lastname@example.org\nLes contenus et les données, sous tous les formats (textes, images, etc.), du site http://www.archives.bourgenbresse.fr appartiennent aux Archives municipales de Bourg-en-Bresse et sont utilisables selon le contrat de licence Creative Commons consultable à l’adresse http://creativecommons.org/licenses/by-nc-nd/2.0/fr/.\nCependant, l'existence de t"}, {"id": "<urn:uuid:a2b98ff7-8e30-449c-b0aa-bcc7fc8fad49>", "text": "Enfant\nUn article de la désencyclopédie.\nUn enfant est un monstre obscur, une sorte de légende. Il ressemble à un adulte en plus petit, plus jeune même. Moins de 1m30, un regard attendrissant, et toujours une série de questions idiotes à la bouche. La vérité sort toujours de la bouche des enfants. La preuve : qui c'est le sale con ?\nMais ne vous fiez pas à cet air angélique.\n[modifier] Conseils de survie\nQuand un enfant attrape une proie, il ne la lâche plus. Dans les ténèbres de la parentalité,"}, {"id": "<urn:uuid:37f4741a-69b1-4c8f-a028-659f5c6e99ab>", "text": "quels sont les consèquences d'un décollement du placenta?\nloveitaliana\nA jamais tu seras en moi. Profil : Doctinaute d'argent\nPosté le 22-12-2008 à 13:50:18\nBonjour à toutes, donc voilà comme le titre l'indique, j'aurai aimer savoir se qu'un décollement du placenta pouvait entrainer?\nJe n'ai pas ça ( et j'espère ne pas l'avoir), mais à l'écho on a vu des hématomes au placenta, mon doc m'a dit repos faudrais pas que ca devienne un décollement du placenta. Donc pour me renseigner je pose la questi"}]}, "ita_Latn": {"0": [{"id": "<urn:uuid:dad189e9-6a8b-459d-ba14-935c2822692c>", "text": "Situazione: Situato in una posizione strategica nel cuore verde della Romagna questo hotel sorge non lontano da numerosi ristoranti, bar, pub e locali notturni. La stazione degli autobus dista circa 50 m. A 14 km di distanza gli ospiti troveranno la stazione ferroviaria. Interessanti opportunità di shopping sono raggiungibili a 20 km. Il Museo delle Ceramiche e i Musei di San Domenico sono a 10 km. Ravenna dista 40 km, Firenze 100 km.\nAlloggio: La dotazione prevede bagno privato con doccia, vasc"}, {"id": "<urn:uuid:942da32e-e413-457d-ba63-67ad1d03a1f9>", "text": "Bruschetta con pomodori e melanzane è un antipasto,diverso dal solito.Avevo delle melanzane fritte da far fuori ..un pò di pane raffermo ed ecco che è nata l’idea.Buon sabato a tutti!!\nIngredienti per 2 persone:\n4 fette di pane raffermo\n1 melanzana piccola\n3 pomodori maturi\nbasilico\naglio\nolio extra vergine\nsale\nProcedimento:\nTagliare le melanzane a tocchetti cospargerle di sale e farle spurgare per 30 minuti.Affettate il pane e passateci sopra l’aglio..fatelo abbrustolire su una piastra o al fo"}, {"id": "<urn:uuid:e8f97fb7-7ca6-48a5-bd57-e8e2d9f18bab>", "text": "La calata G.B. Cuneo. Su un muro la lapide che ricorda il bombardamento della flotta di Luigi XIV.\nLa casa di sinistra, nell’ultima immagine sin qui vista, é quella dove nacque Edmondo De Amicis.\nQuesta, in parte, la zona del Convento.\nIl campanile é quello del Duomo di San Giovanni.\nFuori dal circuito delle mura, il campanile della SS. Annunziata.\nIl ritorno al tratto, minimale, ma ben visibile come tipologia, dei bastioni, situato ad est.\nSu un muro a fianco del Duomo una riproduzione specific"}, {"id": "<urn:uuid:eacbbed8-e88f-4468-ab95-0079be0c6fe9>", "text": "Vieni all’evento del 18 maggio “Windows Phone 7 Day” a Bari organizzato da DotNetSide con la collaborazione di Microsoft Italia e UgiMobile\nNon mancate…ormai manca poco ed i posti sono limitati\nOrmai mancano pochi giorni al prossimo evento che DotNetSide organizza in collaborazione con Microsoft.\nInfo e registrazione : http://dotnetside.org/content/WindowsPhone7Day.aspx\nNon mancate"}, {"id": "<urn:uuid:423fcbc4-d6b5-4e0a-b076-e1434262e2fb>", "text": "Anche i prodotti biomedicali si comprano online. Sempre più spesso gli ospedali, le case di cura, le cliniche private e i medici si rivolgono a siti web specializzati per acquistare cavi, trasduttori a ultrasuoni o dinamici, elettrodi e batterie. Non solo, i siti forniscono anche la riparazione o la sostituzione di prodotti biomedicali già in possesso delle strutture."}, {"id": "<urn:uuid:a700d17c-a86b-4d94-bd58-06333a011454>", "text": "Posizione\nGay Hostel si trova a Berlino (Schöneberg), a breve distanza dai seguenti luoghi di interesse: KaDeWe, Porta di Brandeburgo e Edificio del Reichstag. Nelle vicinanze potrai visitare anche: Chiesa commemorativa dell'Imperatore Guglielmo e Zoo di Berlino.\nCaratteristiche della struttura\nPer il tuo ristoro questo ostello a Berlino offre un bar/lounge. Nelle aree comuni è disponibile accesso wireless a Internet gratuito. In loco è inoltre presente una postazione PC. Il personale può offrir"}, {"id": "<urn:uuid:be089f4f-a3b9-42e4-9fba-4237a08f76cb>", "text": "Karlsplatz è un luogo di incontro importante, e rappresenta solo uno dei motivi che rendono invidiabile la posizione dell'Hotel Königshof.\nLa Karlsplatz è la piazza più grande di Monaco di Baviera e brulica sempre di abitanti e turisti. In estate,\ni bambini si tuffano nella grande fontana centrale; d'inverno, ci si può divertire con una pista di pattinaggio su ghiaccio. Il fatto che\nla piazza sia un luogo d'incontro centrale è solo uno dei motivi che rendono invidiabile la posizione dell'Hotel K"}, {"id": "<urn:uuid:19b17648-c047-4da1-9c08-fb81bdcf1017>", "text": "Questo sito web è dedicato ad un nuovo progetto volto alla creazione di un CMS (questo) estendibile, flessibile, adatto a qualunque utilizzo. Si cercherà di realizzare un CMS il più semplice possibile da utilizzare sia dal punto di vista dell'utente, sia da quello del web master, sia da quello dello sviluppatore che vorrà creare applicazioni web utilizzando questo software.\nUn altro obbiettivo fissato, è quello di dotare il CMS di un automatismo elevato, in grado di ottimizzare automaticamente l"}, {"id": "<urn:uuid:d943d6a9-bbf4-4f9c-810c-f0b8a7e8e0dd>", "text": "[imc-abruzzo] Aggiornata ftr \"regione e legge 30\"\nalfred\nsp1een a riseup.net\nMer 23 Nov 2005 15:58:37 PST\nho inserito l'iniziativa della manifestazione del 22 (anche se un pò in\nritardo :PP )\ne linkato negli aggiornamenti il post che riporta gli esiti della\nmanifestazione.\nhttp://italy.indymedia.org/features/abruzzo/#2474\navevo pensato di scrivere magari una due righe su quest'iniziativa, e\nmagari farlo anche alla ftr degli ex-lsu visto che l'iniziativa l'hanno\norganizzata insieme e c'è un comun"}, {"id": "<urn:uuid:17831323-bca1-4a55-894c-24e49d1471d9>", "text": "Parte oggi con la cronosquadre di Savigliano (CN) il Giro delle Valli Cuneesi nelle Alpi del Mare\nCon la Cronometro a squadre di 14 km di Savigliano parte oggi il Giro delle Valli Cuneesi nelle Alpi del Mare. Domani tappa collinare da Faule a La Morra d’Alba di 162 km, quindi tappa con arrivo in salita lunedi 30, la Fossano-Artesina di 123 km e gran finale martedi 30 con la Bene Vagienna-Terme di Vinadio di 151 km.\nQuattro tappe, tre sono in linea, con 24 squadre ognuna di 5 corridori, per un to"}, {"id": "<urn:uuid:bfa3a432-35f0-42ae-8488-710204e1ba83>", "text": "SET REMOTE_PROC_TRANSACTIONS (Transact-SQL)\nSpecifica che, quando una transazione locale è attiva, l'esecuzione di una stored procedure remota comporta l'avvio di una transazione distribuita Transact-SQL gestita da Microsoft Distributed Transaction Coordinator (MS DTC).\n|Importante|\nQuesta opzione è disponibile per compatibilità con le versioni precedenti per le applicazioni che utilizzano le stored procedure remote. Anziché pubblicare chiamate della stored procedure remota, utilizzare query dis"}, {"id": "<urn:uuid:de12bd3a-064a-4fd8-b9e4-546b53844af8>", "text": "Firefox 3.5Un veloce tour per passare in rassegna le maggiori novità introdotte da Mozilla nella nuova versione 3.5 del browser Firefox. Tra queste, presentate in video da Mike Beltzner, il nuovo supporto ai...\nUn applauso per Firefox 3.5Per il lancio di Firefox 3.5, Mozilla si avvale di alcuni recordman che dimostrino come la velocità sia l'arma del nuovo browser. E il primo video è nell'applauso più veloce che ci si possa immaginare\nRisparmiare RAM con FirefoxUn utile consiglio per ottimizzare"}, {"id": "<urn:uuid:65fde5fb-dc2b-492c-8ce4-4fb749341ba0>", "text": "In questo sito si espongono solo\nimmagini di opere ispirate all'astronomia di artisti che ne danno libero\nconsenso o di pubblico dominio. Per visualizzare le opere di cui non\npossiamo mostrare le immagini forniamo i titoli e i nomi degli autori\nper consentirne la ricerca nel web.\nLe opere presenti in questo sito\nsono state pubblicate solo a scopo divulgativo o di recensione.\nINVITIAMO I VISITATORI A SEGNALARCI\nALTRE\nOPERE\nISPIRATE ALL'ASTRONOMIA.\nLE SEGNALAZIONI\nPIÙ INTERESSANTI SARANNO\nPUBBLICA"}, {"id": "<urn:uuid:7d5dbe23-faf5-4f50-8ca0-305c1352ff1f>", "text": "Ricetta dei muffin integrali ovvero l’impasto base\nEcco la ricetta dei muffin integrali senza alcuna aggiunta, nè di frutta nè di verdura, praticamente questa è la ricetta per l’impasto di base per sfornare dei semplici e genuini dolci integrali. Queste merendine sono fragranti e morbide, perfette per accompagnare la pausa pomeridiana per fare una golosa merenda, magari con una calda e corroborante tisana o un profumato tè. Questa collaudata ricetta USA prevede l’utizzo di zucchero di canna inte"}, {"id": "<urn:uuid:fc32b4b0-baa5-495d-b907-99c3906c0f1b>", "text": "\n\nPunto di riferimento per chi ama la moda di tendenza come per chi preferisce lo stile della tradizione, CARRARO CASA offre una vasta scelta di soluzioni personali per vestire con classe qualsiasi ambiente.\nForte di una grande esperienza decennale nella progettazione d'interni, nella realizzazione di tende e nella produzione di materassi, ha selezionato per voi i migliori tessuti, tappezzerie, trapunte, letti tessili e tendaggi completi di installazione.\nPer interpretare i vostri sogni CARRARO "}, {"id": "<urn:uuid:5720a519-d823-4fd4-b666-bd717831645a>", "text": "Continuano i lavori in casa Canonical verso l’avvicinamento ad Ubuntu 12.10 Quantal Quetzal. Dopo l’arrivo delle Web Apps, dei nuovi templates per LibreOffice ed aver rimosso Unity 2D, ecco che il team ci regala una nuova chicca per la sempre più matura e completa Unity: stiamo parlando della possibilità di avere supporto alle anteprime! Cosa sono queste anteprime? In Ubuntu 12.04 e precedenti versioni, i risultati della Dash venivano aperti dal corrispondente programma abilitato: un file musica"}, {"id": "<urn:uuid:73f34125-0a7a-41f4-a298-dc251f36b222>", "text": "Aim Vicenza e gli studenti dell’istituto per geometri “Canova” insieme per realizzare tre nuove rotatorie in via Quadri. La convenzione è stata sottoscritta questa mattina dal presidente Roberto Fazioli da una parte e dal dirigente scolastico Domenico Caterino dall’altra nell’ufficio di piazza Biade del consigliere comunale delegato alla mobilità, Claudio Cicero.\n“L’asse di via Quadri è in forte sofferenza – ha spiegato Cicero - a causa di incroci regolati da semafori che, uno dietro l’altro, ra"}, {"id": "<urn:uuid:8668a4e1-815f-45f1-8734-318b755e1fb4>", "text": "Il Presidente del Consiglio regionale della Valle d'Aosta è Emily Rini.\nNata ad Aosta il 15 agosto 1982, è residente a Villeneuve. Si è laureata in giurisprudenza presso l'Università del Piemonte orientale. Attualmente è praticante abilitato iscritta all'Albo degli Avvocati di Torino e collabora con uno studio associato a Ivrea e a Torino in ambito di diritto penale. E' coagente di assicurazione nell'impresa di famiglia. Si presenta per la prima volta alle elezioni regionali del 25 maggio 2008 n"}, {"id": "<urn:uuid:470817c7-dd1e-4524-803e-09a2593817f6>", "text": "I resti dell'antica cattedrale di Firenze sono ancor oggi visitabili sotto il Duomo di Santa Maria del Fiore.\nIl nome di Santa Reparata fu mantenuto fino ai primi anni del Quattrocento quando i lavori di ristrutturazione la seppellirono completamente per lasciar posto alla nuova imponente costruzione.\nLa presenza di questi resti ci permette tuttavia il privilegio di approfondire gli studi storico topografici della città. Inoltre gli scavi di recupero dell'antico edificio, iniziati nel 1965, hann"}, {"id": "<urn:uuid:f7a0a9af-9e0c-4ea0-82d3-c44bdcd330fb>", "text": "Il blog “InTime, condivido per comunicare” è un sito che si occupa di social media e web marketing, ma anche di consulenza per tutto ciò che riguarda il web.\nIl blog è nato nel novembre del 2008 e nel corso di questi mesi è cresciuto molto, andando ben oltre le mie aspettative. La passione per il web, web 2.0, mi ha spinto ad iniziare questa avventura, cercando di esplorare come oggi la comunicazione si rapporta con la rete. E come la rete ha cambiato modo di fare comunicazione e business. Argom"}], "1": [{"id": "<urn:uuid:e03bf59e-38e1-49e4-b2d0-1e2e5c691c26>", "text": "Emanuela\nPiedi nudi nella sabbia dei pioppeti, nelle stoppie, nei mucchi di granoturco, per sentirsi parte del mondo. Una laurea in architettura, usata per progettare libri. Un’esperienza al Vivaio, un centro di psicologia per l’età evolutiva, usata per ascoltare. Una passione per il disegno, usata per raccontare. Tanti libri per bambini per imparare e imparare e imparare a non perdere lo sguardo bambino."}, {"id": "<urn:uuid:f10832a3-4e1b-4474-88a6-a040f893280c>", "text": "Le gelide giornate invernali non hanno tolto brio al giovane ed euforico gruppo dei “Beli Nui”, nuovamente pronto a tornare sulla scena per entusiasmare grandi e piccini con il Carnevale Invernale.\nL’evento avrà inizio l’8 Marzo con la sflilata pomeridiana per poi ritrovarci per la cena e il ballo in maschera nella tensostruttura allestita per l’occasione in Piazza San Filippo a Dolceacqua.\nSi proseguirà venerdì 11 Marzo con l’Happy Hour seguito dalla “Spaghettata Belottata”.\nIl gran finale sarà"}, {"id": "<urn:uuid:5bb296b4-7f09-4d99-be0c-20080217d121>", "text": "Tutte le partite della lega di sviluppo del basket americano (NBA Development League) si possono vedere in diretta streaming gratuita sul PC e su dispositivi mobile grazie ad un accordo con Youtube. Il portale di videosharing più famoso al mondo infatti trasmetterà Live 350 partite delle 16 squadre iscritte al campionato D-League 2012/2013 playoffs inclusi da Novembre 2012 ad Aprile 2013.\nLa D-League è stata fondatata nel 2001, sotto il nome di NBDL per volontà della NBA, nata con l’intento di d"}, {"id": "<urn:uuid:9ab40556-2781-4c21-b400-4b35f58ca854>", "text": "Lomè\nLa Ragione\nL'eubage\nCredo che dobbiamo iniziare ad abituarci a dischi sempre più contaminati da singoli punti di riferimento.\nOgni traccia con un suono e un’intenzione differente, una sorta di ‘concept compilation’, più che album, dove la musica si muove a seconda dell’istinto dei propri autori che diventano sempre più onnivori in fatto di stili e meno indottrinati al momento della scrittura.\nLa bellezza di questa fantasia può diventare un’arma a doppio taglio, potrebbe essere anche un alib"}, {"id": "<urn:uuid:1d3a5df4-54ec-40cf-a311-16370dbbb34a>", "text": "Meglio!Si potrei rimpicciolirle\nUn consiglio: le immagini chi sono, forum è possibile farle un po' più piccole?\nPerò vorrei che la slide fosse centrata nel template, ma non riesco proprio a centrarla\npuoi scegliere la dimensione in Px del modulo fra le impost.\nAnche se quel template lo vedo 1 po largo...\nCioè, visto che scrivi su 2 colonne, e il numero di caratteri e/o cmq la dimensione delle immagini è varia, da 1 senso di disordine...\nPotresti scegliere di visualizzare su 1 colonna e stringere"}, {"id": "<urn:uuid:ba407bb8-8b65-408e-9b8b-86454677408a>", "text": "Grazie capo! Non vedo l'ora di vedere i nuovi Mario Kart e Smash Bros per riaprirti le chiappette!\nGatsu mi serve ancora il tuo aiuto\nQuesti volumoni : http://www.amazon.it/Distruzione-The...ds=the+sandman racchiudono le storie trattate nei 21 numeri della planeta ?\nL'altro giorno in libreria ho beccato Cages di Dave McKean, l'ho preso al volo ma lo devo ancora leggere, tu li hai dato uno sguardo ?\nThanks.\nQuello di Amano mi ispira di brutto, spero di trovarlo a buon prezzo\nMi perdoni se te lo c"}, {"id": "<urn:uuid:0a5098ab-eadf-4790-aee1-ae4b158719ae>", "text": "Glen Grant, il whisky scozzese dal carattere inconfondibile, sarà a fianco dei rugbisti del Benetton Rugby Treviso per tutta la prossima stagione. Glen Grant ha scelto di legarsi ad una squadra storica, che affonda le sue radici nella gloriosa e antica tradizione del rugby a Treviso. La squadra dei biancoverdi è tra le protagoniste del RaboDirect PRO12, il campionato che coinvolge squadre d’élite scozzesi, irlandesi e gallesi. Il Benetton Rugby Treviso rappresenta inoltre l’Italia in Heineken Cu"}, {"id": "<urn:uuid:94f2ef30-17dd-403e-bb4f-9fbb8e33f3eb>", "text": "articoli\nLa Stampa n. 02.01.2011\nLe frottole di inizio gennaioEccone un altro. Di anno. Primo gennaio, giorno di propositi, di promesse, di buone intenzioni, di parole date e, soprattutto, di speranza. Aspettative grandi e piccolissime. Sogni. Nel corso del tempo ho visto cambiare segni e significati che qualcuno mi aveva insegnato, che avevo imparato e che la vita mi aveva confermato come certi e immutabili.\nI fatti, i gesti, gli sguardi non sono più gli stessi. Le parole non compongono afferma"}, {"id": "<urn:uuid:4b853cf7-af22-49b4-b319-c467b2280e74>", "text": "Corsi di Musica\n- Bachelor of Art\n- Come scrivere una canzone\n- Concerti Allievi\n- Coro Gospel\n- Corsi Certificati\n- Corsi di Musica Collettivi\n- Corsi di musica moderna\n- Corsi per Strumenti ad arco\n- Corso di Basso\n- Corso di Batteria\n- Corso di Canto Moderno\n- Corso di Chitarra\n- Corso di Chitarra Acustica Fingerstyle\n- Corso di Pianoforte e Tastiere\n- Corso di Viola\n- Corso di Violino\n- corso di violoncello\n- Eventi\n- La musica…in tutte le salse\n- MARoma iscrizioni 2013/2014\n- Musica Classic"}, {"id": "<urn:uuid:8796b163-4679-4253-8897-7b952736eae8>", "text": "mercoledì 11 aprile 2012\nE' una sorta di \"pellegrinaggio\" in tutti gli stati mediorientali asserviti agli interessi imperialisti quello compiuto in questi giorni dall'Ex-vicepresidente irakeno Tarik al-Hashemi, inseguito da mandati di cattura emessi dal tribunale di Bagdad per il suo ruolo di organizzatore di attentati e omicidi, la cui realizzazione veniva affidata al dettaglio delle sue guardie del corpo, ricompensate con tremila dollari \"a colpo\" e minacciate negli affetti familiari laddove n"}, {"id": "<urn:uuid:ff5c50c1-7f17-4bd5-87a6-8f1db65e1f33>", "text": "Free Online Dictionary\nvena cava superiore\n|Wikipedia Italiano L'enciclopedia libera||Download this dictionary|\nVena cava superiore\nLa vena cava superiore è una delle più grandi e importanti vene dell'organismo: la sua funzione consiste infatti nel trasportare il sangue privo di ossigeno dai tessuti che si trovano al di sopra del cuore fino all'atrio destro di quest'ultimo, per fare in modo che esso sia riossigenato tramite il meccanismo della piccola circolazione. Tra le sostanze che si trovano"}, {"id": "<urn:uuid:9803ff68-d341-47df-82e5-b9066e9f68e9>", "text": "Kursaal , Merano\nPrevendita biglietti presso tutte le librerie Athesia, Baba's (Bolzano), Non Stop Music (Merano) e online su athesiaticket.it.\nNonostante i nostri sforzi nel verificare i dati qui indicati, non possiamo assumerci alcuna responsabilità in riguardo alla correttezza di quanto riportato e all'effettivo svolgersi della manifestazione. Per sicurezza vi invitiamo a contattare l'organizzatore."}, {"id": "<urn:uuid:e55d73e9-453a-4eff-8fc4-804eac0a1c74>", "text": "Lungo i portici di corso Fogazzaro domenica 9 ottobre, dalle 9.30 alle 19, va in scena la ventitreesima edizione di “Antichi Mestieri in Corso”, mostra mercato dedicata all’artigianato artistico e naturale ed all’enogastronomia tipica. Domenica 9 ottobre sarà, quindi, una giornata dedicata al mondo della manualità, dell’arte e anche dei sapori.\nI circa cinquanta banchi multicolori ed eterogenei di “Antichi mestieri in Corso” si snoderanno dalla chiesa di San Lorenzo fino ai Carmini.\nTra gli arti"}, {"id": "<urn:uuid:63d1f2f9-d0b6-47bc-94ba-3407cb8fb938>", "text": "Ciao, è la tua prima visita? sai che su CoPlaNet.it c'è una ricca comunità pronta ad aiutarti? Sai che è il sito di riferimento numero 1 in Italia per quel che riguarda Liste Trofei e Obiettivi? Sai che partecipando attivamente alla community potrai ottenere tante medaglie e partecipare a tantissime inziative come le lotterie periodiche e vincere fantastici premi? Che stai aspettando, REGISTRATI SUBITO e presentati, avrai diritto ai tuoi primi punti rep e alla tua prima Medaglia. Ti aspettiamo!!"}, {"id": "<urn:uuid:bcce4b2f-6501-4a36-b699-e5bd72655c94>", "text": "Pensavano di avere avuto un’idea geniale Stefano Mendicino e Michele Mastroianni, due giovani sviluppatori che avevano creato e pubblicato sull’iTunes Store un’applicazione che estrapolava circa 150 frasi celebri dai romanzi di Fabio Volo. Il successo era arrivato in fretta: i due avevano già venduto 600 copie con un guadagno di più o meno 300 euro, grazie alla passione tutta italiana per aforismi, massime e tutto quello che c’è di simile.\nIdea che però non è piaciuta a Mondadori, editore dei li"}, {"id": "<urn:uuid:d3bf44a2-e51b-4038-9e95-6a5ba7d5f179>", "text": "La lavorazione di Breaking Dawn è giunta alle battute finali. Robert Pattinson e Kristen Stewart sono atterrati a Vancouver per realizzare le ultime riprese del film sul set allestito presso i North Shore Studios.\nDopo mesi di lavorazione, sembra proprio che i RobSten siano in procinto di abbandonare definitivamente i panni di Edward e Bella.\nIl sito HollywoodLife ha diffuso le immagini dell’ultima location scelta per l’ultimo capitolo di Twilight, dove verrano girate le ultime scene relative ag"}, {"id": "<urn:uuid:991c2632-b57d-4933-8733-2207a06be299>", "text": "Le telecamere di Explora Science Now!entrano nell’istituto comprensivo “Galileo Galilei” di Montopoli in Val d'Arno, in provincia di Pisa. Con i ragazzi della classe quarta parleremo di proporzioni e lo faremo utilizzando delle semplici fotografie.\nNato nel 1989 come sezione aggiunta al cartellone del Festival dei Due Mondi, Spoletoscienza in breve tempo ne è diventato appuntamento irrinunciabile, capace di attrarre nuovo pubblico e indovinarne la richiesta di conoscenza. Scienziati, filosofi, a"}, {"id": "<urn:uuid:a548d804-8369-45aa-a14a-83863843a006>", "text": "Gioca gratis al gioco I need air. Sul nostro sito sono presenti inoltre tantissimi altri Giochi per Tutti, continuamente aggiornati e descritti in italiano. Giochigratis24.it è il primo sito di giochi gratis in Italia dove ogni ora vengono offerti nuovi e bellissimi giochi; Solo qui si gioca gratis, 24 ore su 24...Buon divertimento!\nSalvate i malcapitati che sono stati incatenati a delle lastre di cemento e gettati in fondo al mare! Sparando con il vostro sottomarino, cercate di spezzare le cate"}, {"id": "<urn:uuid:b0e4e917-5f01-4729-8529-0483677a5077>", "text": "Created Equal è un bellissimo progetto fotografico di Mark Laita, che affianca foto estremamente simili di soggetti estremamente diversi, facendo risaltare la superficialità di ciò che ci distingue. Commenta sul suo sito:\nIn America, il divario tra i ricchi e i poveri è in crescita, il conflitto tra liberali e conservatori si sta radicalizzando, e anche il bene e il male sembrano più lontani di quanto siano stati mai. Al centro di questa galleria di dittici c’è il mio desiderio di ricordare che "}, {"id": "<urn:uuid:74c2760e-3f2d-4b69-aea3-8584deb496d0>", "text": "La settimana scorsa l’Alto rappresentante per gli Affari esteri dell’Unione Europea, Catherine Ashton, ha incontrato il nuovo presidente serbo Tomislav Nikolić in uno dei tanti vertici degli ultimi anni tra Europa e Serbia affinché quest’ultima possa entrare presto nell’UE. Come mostra un video che sta circolando molto online, a pochi minuti dall’incontro Ashton ha spiegato di non saper riconoscere Nikolić e ha chiesto al diplomatico Robert Cooper di accompagnarla per indicarglielo. Secondo l’In"}], "2": [{"id": "<urn:uuid:0b06038d-553a-4731-b131-fec59b88b4cc>", "text": "Per iniziare, puoi seguire i tuoi amici di Facebook o Twitter che sono già membri di Chicisimo.\nPerché devo diventare membro utilizzando il mio account Facebook? Per saperne di più...\nChiedendo a tutti di connettersi tramite un account Facebook o Twitter aiuta ad evitare il caricamento di immagini inappropriate e di commenti offensivi, così da creare un ambiente e un'atmosfera più positiva... almeno proviamo a far sì che questo accada.\nPuoi decidere quali informazioni condividere sul tuo profilo"}, {"id": "<urn:uuid:5445de59-3663-4671-a9cc-bbfde262b156>", "text": "Komsomol\n|Komsomol|\n|(RU) Комсомо́л|\n|Stato||URSS|\n|Fondazione||29 ottobre 1918|\n|Dissoluzione||1991|\n|Partito||Partito Comunista dell'Unione Sovietica|\n|Affiliazione internazionale||Federazione Mondiale della Gioventù Democratica (1945-1991)|\nIl termine Komsomol, in russo: Комсомол[?], è la contrazione di Kommunističeskij Sojuz Molodëži (in cirillico: Коммунистический Союз Молодёжи) ovvero l'Unione comunista della gioventù, organizzazione giovanile del Partito Comunista dell'Unione Sovietica.\nF"}, {"id": "<urn:uuid:adf87f97-3158-4933-9067-b5cb9cc2850b>", "text": "Pillola, come funziona? Non lo sa il 98% delle donne\nLa pillola è molto usata, ma le donne (nel 98 percento dei casi) non sanno come realmente funzioni. Serve per evitare gravidanze indesiderate: questo è chiaro. Ma come fa a bloccare quest’eventualità? È un mistero per quasi la totalità delle consumatrici. Lo ha verificato una ricerca condotta in Germania, Francia, Gran Bretagna, Svezia e Romania, e pubblicata sulla rivista Contraception. Ricordiamo che la pillola, l’anno scorso, ha compiuto 50"}, {"id": "<urn:uuid:00c3278c-ecef-447d-8e03-0186f4057311>", "text": "Premessa\nIn questo articolo approfondiamo alcuni degli argomenti trattati nel precedente articolo sull’omicidio massonico e chiariamo alcuni dubbi che l’articolo aveva suscitato specialmente in merito al caso Pantani.\nIn primo luogo l’articolo precedente terminava con una domanda. Mi chiedevo cioè il motivo dell’immenso numero di persone “suicidate” (come si dice in gergo) mediante impiccagione, e facendo toccare alla maggioranza di essere le ginocchia per terra.\nVoglio poi rispondere alle molte"}, {"id": "<urn:uuid:01ea2d5a-a003-4310-ae15-ba7a5b78f33a>", "text": "Elisabetta I Tudor, figlia di Enrico\nVIII e della seconda moglie Anna Bolena, regina d’Inghilterra e d’Irlanda\nnacque a Londra nel 1533 e morì nel 1603; il suo regno durò dal 1558 al 1603.\nFu l'ultima regnante della dinastia Tudor.\nRitratto di Elisabetta I, 1585 (attribuito a William Segar)\nLa gorgiera e gli alti polsini sono realizzati in reticello e il bordo a lunghe punte è in punto in aria.\nIl pittore ha realizzato questi merletti con il pennello ma sembrano realizzati con l’ago\nElisabetta I"}, {"id": "<urn:uuid:137975f6-1dd6-42f7-8479-ce352cb72947>", "text": "Al museo del Bigallo, a due passi dal Duomo di Firenze, hanno appena montato un campanello per gli invalidi. Staffa nera, contrassegno con seggiola a rotelle, giusto all’altezza di chi è costretto a trascorrere la vita seduto. Manuela Cappellini, presidentessa dell’Associazione Toscana Paraplegici Onlus, ha appena premuto il pulsante blu. Non c’è pedana, ne un elevatore, Manuela aspetta fuori che qualcuna la faccia entrare. Dietro di sé, tiene i manici della sua carrozzina Samira, per tutti Sami"}, {"id": "<urn:uuid:2d96fe4c-9c36-470f-83db-67577e8d7e99>", "text": "\n\nIl Friuli Venezia-Giulia, la regione più settentrionale d’Italia, si trova a ridosso dell’Austria a nord, e della Slovenia a est. La parte settentrionale del Friuli è occupata dalle montagne mentre la parte meridionale da una fascia di colline che scendono fino alla pianura percorsa dal fiume Tagliamento. Questa pianura termina sul mare con una costa bassa e sabbiosa, nella quale spiccano le lagune di Marano e di Grado.\nIl clima del Friuli è tipicamente alpino sulle montagne, mentre nella zona"}, {"id": "<urn:uuid:fe21978c-b693-49df-8aae-522a648541d7>", "text": "Pensare oggi alla salute di domani\nL'Osservatorio Nazionale sulla salute della Donna studia le principali patologie che colpiscono l'universo femminile e propone strategie di prevenzione primarie e secondarie, promuovendo una cultura della salute di genere. O.N.Da sostiene ricerche di base e cliniche sulle principali patologie, ne valuta l'impatto sociale ed economico e informa le Istituzioni, i medici e il pubblico."}, {"id": "<urn:uuid:73c971c9-094c-4328-bfdf-2881b4a49a3f>", "text": "Dai un'occhiata ai link qui di seguito per punti di riferimento nel Ciberspazio:\nScientology\nDai un'occhiata a questo vasto sito per avere risposte a domande sulla religione che si sta espandendo più rapidamente di qualsiasi altra: Scientology.\nUlteriori siti sulla religione di Scientology\nL. Ron Hubbard\nAnche se maggiormente conosciuto per Dianetics e Scientology, le opere di L. Ron Hubbard comprendono molti campi differenti - su questo sito puoi trovare informazioni dettagliate sui numerosi as"}, {"id": "<urn:uuid:10da3af0-d031-4ae7-b580-e5494764147e>", "text": "PALERMO, 26 LUG – “Lo chiamavano l’ispettore anti estorsioni. Giovanni Lizzio, responsabile della sezione anti estorsione della Questura di Catania, venne ucciso il 27 luglio del 1992 proprio nella città in cui si stava occupando di inchieste molto delicate e delle confessioni di un collaboratore di giustizia. Un uomo simbolo della lotta contro lo strapotere e l’arroganza della mafia, un poliziotto conosciuto, una memoria storica della città di Catania”.\nA 20 anni dall’omicidio dell’ispettore ca"}, {"id": "<urn:uuid:f062a298-a8a7-47cb-b4db-d4e65705adc1>", "text": "I gravi fatti di cronaca di via Mantegna a Reggio impongono la presa di coscienza e la riflessione sollecitate dal vicequestore Cesare Capocasa. Anche la nostra provincia, come il resto del paese e in particolare il Nord Italia, è costretta a fare i conti con un nuovo tipo di criminalità. Una criminalità che non si dedica a reati di particolare spessore, ma per lo più a furti e rapine. E che tuttavia è propensa ad un uso della violenza sproporzionato e spesso del tutto immotivato.\nDi fronte a qu"}, {"id": "<urn:uuid:ed38453b-24c5-4755-b9dc-62097e28ea86>", "text": "Login\nNome di utente\nPassword\nRicerca rapida\nID\nNome\nGenere:\nL’eta:\nBollettino di Ultime aggiunte\nGenere dei Profili:\nTestimonials\nGrazie all`agenzia \"TopBellaDonna\" ho incontrato la mia moglie attuale. Non potevo neanche immaginarlo prima, perché era molto strano per me, com`è possibile innamorarsi di una persona di un`altro\nUN GIORNO STAVO OSSERVANDO SOLO UNA FOTOGRAFIA E MI IDENTIFICAVO SPIRITUALMENTE CON QUESTA DONNA E IN EFFETTI HO SAPUTO CHE ELLA È ESISTITA. GRAZIE A QUEST'AGENZIA CHE EBBI"}, {"id": "<urn:uuid:441c319e-7d52-4d62-8550-c5b974fea007>", "text": "Notizie - ottobre 2011\nLe \"buone pratiche\" in Trentino\nAperta un'inchiesta. Iscrizione nel registro degli indagati di Luciano Dalpiaz, genero della vittima e padre delle tre sorelle\nScontri fra cristiani copti ed esercito: il commento del comboniano padre Esti\nLa Corte d'Appello deciderà sul ricorso presentato dall'ex assessore condannato per corruzione impropria\nVasta operazione di Polizia e Carabinieri negli ambienti dell'estremismo radicale\nIl premier a Bruxelles presenta le misure anticrisi."}, {"id": "<urn:uuid:501f0e2c-b15c-4b9f-98b9-4937d4b88215>", "text": "Trattamento della disregolazione\nemotiva nei DCA\nDa oltre 15 anni Villa dei Pini di Firenze si occupa della Terapia Residenziale e\nSemiresidenziale dei Disturbi del Comportamento Alimentare.\nParticolare attenzione Ŕ sempre stata prestata ai DCA in comorbiditÓ con altre patologie\npsichiatriche, soprattutto inerenti i disturbi del controllo degli impulsi tanto da affiancare\nun programma specifico integrativo per i pazienti Borderline (o comunque con disturbi di\npersonalitÓ\ndi cluster B) che si ass"}, {"id": "<urn:uuid:4a90a289-7b84-4999-bc4a-bc2d5d694958>", "text": "Profughi d'Istria\nDoc\n\n\nQuella mattina a Montona passava la commissione alleata che doveva stabilire (ma doveva solo ratificare secondo gli accordi decisioni già prese) che a Montona non vivevano più italiani. La maestra, altra testa calda, aveva distribuito dei gessetti colorati ai bambini delle elementari e fatto disegnare sul palmo della mano la\nbandiera tricolore\nA pugni chiusi, per non farsi scoprire da qualche slavo (pena l’infoibamento), i bambini uscirono dalle classi in strada e al pass"}, {"id": "<urn:uuid:3db4f097-4ccf-4cc5-a615-3a3111a49026>", "text": "L’ Integral Fast Reactor (IFR, in origine Advanced Liquid-Metal Reactor) è un tipo di reattore nucleare autofertilizzante. Questi reattori sono progettati per estrarre quasi tutta l’energia dell’Uranio e del Torio, diminuendo le necessità di carburante di quasi 100 volte. In pratica con la tecnologia IFR da sola sarebbe possibile mantener il consumo mondiale attuale di energia per un miliardo di anni.\nIl Department of Energy degli USA aveva un progetto IFR fino al 1993, quando venne cancellato. "}, {"id": "<urn:uuid:2719cbc1-8c4f-4ce1-8613-51e0ffc494db>", "text": "Paolo Busi, Fiasco!, e il Teatro dell'Improvvisazione\nNegli ultimi anni si è parlato spesso di improvvisazione teatrale, tramite radio, tv, internet e passaparola tra amici.\nFare improvvisazione teatrale vuole dire andare in scena senza testo scritto, creando lo spettacolo direttamente davanti al pubblico. L'attore che improvvisa non sa cosa farà, ma saprà cosa fare una volta che lo spettacolo è iniziato.\nL’Associazione Culturale Janus ha avuto il piacere di intervistare Paolo Busi, attore del t"}, {"id": "<urn:uuid:ecde08b3-84b0-4797-bd7b-97937245b392>", "text": "21 set\n“[...] Cosa induce l’ottimo Cacciari a garantire che l’Italia non sarà trascinata a combattere per il solito vincitore, che poi, strada facendo diventa lo sconfitto?\nPerché insistere a chiederci se si tratta o no di fascismo? Quello prodotto da trent’anni di bombardamento televisivo è probabilmente peggio del fascismo storico, perché non si fonda sulla repressione del dissenso, non si fonda sull’obbligo del silenzio, ma tutto al contrario, si fonda sulla proliferazione della chiacchiera, "}, {"id": "<urn:uuid:51f4b642-e277-461d-bd57-74c8822372b6>", "text": "05/09/2009\nAntonio Di Pietro: “No ai condannati in Parlamento ed alleanza sulla condivisione di tutto il programma”\nMercato San Severino, in provincia di Salerno, ieri è stata omaggiata dalla visita contemporanea del leader nazionale Italia dei Valori Antonio Di Pietro e dell’europarlamentare, più votato alle scorse elezioni, Luigi De Magistris. La serata, a cui hanno preso parte, fra gli altri, il segretario provinciale IDV Nello Formisano, il consigliere provinciale IDV Carlo Guadagno, il segr"}, {"id": "<urn:uuid:82baca94-b688-4562-93aa-90e896bf917f>", "text": "... salafita ispirato ad Al Qaeda: volevano tenere un congresso nella loro roccaforte, Kairouan, nell'interno del paese. A portare la tensione alle stelle aveva pensato Amina Tyler, che già aveva suscitato la...GIAMPAOLO CADALANU\n... islamico retto sulla sharia; teorizza la legittimità di combatterlo con ogni mezzo. La sua corrente jihadista, guidata dal reduce \"afgano\" Abu Ayad, si richiama a Al Qaeda. Il partito di Gannouschi si...RENZO GUOLO\n... quale hanno partecipato sindacati, società civi"}], "3": [{"id": "<urn:uuid:9da5fa5c-338d-4596-a757-776bed5b7bc1>", "text": "come da oggetto sto sviluppando un progetto in java che sfrutta il formato json per i file di configurazione.\nCol senno di poi avrei fatto tutto in xml, ma java e xml sono un'accoppiata relativamente e inutilmente complicata\nAd ogni modo, il problema che ho con questo formato è che essendo nato prevalentemente per lo scambio di dati non contempla l'utilizzo di parti commentate. Questo un po' mi limita nel contesto in cui lo utilizzo perchè mi sarebbe utile avere dei file di configurazione con po"}, {"id": "<urn:uuid:6908f539-b49f-451c-9861-705c681df5f3>", "text": "Il sito di WordPress appare strano da qualche ora, forse ha subito l’attacco di hacker. Probabilmente quando vedrete questo post, la mattina del 14 ottobre, sarà tutto a posto, ma per diverse ore, a partire da ieri sera, il sito www.wordpress.org appariva diverso dal solito.\nIl sito ufficiale di Wordpress, visitatissimo da chi è alla ricerca di plugin e template WordPress gratuiti e affidabili, consigliati dalla comunità mondiale degli sviluppatori del cms per blog più famoso al mondo, è stato h"}, {"id": "<urn:uuid:ed4497c1-245e-458a-815f-c9bddd358476>", "text": "\n\nProve tecniche di campionato per il Città di Messina che a Camigliatello affronta il Montalto, formazione di serie D.\nIl Città di Messina supera 2-1 i calabresi guidati da Paschetta al termine di un confronto piacevole ed equilibrato. Le reti tutte nel primo tempo: Citro porta in vantaggio i suoi, pareggia Sifonetti, Assenzio appone il suo sigillo. Nella ripresa un rigore sbagliato per parte da Sifonetti e Buda. Le due formazioni si ritroveranno di fronte nel torneo di D.\nLa prima occasione la"}, {"id": "<urn:uuid:20e71951-4149-4a07-9458-9bfcfc20da4f>", "text": "STOCCOLMA – In Svezia, Viggo Hansen, consigliere della Contea di Sormland, ha varato una mozione che mira a suddividere le “tazze” dei servizi igienici della sede del consiglio provinciale, indicando con un’apposita targhetta quelle destinate esclusivamente agli uomini che vogliono orinare in piedi. Le ragioni di questa scelta sono di tipo igienico e salutistico: obbligare gli [...]\nArchivio | per luiRSS feed per questa sezione\nROMA- Benchè qualcuno continui a sostenere che sia un luogo comune p"}, {"id": "<urn:uuid:c695b283-905d-4554-85fa-8954f61f3412>", "text": "Lucy Bullivant - Gli edifici pubblici che hai recentemente terminato, due biblioteche Idea Store situate a Londra nelle zone di Whitechapel\n(2001-5) e Poplar (2001-4), reinventano la tradizionale istituzione, conferendole la forma di spazi vivibili e accessibili, offrendo un’idea ibrida di luogo educativo, informale e intimamente associato al contesto locale. Riesci a dar vita ad un linguaggio architettonico capace di creare un’atmosfera dove prima non esisteva. Come hai affrontato questi due co"}, {"id": "<urn:uuid:73b49639-f8c2-4e5e-b827-62d8dd009bc3>", "text": "Gentile signora Benedetta Parodi,\nè a lei che mi rivolgo, giacché è solo lei che ci mette la faccia...\nNon avevo mai visto il suo gradevolissimo spazio di cucina all'interno di Studio Aperto fino a ieri, quando mi hanno avvertita che proprio ieri, con grazia e leggiadria, aveva preparato in TV una ricetta \"presa\" dal mio blog e precisamente La Panna Cotta al cioccolato di Paolina!\nSì, sì, \"presa\", e lo sottolineo, perché, a quanto mi risulta, la ricetta non le è MAI stata inviata dalla autrice, "}, {"id": "<urn:uuid:8535553c-98ed-4bdf-9814-577aba582bc8>", "text": "\n\nSICUREZZA >> TUTTI I MODELLI\nOzone crede nella stessa filosofia di sicurezza degli standard IKO per gli sganci di sicurezza con il sistema a 3 stadii.\n- 1°Sicura primaria (Lasciare la barra)\n- 2° Sganciare il Chicken loop per sbandierare il kite senza potenza (Il nuovo CL Ozone Megatron in fusione.\n- 3° Sganciare il leash di sicurezza se ancora in pericolo (Il leash è collegato alla linea di sbandieramento)\nSafety Video\nIl primo stadio per la sicurezza su tutti I kite Instinct quando ci si tro"}, {"id": "<urn:uuid:f0704b6a-6a00-48f9-9f7a-74132c0da3a9>", "text": "Guida | Samsung Bada 2.0 Per Wave S8500: disponibile il primo firmware ufficioso S8500XPKG5!\nDi iNicc0lo il 20 luglio 2011\nFinalmente ci siamo. Come anticipato nel corso del pomeriggio, è arrivato il primo firmware ufficioso Bada 2.0 per Samsung Wave S8500. Si tratta dell’aggiornamento S8500XPKG5 che vi abbiamo anticipato nel precedente articolo. Ancora molti i problemi software e difficilmente potrà essere utilizzato quotidianamente. Di seguito comunque trovate guida per aggiornare e immagini d"}, {"id": "<urn:uuid:0c598e59-9682-465a-9728-134d725aec81>", "text": "Il primo avvio del sistema a piena potenza è ciò che gli ingegneri elettronici chiamano la «prova del fumo».\nNon ci si deve preoccupare se il sistema non si avvia correttamente. Infatti, se l'installazione si è conclusa con successo, ci sono ottime probabilità che ciò che blocca l'avvio del sistema con Debian sia solo un piccolo problema. In molti casi questi problemi possono essere risolti senza ripetere l'installazione; un modo per trovare una soluzione ai problemi di avvio è usare la modalità"}, {"id": "<urn:uuid:20e297cd-da50-4ba7-9393-59c64f896c96>", "text": "• Glamour\nIl cactus è il migliore amico delle donne. Perché? Perché è lo specchio della vita sentimentale. Se lo affoghiamo di cure, lui marcisce. Se siamo troppo indifferenti e ci dimentichiamo di innaffiarlo, rinsecchisce. E il problema è che ce ne accorgiamo sempre troppo tardi, proprio come con gli uomini bonsai (vanno piantati per farli crescere!). I cactus sono la filosofia di vita delle protagoniste, le amiche del GAA (gruppo di auto aiuto). Ester, precaria al call center e con una vita s"}, {"id": "<urn:uuid:e8ff534d-6308-4aaa-83dd-259f7ff7452a>", "text": "Processo a Stampa pei Furti di S. Agata\nVol. II.--Ostensori / Parte I.--Interrogatori\nInterrogatorio di Consoli Giuseppe\nD. R. Ho mostrato il desiderio di essere inteso della S. V. nuovamente per poterle rassegnare in mia discolpa quanto appresso: Francesco Nicotra nel dire che io avessi preso parte al furto degli ostensori in sua compagnia mi calunnia, e la ragione per cui egli mi vuol calunniare sta, secondo io penso, in questo fatto:\n(Fog. 437, vol. 1.--13 maggio 1891).\nNelle ultime elezioni "}, {"id": "<urn:uuid:97c20a48-499a-4a4d-a9c3-0cbc4d780b03>", "text": "La detective Sarah Linden, nel suo ultimo giorno di lavoro alla omicidi di Seattle, si ritrova per le mani il caso dell'uccisione della giovane Rosie Larsen. Le indagini porteranno a galla molti segreti e investiranno la famiglia della vittima per allacciare poi gli ambienti politici della città. Remake di Forbrydelsen, serie thriller danese del 2007."}, {"id": "<urn:uuid:fe7d3df0-4523-4260-9a84-20d26c442b50>", "text": "14.01.2013\nElezioni, la valanga dei 215 simboli\nTranne il Pd e Giannino, nessuno rinuncia a indicare il nome del leader. Il paciugo Pdl-Lega sul \"Berlusconi presidente\". I simboli negli schieramenti principali\n(Ansa)\nUn popolo di santi, poeti, navigatori e ideatori di liste elettorali. Sono 215 i simboli consegnati per le prossime elezioni di febbraio. Alcuni clonati, molti assurdi: dal Movimento bunga bunga a Forza evasori, da Aqua (senza la c) bene comune a Forza Roma, non ci facciamo davvero "}, {"id": "<urn:uuid:b6efd5f0-a0de-4c77-a421-bd5147831762>", "text": "Questo articolo è un aggiornamento dell’originale “Jetpack: modificare il comportamento dello sharing su Twitter e Buffer” disponibile all’indirizzo gioxx.org/2012/01/24/jetpack-twitter-buffer. Nel caso in cui ve lo foste perso vi consiglio di dargli un’occhiata!\nAutomattic ha rilasciato un aggiornamento per Jetpack (arrivato alla versione 1.6.1) che introduce un restyling dei pulsanti per la condivisione dei contenuti sui principali social network.\nQuesto aggiornamento sembra però andare ad ini"}, {"id": "<urn:uuid:fec64eca-22bc-4b13-a1a2-22f10f0f5306>", "text": "sperava di poter dare un'immagine di normalità e tranquillità del paese nordafricano chiamato alle urne per la prima volta nella sua Storia. Il Segretario della Commissione elettorale Nuri al-Abbar ha cercato di dare una lettura normalizzatrice e rassicurante ammettendo solo che \"alcune stazioni di voto non hanno potuto dare il via alle operazioni non essendo state raggiunte per tempo dai materiali necessari, per motivi di sicurezza\". Ma le sue parole, attentamente analizzate, dimostrano che il "}, {"id": "<urn:uuid:dc924d87-42a8-4a83-88cb-fed6b78e7cd6>", "text": "venerdì 24 maggio 2013\nSuvvia, siamo positivi!\nAbbiamo indicato, in passato, pro e contro dell'aprire una fumetteria.\nSoprattutto i contro.\nMa, vogliamo parlare anche dei magnifici vantaggi, dei bonus, dei benefits, che questo incredibile e divertente lavoro ti offre?\n1-Puoi leggere fumetti gratis. Sempre.E se non ti piacciono rimetterli nelle caselle dei clienti!\nE puoi farlo in orario di lavoro!\nO a casa, spacciandolo per lavoro!\nO a casa dei tuoi acquirenti, ma rimettendoli a posto, dopo, e t"}, {"id": "<urn:uuid:136a062b-823c-4ac5-b02c-467dcd7bf197>", "text": "\n\nCSL ITALIAN CARRIERS - veicolo follow me\nonly for FS2000di Francesco Mandelli\nMilano Gennaio 2001\nHo provveduto ad\naggiornare le CSL, mediante linserimento di un veicolo Follow-me.\nPer aggiornare le vostre CSL Italy (che avrete già scaricato da Ali dItalia e installato sul vostro computer), è sufficiente scompattare lo zip nella cartella dove cè FS2000. I files andranno nelle cartelle appropriate.\nChi utilizzerà il follow-me\ndovrà scegliere nel menu a tendina degli aerei di SB (versione 2.3) i"}, {"id": "<urn:uuid:bcdac1d6-6357-41ca-97a0-7194f1f18146>", "text": "\n\nProfilo biografico di\nMadre Mectilde del SS. Sacramento\n(Catherine de Bar)\nMadre Mectilde de Bar è una figura poco conosciuta in Italia, anche nell’ambito monastico e religioso.\nNata a Saint-Dié, in Lorena (Francia), il 31 dicembre 1614, entra giovanissima in un fervente convento di Annunciate a Bruyères.\nLa guerra dei trent’anni, che mette a ferro e fuoco la Lorena, nel 1635 disperde la comunità di cui Catherine de Bar era già superiora; dopo due anni di orrori, di fughe, di pericoli inauditi"}, {"id": "<urn:uuid:bf9e517c-c1f3-4bd2-bee9-669e62dcc341>", "text": "Page Content\nUltime news -- Software\nIl gigante del software Microsoft è stato citato in giudizio per il suo strumento anti-pirateria Windows Genuine Advantage (WGA).\nBrian Johnson di Los Angeles sta cercando di ottenere un’azione legale aperta a tutti i consumatori (la temuta “class-action”) accusando Microsoft di non aver comunicato adeguatamente i dettagli del funzionamento di questo strumento, prima di farlo scaricare dal sistema di aggiornamento automatico di Windows.\ncontinua\n- Trackback: "}, {"id": "<urn:uuid:f049042a-6b52-4f35-a384-d2d5e5bb7116>", "text": "Primariamente, stesso nei paesi industrializzati, numerose sono le donne che danno precedenza al lavoro di educazione e di cure ai differenti membri della loro famiglia. L'assumono modulando la loro partecipazione al mercato del lavoro rimunerato e riconosciuto. Questo lavoro familiare, indispensabile per il benessere e l'avvenire della società, majoritairement effettuato dalle donne è considerato come privi, senza valore commerciale e dunque economicamente improduttivo. Questo contributo import"}], "4": [{"id": "<urn:uuid:93d8bf08-61bf-4858-9487-1b504457b0d0>", "text": "- Fai shopping e guadagna con il cashback [chiudi]\nSapphire 11190-09-20G 6450-2g-d3\n- tu paghi al negozio\n- €0\n- noi ti ridiamo\n- €0\n- pari al\n- 0%\nDescrizione del prodotto.\nSchede grafiche Radeon HD 6450; 2 Gb GDDR3; PCI-Express 2.1 11190-09-20G SAPPHIRE TECHNOLOGY; Grazie al suo sistema di raffreddamento passivo, questa Sapphire funziona in un silenzio assoluto Con questa scheda grafica HD 6450 i giochi di ultima generazione sfilano davanti ai vostri occhi con DirectX 11 con il massimo tasso d"}, {"id": "<urn:uuid:f94a5920-de92-4f32-bc4d-29dc16108837>", "text": "RISORSE DELL’AISO\nIn questa sezione si vorrebbe mettere a disposizione degli utenti un catalogo che descriva vari fondi di interviste e videointerviste conservate presso centri, associazioni, enti di ricerca e privati ricercatori che hanno manifestato la volontà di collaborare con l’AISO e di mettere a disposizione della comunità le informazioni riguardanti i materiali in loro possesso. Presentiamo qui anche il catalogo della biblioteca dell’AISO, consultabile presso la sede di Roma.\nPubblichiam"}, {"id": "<urn:uuid:21e97dfe-1514-4e33-b89b-6cb85e53faad>", "text": "thnl32.dll is a DLL file Questo processo ancora sta rivedendo. Se gli avete liberamente alcune informazione tatto per trasmetterci un email a pl[at]uniblue[dot]net\nProcessi non di sistema come thnl32.dll hanno origine da software installato nel sistema. Poiché la maggior parte delle applicazioni conserva i dati nel registro del sistema, è probabile che il registro abbia subito una frammentazione e abbia accumulato voci non valide che possono compromettere le prestazioni del PC. È consigliabile c"}, {"id": "<urn:uuid:8a901efb-e7dd-4d5f-a272-c58aa984913b>", "text": "The Invisible Children, diventata famosa per il suo video Kony 2012 apparso youtube, ha aiutato il governo ugandese arrestare un ex soldato bambino e sostenuto un'operazione che ha ucciso più civili che ribelli, secondo i cablo pubblicati da Wikileaks. Pochi giorni dopo aver rilasciato i suoi nuovi video di Invisible Children - e la statunitense ONG dietro il \"successo fenomenale Kony 2012\" (NdA successo non direi dato che tutti si erano accorti che era un video propaganda) ancora una volta si è"}, {"id": "<urn:uuid:35176956-e6cf-422c-ac86-224f5d689a3f>", "text": "\n\nINDICAZIONI PER L'ACQUISTO\nPer procedere nell’acquisto delle riviste è necessario essere registrati.\nIn questo modo potrai navigare all’interno del nostro catalogo virtuale ed inserire nel carrello ogni singolo articolo tramite il tasto\nPotrai cambiare la quantità dell’articolo inserito dando conferma con il tasto\nPotrai cancellare le riviste inserite con un semplice click nel tasto\nInfine, se decidi di voler ripetere l’operazione di inserimento clicca su SVUOTA IL CARRELLO\nModalità di pagamen"}, {"id": "<urn:uuid:ee643417-56c3-4f95-ae2b-a34e29bd8410>", "text": "\n\nARREDO FRIGO COLD LINE\nPer le installazione e le manutenzione di sistemi di condizionamento dell'aria nella provincia di Alessandria e Torino rivolgiti alla ditta Arredo Frigo Cold Line.\nI più moderni impianti frigoriferi commerciali nella provincia di Alessandria e di Torino te le offre solo la Arredo Frigo Cold Line, azienda leader del settore.\nIl più sicuro commercio di frigoriferi industriali e commerciali nella città piemontese di Alessandria lo mette a disposizione solo la ditta Arredo F"}, {"id": "<urn:uuid:b717bc7e-a2e1-4f36-bac9-ad57ab01d562>", "text": "Proposta di direttiva (Euratom) del Consiglio sulla gestione del combustibile nucleare esaurito e dei residui radioattivi\n/* COM/2003/0032 def. - CNS 2003/0022 */\n|BG||ES||CS||DA||DE||ET||EL||EN||FR||GA||IT||LV||LT||HU||MT||NL||PL||PT||RO||SK||SL||FI||SV|\n|html||html||html||html||html||html||html||html||html||html||html|\n|doc||doc||doc||doc||doc||doc||doc||doc||doc||doc||doc|\n|Doppia visualizzazione: DA DE EL EN ES FI FR IT NL PT SV|\nProposta di DIRETTIVA (EURATOM) DEL CONSIGLIO sulla gestione d"}, {"id": "<urn:uuid:6c8c7b43-4365-474e-b58d-ff6542500ed5>", "text": "Le scommesse a Quota Fissa su avvenimenti sportivi e non sportivi dipendono dal tipo di sport o di evento su cui si scommette. Sul calcio ad esempio, sport in cui il ventaglio di offerte è più vasto, oltre al classico \"1X2\", è possibile scommettere anche sul risultato esatto di una partita, sul risultato del primo tempo, sul numero di gol superiori o inferiori ad un numero prefissato e su molte altre tipologie di esiti. Sui principali avvenimenti sportivi è, inoltre, possibile effettuare anche s"}, {"id": "<urn:uuid:52188508-3f18-49a8-855d-be0c342cfb62>", "text": "Consente all'applicazione di scattare foto e riprendere video con la fotocamera. L'applicazione può raccogliere in qualsiasi momento le immagini inquadrate dalla fotocamera.\nGestione della vibrazione\nConsente all'applicazione di controllare la vibrazione.\nRegistrare audio\nConsente all'applicazione di avere accesso al percorso di registrazione dell'audio.\nModificare i parametri audio\nConsente all'applicazione di modificare i parametri generali relativi alle funzioni audio, come il volume degli al"}, {"id": "<urn:uuid:77169e1c-e4fb-425a-81c3-2f673b64a48e>", "text": "We detected that your JavaScript seem to be disabled.\nYou must have JavaScript enabled in your browser to utilize the functionality of this website.\nTutte le spedizioni vengono effettuate tramite corriere GLS. La consegna della merce avviene generalmente in 24 massimo 48 ore. Le spese di trasporto ammontano a 8.00€ per l'Italia, per l'estero i costi verrano calcolati in base alla zona di provenienza. Per conoscere il totale delle spese di trasporto da pagare, per uno o più prodotti, basta inseri"}, {"id": "<urn:uuid:8def6dc7-0f77-43b1-a9f0-dfa940d24548>", "text": "JavaScript sembra essere disabilitato nel tuo browser.\nDevi abilitare JavaScript nel tuo browser per utlizzare le funzioni di questo sito.\n1 oggetto(i)\nIl pagamento degli acquisti tramite carta di credito può essere effettuato esclusivamente con le carte di credito VISA, VISA ELECTRON, MASTERCARD e AMERICAN EXPRESS e solo dal titolare/intestatario della carta utilizzata (sono accettate anche le carte di credito prepagate, come ad esempio la Postepay, solo per prodotti non in abbonamento). Sono a"}, {"id": "<urn:uuid:426ea1bf-60d3-4117-9a1f-308aa6733326>", "text": "Trenitalia ha un obiettivo: spostare sull’alta velocità (cosiddetta) la maggior parte di traffico passeggeri e fottersene del resto. Il trasporto locale non è mai stato così abbandonato a se stesso come oggi: treni sporchi, mezzi rotti e rattoppati, latrine (perché di questo si tratta) aperte una si e tre no, impianti di riscaldamento guasti e porte inutilizzabili. Ma perché occuparsene se l’obiettivo è quello di smantellarli?\nSulla linea Venezia-Ancona, ad esempio, quelli che fino a qualche tem"}, {"id": "<urn:uuid:935b572c-b244-4a17-9a42-646feca197fc>", "text": "31 ottobre 2009\nIl buon stato di della finanza pubblica regionale, è il principali elemento che ha permesso l'importante e tempestivo intervento anti-crisi nell'anno 2009 e da una realistica prospettiva di traghettare la Regione verso la ripresa economica. Alcuni interventi anti-crisi sono già riproposti per il 2010 e il Governo ha avviato il percorso simile allo scorso anno per addivenire alla stesura di una nuova legge anti-crisi per l'amo 2010.\nL'aumento nel 2010 è frutto di un effetto combin"}, {"id": "<urn:uuid:fe177d97-3e97-4ebb-a552-68bcb67d526b>", "text": "Articolo\n“10x10 storie di qualità” a FORUM PA 2012. Ecco i Vincitori e le Menzioni speciali\nA chiudere FORUM PA 2012, last but not least è il caso di dire, l'evento di premiazione del Call “10 x 10. Storie Qualità\", che ha dato voce a 10 esperienze di qualità nelle pubbliche amministrazioni italiane, raccontate ciascuna in 10 minuti dai funzionari, responsabili, professionisti delle amministrazioni che le hanno portate avanti.\nIl Call “10 x 10. Storie Qualità\", nato in collaborazione con l’Assoc"}, {"id": "<urn:uuid:22e05875-06e5-4b60-97ad-c4b637db06a8>", "text": "(art. 13 del Codice in materia di protezione dei dati personali)\nSky Italia s.r.l.,(di seguito \"Sky\") ai sensi dell'art.13 del D.lgs 196/03 \"Codice in materia di protezione dei dati personali\", ti informa che i dati personali che ci fornisci con la richiesta di registrazione e successivamente per avvalerti dei servizi di volta in volta forniti, nonchè i dati personali forniti al momento della sottoscrizione del contratto, saranno trattati per i seguenti fini:\nI dati contrassegnati con l'asterisc"}, {"id": "<urn:uuid:e278d2a2-49d6-4fef-b8e5-537ee9a15b15>", "text": "Piano Comunale di Protezione Civile\nIl Piano Comunale di Protezione Civile è stato aggiornato e approvato nel marzo 2012 per dare alla cittadinanza uno strumento utile a fronteggiare eventi naturali o connessi all'attività dell'uomo\nAprile 2012\nIl Piano Comunale di Protezione Civile, aggiornato e approvato nel marzo del 2012, è stato elaborato con lo scopo di fornire al Comune, ma soprattutto a tutta la cittadinanza che lo compone, uno strumento operativo utile a fronteggiare l’emergenza locale,"}, {"id": "<urn:uuid:75051f8b-86bd-4f0b-a204-63583e49d477>", "text": "Estirpazione vigneti e diritto di reimpianto\nLa normativa vigente sui vigneti prevede l'istituzione di un inventario regionale delle superfici vitate. Ogni superficie vitata in Lombardia, compresa quella inferiore a 10 are destinata all'autoconsumo, deve essere iscritta all'inventario regionale. Per poter piantare nuove superfici vitate, occorre essere in possesso di un diritto di impianto. Tali diritti, come le quote latte, sono cedibili ad altri soggetti, secondo un rigido sistema di regole st"}, {"id": "<urn:uuid:d9f6f708-978d-4d9e-a07a-f609963c49bf>", "text": "Fondare il PGT sull’applicazione del concetto di sostenibilità e sulla qualità dei “vuoti urbani”, nella prospettiva di proporre certezza e garanzia per i cittadini, implica l’attivazione di una “politica dei pieni”, in grado di produrre risorse necessarie per il conseguimento effettivo dell’alto livello qualitativo atteso. Densificare non comporta un aumento generico ed indistinto nella volumetria urbana, secondo pratiche tipiche dei tradizionali piani regolatori che ridistribuivano in modo ast"}, {"id": "<urn:uuid:25ee5661-0f49-49a1-acd6-f732b65311e2>", "text": "Città Studi è stata fondata per iniziativa delle istituzioni e dell'associazionismo imprenditoriale locale allo scopo di favorire lo sviluppo tecnico scientifico dell'industria biellese. Rappresenta uno dei poli di cultura industriale più importanti d'Italia e comprende nei suoi oltre 100.000 mq:\n- una Sede Universitaria;\n- un' Agenzia per la Formazione Professionale;\n- un Centro Congressi ed una Biblioteca Specialistica;\n- un' area di Servizi, Ricerca e di Consulenza alle Imprese.\nGuarda il vid"}, {"id": "<urn:uuid:36cb9903-1da1-4aa9-baa2-eaacae9526d4>", "text": "Aggiornato il 20.7.12\nC'era un tempo in cui suddividere un file video era l'unica soluzione per inviare filmati via Email cosi da condividerli con altre persone.\nOggi che le connessioni internet sono veloci e, soprattutto, oggi che esistono servizi online come YouTube o altri portali dove caricare video e condividerli in privato con altre persone, ci sono meno necessità di dividere un video lungo in varie parti.\nLa divisione di file video però si fa ancora e lo testimonia la presenza, in vari fo"}], "5": [{"id": "<urn:uuid:9ba1a7ab-9ce9-449d-937e-304217f5d411>", "text": "E cosi', quel fazzoletto di sfiga popolato da 1.657.155 rompicoglioni tra i quali contiamo diverse migliaia di barbuti musulmani fanatici e qualche centinaio di raddrizzatori di banane etiche filoislamici nostrani impegnati a soccorrere i \"bambini di Gaza\" e a sminuzzarti gli zebedei con \"gli occhi dei bambini di Gaza\", ha prodotto nuovamente l'unica cosa che produce, nonostante gli ampi finanziamenti dell'Unione Europea che finiscono in Kalashnikov e quelli dell'abominevole regime iraniano che "}, {"id": "<urn:uuid:22cb602e-5721-4e85-81d6-ee6d28d1b579>", "text": "Benvenuti su www.gechi.it\nIl sito è attualmente in fase di sviluppo. Per proposte di collaborazione e richieste di informazioni, inviare un messaggio riempiendo il modulo seguente.\nWelcome to www.gechi.it\nThe site is currently under construcion. For inquiries, send a message by filling-in the following form.\nMandaci un messaggio / Send us a message"}, {"id": "<urn:uuid:39ff10e8-3863-4cb5-8e03-cef5637f8b21>", "text": "YEMEN – IL PAESE DELLE MILLE E UNA NOTTE - (2005) di Daniela e Sandro\nper info sul paese click sulla bandiera\nINTRODUZIONE:\nDifficile raccontare lo Yemen, ma ci provo partendo dall’inizio.\nCom’è nata l’idea di un viaggio proprio in quel Paese?\nPremetto che soffro da tempo del famoso “Mal d’Africa” e che gli ultimi viaggi sono stati esclusivamente verso quel Continente, ma il Mondo è grande – mi dico sempre – e bisogna allargare i propri orizzonti.\nL’idea originale era di riprendere un vecchio pr"}, {"id": "<urn:uuid:130f4e73-2006-4174-8107-e19b69458a29>", "text": "Primo!!! E so soddisfazioni...\nsatana è nelle vostre zucche\nAvv. Paolo, che impressione ti fece il DJ Young a codesto incontro pubblico? > Un anti-hoaxer\nsì però se vi serve una mano per l'audio la prox volta, ditemelo...una bella riduzione del rumore ci voleva!\nhttp://www.corriere.it/notizie-ultima-ora/Cronache_e_politica/Mafia-Ass-Georgofili-brutta-coincidenza/28-06-2011/1-A_000221897.shtml\nQUOTO: 'Pierluigi Vigna' > Georgofilo\nAll'anonimo che chiede dell'audio, non ci serve una mano, grazie.L"}, {"id": "<urn:uuid:caee0ca6-5903-4540-aae8-8b37550ac4d7>", "text": "\n\nper Unisex\n.136 oz refillable perfume travel atomizer, airline approved (fragrance not included)\nElemento # 231154\n\n\nper Unisex\n28 piece beauty kit with 20 eye shadows & 6 creamy lip glosses & 2 blushers & 2 applicators & mirror\nElemento # 233690\n\n\nper Unisex\na set of 7 cosmetic brushes in a purple carrying case\nElemento # 161765\n\n\nDesign House: Creed\nAnno introdotto: 1975\nNote di fragranza: Mandarino, bergamotto, fiori bianchi, scorza di limone, pompelmo\nDisponibilità: Disponibile ora\nAltri p"}, {"id": "<urn:uuid:f0d30c9b-2bb9-415c-b3a0-010b7fb87e4a>", "text": "Non vedevo Marco da parecchio tempo. E’ un mio vecchio amico, una specie di fiamma mai del tutto accesa, mai completamente spenta. Marco è il tipico uomo che mi fa eccitare al solo pensiero, uno di quelli a cui non so mai dire di no.\nCerto, faccio un po’ la preziosa, come tutte le donne. E so fare lo sguardo da mangiauomini, quando serve…ma a Marco concedo tutto, ed assecondo sempre ogni suo più piccolo desiderio.\nLui lo sa, ma non ne approfitta, e lascia che io faccia sempre ciò che mi sento di"}, {"id": "<urn:uuid:c1b6e8bd-4c4b-4597-a87a-1427d91f67e8>", "text": "Qualche appunto a margine del vergognoso film della RAI su Rino Gaetano.\nPaolo Franceschetti e Stefania Nicoletti\nCome abbiamo descritto molte volte nel nostro blog, il nostro è un sistema che uccide e strangola tutti coloro che ne sono al di fuori e non vogliono essere coinvolti nei giochi illeciti del potere massonico.\nIl sistema, però, non penalizza solo chi ne è fuori, ma anche chi ne è dentro e ne riceve i vantaggi. Perché il problema è che una volta entrati nel sistema, tutto ciò che ti vi"}, {"id": "<urn:uuid:3adfbeaf-3e28-4280-b3a0-f305f3ff3153>", "text": "Archivio degli articoli taggati 'spoiler'\n6 agosto 2009 ore 13.43\nSono tornata dal campo!! Mi fa strano dormire di nuovo in un letto. Certo, è comodo, ma già mi mancano le stelle sopra la testa. Mi è capitato un paio di volte di dormire sotto i rifugi di fortuna (di cui uno si è allagato la prima notte durante una bufera e il secondo si è allagato l’ultima notte durante una bufera) e decisamente non invidio eynis che d’inverno dorme tranquillamente sulla nuda terra (è vero, c’è da considerare l’"}, {"id": "<urn:uuid:79d94bb0-7e52-4a06-ac22-7b2f223570b5>", "text": "Hotel Imperial Beach\n18 4.1666666666667\n- Per Hotel Imperial Beach purtroppo non ci sono ancora video di viaggio.\n- In alternativa ci sono 18 video su Rimini\n- Ci sei stato? Allora carica subito un video su questo hotel!\nAvviso: in alta stagione la pubblicazione può richiedere un po' più di tempo del normale."}, {"id": "<urn:uuid:f8ff19fb-6407-4036-9221-fb0765708949>", "text": "PHP Developer Fundamentals on MySQL® Environment rappresenta un nuovo e completo percorso di Formazione e Certificazione e nasce per rispondere alla crescente importanza che stanno assumendo, a livello mondiale, le applicazioni web dinamiche basate sull’uso di linguaggi di scripting lato server e di database relazionali. Il linguaggio PHP è un linguaggio di programmazione web di ultima generazione, open source, e rappresenta lo strumento di lavoro ideale per la generazione di applicazioni Web. I"}, {"id": "<urn:uuid:34edc579-31e1-49de-a252-8dc330988e6a>", "text": "Sei in: Home //\nIn Primo Piano //\nQuesto no!\nAutore\nadmin il\n13 dic, 2009 |\n25 Commenti\nBerlusconi ferito a Milano\nDal nostro piccolo, ci dispiace sinceramente, Presidente.\nRedazione JF\nPersonalmente dispiace anche a me.\nMa spero che il gesto di una persona che soffre di seri problemi psichici non sia oggetto di strumentalizzazioni.\nDico spero, ma sto seguendo lo speciale del tg1 e sento che c’è già qualcuno (il vice-direttore de “Il Giornale”) che chiede la testa di Di Pietro e la sinistra in g"}, {"id": "<urn:uuid:bb571a82-5c2e-46ac-8623-9a8850042cdc>", "text": "Sapete che mi sono accorto di una cosa gravissima? Non abbiamo minimamente parlato delle Olimpiadi di Pechino! Poi è ovvio che si dica che i froci si disinteressano di sport.\nE così, avevo deciso di far partire una bella rubrica quotidiana dedicata ai Giochi: avevo cominciato a raccogliere materiale, quando qualcuno mi ha detto che le Olimpiadi sono finite da un pezzo. Ma come? Di già? Maledetti Cinesi, fanno tutto di fretta.\nComunque, voglio recuperare con le foto di un atleta mezzo nudo e un p"}, {"id": "<urn:uuid:dcc9ab3f-3272-43bc-a61b-03368d48d57a>", "text": "SERVIZIO RISERVATO\nPer poter accedere ai contenuti di questa sezione occorre possedere Username e Password assegnati da Confindustria Udine.\nE’ sufficiente inserire i codici di accesso nella sezione ‘servizi riservati’ e fare click sul pulsante 'accedi'.\nSe siete un'azienda iscritta e avete dimenticato la password richiedila a:\nArea Innovazione, Tecnologie e Qualità\ntel. 0432.276228\nfax 0432.276225\nemail: firstname.lastname@example.org\nSe invece non siete ancora iscritti e desiderate ricevere in"}, {"id": "<urn:uuid:6ab1cc92-6cac-4810-b6ab-7c892c7b8d34>", "text": "[ 001 ] Pietro Boccamazza si fugge con l' Agnolella; truova ladroni: la giovane fugge per una selva e è condotta a un castello, Pietro è preso e delle mani de' ladron fugge e dopo alcuno accidente capita a quel castello dove l' Agnolella era; e sposatala con lei se ne torna a Roma.\n[ 002 ] Niuno ne fu tra tutti che la novella d' Emilia non commendasse; la quale conoscendo la reina esser finita, volta a Elissa, che ella continuasse le 'mpose; la quale, d'ubidire disiderosa, incominciò:\n[ 003 ] A "}, {"id": "<urn:uuid:3a031921-a339-48df-a9d8-392071f5bdbf>", "text": "L10N Italian Team\nFrom FedoraProject\n\n\n(→Credits)\n\n\n(→Mailing List Admin)\n|Line 90:||Line 90:|\n|}\n|}\n|−|\n== [\n|+|\n== [\n|+|\n|+|\n|+|\n://www.redhat.com/mailman/listinfo/fedora-trans-it Mailing List ]\n{| style=\"width: 100%;\"\n{| style=\"width: 100%;\"\nRevision as of 05:41, 8 September 2012\nContents\nBenvenuti\nL'obiettivo di questo team è quello di rendere disponibile in lingua italiana il software, la documentazione ed i siti web associati al Fedora Project.\nLe procedure specifiche del team Italiano son"}, {"id": "<urn:uuid:92fb58f8-7885-41e3-896f-93a1a57719ce>", "text": "Page Content\nQuesta sezione Barcellona FAQ è in continua espansione per cui ritieniti libero di mandarci una domanda e noi faremo del nostro meglio per risponderti. Per inviare una domanda guarda alla base di questa pagina.\nGrazie a tutti coloro che hanno mandato delle domande. Il nostro scopo è di fornire il miglior portale di viaggi al Mondo su Barcellona. Con i vostri continui commenti possiamo realizzarlo.\nGrazie, John (Editore)\nDomande Sui Trasporti di Barcellona\nCome posso raggiungere dell"}, {"id": "<urn:uuid:6f493925-558f-4d0b-91b6-b4c0ea66a69f>", "text": "\n\nRegolamento\nRegole generali per l'uso consapevole di\nEFP\n- l'utente che visita o che si iscrive a\nEFP\nè tenuto a leggere e ad accettare integralmente il\nRegolamento del sito. La permanenza sul sito, la lettura delle storie\nin esso contenute o l'iscrizione costituiranno atto accettante del\nRegolamento.\n- L'utente che non si iscrive ma che visita\nsolamente il sito dovrà\nprestare attenzione al regolamento in special modo nella sua parte\nrelativa alla lettura delle storie, alla compresione del rat"}, {"id": "<urn:uuid:0d989ecc-59fc-488c-81af-9429005cfe23>", "text": "|Contattaci!||\n\n\nAggiornato Domenica 06-Gen-2008\n\n\nGiovedì\n16 settembre alle 18, alla Festa Nazionale de L'Unità di Genova,\ndi fronte a un pubblico composto quasi esclusivamente da donne, si è\nsvolto l’incontro “Voci che rompono il silenzio. Contro\ntrans/omofobia. Un appello alla lotta contro la violenza alle donne,\nalle minoranze oppresse e alle diversità.”\nCrisalide\nAzione Trans www.crisalide-azionetrans.it\n- email@example.com\nIl 16 settembre si è tenuta a Genova, presso la Festa dell’Unità na"}, {"id": "<urn:uuid:fcdc1ce6-1ebc-418b-b6af-ee2a7ed212f8>", "text": "Franco Arminio, Nevica e ho le prove. Cronache dal paese della cicuta, Bari, Laterza, 2009.\nPoeta e prosatore tra i più intensi e originali del panorama letterario contemporaneo, Franco Arminio approfondisce, di libro in libro, una scienza di cui è il fondatore e il solitario cultore, da lui definita «paesologia». L’orizzonte è sempre lo stesso, l’Irpinia orientale, terra di confine afflitta da lunghissimi e gelidi inverni. Quanto alla «paesologia», bisogna dire che, pur non essendo né una socio"}, {"id": "<urn:uuid:5d4623a4-d5b4-4bdb-a0c1-8853f05dcb80>", "text": "marzo 10, 2013 Lascia un commento\nDedefensa 9 marzo 2013\nSi cercheranno di analizzare gli eventi italiani, soprattutto la vittoria del Movimento 5 Stelle (M5S) e di Beppe Grillo, il 25 febbraio (vedi in particolare 26 febbraio 2013), dal momento che questo evento, secondo un approccio generalista e anti-sistema, ci pone in particolare relazione all’attuale posizione dell’Italia, ma anche in relazione al suo sviluppo storico, secondo la posizione molto importante dell’Italia nel sistema europeo, "}]}}, "DCLM-Edu": {"en": {"0": [{"id": "<urn:uuid:b069356a-720e-44d3-9386-6f78102e1789>", "text": "Environment in emerging and transition economies\n\nEaP GREEN: Reform of environmentally harmful subsidies\n\n\n\nReforming environmentally harmful subsidies (EHS) is a fundamental element of green growth strategies and confers a range of benefits to countries that undertale such reforms.
