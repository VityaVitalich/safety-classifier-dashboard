事を始めてたった2日。ほら。クリスマスはミシュランのレストランで\nデートしたって言ってたから、もっとオシャレ系の店を選ぶと思ってた\nクリスマスは特別！食べれなかったけど。Ｋの問いかけにそんなこと聞かないでぇー、あんっ。\n優奈と修平が仲良く荷物運びをしている姿を目の端に映し、ヒョヌは木陰で本を読んでいる。\n立て続けて明美は昇天した。三人とも首を振る。\n。恋愛感情なんて、物騒なものを先輩に持たれては困るし、女房にも自覚を持たせるため\nだった。\n男はガムテープを取り去り、荒らい息をする私をニヤニヤ見つめながら、信じられないことをいったのです。\nみたいな感じでようやく彼女もパニックからは覚醒した感じ。そして吐くのは毒が多い。Ｂ君はうおー初めて触ってもらったーマジ感動。\nだから今まで僕が付き合ってきた女の子やナンパしてゲトした女の子は漏れなく初日からバッ"}, {"id": "<urn:uuid:849cc7d9-2dbb-45b9-a638-005a3303babd>", "text": "衝撃感度（しょうげきかんど）とは爆薬の衝撃に対する感度を示す値である。\n輸送時の爆発事故を防ぐためには重要な指標であり、特に感度の高いニトログリセリンや過酸化アセトンなどを輸送する場合には鈍化剤と混合するなどの特別な措置を必要とする。\nRDXやダイナマイトのような爆薬は非常に感度が鈍く取り扱いやすくなっている。"}, {"id": "<urn:uuid:d3f98c30-c65c-438b-aeb5-40bd844b34c8>", "text": "ゲスト さん[ログイン]\n怒りに一致する情報は見つかりませんでした。\n※ 自動スペルチェック機能により、検索語から想定されるキーワード候補を表示しています。\n※ キーワード候補をクリックすると、その言葉で再検索ができます。\n東日本大震災に関する取り組み"}, {"id": "<urn:uuid:eb9c51ce-4cd4-4a27-86dd-93e7ef50328a>", "text": "画像内に表示されている英数字を入力し、ボタンを押して下さい。\nこの画面は、短期間に多くの検索を行ったお客様に表示しております。\nPlease input the string displayed on the image and press the submit button.\nご使用のコンピュータがウィルス等に感染していたり、スパイウェアが埋め込まれている可能性はございませんでしょうか。\nお心あたりのないお客様は、下記の画像内に表示されている英数字を入力し、「submit」を押して頂くことにより通常の検索画面に戻ることができます。\nまたご使用のブラウザーでクッキーをオフ（無効）にしている場合はお手数ですが、クッキーをオン（有効）にしてください。\nLots of queries are issued in short period.\nPlease check your computer if it is defected by virus or spyware,\nand please make sure your cookie settings are ON.\nAfter that, "}], "4": [{"id": "<urn:uuid:d03fc65f-99bb-4095-b3f8-59b000c95b75>", "text": "\n\nふくむすめどうわしゅう(Hukumusume fairy tale collection) > がいこくご(Foreign language)\n>イソップどうわ(Aesop’s Fables)\nイラスト myi ブログ sorairoiro\nいっしょ に かり に いった ライオン と ロバ\nThe Lion and the Donkey that hunted together\n(イソップどうわ)\n(Aesop’s Fables)\nほんやく(Translation) ちいさな翻訳屋さん\nJapanese(にほんご) ・ English(えいご) ・ Chinese(ちゅうごくご)\nJapanese & English ・Japanese & Chinese\nライオン と ロバ が そうだん して、いっしょ に かり に いきました。\nThe lion and the donkey arranged to go and hunt together.\nやせい の ヤギ が たくさん いる ほらあな まで くると、ライオン は いりぐち に じんどって、\nWhen they went "}, {"id": "<urn:uuid:dfa97bb6-50f1-4fbf-a603-12cc95e8aa79>", "text": "ユーザ・コメント\nlucio: Eu adoro este progama. Bastante funcional e de simples manuseio. Definitivamente 'The Best!'\nandor: e tare bun bs player | oode: ขอบคุณที่มีโปรแกรมดีๆมาให้ใช้ | Veloz: Szerintem a legjobb program | illydio e.: O programa é muito bom. Mesmo a versão free é de grande qualidade\nandor: e tare bun bs player | oode: ขอบคุณที่มีโปรแกรมดีๆมาให้ใช้ | Veloz: Szerintem a legjobb program | illydio e.: O programa é muito bom. Mesmo a versão free é de grande qualidade\nBSPlayer- ベストなマルチ・メディア・プレ"}, {"id": "<urn:uuid:037a07be-3efc-4ab7-be4e-160c4018fc26>", "text": "ハイブリッド・クラウドを実装することは、ハイブリッド・クラウドへの投資の真価が損なわれるリスクや、企業が一層不安定な状況に陥るリスクを孕んでいます。何を実装する場合も同じですが、ハイブリッド・クラウドを稼働状態にし、適切な機能、セキュリティー、信頼性を確保するには、いくつかの重要な事項を注意深く考慮する必要があります。ハイブリッド・クラウドが効果的に機能するためには、それまで構築されてきたサイロを解消し、BSM (Business Service Management) と ITSM (IT Service Management) の両方に共通の手段を提供する必要があります。そのためには、ガバナンス・ポリシーをインテリジェントに構築し、厳格なコンプライアンスを維持しつつシステムとシステム・パフォーマンスを管理する必要があります。\nITaaS (IT as a Service) を実装することにより、IT は真のビジネス・パートナーとなる必要があります。ITaaS を実装するためには、IT プロセスを以下のように設計する必要があります。\n- サービス・プロバイダーとしての心構えを持つ\n-"}, {"id": "<urn:uuid:d690630b-5569-4cd2-ac63-2951394a7408>", "text": "盗撮動画詰め合わせ\nスカートの中。修学旅行の温泉。体育前に教室で着替える女子たち・・・\n出演 ： ----\n動画を配信しているサイト ： YourFileHost.com\n識別コード ： 010701.wmv 010902.wmv 010904.wmv 011002.wmv 011003.wmv\nこの動画を見た人はこんな動画も見ています。\n地方の旅館に宿泊しているJK達を盗撮。脱衣所で生着替えをしているところから、電車内で女子生徒たちが戯れている場面まで。画質は悪いですが、修学旅行ならではの集団入浴シーン..."}, {"id": "<urn:uuid:f7df455b-a4e9-4a1c-bf0a-ab5a38acc4ca>", "text": "auは、パンテック製の「SIRIUS α IS06」とNECカシオ製の「MEDIAS BR IS11N」のAndroidスマートフォン2機種に不具合が見つかったとして、ソフトウェア更新サービスの提供を開始した。\nIS06の不具合は、バーコードスキャナー設定において、再起動が発生する場合があるというもの。あわせてCメールアプリの不具合についても改善される。更新にかかる時間は約15分。更新はWi-Fi経由、またはmicroSDカードを利用して行う。\nIS11Nでは、ブラウザを利用してインターネット接続を繰り返していると、ブラウザの起動に時間がかかるようになる不具合と、G-SHOCK（GB-6900）とのBluetooth接続において、G-SHOCKのスリープ状態から復帰時に再接続を行わない場合があるという不具合が確認されている。更新にかかる時間は約14分。こちらは3G経由での更新となる。更新の際の通信料は無料。\n|SIRIUS α IS06||MEDIAS BR IS11N|"}, {"id": "<urn:uuid:9a1d2e16-d982-4937-9b11-939fdd3529be>", "text": "当相談室は様々なお客様の質問・要望にもお応えできるよう介護職経験者や住宅選びのプロである宅建主任者、行政書士など有料老人ホーム選びに必要な知識を有する経験豊富な相談員がご対応しております。\n【あんしん・親切】に有料老人ホーム選びをサポートいたします。お気軽にご相談ください。\nメールマガジン"}, {"id": "<urn:uuid:b05f558c-f6d5-4aef-bd26-6a546ca0930a>", "text": "黒神めだか － くろかみ めだか\n所属：一年十三組・生徒会会長\n特技：真骨頂「その1 」から「その4」・黒神ファントム\n血液型：AB型\nCV：豊崎愛生\n箱庭学園一年生にして生徒会長。\n生徒会長選挙戦の際には98%の支持を集め、生徒会長として就任。\n全ての勉学、スポーツにおいてズバ抜けた能力を持ち、あらゆる格闘技を修得しているようで,戦闘能力は極めて高い。\nあえて反射神経をオフにしたり、力のリミッターをはずす切り替えるなど、自分の体を自在にコントロールできる。\n人吉善吉 － ひとよし ぜんきち\n所属：一年一組・生徒会庶務\n利き腕：左\n血液型：AB型\n星座：しし座\n特技：めだか想い・サバット\nCV：小野友樹\n「黒神めだか」とは2歳からの幼馴染。\n一組所属のノーマル生徒だが、昔から「めだか」の正しさを信じ、害なす敵を蹴散らし、「めだか」の一番の理解者として常に居る。\n黒神真黒の特訓により、戦闘能力は異常者（アブノーマル）にも劣らないレベルへと成長した。\n阿久根高貴 － あくね こうき\n所属：二年十一組・生徒会書記（柔道部より移籍）\n血液型：AB型\n特技：破壊臣・柔道二段・字が綺麗\nCV：浪川"}, {"id": "<urn:uuid:c8c8ef29-2506-4544-ba8e-3a4d218f540f>", "text": "対応機器の同時使用でわかった「nasne」の柔軟性\n- 2012 7/27\n- カテゴリー : PS3 . Sony Tablet . VAIO . テレビ・ビデオレコーダー . 携帯電話・PHS . 有機ELテレビ\n- torne/nasne . VAIO Z . XEL-1\n発売前日の回収騒ぎから1週間を過ぎましたが、いまだ発売日がはっきりしない「nasne」。関東では連日の猛暑ですが、そんな中、我が家のnasneは問題なく動き続けております。余談ですが、その後本体はリビングに移動しており、混合器でBSも見られるようにしています。PS3は番組表がシームレスで使いやすいです。ちなみに、BS番組表では少ないながらトルミルの数字も確認できました（BDレコーダー連携の数字かな？）。\nさて、そのnasneですが、放送中の番組や録画番組を2台の機器で同時に楽しめるのが売りになってます。ver.1.0の状態ではありますが、手持ちの対応機器にて一通り検証してみた結果、nasneで番組録画をしながらでも2台の機器で録画済み番組を同時に再生できることがわかりました。ちなみに、録画中の番組をPS3で追い"}, {"id": "<urn:uuid:3e5f9f0b-414e-4e43-afa5-0b52a5f90aca>", "text": "\n\n■CPU／メモリ／ハードディスク：お使いのOSが推奨する環境以上（Microsoftが推奨する環境に準拠します）\n【ブラウザ】\nInternet Explorer® 6〜10\n※最新セキュリティプログラム適応済みのものであること。\n※FireFox等のInternet Explorer®以外のブラウザには非対応です。\n※Internet Explorer 9、10 の「ActiveXフィルタ」を有効にしていた場合、インストールができません。\n「ActiveXフィルタ」を無効にしてご利用ください。\n※64bit版Internet Explorerでは、ActiveXにてインストールすることができませんので、インストーラを提供しております。\n※Internet Explorer®の各設定値が既定値ではない場合、正常に動作しない場合があります。\n【接続環境】\nインストール、起動時ともにインターネットに接続中であること\n※企業内ネットワークなどインターネット接続環境設定によっては、ご使用いただけない場合がございます。\n※ADSLや光ファイバーなど、常時接続が可能な環境を推奨します。\n※nP"}, {"id": "<urn:uuid:398576ba-89bb-4bbd-93f5-f127e1e73dc7>", "text": "|リリース情報||イベント情報||番組表||特典付き／スペシャルグッズ|\n脚本：水瀬葉月 コンテ：二瓶勇一 演出：神保昌登 作画監督：大島美和／渡辺亜彩美／寺尾憲治／野田めぐみ／山吉一幸\n|とあるキャンプ場へ林間学校へやってきた春亮たち大秋高校の面々。\n\n\n学園の生徒ではない黒絵やサヴェレンティも合流し、賑やかに楽しむフィアたちのもとへ、\n学園理事長で『禍具』コレクターの世界橋から指令が届く。\nフィアたちのいるキャンプ場に、『呪われた道具＝禍具』に関係する（かもしれない）\n怪物が現れるというのだが・・・・。\nうさんくさがりながらも調査に乗り出すフィアたちだったが、\nところどころにその怪物が現れたらしき痕跡を発見し、\nついには春亮が何者かにさらわれて・・・・！？\n脚本：横手美智子 コンテ：川口敬一郎 演出：山口頼房\n作画監督：野田めぐみ／斉藤良成／山吉一幸／竹森由加／高原修司／松浦里美／渡辺亜彩美／堤谷典子／寺尾憲治／中西理絵／松尾 慎\n|囚われた春亮と黒絵を救出するために\n\n\nアリスの待つ倉庫へと訪れたフィア、このは、錐霞。\nアリスの使う『禍具』の圧倒的な力に苦戦するフィアたちだったが"}, {"id": "<urn:uuid:fd13426e-63f6-4e66-9486-497875d86994>", "text": "理学系研究科男女共同参画基本計画\n理学系研究科男女共同参画基本計画\n理学系研究科は，理学系研究科・理学部憲章および東京大学男女共同参画基本計画の精神に則り， 理学の教育・研究における理想的な環境を実現すべく，この基本計画を定める。\n(1) 基本理念\n理学系研究科は，豊かで平和な人類の未来社会を切り拓く先端的な理学の教育・研究を推進するため， 知の創造と継承，人材育成，自律した運営と体制整備，差別と偏見の排除，社会貢献を行うことを宣言した。 特に，性別，国籍，民族，宗教などによる差別・偏見を排除し，普遍的で自由な精神をもってこれに臨む決意である。\n1877年創設の東京大学で女性の入学が認められたのは1946年以降であり， これまでに輩出した卒業生に占める女性の割合はなお僅少であるだけでなく， 教員に占める女性の割合も低位にとどまっている。 この状況は理学系研究科でも同様である。 理学系研究科が目標とする教育・研究の推進と発展，および世界的なリーダーとなる人材の育成には， 個人が性別にかかわりなくその個性と能力を十分に発揮することのできる社会の実現が必要不可欠である。\n理学系研究科は， 理"}, {"id": "<urn:uuid:40dce298-5a67-4a35-ae32-1c960564d811>", "text": "【これまで、古気候の話題を便宜上「気象むらの方言」のカテゴリーで扱ってきた。[2012-04-24の記事「氷河時代、氷期、小氷期」][2013-04-22の記事「最終氷期、『ウルム氷期』(?)」] 今回の話題もそれと関係あるのだが、古気候よりも広い古環境の話題なのと、古環境の専門家が使う意味をひとつ説明するだけではすまず、意味の多様性を説明する必要があるので、「バベルの塔の職人長屋」のカテゴリーに入れることにする。】\n「縄文海進」というものがときどき話題になる。地球温暖化の話題で比較対象とされるようだ。それに関する専門家による説明は、日本第四紀学会のウェブサイトhttp://quaternary.jp の「Q & A」の中の「縄文海進の原因について」http://quaternary.jp/QA/answer/ans010.html というページにある。(前にはwwwsoc.nii.ac.jpの下にあったが、国立情報学研究所が学会のウェブサイト提供をやめたので移動した。) しかし、もう少し問題を分解して説明しないとわかりにくいかもしれない。\n海進・海退という表現は、次のような複数の意味"}, {"id": "<urn:uuid:8817e8b4-7959-4efc-9d7b-05848d635e6a>", "text": "記名被保険者またはそのご家族が、原動機付自転車を運転中の事故により他人をケガさせてしまったり、他人の財物を壊してしまったりしたとき、あるいはご自身がケガを負ったりした場合に保険金をお支払いする特約です。\n[SBI損保では]\nこの特約は以下の2種類があります。\n|*1||125cc以下の原動機付自転車および50cc以下のミニカーが対象となります。（借用中も含みます）|\n|*2||ご契約のお車が複数の場合、1台のご契約に付帯していただくだけで、補償の対象となります。|\n|関連リンク\n\n\n|《よくあるご質問》\n\n\nファミリーバイク特約の補償内容を教えてください。"}, {"id": "<urn:uuid:faeefa5b-57d5-4974-a38d-5f231ba512e6>", "text": "ポイントプローブ（POINTPROBE®）\nシリコンAFMプローブ\n世界中のお客様から最も多くの信用をいただいているSPM・AFMプローブです。\nPointprobe Tip\nPointprobe Side View\nPointprobe 3D View\nPointprobe® （標準探針）\nシリーズの標準探針は多角錘形状をしています。\n正面から巨視的に見た場合のハーフコーンアングルは20°- 25°、サイドから見た場合は25°- 30°。先端近傍を微視的に見た場合はゼロに近い値です。\nPointprobe®の標準探針は高さ10 -15 µm、先端曲率半径8 nm (代表値) 以下、\n12 nm以下を保証します。\n特徴\n- 高分解能測定のためのシリコンSPM・AFMプローブ\n- 市販されているほぼ全てのSPM・AFMで使用可能\n- 単結晶シリコン(Si)製のサポートチップの縁に探針のついたカンチレバーを配置\n- カンチレバー、探針、サポートチップを一体に形成\n材質\n- 高ドープ、単結晶シリコン(抵抗値 0.01 - 0.025 Ohm•cm)\n- コーティングなしの場合、固有のストレス"}, {"id": "<urn:uuid:ec7b03a6-9d76-4ca0-aadd-e403ddb8514f>", "text": "アンジェリークシリーズ\n|アンジェリークシリーズ|\n|ジャンル||恋愛シミュレーションゲーム|\n|開発元||コーエー|\n|発売元||コーエー|\n|1作目||アンジェリーク\n\n\n（1994年9月23日）\n|最新作||ラブラブ天使様～アンジェリーク～\n\n\n（2011年11月30日）\n|公式サイト||ネオロマンス・オフィシャルサイト：アンジェリーク|\n\n\n目次\n概要 [編集]\n女性向け恋愛シミュレーションゲーム市場を開拓したシリーズで、コーエーの女性向けゲーム開発チーム、ルビー・パーティーが開発したネオロマンスシリーズ第1作目。\n※『ネオ アンジェリーク』についてはアンジェリークシリーズに含まれないネオロマンスシリーズ4作目であるため本稿には記述しない。\n1994年に第一作が発売されたのちキャラクター増加と設定追加・変更という流れでシリーズが続けられた。\n登場人物 [編集]\nゲーム [編集]\n基本的にシリーズの世界観は『アンジェリークSpecial2』で前作の主人公が女王になっているなど女王エンディングが基本になっている。\n恋愛シミュレーション [編集]\n- アンジェリーク\n- シリーズ1作"}, {"id": "<urn:uuid:ba04b505-2547-442a-b169-4b1bf054037a>", "text": "はじめに\nこのソフトウェア コンフィギュレーション ガイドでは、シスコの Command-Line Interface（CLI; コマンドライン インターフェイス）を使用して次の Cisco 1800 シリーズ サービス統合型固定構成ルータの機能を設定する手順を説明します。\n• Cisco 1801、Cisco 1802、および Cisco 1803 DSL アクセス ルータ\n• Cisco 1811 および Cisco 1812J イーサネット アクセス ルータ\nここでは、対象読者、このマニュアルの構成、およびマニュアルに使用されているテキストとコマンドの表記法について説明します。この章は、次の項で構成されています。\n•\n「対象読者」\n•\n「マニュアルの構成」\n•\n「表記法」\n•\n「関連資料」\n•\n「マニュアルの入手方法およびテクニカル サポート」\n•\n「シスコのテクニカル サポート」\n•\n「その他の情報の入手方法」\n対象読者\nこのマニュアルは、ルータの設定に関する経験がまったくない、あるいはほとんどないネットワーク管理者から、高レベルの経験を持つネットワーク管理者まで、さまざまなバ"}, {"id": "<urn:uuid:1a3fe5d3-0a75-4abc-8b7b-2b7367f18591>", "text": "ＥＵ （欧州連合） は２００９年１１月１９日にＥＵ大統領 （欧州理事会常任議長） と外相 （外務・安全保障代表） を選出し、１２月１日から長年の課題であった新基本条約 （リスボン条約） が発効する。これまでのＥＵは理事会の議長国が半年ごとに持ち回りで交代し、議事運営も半年ごとに微妙に変化していたが、新制度では大統領の任期は２年半 （再任１回まで）、外相は５年と長期的なものになる。しかし、知名度の高いブレア前イギリス首相ではなく、控えめで調整能力に優れ、英・仏・独・蘭 （オランダ） 語に堪能なベルギーのファン・ロンパル首相が大統領に選出されたように、ＥＵは今後も各国間の利害や連合体としての統一政策で多くの混迷が予想される。\n遺伝子組換え作物の栽培や食品・飼料の輸入承認をめぐっても、ＥＵ各国はトウモロコシ栽培のセーフガード（緊急停止）発動や不毛とも思える安全論争を繰り返してきたが、トウモロコシと異なり約９０％を輸入に依存している家畜飼料用ダイズだけは、速やかに輸入承認するなど現実的な対応も採ってきた。しかし、飼料用ダイズの中に未承認の組換えトウモロコシが微量混入するケースまでは想定していな"}, {"id": "<urn:uuid:5ce56285-41c6-48b0-8ef4-0e759975fe35>", "text": "ウイルス、スパイウェア、スパム、フィッシング、個人情報詐取からご自宅のPCを守る、簡単操作の総合セキュリティ。\n専任のITスタッフをお持ちでなくセキュリティに煩わされたくない企業ユーザのためのシンプルな包括的セキュリティ。専任のITスタッフをおき厳格なコンプライアンスを運用されている企業ユーザ様は、「大企業のお客様」向けソリューションもご参照下さい。\n専任のIT組織をもち厳格なコンプライアンスを運用されている大企業ユーザ様向けのセキュリティ＆コンプライアンスソリューション\nマカフィーは、パートナーの皆様とともに成長するため、パートナー施策の拡充に努めています。\nCopyright © 2003-2013 McAfee, Inc. All Rights Reserved."}, {"id": "<urn:uuid:b904a270-5d39-43b0-a82d-f87dac4308f4>", "text": "\n\n弊社が提供する地上デジタル放送IP再送信（以下、地デジIP再送信）サービスでは、CAS/DRMとして「Marlin」を利用します。地デジIP再送信サービスに対応する受信機を開発・提供するためには、本ホームページにおいて提供する規則・仕様に従ってMarlinの実装を行うとともに、弊社が提供するMarlin鍵（Marlinの相互認証で利用する電子証明書等）を受信機に搭載する必要があります。\nMarlin概要\nMarlinは、家電向けに開発されたCAS/DRMで、Founderである パナソニック（株）、ソニー（株）、Intertrust、Philips、サムソンの5社が開発を推進してきました。Marlinの技術仕様である「Marlin IPTV-ES」はIPTVフォーラムにおいて策定されたIP放送、VOD、地デジIP再送信、ダウンロードの各サービスに対応しています。\n弊社の提供する地デジIP再送信に対応した受信機を開発・提供するとき、当該受信機には弊社が提供する「Marlin鍵」を搭載する必要があります。この「Marlin鍵」は、弊社が提供する地デジIP再送信用CAS/DRMサーバとの"}, {"id": "<urn:uuid:c26b8701-23cb-4532-8829-8413ad293ae0>", "text": "仏国寺\n|佛國寺|\n|所在地||慶尚北道慶州市進峴洞15|\n|宗派||曹渓宗（華厳宗⇒曹渓宗）|\n|寺格||曹渓宗 第11教区本寺\n\n\n|本尊||釈迦三尊仏（毘盧遮那仏⇒釈迦三尊仏）|\n|創建年||774年 新羅（恵恭王10年）|\n|開基||金大城|\n|正式名||佛國寺|\n|別称||華厳仏国寺\n\n\n法流寺\n|文化財||釈迦塔（国宝第20号）\n\n\n多宝塔（国宝第21号）\n蓮華橋・七宝橋（国宝第22号）\n青雲橋・白雲橋（国宝第23号）\n金銅毘盧遮那仏座像（国宝第26号）\n金銅阿弥陀如来座像（国宝第27号）仏国寺舎利塔（国宝第61号）\n石窟庵と仏国寺（世界遺産）\n|仏国寺|\n|各種表記|\n|ハングル：||불국사|\n|漢字：||佛國寺|\n|発音：||プルグクサ|\n|ローマ字：||Bulguksa|\n\n\n目次\n歴史[編集]\n1973年に発掘調査後、改修工事で無説殿、観音殿などが再建される。\n宗派と本尊[編集]\n高麗時代に書かれた『新羅国東吐含山華厳宗仏国寺事蹟』や仏国寺の寺誌『慶尚道江左大都護府慶州東嶺吐含山大華厳宗仏国寺古今歴代諸賢継創記』が示すとおり、もとは毘盧遮那仏を本尊とする華厳宗の寺院"}], "5": [{"id": "<urn:uuid:8f65c22c-32f8-40f4-9700-dce811f1fb11>", "text": "２００５クリスマス企画\nクリスマスを過ぎても・１ year later\n〜今年のクリスマスは〜\n１１月・朱音\n結婚宣言して１ヶ月。\n周りの視線は相変わらず痛い…\nバツイチとはいえ、出世頭でイイオトコでは３本指に入ってた本宮課長がいきなり同じ課の女子社員、それも目立たない、地味でオールドミス候補と言われてたあたしと入籍したってことがかなり気にくわなかったようで…\n結婚を意識してる女性達からの攻撃は主に化粧室、給湯室だった。\n「一体何を武器に結婚を迫ったんだか。あの貧弱な身体じゃ、本宮課長だってなかなかその気にならなかっただろうにね。」\n「よく相手にして貰えたわよね。酔ってるとこに付け入ったんじゃないの？いいわよね、同じ課だなんて。あたし達だって同じ課だったら…負けはしなかったのに。」\n総務の子かな？それと受付の関さんだわ。綺麗って言うより可愛いので評判だったはず．．．\n「ほんと、だったら結婚だって、子供できたとかいって脅したんじゃないの？」\n「ありえる〜〜〜」\nってトイレの中に居るんですけど？そんなこと言われてるのか、あたしって。\nその後しばらくでれなかったのは言うまでもなくって．．．意"}, {"id": "<urn:uuid:cbe36697-f3a2-41b9-a3c5-4161fa8bf027>", "text": "HOME\n> 体験レッスン\n初めてITBをご利用になる方を対象とした体験レッスンをご用意しています。 是非ご利用ください。 体験レッスンのご利用はお一人様1回（2時間）に限らせていただきます。\n体験レッスン\n（1回 2時間指導1回）\nチューターとの相性が合わないなどご要望がない限りは、原則体験レッスン時の担当チューターで入会後も引き続き指導させていただきます。\n詳細につきましては、ITB本部担当スタッフまでお気軽にご相談ください。様々なご要望にできうる限り対応させていただきます。\nお気軽にお問い合わせください\n株式会社個学舎 市進チューターバンク本部 〒171-0022 東京都豊島区南池袋2-12-5 英ビル３F Tel 03-6914-0967 Fax 03-6914-0968\nCopyright © 2011 KOGAKUSHA LTD. All Right Reserved."}, {"id": "<urn:uuid:7528d26f-156c-427b-9e1f-7d012f08fad3>", "text": "ペリカンのウエブサイトについて何かご要望やご質問はありますか？ペリカンの高級筆記具について何かご質問はありますか？\nご質問やご要望はいつでも歓迎いたします。\nご連絡を差し上げる為に、下のフォームにご記入ください。\nありがとうございます。\nメッセージは最大512文字まで入力可能です\nペリカン日本株式会社〒110-0005 東京都台東区上野1－1－12 信井ビル5階電話03－3836－6541"}, {"id": "<urn:uuid:da9911e9-f879-4d84-b58e-0cac8948a885>", "text": "|アルバイト検索サイト an：ご迷惑をおかけ致しますが、しばらく時間をおきまして、再度アクセスをお願い致します。|\n|戻る|\n|この画面が何度も表示されてしまう場合、以下のような原因が考えられます。|\n|■推奨されていないブラウザで閲覧している|\n|■CookieがONになっていない|\n|■JAVAscriptがONになっていない|\n|■応募・登録フォームの入力に30分以上かかっている|\n|■サイトへのアクセスが混雑している|\n以上の原因を解決しても、この問題が発生する場合や、その他ご不明な点がある方は、ユーザーサポートまでお問い合わせください。\nお問い合わせいただいた方には、anユーザーサポート担当者よりメールにてご連絡させていただきます。\n|このページを、お気に入り（ブックマーク）登録してくださっていた皆様へ|\n仕事情報は、掲載期間中に募集を締め切る場合や、アクセスするURLが変更されることもございます。"}, {"id": "<urn:uuid:29afc501-f284-4d1e-a240-0e7cdd6eaec6>", "text": "～屋敷の奥に隠匿された一族の忌まわしくも魅力的で淫靡な秘密……\n河原崎縄綱の64回目の誕生日、恋人の「杏奈」に同伴するかたちで河原崎家を訪れた主人公「優馬」。人里離れたこの屋敷で暮らしているのは、縄綱とその身の回りの世話をする使用人達のみ。夕食の席に姿を現した縄綱は、お祝いに集まった縁ある者達に「これからは皆で自分の世話をするように」と申し渡す。縄綱とその使用人達の異常さに不快感を覚えた「優馬」は、「杏奈」を連れて屋敷を出ようとするが、奇妙なことに彼がどう足掻いても再び河原崎家の門をくぐることになってしまうのだった。彼の眼前で繰り広げられる非日常的な現実……狂気に染まる淫靡で背徳的な世界がここに！\n「あの時にこうしていたら……」誰もが一度は思いながらも現実では叶わない、同じ時間軸で別の行動を試す事のできるゲーム、それが河原崎家の一族2！\nナビマップに優しく導かれ、縦筋に沿って穴を埋めていく快感を味わってください！\n緻密で背徳的なシナリオ、りんしん氏が描く可憐な美少女たちの淫猥なグラフィック、\nそしてムービー、アニメーションを含む超絶なクオリティーのゲームビジュアル！\nパンチラ、ムネチラ"}, {"id": "<urn:uuid:89f5fbcd-322e-4aad-a69b-778c179ce355>", "text": "User:Ows03786\nFrom Jomc490\n\n\n(→再挑戦の為に・・・: new section)\n\n\n(→今回絶品だったのは、皆様方も仰せなのですが、まずは恭太郎さん: new section)\n|Line 393:||Line 393:|\n<li>前者は帳票作成や出力をつかさどる帳票ツール群、後者は業務ユーザーのデータ集計・検索ツール群である<\/li>\n<li>前者は帳票作成や出力をつかさどる帳票ツール群、後者は業務ユーザーのデータ集計・検索ツール群である<\/li>\n|+|\n|+|\n|+|\n|+|\n|+|\n|+|\n|+|\n|+|\n|+|\n|+|\n|+|\n|+|\n|+|\n<\/ul>\n<\/ul>\nRevision as of 05:54, 20 January 2013\nperché in Prima dell'alba e tramonto\nAvete la tendenza a pensare i pensieri negativi in realtà, solo di punto in bianco? Per esempio, mentre si fa un lavor"}, {"id": "<urn:uuid:e25b5b43-c908-4d10-9f9a-ed47399524ea>", "text": "\n\n豆腐(るくちゃんにお借りしました) 大きいカラコンを入れるだ\n2013-05-20\nあと、カラコン忘れてる。……こらー。笑。\n日曜日カラコン破けたのつけてた左目が今更痛いんだけども。カラコンちゃうかった？度ないの？多分レポート。な気がする。お菓子食うなや！！(笑)。\nカラコン 豆腐(るくちゃんにお借りしました) 大きいカラコンを入れるだけで別人になることが証明された一枚 http://t.co/8kdiHr5T。 通販のフェイスマスク検索一覧です！ 何か聞いたことある♡こまお٩(*′∀‵*)۶♡ちょうどカラコン切れてたから頼んでみよ♡ http://t.co/N9SVt7Wm。\nカラコンオシャレ カラコン外したら消えた。左目。お気に入りやったし、もう販売してないやつやのに。立ち直れない。カラコン変えただけで こんなに雰囲気変わるㅋㅋ http://t.co/s79PjzF376。\nカラコン変えたら目やに結構出てくるんだけどなんなの(´･_･`)。\n\n\n新しいカラコン買わなきゃいけない。あー！給料下ろしにいかねば\n2013-05-17\n今週こそテニスしよう。まずはシューズにビッシリ生"}, {"id": "<urn:uuid:9e71a8e6-1a60-4e7f-8ca9-27df02e154a3>", "text": "一人ラーメンやってきたんです。中に入るまでは結構心細く居心地が悪くてたまらない心持ちだったのですが、店に入ったらそういうさみしさは感じなく、割と気楽。 友達に遠慮することなく、のんびりといられるって本当にいいですね！周りの目を気にしなくてもいいので、余計なストレスをためることもないですし^^\nただ、一人でそういう所を毎回訪れるのは、流石にまだ慣れてなくて恥ずかしいので、人が少ない平日を狙っていかないとダメです><勢いに任せないと自分の場合は途中で心が折れてしまうので…。\nしかも、ただって所にによってはかなり緊張しますよね;周囲がカップルばっかりだったら余計にドキドキしてしまいます。そのくらいただって難しいなので一人ラーメンを普通にできる人は本当にすごいなーと思います。女性の方は特に！でも最近はただ専用のサービスを提供している所もあるので、気軽にできるのが助かりますよね！きっかけがあれば、是非一人ラーメンしたいです\nサッカーが好きなわたしは最近初めてスタジオへ足を運んできました。本日は優勝を決める試合が開催されるということなので、競技場に行き着くと開場前からとっくに長蛇の列が完成してたん"}, {"id": "<urn:uuid:25b1a408-6315-49b1-a062-5e50adbc2317>", "text": "|不動産会社コード：501316|\n長岡京市・向日市・大山崎町の不動産専門店\n当社は平成８年の設立以来、お客様にとって本当に価値ある物件を提供するために、地元に密着したサービスと情報力で不動産を提供し続けて発展してまいりました。当社が設立以来徹底して貫いているのが真のお客様第一主義です。常に「当社はＮｏ．１の大企業ではありません。しかしお客様を大切にする気持ちはＮｏ．１です」をモットーにしております。情報の多さにも自信を持っておりますので、長岡京市・向日市・大山崎で物件をお探しの際はお気軽にお問い合わせ・ご来店下さい。\n駐車場は７台完備しております。キッズルームも約４．５帖ありますので、お子様連れでもご遠慮なくお越しください。\nキッズルーム完備\n|商 号||(有)不動産情報サービス||住所||〒617-0823\n\n\n京都府長岡京市長岡２丁目３０－３７\n|代表者||木村 勝尚||免許番号||京都府知事免許（４）第１０４４３号|\n|所属団体名||(公社)京都府宅地建物取引業協会会員 (公社)近畿地区不動産公正取引協議会加盟||保証協会||(公社)全国宅地建物取引業保証協会|\n|主な取扱物件"}, {"id": "<urn:uuid:d3770068-c323-4560-af04-6c1ee7cf8546>", "text": "2012年03月05日\nこのニュースは http://wiki.debian.org/DeveloperNews でまとめたものです。 寄稿はご自由にどうぞ。\nDebian メンバーのポートフォリオサービス\nDebian メンバーのポートフォリオサービス (以前は Debian 開発者のポートフォリオ サービスとして知られていました) が http://portfolio.debian.net/ で利用できる ようになりました。この変更の目的は、パッケージングをしない人も私達のメンバーとなった ことへの対応です。サービスはまだ開発中で、私がホストしています。サービスの改善の提案 や、皆さんの言語への翻訳を歓迎します。サービスのソースコード (Python/Pylons) は、 GNU Affero General Public ライセンスによる許諾のもと、公開 git リポジトリ で入手できます。\n-- Jan Dittberner\nPTS でのリリースゴールバグの表示\nパッケージトラッキングシステムでは、あなたが担当しているリリースゴール の一部となっている未解決のバグを、常にTOD"}, {"id": "<urn:uuid:20b2e3f8-746e-45de-bd9f-de3eab927789>", "text": "※指定されたページ（ＵＲＬ）へのアクセスは禁止されています。\n• ＵＲＬに間違いがないか、再度確認してください。再読み込みしてください。\n• ご利用中のユーザー様は 【\nロリポップ！よくある質問集\n】 をご参照ください。\n• 疑問点等ございましたら 【\nロリポップ！お問合せフォーム\n】 よりお問合せください。\nこの部分は iframe 対応のブラウザで見てください。\n株式会社 paperboy&co."}, {"id": "<urn:uuid:25cb0579-6a74-4cc0-a124-8199a7b951fd>", "text": "十年前、家族が倒れたときホームヘルパーを依頼した。サービスの内容や書類の作成など親切に分かりやすく説明してもらった。信頼感がぐっと増した。我が家担当の職員が紹介されたとき、なるほど、好印象を裏切らない人だった。数日後、訪問の際に好感度と信頼度はぐ～んとアップした。細やかに患者の様子を観察して、適切な対応をしてくれた。ホームヘルパーを依頼する時は、事業所を訪ねた時の対応や説明に安心感や信頼感がもてるかは大きなチェックポイントだと思う。ホームヘルパーは、専門の資格があります。資格取得については、講座や専門学校などがありますが、身近な資格の一つとしてホームヘルパーがあげられると思います。ホームヘルパーの仕事先には、老人ホームや自宅介護の家庭があります。老人の生活補助や食事などの身の回りのお世話が主になります。もちろん入浴補助やトイレの補助にもあたるため、ホームヘルパーという仕事や老人が好きな方にしかできない仕事でもあると思います。\n多摩動物公園（日野市）で、絶滅の恐れがある動物の赤ちゃんが続々誕生、公開され、関係者を喜ばせている。\n５月２５日に生まれたユキヒョウの赤ちゃん「スカイ」（雄）、「"}, {"id": "<urn:uuid:e2571397-4e4a-46bd-ad83-a712035d4050>", "text": "生涯メールサービス\n熊本大学生涯メールサービスは、卒業生と大学の直接の情報交換や連携を目的として、卒業生に生涯メールアドレスを発行し、大学からの最新の情報提供、卒業生から大学への意見・提言、卒業生同士の交流等を図るもので、「メール転送サービス」、「メール送受信サービス」及び「メールマガジン」の各サービスを提供するものです。\n卒業生を対象とした生涯メールアドレスの取得は、申請があり次第在籍確認を行い随時発行しています。\n大学からの情報提供については、「熊本大学メールマガジン」を発行しており、主に熊本大学のホームページにリンクしながら掲載しますが、卒業生からの情報提供、同窓会・同期会及びサークルOB会などの開催等の案内等も行っています。\n熊本大学 マーケティング推進部\nE-mail：kik-doso@jimu.※\n（迷惑メールへの対策のため、メールアドレスの kumamoto-u.ac.jp を※に置き換えております。）\nTEL：096-342-3129\nFAX：096-342-3149\n詳しくは、熊本大学生涯メールサービスのホームページをご覧ください。\nお問い合わせ\nマーケティング推進部"}, {"id": "<urn:uuid:a39dbd83-62db-452f-a49e-5bba0a6db7e6>", "text": "イギリスの街並み\n日本の街並み\n表向きは綺麗でも裏路地回れば汚いなんてオチじゃないだろうな\n観光地とかはいいけど郊外はむちゃくちゃ汚いぞ\n郊外なんてどこの国行っても醜いだろ\nアジアやもん、これぐらいゴチャゴチャしてないと\n>>2\n日本人の男には、このレベルの人間が多いから\nこんなことになっちゃったんだよ。\nほんとに男に際立ってこういう発言してる下品な育ちの奴が多い\n日本人は公共心が無いからね。\nだから土地利用も町並みも好き勝手のやりたい放題。\nぶっちゃけ、民度が低いんだから仕方が無い。\n日本の町並みはほんとにゴミだよな\nイギリス好きで昔一人旅でいろんなとこ言ったが\nヨークとエヂンバラは良かったな。\n帰りに飛行機の窓から関空が見えてきて\nあまりのゴチャゴチャ感と緑地の少なさに軽く鬱になった\nこういう風景も好きだけどな\n>>22\nどこ？\n>>219\n大阪ビジネスパークをバックにした大阪城。\n>>22\n俺が金持ちだったらこんな感じに都心に城建ててブーム起こしてやりたい\n>>34\n江戸城再建の話があるが皇居を見下ろしてしまうので駄目らしいなｗ\n>>45\n東京には皇居見下ろしてるビルいっぱいある"}, {"id": "<urn:uuid:4715769a-a2e9-4823-b6e8-cc6f02184a6e>", "text": "|読書・コミック||\n\n\nはぃな(´･ω･｀)ｂ題名通り\nブログ移転しまーす(´･ω･｀)\nhttp://wreith.blog39.fc2.com/\n↑(´･ω･｀)まったりすぎる絵描きブログですはぃ。。\nょヶればｄ(´･ω･｀)ｂ\n2008.03.03\n報告遅れたヶど自己推薦合格ヾ(´∀｀*)ﾉ ダーッ!!ｗ\nこれで楽に(´・ω・｀)ｗ（ぁ\n2008.02.05\n今日は私立高校の合格発表日でしたｯｗ\n見事合格＿|＼○＿ ﾋｬｯ ε＝ ＼＿○ノ ﾎｰｳ!!←でも絵ばっかり描いてた人\nゃはり隠れた実力・・・・・( ´_ゝ｀)ﾌｯ...（違うだろ（蹴\n絵は赤石のテイマｓです(´･ω･｀)ｂ\nちょぃ訂正版貼ればよかったけど（なら貼れ 、スキャナに通すのが面倒だったヵら、色づけしたのでもはろぅヵな(´･ω･｀)ｂ\nってヵ、誰か正面からの脚の描き方教えてください・・・・・*･ﾟﾟ･*:.｡..｡.:*･ﾟ＿｜￣｜○ﾟ･*:.｡. .｡.:*･ﾟﾟ･*\n2008.01.29\nカテゴリ：詩\n初詩ですなｗ\nまぁ、目を通すぐらいで流してくださぃ(´･ω･｀)ｂ\n俺のナイフがここに3本ある。\n3本ある内"}, {"id": "<urn:uuid:b5787e46-7bb8-42c3-b359-032b6bb265b9>", "text": "\n\nそうですよーっ調理師専門学校行ってるんで（´ω）\n2013-05-22\n「結婚」\nテレビで泣いたの久々かも 檀れいと結婚したい。\nおはよーまいまい!!息子氏たっち始めたなんてきっと美女ナンパも高度化するね！んでまいまいスリングbotしてたんだw知らなかったw 高校の先輩からもレスもらったんだけどピースリングの麻のやつ高いわ!! 綿素材で妥協するかも…グラデのが可愛くて欲しいんだけどね！泣。 スマ婚 評判 初心者の情報 えっとね、そんな凄い事じゃないのよ 結婚しても子ども出来ても歳とってもスンマロできんじゃんこれ！って思っただけ。車 ヾ ディーゼルエンジン ゼタバイト んー ブリトラキター セーブ カップル ´º﹃º｀ 希望 3kgm ルーツブロワー式スーパーチャージャー。なんだ結婚指輪か・・・。\nええ。宗教強調週間みたいなんやってるやん(･_･;あああ。2限はよはじまってくれたほがいい。チャペルの時間OC見れるやん？( *｀ω´) ねむねむ。婚約指輪って二人でつけるもの？それとも一方的にあげるもの??\n誰か結婚するのか・・ 小学校の同窓会と被ったから俺は行かんけど。\n2013-05"}, {"id": "<urn:uuid:f2f0ddd6-9634-488c-abd8-30e529e89e37>", "text": "オススメ相互リンク集\n当店Web Room KRYMはリンクフリーです。\nあなたのＨＰやブログで当店をご紹介して頂けると嬉しいです。\nお好みのサイズをコピー・張り付けの上、ご活用下さい。\n相互リンクをご希望の方は当サイトへのリンク掲載後,メールにてご連絡下さい★\nただし、アダルト・出会い系などのサイト、公的秩序に反するサイト、不適切と判断したサイトは\n掲載できませんのでご了承願います。\n★バナー（８８×３３）★\n★バナー（２００×４０）★\n★テキストバナー★\nプチプラ★レディースファッション通販KRYM\n★サイト説明文★\n当店は安モテ・安カワなレディースファッションのトータルサポートなネットショップです！\nお値段もおサイフに優しいプチプラばかり！悩めるレディース必見です！!\n脂肪吸引って本当に痩せるの？！体験談情報が聞きたい方はこちらのサイトでまとめてチェック！エステサロン.navi\n岩盤浴で驚くほどの汗を実感してみて！気分爽快です。二重info\n特訓次第であなたも二重になれる！二重情報はこちら！豊胸.net\n豊胸お勧めクリニック、多数掲載！インプラントex\nインプラント情報を掲載して"}, {"id": "<urn:uuid:7d8a0dbd-c5c7-4685-a09a-e32f62f3dcca>", "text": "\n\nトルコとユダヤ人\nダニエル・パイプス\nhttp://www.danielpipes.org/12256/\nTranslation of the original text: Turkey and the Jews\n今でもムスリム諸国に現存するユダヤ共同体は、弱体化し、将来がなく、半世紀前に存在した活力ある住民の抜け殻だ。エネルギーや野心のある人は誰でも、イラン、イエメン、シリア、エジプト、チュニジアから逃げた。残っている人々はかろうじて細々と生計を立てている。自分の国で、ビジネスや知的生活において評判ある役割を持たない。政治的には、潜在的な犠牲者として、あるいは安く手放される人質としてのみ、数え上げられる。ノーマン・スティルマンは『現代におけるアラブの地のユダヤ人』（1991年）で、彼らを「小さく、痕跡を留めた、消滅しかけている残り物」と正確に描写した。\nトルコでは、どれほど違っていることか！ここのユダヤ人は、西洋のように、国内で不釣り合いな役割を担っている。先頃、（ほとんど全てのトルコ系ユダヤ人が暮らす都市）イスタンブールを訪問した間、私は、二人のトルコの大立者に会う機会があった"}, {"id": "<urn:uuid:ebb1fa2e-25c1-4f38-8138-d30a7dbd717f>", "text": "トップ 404 Not Found\nご指定のページが見つかりませんでした。\nたいへん申しわけございません。\nアクセスしようとしたページが、見つかりませんでした。\nお手数ですが、下のメニューから、見たいコンテンツをごりようください。\nこのホームページに掲載されている内容の著作権は（株）クリーチャーズ、（株）ポケモンに帰属します。\nこのホームページに掲載された画像その他の内容の無断転載はお断りします。\nこのウェブサイト（http://www.pokemon-card.com/）は、株式会社ポケモン（http://www.pokemon.co.jp/corporate/）が運営しております。"}, {"id": "<urn:uuid:761a8243-ad43-46c3-b2cd-9edaa88e1365>", "text": "クオリティーは様々\n無料でブラウザでアクセスするだけでプレイできるものから、有料でダウンロードしてプレイできるようになるものまで、エロアプリにはさまざまにありますが、そのクオリティーも正直ピンキリです。\nアダルトゲームの開発者を目指すような人や、ゲームのプログラマーなどを目指すような人が、自分の趣味や、トライアルで制作しているものも多く、また、自分で作りたくなってしまってエロアプリを作ってみた、というものもあります。\n無料のものでも、女の子の絵が可愛くて、動きもリアルで思わず抜いてしまいたくなるものから、いかにも素人がつくりました、というものまでさまざまです。まぁ、後者でも味があっていいという人もいます。\nともあれ、アダルトゲームやエッチ動画の配信などが少なかったかつては、エロアプリも貴重なエロの資源でした。そのため、今から見ればちょっと質の落ちるエロアプリでも、その頃では多くの男子の股間を熱くさせたものもあるのかもしれません。\nまた、同人誌の延長で、人気の女性キャラクターが動くエロアプリについても、けっこう支持を集めていたかもしれません。\nアダルトゲームでは、エッチなシーンまで行くの"}]}, "cmn_Hani": {"0": [{"id": "<urn:uuid:c242561d-009f-4a43-b0bb-f75694e7456d>", "text": "省体育场重新铺设足球场草皮。\n新草皮耐旱耐寒。\n经过近10年的风吹雨淋，陕西省朱雀体育场（陕西省可口可乐体育场）容颜已老。日前，省体育场改建工程全面启动。将对球场草皮、座椅和电子屏等设施进行改建。预计工程将于今年5月底完工。由于中超联赛将在3月底开战，受此影响，宝荣俱乐部总经理成耀东昨天表示，浐灞队的主场初步确定在宝鸡举行。\n美国进口草种为场地换装\n记者昨天下午进入省体育场看到，负责球场改建的工人正在对足球场的草皮进行更新，原来的草皮已经全部铲除，不少工人正在铲土车的帮助下进行铺沙。\n据一位工人介绍说，球场完全是按照高规格在施工，因此程序上也比较复杂。足球场最底下是一层厚达50公分的石子，是属于渗水层，其目的是在遇到大雨天气的时候不至于积水。接着将在石子上面再铺一层厚度为30公分的经过过滤的沙子，“日前我们正在进行铺沙这一道工序。估计再有一周时间就能完成。之后，还将对沙子基础层进行杀菌处理，杀掉沙土中的细菌和杂草。”据负责工程的一位负责人介绍说，球场草皮更新的工作是于两周前开始的，预计到月底将完成基建工作。等到春节过后，也就是大约到了三月中旬天气变暖的时候，北京一家公司负责种植的草皮就"}, {"id": "<urn:uuid:2208f308-4136-4266-950c-7cefd3a7c3f8>", "text": "如何申请入学？\n请仔细阅读本节，选择适当的网页连接下载申请表格，打印申请表格，依照指示填写，再将申请表及相关文件资料交回 (传真或邮寄) 市场部。如有任何疑问或需要更多有关资讯，请联络学院市场部的职员，我们会很乐意为您提供帮助。\n纽西兰公民及永久居民\n- 请参阅开课日期及入学条件一栏，查阅有关课程申请要求，准备相关文件资料。\n- 下载enrolment application form，或联络市场部。\n- 正确填写入学申请表，并附上所需文件资料。如您想申请入读工商管理硕士学位课程，您必须另外填写MBA supplementary form、两页MBA referee form 推荐人表格。详情请参阅MBA入学申请程序。\n- 请将你的申请表格和所要求的文件资料一起递交到学院市场部。\n邮寄地址：AIS St Helens, PO Box 2995, Auckland 1015, New Zealand；\n传真：0064-9-8151802 或 8153762。\n- 学院受理您的申请，如有需要学院市部职员会联络阁下，或为您安排考试或面试。\n- 学院发出录取通知书。\n国际留学生\n- 请参阅开课"}, {"id": "<urn:uuid:845b5343-178e-4ca8-8734-2646d51c2c98>", "text": "集邦科技（TrendForce)旗下的LED专门调研机构LEDinside表示，根据该机构的最新价格调查报告，2011年Q4因库存出清影响，平均报价跌幅约10%左右。展望2012年Q1，经过上季报价大幅下跌，加上新产品推出效应，预估本季平均报价跌幅可望缩小。特别是2012年市场上的主流液晶电视背光规格LED元件将由新的规格(7030)封装体接棒。至于在照明领域， (5630)封装体在价格下降至一定幅度后，未来于LED照明市场的应用比重将逐渐增加，预估将会在中低功率的LED领域，将往下挤压到(3014)与 (3020)等LED封装体规格于照明市场的应用。\n2011年Q4 LED报价回顾\n2011年第四季市场需求疲弱，加上厂商出清库存影响，使得部分应用价格出现较明显的下滑，整体而言平均报价跌幅约10%左右。特别是在照明应用，因LED制造商面临库存压力，以及中小功率LED杀价竞争影响，使得大功率LED报价出现明显的下滑。\n2012年Q1 LED报价展望\n根据LEDinside观察1Q12的报价跌幅趋缓，电视背光规格(5630)跌幅约4%，(7030)在未大量量产的情况下，平均报价看来并不是很"}, {"id": "<urn:uuid:f508315f-6fca-40f5-9af1-85fdd1e59f13>", "text": "我們選擇這裡是因為網上的一致好評。。。我同意大多數的評論。! 令人驚訝的是在道道網上對於這裏並沒有很多好評,但是我們發現這個旅館幾個月前換了老闆,而且從那以後開始有好評了。! 安伯利出行很方便,到市中心只要步行5分鐘。你可以步行去尋找那裡很多家很棒的酒店之一。這也是非常接近河和聖殿酒吧,,你到那裡只要10分鐘, 主人西爾維亞很友... 更多\n地區： 愛爾蘭 > Province of Leinster > 都柏林郡 > 都柏林 > North City Centre\n設施：\n免費早餐 免費高速網路 接駁公車服務 殘障通行設施\n都柏林排名第 68 的民宿/旅店 (共 156 間)\n價位（每晚）： NT$2,316 - 4,061\n- 訂房選項：\n- TripAdvisor 非常榮幸能與 HostelWorld 合作，讓您可以保證預訂 安伯利酒店 的訂房。 我們每個月都會協助上千萬名旅客尋找最適合度假和商務旅行的飯店，而且隨時提供最優惠折扣和特惠方案。"}, {"id": "<urn:uuid:840abcf8-9705-4594-9209-735fb6ecc610>", "text": "TripAdvisor 是全球最大的旅遊網站，有 224 則旅客評論、123 張真實照片，以及 9 家愛荷華Newton的飯店價格。 TripAdvisor 由真實旅客的建議集結而成，為您提供位於Newton的最佳飯店評論。\n我們也與其他人氣旅遊景點合作，讓您可以輕鬆找到最佳價格。 如果要找在Newton的住宿，我們的合作夥伴也包括 Expedia, HotelsClick, Venere, Hotel Club, Agoda 和 Hotels.com。 這些合作夥伴可能依各家飯店而有所不同，在飯店網頁上方附近都會提供有特別介紹。"}, {"id": "<urn:uuid:81b1bac5-0828-48dd-a330-1712b6d80c6b>", "text": "Rotarians and Rotary Clubs\n2007年，Live Earth成功举办了全球有史以来规模最大的娱乐活动——“气候危机演唱会”（Concerts for a Climate in Crisis）。如今，Live Earth计划于2010年4月18日与陶氏合作，在全球多个国家同期举办陶氏Live Earth Run for Water大型活动。此项活动由一系列6公里跑步/健走活动组成（6公里代表着全球许多妇女儿童为了取水每天必须行走的平均路程），持续时间长达24小时。活动期间将举办音乐会及水资源保护教育讲座，致力于掀起一场声势浩大的全球运动，帮助解决水资源危机。Live Earth有幸与Wasrag（水与卫生扶轮行动小组，Water and Sanitation Rotarian Action Group）达成合作伙伴关系，并邀请全球各地的扶轮社参与此项全球水资源保护运动。您所在的扶轮社将如何参与此次活动？\n- 在2010年4月18日当天或前后举办一场本地跑步/健走活动，或其他形式的相关活动，致力于提高公众的水资源保护意识，并为全球水资源保护项目筹集善款。 点击此处"}, {"id": "<urn:uuid:fc82ea72-5666-4fb1-9c53-eb6c601193dc>", "text": "\n\n执行措施让市民有秩序观看抢包山\n\n\n＊＊＊＊＊＊＊＊＊＊＊＊＊＊＊\n市民热切期待停办了二十六年的长洲太平清醮抢包山比赛，将于五月十六日凌晨在长洲北帝庙游乐场的足球场重新举行，一系列措施经已订定，让市民有秩序观看抢包山比赛。\n今年的抢包山比赛是由康乐及文化事务署（康文署）和香港长洲太平清醮值理会联合主办，预计会吸引很多市民及游人前往长洲观看。\n康文署、离岛民政事务处、警务处及运输署今日（五月十二日）举行了记者会，简布有关的人群管理的措施。\n康文署助理署长（康乐事务）丘国贤表示：「抢包山比赛的开幕典礼于晚上十一时三十分举行，而比赛则于凌晨零时正式开始。\n「由于场地面积有限，除嘉宾外，只可容纳一千人观看抢包山比赛。北帝庙游乐场的足球场将分成五个区域，包括一个嘉宾区及四个供市民观看比赛的区域。\n「如欲进入足球场观看比赛的市民，可在北社海傍路的球场入口排队，于晚上十时三十分开始入场，顺序进入第一至第四区。\n他补充：「由于预计有很多市民希望到现场观看比赛，因此我们已安排在长洲体育馆及海傍街体育馆，分别设置六米乘六米及四米乘四米的显示屏幕，现场直播整个活动过程。\n「当足球场额满后，主办大会及警方"}, {"id": "<urn:uuid:edd42da3-3c00-4a0a-ad93-3fe4636931fc>", "text": "|Share:|\n（布城29日讯）首相拿督斯里纳吉表示，我国人民今年幸运的可以同时庆祝开斋节和第54届国庆日，对我国这个多元种族国家有着重大的意义。\n他说：“人民应该感到庆幸与感谢，马来西亚和平繁荣的情况，是任何人都无法否认的。我们就犹如在政治与经济洪流中，安稳处世的小岛。”\n他是在开斋节和国庆日献词中，如是指出。\n他表示，当世界经济巨头美国和几个欧洲国家都面临严重的经济危机，导致他们都需要援助时，我国依然可以继续发展经济，并创造就业机会。此外，政府也在双佳节前，拨出20亿令吉派发半个月花红给140万名公务员。\n不过，他指出，我国不能就此自满。他希望人民可以继续努力工作，提升技能，并善用所有机会，为自己以及后代开创幸福生活。\n他强调，政府的最高目标是以人民福利为先。政府理解人民的生活成本日益俱增，所以他们将继续采取行动，有阶段性而全面的改善这种现象。\n他表示，虽然食物价格上涨是全球现象，但政府有责任解决它。他指出，副首相丹斯里慕尤丁将领导供应和物品价格内阁委员会，探讨并解决这现象，还将有关目标列入国家关键成效领域（NKRA）。这一些举措，都证明了政府在努力为人民的美好生活而付出。\n此外"}, {"id": "<urn:uuid:485d06aa-3693-4503-a1d6-03a83185c0c2>", "text": "法语“Haute Horologerie”或者英语“High Horology”字面上解作高级制表。从某种意义上说，所有精良钟表制造均属“高级之列”，而IWC万国表的高级腕表更是需要灵巧手腕、优秀技术和精湛工艺的完美结合。 浏览文章\n照片 — Felix Streuli 日期 — 2011年08月29日\n葡萄牙Sidérale Scafusia腕表是沙夫豪森IWC万国表高级制表的又一颗瞩目新星。十年的深入研究，成就出这枚非凡杰作。设计团队包括来自不同学科的专家，在他们的帮助下，腕表成功地融入太阳时和恒星时。欢迎您一起深入认识葡萄牙Sidérale Scafusia腕表的幕后功臣。\n有些员工刚进入职场便开始参与本计划，至今这个项目可以说是占据了他们整个职业生涯\n斯蒂芬•艾因（Stefan Ihnen）\n接受制表训练，及后成为合格的手工制表工艺大师，修读微型及精密工程，持商业管理研究院学位。拥有十年制表经验。自2002年起出任IWC万国表的开发和设计人员。2006年委任为机芯研发部主管。2010年5月起成为技术总监，负责“Sidérale 项目”等工作。\n艾因：这枚腕表最迷人的地方是其复杂"}, {"id": "<urn:uuid:c54fef00-aed2-4058-83b6-b7f4fe1a6d16>", "text": "電話:\n地區： 紐西蘭料理 > 北島 > Bay of Plenty > Mount Maunganui\n設施：\n免費高速網路 免費停車 小廚房 套房 游泳池 殘障通行設施\nMount Maunganui排名第 1 的飯店 (共 7 間)\n價位（每晚）： NT$3,439 - 4,705\n- 訂房選項：\n- TripAdvisor 非常榮幸能與 Booking.com 和 Agoda 合作，讓您可以保證預訂 Baywatch Motor Inn 的訂房。 我們每個月都會協助上千萬名旅客尋找最適合度假和商務旅行的飯店，而且隨時提供最優惠折扣和特惠方案。"}, {"id": "<urn:uuid:78b87a90-94af-49b7-bc11-e768163e2ff8>", "text": "Bindon Bottom B&B\n特惠方案 套裝優惠\nLimestone Hotel\n特惠方案 房價省下 20%\nTripAdvisor 是全球最大的旅遊網站，有 1,426 則旅客評論、725 張真實照片，以及 19 家多塞特郡West Lulworth的飯店價格。 TripAdvisor 由真實旅客的建議集結而成，為您提供位於West Lulworth的最佳飯店評論。\n我們也與其他人氣旅遊景點合作，讓您可以輕鬆找到最佳價格。 如果要找在West Lulworth的住宿，我們的合作夥伴也包括 Booking.com。 這些合作夥伴可能依各家飯店而有所不同，在飯店網頁上方附近都會提供有特別介紹。"}, {"id": "<urn:uuid:d07ff457-5b2c-424b-831c-fd791f04f9ee>", "text": "1972年2月21日到26日，美國總統尼克松訪華，導致美中兩國打破多年隔閡的堅冰，實現兩國關係正常化。這次訪問被稱為“改變世界歷史的一週”。2006年，美國之音中文部派記者到美國和中國各地，採訪參與尼克松總統訪華的美中各界人士，請他們回憶有關訪問的一些重要史實和奇聞軼事，評價那次訪問的歷史意義。今年亦不乏重溫和最新披露。\n最後更新 10.02.2012 07:40"}, {"id": "<urn:uuid:70f7cb6d-027e-4133-8560-6efaac8363f8>", "text": "HP 融合雲端實現靈活性\n» English\n香港，2012年4月12日 – HP今天宣佈HP融合雲端(HP Converged Cloud)，為業界首個以共同架構(common architecture)為基礎的混合交付方式及組合，涵蓋傳統IT、私有、託管及公用雲。\n為企業而設計的HP融合雲端，將雲端的力量擴展跨基礎架構、應用程式及資訊層面，藉以提供：\n- 選擇 – 透過涵蓋開放及以標準為本的方式，支援多個hypervisors、操作系統及開發環境，以及異構基礎架構及可擴展的夥伴生態系統。\n- 信心 - 透過一個涵蓋訊息、應用程式及基礎架構的管理及安全方案。\n- 一致性 – 透過一個單一的共同架構\nHP香港董事總經理陳珊珊表示：「雲運算及流動連繫的融合正改變建設基礎架構、開發應用程式及傳遞訊息的方法。HP融合雲端讓企業得以把混合公用、私有及託管的雲端服務結合至他們現有的IT，以建立一個無縫的混合環境，藉此迅速配合不斷變化的需求。」最新研究顯示對新方法的需求\n由HP委託進行的一項調查(1) 顯示機構在服務交付方面正經歷重大的轉變；此外，調查亦指出越來越多的雲端方案在未經IT部門許可下被"}, {"id": "<urn:uuid:cfbe270c-b17f-4a1c-9f57-d0468e423e18>", "text": "有关Athina Hotel Delphi的评论\n评论和评分的解释\n下面为最近6个月内曾预订过该旅舍的顾客所发表的评论。\n评分框中的评论和评分都是基于实时反馈，是提交这些评论和评分的顾客而非 Hostelworld.com 的意见和看法。通过这种方式，您可以了解一家旅舍的最新服务情况。 查看我们的评论准则 »\n我们现在根据旅游经验，对评论用户进行了分类。\n- 新手: 1-10 评论已添加\n- 热心游客: 10-20 评论已添加\n- 旅游达人 : 20+ 评论已添加\n- 以特定的语言显示翻译好的评论\n-\n抱歉，这家物业在过去6个月中没有任何中文的客评。请 点击阅读所有客评。"}, {"id": "<urn:uuid:dc3c436e-959b-411f-8717-ea91452ff491>", "text": "注：此網頁的中文譯本不及原英文本新。\n雜項\n網站的這部份是所有不適合放在其他地方的事物。\nDebian distribution 與網站有贏得一些獎項，你在獎項頁面 可以找到。\n如果你想看由其他公司所製作有 Debian logo 的周邊商品，你會想看看我們的 Debian 周邊商品頁面。\n看看我們的網頁橫幅圖片，你可以用來推廣 Debian。\n有各式各樣與 Debian 有關的組織與計畫，我們以與它們連結的方式致謝。\nDebian 也有屬於各種不同組織的成員。\n我們也有頁面是給在筆記型電腦使用 Debian 的人。\n也有整個章節是關於映射(mirroring) Debian。"}, {"id": "<urn:uuid:d76d6063-d1af-4438-892d-4cc7a76082ee>", "text": "比利羅斯藝術花園\n以色列博物館內的比利羅斯藝術花園由日裔美國人雕塑家野口勇（Isamu\nNoguchi）設計，融合了不同文化；雕塑家將東方及西方的元素融合在中東文化裡，跟耶路撒冷神秘的背景互相輝映。園內收集了多位國際著名雕塑家的作品，包括瑪格達蓮納阿巴卡諾維茲（Magdalena\nAbakanowicz）、亨利摩爾（Henry Moore）、巴勃羅畢卡索（Pablo\nPicasso）、詹姆斯特瑞爾（James Turrell）及米哈厄爾曼（Micha\nUllman）的作品。\n花園坐落在博物館西面的斜坡上，由粗石造成的高牆和拱門支撐。花園設計理念和日本襌宗花園很相近：地面鋪上礫石，小徑兩旁種滿本地獨有的植物。此外，設計師採用不同種類、大小不一的石頭，結合混凝土和水等材料來突出花園設計。\n現在藝術花園已成為舉辦各種公共及私人活動、節日慶祝活動、嘉年華會及博物館活動的熱點。為期三天的以色列品酒節每年夏天都在這裡舉行。品酒人士在著名美國波普藝術家羅伯特印第安那（Robert\nIndiana）的作品《愛》（LOVE）旁邊，品嘗從多間以色列酒廠出品的葡萄酒。他們可以悠閒地坐在一旁，一邊欣賞現場演奏"}, {"id": "<urn:uuid:5af9bf9b-e7b3-485b-a254-d36a192c1d61>", "text": "摘要:谈起珍品，大家可能会想起郑板桥的作品，或是一把珍贵的军刀，而我家有一件珍品，对我们来说意义非凡。 我家的珍品是一台普普通通的录音机，在搬新家之前，许多陈旧的物品都不要了，唯独它(tā)留了下来，因为这台\n所属栏目：[六年级作文-话题作文]；\n文章出处：[小学生作文网]；\n关键字 ：[珍品,一件,我家,]；\n责任编辑：[admin]；\n我要收藏：\n谈起珍品，大家可能会想起郑板桥的作品，或是一把珍贵的军刀……，而我家有一件珍品，对我们来说意义非凡。\n我家的珍品是一台普普通通的录音机，在搬新家之前，许多陈旧的物品都不要了，唯独它留了下来，因为这台录音机里，有着每个人美好的回忆。\n以前，奶奶还比较年轻，下班回来，就靠这台这台录音机来缓解疲劳。听上一段黄梅戏，跟着“咿咿呀呀”地唱上几句，甚至有时还会伴着音乐，手舞足蹈，心情当然是很不错。\n爷爷对这台录音机也是情有独钟，听上几段新闻，了解了解国家大事，当然，他也会跟着轻唱一些抗日战争的歌曲，比如什么“地雷战”、“抗日之歌”……\n自从我上了幼儿园后，妈妈便给我买了许多故事磁带。夜晚，当夜深人静的时候，唯有我床头柜上的录音机还在“工作”，播放一段"}, {"id": "<urn:uuid:75745ad1-19bc-4b9e-a6f7-5d208bdcb903>", "text": "惠普ProLiant Gen8服务器家族再添新成员，增强虚拟化性能并推动企业云转型\n作为业界首款采用HPProActive InsightArchitecture的四路服务器，HP ProLiant BL660c和DL560Gen8服务器凭借高度的自我管理水平和连续的系统健康监测能力，帮助客户显著减少了维护时间，平均每年可为IT员工节省超过30天的管理时间(2)。\n客户正在不断对其计算密集型应用进行虚拟化，以实现更高的利用率和效率，并推动向私有云和混合云的迁移。很多客户都对基本的基础设施和规模较小的工作负载进行了虚拟化，但对于更复杂和更高端的工作负载，挑战仍然存在。客户经常面临性能瓶颈、数据中心空间和能源的限制，以及传统二路服务器缺乏足够的内存容量等问题。\n作为惠普融合基础设施的组成部分，此次发布的多处理器服务器能够满足客户对高端计算能力的需求，帮助客户扩展端到端虚拟化，并为构建私有云和混合云奠定基础。\n四路刀片服务器HP PoliantBL660cGen8通过将密度提高三倍(3)并缩小服务器体积，可在前代产品一半的空间内达到相同的四路服务器的计算密度(4)，并可减少多达30%的总体拥"}, {"id": "<urn:uuid:e1a706d6-e0c4-42c1-9372-634e9afd7559>", "text": "高通量同位素反应堆（HFIR）在橡树岭国家实验室设置集中冷中子世界纪录\nPublished on November 30, 2007 at 12:31 PM\n高通量同位素反应堆（HFIR）在能源署橡树岭国家实验室已成立了一个用来研究材料的冷中子浓度的世界纪录。\n橡树岭的罗恩科龙说分辨率高强度的中子，可以比世界上任何其他设施有较深入的研究材料的分子结构。\n“HFIR冷源提供了最激烈的冷中子束，”科龙说。 “这一说法，中子散射社区能够使用该光束来研究材料的结构。”\n橡树岭反应堆升级一年前开始，提供新的研究机会。\n“事实上，中子清凉提供了一个波的长度，让他们看看更详细的结构和较小的样品，”科龙说。"}, {"id": "<urn:uuid:9391f031-620a-40e5-a91a-a4c72b7b9dc4>", "text": "常见问题\n在这些页面，您可以找到关于我们服务的常见问题的解答，可分为若干类别。\n哪里可以获得有关起飞时间和到达时间的信息？\n如何预订航班？我能否飞往一个城市，但从另一个城市返回？\n如何获得最优惠的票价？为什么芬兰航空公司对自己的航班收取服务费？\n如何为网上预订付款？在线使用信用卡是否安全？\n我可以随身携带多少行李？如果我的行李丢失或损坏，我应该怎么办？\n应在什么时候抵达机场？哪里可以找到特定机场的抵达说明？\n在赫尔辛基机场有哪些停车设施，停车费用如何？有哪些机场服务？\n赫尔辛基机场的免税商店的营业时间是几点？如何在航班后购物？\n如何选择我的航班上的特殊座位？我的机票中是否包含餐饮？\n我应该为转乘中转航班留出多少时间？\n如果我的航班取消，该怎么办？如果我的航班预订超员，该怎么办？"}], "1": [{"id": "<urn:uuid:5fbf4069-e1d4-4d95-879b-bc4bef50584c>", "text": "雖然作為糾紛爭鬥的相關産品，早已停産，但是，“妹（M）”、“哥”（G）之間仍然誰也不願作出讓步，“哥哥”步步緊逼，耗資數千萬元，在全國各大主流媒體以購買廣告版面的形式，發佈與美的勝訴的專利案件，提示“侵權空調産品的商家立即停止銷售”，並提醒消費者“甄別侵權産品”。“妹妹”也毫不示弱，向媒體披露涉及的相關産品3年前已經淘汰，並呼籲對手不要以“很常見的技術競爭事件”借題發揮。\n我們説，如果僅僅從知識産權保護的角度出發，對侵犯專有技術的行為，用法律武器予以反擊，應當是值得鼓勵和讚賞的。因為只有這樣，企業才會更加注重技術的研究和開發，企業的市場競爭力才會得到真正的提高。但是，如果過度運用，並將此作為置對手與死地的手段，不惜一切代價，大肆渲染侵權行為，也是不可取的。從某種意義上講，是對企業自身不負責任。因為，這樣做的結果，會讓消費者對企業的氣度、企業技術研發的能力産生懷疑，甚至影響到企業在消費者心目中的誠信形象。\n就“妹”、“哥”之爭來説，從表面看，格力贏了官司，美的的市場形象受到了一定影響。但是，由於格力的過度渲染、過度把官司的勝訴作為打擊對手的手段。結果，自身的弱點也頻頻暴露在了消費者的面前"}, {"id": "<urn:uuid:f0801b2f-8a1d-4b37-bf43-164e4f0fc8de>", "text": "登录（或注册），检查了我们刚刚推出了新的功能！\n目前发现（第名单）：\n只提供给注册用户。\n这个站点被设计主要作为提示系统供合格的医师和其他医疗专家使用。 通过使用这个站点您了解并且接受DiagnosisPro.com不会使用作为一个诊断决策系统，并且不能使用做一个临床诊断或替换或者否决一位被准许的医疗保健专家的评断或临床诊断 (充分的使用条款). 我们遵循健康网络基金会的 医学和健康网站的行为准则. 点击这里核实\n© 2013 MedTech USA, Inc. (最后更新在05/18/13)"}, {"id": "<urn:uuid:7080e690-f065-4352-adf3-642c29ab37b4>", "text": "在迅速发展的数字时代，人们创造财富和积累财富的时间比电子时代大大缩短，这是一个产生奇迹的时代，一个独特的新职位往往意味着滚滚财源。高考即将开始，广大考生即将面临的问题就是报考、选专业;北大青鸟总结十多年办学经验，带您穿越火线了解2012最吸金的几大专业，让您了解行情中天天向上。\n新世纪对世界产生革命性影响的是信息技术，IT是高薪族的聚集地。从发展前景来看，未来最走俏的职业将是以下几种，如果你先知先觉的把握心战时机，潜心谋划，你就是未来职业发展的“黑马”。\n“吸金”专业一：3G软件工程师\n工业和信息化部发布数据，2009年中国3G终端用户达1500万，2010年3G用户总数有望突破一亿大关。国家对3G的扶持不遗余力，直接投资1609亿元，间接拉动国内投资近5890亿。3G整个网络建设的总投入资金在万亿以上，中国将是世界上最大的3G市场，预计直接市场价值在10万亿左右。庞大的用户群体，巨大的市场发展前景，为更多专业从事3G用户增值服务的企业和个人提供了机遇。北大青鸟安卓培训统计显示，2010年中国3G软件工程师缺口50万。市场供不应求，成就android开发工程师，进淘宝网、优酷、163、"}, {"id": "<urn:uuid:646d82d3-1ed5-492f-bdd2-94d628ff19b0>", "text": "\n\n钢铁侠2(2010)\n状态：BD高清更多片名：Iron Man II\n网友评论：\n剧情简介：\n派拉蒙与奇迹影业出品的动漫英雄大片《钢铁侠》以总票房三亿一千七百万美元的佳绩，成为今夏票房榜亚军。导演乔恩表示，《钢铁侠》当然不会就此结束。记者招待会上，他还对《钢铁侠2》目前的设想以及进展透露了不少讯息。\n乔恩称，目前他邀请贾斯汀·塞洛克斯为《钢铁侠2》撰写剧本。塞洛克斯是一位能编、能导、能演的才子，他作为编剧与“钢铁侠”小罗伯特·唐尼在《热带惊雷》中已有过合作，这部影片在今年暑期曾连续三周蝉联周末票房冠军。\n不过，对于《无敌浩克》最后一场戏中出现了钢铁侠这个镜头，乔恩表示，此后的剧情要如何发展他目前也没有头绪。\n另外在近日，《黑暗骑士》跃居IMAX票房冠军，许多影迷也渴望能在超大银幕上观看《钢铁侠2》，这些都促使乔恩想以3D的方式拍摄将续集搬上IMAX银幕，不过是否能够顺利实现，乔恩表示这就要取决于制片方的资金投入了。"}, {"id": "<urn:uuid:180818cf-6810-47fa-b625-790089f1b0ed>", "text": "通心面俱乐部(星期二， 2007 1月30日)\n“对巴厘岛的恐怖袭击，在2001年10月12日，毁坏了我们设计了的原始的Caruso通心面俱乐部。 第一个项目讲了话在地方传统的现代性; 新的项目讲话舒适和非进攻型的空间 -- 在国家哀伤的记忆充分将给人们‘生活之乐’的空间”。 D'Ambrosio说设计师Giovanni。\nGiovanni D'Ambrosio (星期二， 2007 1月30日)\nGiovanni D'Ambrosio，罗马，意大利档案\nKONE真空系统(星期五， 2007 1月26日)\n描述作为‘对一个传统清洁问题的一种非传统的解答’， KONE比一种规则装置出现更多象家庭口音，提供是时髦和工作的存贮解答。\nAsis范围(星期四， 2007 1月25日)\n模件产品帮助的Asis范围通过提供功能上可实行和审美谦逊的存贮解答de视觉上凌乱卫生间。\nNexus Product Design (星期四， 2007 1月25日)\nNexus Product Design外形， Finkeldey + Uetrecht，德国。\nKorzina (星期三， 2007 1月24日)"}, {"id": "<urn:uuid:0dd0ca74-15aa-4b15-8c4c-52fc5c34412f>", "text": "Leonid Leykin\nLeonid Leykin 一直渴望成為馬戲團表演者，而且一開始已醉心於小丑的角色。他畢業於舉 世聞名的俄羅斯零舍癲小丑學校（Licedei）。該校老師包括被譽為全球最偉大小丑的 Slava Polunin，他除了曾在太陽劇團的製作中亮相，亦在其著名的個人表演上擔綱演出。\nLeonid 曾是俄羅斯零舍癲小丑默劇團的成員多年，期間周遊列國巡迴演出，並首次踏足 北美洲。在這段期內，他曾從事的工作還包括：在俄羅斯執導劇目；在俄羅斯電影演 出；經常在莫斯科馬戲團粉墨登場，以及在他本人的電視節目中亮相。該節目除有喜劇 環節外，亦有俄羅斯名人擔任嘉賓。\n對於 Leonid 而言，擔當小丑背後的信念絕非只是以滑稽動作來逗人發笑。他說：「小丑具 有很大自由度，即使於前蘇維埃時代，小丑仍能冷眼旁觀，以風趣幽默又或是悲情傷感 的手法來反映世情。」\nLeonid 於 1993 年首次獲得太陽劇團邀請加盟，但由於他在零舍癲小丑默劇團的成就非 凡，令他婉拒了太陽劇團，直至 1997 年才告加盟。及至 1998 年，他參與《飛躍之旅》 （Alegria）在歐洲的巡迴演出。而在 2000"}, {"id": "<urn:uuid:29304682-4c95-4650-aabc-4199f9adb3d9>", "text": "作者精彩訪談（原文摘自英國亞馬遜網路書店Amazon.co.uk）\n●《別相信任何人》是你的第一部創作，你一直想成為小說家嗎？\n──沒錯，我從很久以前就想寫小說。其實我小時候立志當清潔員，但到了八歲以後，就開始夢想將來在書架上看到自己寫的書，想像有讀者拿著它的畫面。我任職於英國國民保健服務計畫，但心裡一直曉得，自己終究會回來完成這個重要的夢想。\n●小說的主題探討嚴重失憶，你的靈感從何而來？\n──我在報上讀到美國男子亨利‧古斯塔夫‧莫萊森（Henry Gustav Molaison）的訃聞。他死於2008年，在1953年曾接受腦部手術，治療車禍造成的癲癇症，但術後卻得了失憶症，無法建構新的記憶。我不禁想到，他每天早上醒來，必定仍以為此刻是1953年，而他仍是20多歲。我試著想像當他面對鏡子、意識到對自身的處境知之甚少，會感到何等震驚、無措。就這樣，小說的主角克莉絲汀在我腦海浮現了。\n●你花了多少心力蒐集和失憶症有關的資料？\n──我費了不少心力，希望小說中提到的醫學層面都真實可信，但我也不想把失憶症寫得很瑣碎或煽情。我想努力去理解失憶症患者的感受，或是和這些患者共同生活的人的感受。蒐集資料"}, {"id": "<urn:uuid:c7b9b56d-bd54-44ad-8b44-e041d0a1423e>", "text": "首页\n标签\n找人\n活动\n意见反馈\n帮助\n我要提问\n这里是\n匿名提问\n所提的问题，您需要登录才能参与回答。\n“天涯问答”是天涯社区旗下的问题分享平台。在这里您可以提问，回答感兴趣的问题，分享知识和经历，无论您在何时何地上线都可以访问，此平台完全免费，而且注册非常简单。\n快速注册天涯帐号\n己有天涯帐号？\n登录\n为什么酷我音乐盒没有声音\n只是单纯播歌就没有声音，可是播MV又有声音，重装过了也没声音，怎么会这样？\n匿名提问\n2009-12-05 20:00:02 发布\n0个回答\n时间\n投票\n分享到：\n立即登录，登录后可回答\n相似问题\n为什么酷我音乐盒没有发行者\n1\n回答\n为什么酷我音乐盒没有页面显示啊\n0\n回答\n为什么酷我音乐盒的mv打开后只有声音而画面是雪花看不到画面\n1\n回答\n为什么酷我音乐盒能放歌而在线视频却放不出声音\n0\n回答\n为什么酷我音乐盒无法播放?总是说列表中没有可以播放的歌曲?\n1\n回答\n搜索\n4068\n人看过这个问题\n0\n人收藏\n×\n等待你回答\n你對誰說過：“我爱你”三个字？\n一起说说中国电影圈的那些事？\n你曾幻想过自己未来的老公吗？\n7年前小李的年龄是他爸爸的1/3，7年后"}, {"id": "<urn:uuid:af1923d8-5339-4fb5-bcbd-a19beeada58b>", "text": "\n\n大月觀用心看待自然萬物化育而生的美意，悉心取材韓國歷代皇室御用、\n海拔七百公呎處的長水石，透過工匠師傅傳承的手藝，精心開鑿黝黑石鍋\n，也因質地粗、細孔多，把多餘油脂完全吸收，將食材的自然鮮味及精華，\n淋漓盡致總和於湯底裡。\n\n\n欲將風味萬千的美味呈現予您，大月觀深入秘境尋找美味，級選優質雪花牛肉\n、 小羔羊、遠洋近海魚蝦貝、布袋蚵仔及當令時蔬…，搜羅所有山川海味，\n佐入 風味各異的石鍋湯底裡，加進數十種當季蔬果慢熬，口感自然甘美的珍\n饗石樂鍋、 擇以自家私房泡菜入味，口感酸香帶辣的恬辛泡菜鍋、取自古法\n自然發酵的酸白菜 熬煮，湯頭清甜愈煮愈爽口的臻月酸菜鍋，最後再煮上一份\n黃金稀飯，為這精采的 美味，做一個完美的ENDING。"}, {"id": "<urn:uuid:118e3664-1d4b-4e28-8b9a-d5d99775044a>", "text": "|© UNICEF/NYHQ2008-1508/Holtz|\n|孟加拉一名卫生工作者展示一种可预防五种常见儿童疾病的疫苗。这五种疾病分别是B型流感嗜血杆菌、白喉、破伤风、百日咳和乙型肝炎。2009年的免疫运动由世界卫生组织和联合国儿童基金会等共同组织。|\n伊丽莎白.基姆报道\n美国纽约，2009年10月21日 – 尽管现在接种预防致命疾病疫苗的儿童比以往任何时候都多，但是由于缺乏充足的资金和更好的渠道，至少还有2400万名婴儿未受到疫苗的保护。\n联合国儿童基金会、世界银行和世界卫生组织今天发表的一份报告指出，五分之一的儿童没有接种麻疹、破伤风和白喉等可预防疾病的常规疫苗。\n根据这份名为《全球疫苗和免疫现状》的报告，最近儿童死亡率降低的直接原因是免疫接种率提高的结果。\n联合国儿童基金会执行主任安.维尼曼说：“2000年至2007年期间，全世界麻疹死亡人数减少了74%，接种疫苗对此发挥了重要作用。这一成绩必将激发新的努力，为全球儿童接种疫苗，预防威胁生命的疾病。”\n成效显著\n《全球疫苗和免疫现状》的发布强调了疫苗接种在预防传染病方面的突出作用。当前，全球许多国家正面临着急需大量预防H1N1病"}, {"id": "<urn:uuid:ac8ad302-e352-419a-a35c-c6aa36621577>", "text": "逃离利比亚冲突\n在联合轰炸之前，阿拉伯利比亚民众国的冲突和暴力将居住在这里的人民置于危险之中，其中许多人被迫逃离。\n在冲突早期，离开阿拉伯利比亚民众国的主要是外国劳工。但是，随着冲突的加剧，越来越多的利比亚国民也开始向邻国寻求避难。\n世卫组织一直在帮助周边邻国协调为逃离战乱的人民提供所需的医疗应对支持。本图片库生动展示了群众离开阿拉伯利比亚民众国时遇到的困难。\n利比亚人与家人逃离冲突，穿过边境进入尼日尔。\n许多逃离的民众仅带走他们能够搬得动的财物。\n突尼斯一个中转难民营收留了1.8万名等待安全返家的人民。\n这名外来劳工手举标识，希望能搭乘飞机回家（65%的移民来自孟加拉国）。\n营地居民排长队等待派发突尼斯和国际人道主义组织提供的食品和水。\n来自突尼斯公共卫生部的医疗小组为数千名穿越边境的人们提供医疗救助。\n世卫组织与公共卫生部在利比亚边境协调卫生行动。\n世卫组织及其合作伙伴为受到此次危机影响的人们分发医疗物资。\n一辆载有世卫组织工作人员和创伤物资的卡车从埃及穿越边境进入利比亚，以便允许开展外科干预措施和治疗。\n由于逃离冲突的家庭数量持续上升，世卫组织正支持埃及和突尼斯卫生部提供卫生服务"}, {"id": "<urn:uuid:81f8d400-1c56-428e-9d8a-995a4c41e251>", "text": "谢尔盖·亚历山德罗维奇·叶赛宁\n|谢尔盖·叶赛宁|\n|出生||1895月10月3日\n\n\n康斯坦丁诺沃，梁赞\n|逝世||1925年12月27日 （30歲）\n\n\n圣彼得堡\n|職業||抒情诗人|\n|國籍||俄罗斯|\n|創作時期||1915–1925|\n\n\n目录\n概况 [编辑]\n1912年，叶赛宁来到莫斯科，在一家印刷公司当校对员。次年，他申请就读莫斯科国立大学，并作为一名外来学员在那里学习了一年半。早期时候，他的诗的灵感大都来自俄罗斯的民间传说。1915年，他来到圣彼得堡，渐渐结识了亚历山大·勃洛克、尼古拉·卡拉约夫、谢尔盖·高罗德斯基（Сергей Городецкий）和安德烈·别雷等当时俄国的著名诗人，并于同年发表了第一本诗集：《亡灵节》（Радуница），开始闻名于文坛。\n勃洛克促进了叶赛宁作为诗人的早期创作生涯，并与卡拉约夫教授他抒情诗歌方面的一些写作技巧。而别雷则在诗歌的形式方面对叶赛宁有较大指导和影响。\n婚姻 [编辑]\n1921年秋天，在叶赛宁访问阿列克谢·雅科夫列夫的工作室之际，他认识了美国舞蹈家伊莎多拉·邓肯——一个比他年长18岁的女子。他们在1922年的5月2日结婚，然"}, {"id": "<urn:uuid:889af3ce-976f-4126-b90f-052003a496c3>", "text": "\n\n在2011年第八届WRO的赛场上，主办方邀请了众多世界级的乐高名人到场，向来自各国的参赛选手一展乐高世界的迷人风采。\n本论坛有幸参加这场盛会的人，当然也不会放过这个向各路乐高界名人讨教、介绍论坛的机会。\n首先我们来看看现场的景象吧。以下这段视频是转载自 Mark Crosbie （他也在现场，稍后会有对他的详细介绍），正如 Mark Crosbie 所说：这些大神们在现场是为了向来自全世界的孩子们展示乐高头脑风暴机器人到底能做些什么。（能在如此短的时间内剪辑、制作出这段高水平的视频，这些大神们的专业精神着实令我钦佩）。\n笔者在现场向各位大神讨教的同时，也向他们讲述了中国乐高迷们对他们的喜爱，并介绍了本论坛一直在转载他们的博客，向国内介绍他们和他们的作品，感谢他们让我们分享乐高的乐趣。各位大神欣然提笔，为论坛签名，并写下了祝福。\n再次感谢这些世界级的乐高高手们。\n本论坛也将向大家逐个介绍这些高手和他们的作品。\n按照上面签名的顺序，让我们先来认识一下这些高手：# F! b8 C. S+ o7 [\" u* ~) R* l"}, {"id": "<urn:uuid:bc422f46-1a91-4cfc-9551-8ed0b1f8f92d>", "text": "研究和市场公司宣布除了抗病毒治疗-技术，市场和公司 “，他们的产品的耆那教PharmaBiotech的新报告“ 。\n该报告回顾了当前国家的抗病毒药物的方法，包括疫苗，药品和疗法交付的创新技术的最先进的。引进开始与实际分类的病毒性疾病，根据其商业上的重要性。各种抗病毒药物的方法，包括药品和分子生物疗法，基因疗法和RNA干扰（RNAi）以及病毒感染的疫苗，如描述。专家的意见是目前存在的问题和抗病毒药物治疗的需求。 SWOT（优势，劣势，机会和威胁分析）的抗病毒药物的方法是对一个理想的抗病毒药物的概念背景下提出的。\n本报告的一个新特点是使用纳米技术在病毒学及抗病毒疗法的潜力。纳米粒子与病毒之间的相互作用进行了阐述。 NanoViricides聚合物胶束，纳米药物来消灭病毒。本地以及全身抗病毒药物和疫苗提供的各种方法进行了阐述。纳米生物技术中起着重要的作用，改善抗病毒药物的交付。交付基因为基础的，反义和RNAi抗病毒疗法的优势和局限性进行了讨论。\n抗流感措施适用于人类以及禽流感的形式进行了阐述。虽然它是小于与金刚电阻可以开发针对神经氨酸酶抑制剂。考虑到这些问题，有必要为一个更有效的代理。替代抗"}, {"id": "<urn:uuid:0f0738c2-4097-4bf6-bdbc-ce8096155326>", "text": "尝试给自己一点时间，静下来、慢下来，用一种自然而有趣的方式，慢慢享受生活，用宁静洗涤喧嚣的疲倦——所以看看爱稀奇为这个即将到来的春节和寒假准备了什么吧，你知道，慢慢用手做出来的快乐，是真实而朴素的快乐~请看囧死人的机器人纸巾盒和星战AT-AT风格多功能收纳盒：\n【规格】\n尺寸：没测量。机器人的脑袋比一卷纸巾大一点。\n包装：环保牛皮纸盒\n材质：5MM E1 级环保中纤板（非木质！）\n内含：DIY超囧机器人纸巾盒所需的所有零件（含囧、怒、严肃三面表情！）、并附送砂纸、螺钉和蝴蝶螺母等。\n2、星战AT-AT风格多功能收纳盒 (收线盒/储物盒/名片盒)：本来，这AT-AT步行者本是星球大战中帝国方经典的陆战武器，其威猛的造型让人不寒而栗——可惜的是，在帝国毁灭之后，它也落得个英雄无用武之地，只好化身为多功能收纳盒服务大众了~集收线盒、储物盒、名片盒于一体，DIY完成后，造型和AT-AT步行者外观非常相似，各个关节同样可以活动，摆出各种POSE，甚至是趴地上等待爱抚的“狗狗”，哈哈。爱稀奇淘宝店、拍拍店、有啊店有售。\n【规格】\n尺寸：主体盒身尺寸约28CM X 19CM X 11CM\n包装：环保"}, {"id": "<urn:uuid:d9e75caf-b793-4db7-9aff-de9779ff7d61>", "text": "\n\n记者: 海涛 | 华盛顿\nREUTERS\n刘晓波获诺奖一周年\n*海外中文网：刘晓波诺奖恐收回*\n海外一些互联网中文媒体近日报道说，有关方面正在调查近几年诺贝尔和平奖是否违背诺贝尔初衷，刘晓波、奥巴马得奖“恐收回”。这一报道引起中国大陆互联网站的重视，并得到广泛转载。\n中国大陆互联网站《中国网》等许多新闻网站都报道说，奥巴马和平奖恐不保。他们的消息来源是中国台湾网，而这一消息原来的标题是：评审受查 ，刘晓波奥巴马和平奖恐不保。\n该报道是根据“英文《斯德哥尔摩新闻》网站”的报道。而该新闻网站2月1日只是刊登一条只有三段的“豆腐块”新闻，题目是：挪威诺贝尔委员会受到调查。(Norwegian Nobel Committee to Be Scrutinised)\n*瑞典首都行政当局关注这种批评*\n报道援引Daily Dagens Nyheter的报道说，斯德哥尔摩县行政当局开始对挪威诺贝尔委员调查，调查的目的是了结该委员会是否按照诺贝尔的遗愿来颁发和平奖。\n报道说，和平奖委员会一直受到垢病，说其把奖项颁发给了奥巴马、基辛格这样的政客，还颁发给只是关注环境而不是推动和平以及裁军的美国人戈尔。"}, {"id": "<urn:uuid:3a39d69e-f5f4-42b6-9ab2-7647ddd0a774>", "text": "為與他們的血液和小的設備下落的癌症測試人員將可能很快是可能的。 作為歐洲研究計劃一部分，科學家發展了檢測的 HSP70 蛋白質一個設備，用有癌症的許多類型的病人過表示。 目的： 做一個診斷非常及早在疾病進程中，從而改進患者的結果。\nHSP70，指示在人體的蛋白質重點，是前列腺、冒號、食道、肺和腦癌的一生物標誌。 因此能跟蹤在患者的此蛋白質，更可能使早診斷癌症的這些類型，為醫生是非常有用的。 作為 「Spedoc」歐洲研究計劃一部分， EPFL 小組發展一個非常敏感，易用 HSP70 檢測平臺。 設備，大於一隻小提箱沒有，在 2014年預計在這個市場上。\n它如何運作？\nSpedoc 平臺要求患者的血液的仅下落。 這滴血液在包含許多微通道的籌碼被插入。 在其中每一條通道裡面是從金子做的微小和圓的結構，與被設計 「捕捉」 HSP70 的特殊 「抗體」表面化學。 因為這滴血液流經通道， HSP70 蛋白質由結構困住，有在路的千位這滴血液通過這個籌碼按照。\n下一個步驟在這個進程中介入先進的 plasmonics，這個小組使用確定在圓的 nanostructures 困住的 HSP70 蛋白質的數"}, {"id": "<urn:uuid:eb8e81ff-38a4-4dad-a775-ba6f4152304e>", "text": "影响\n透过“开放式课程网页”计划，麻省理工学院让教授们的核心教材开放给世界上所有的人，从任何地点都可以利用网络使用教材。我们发现，藉由提供超过九百门课高品质的麻省理工学院的核心教材，这个专案帮助了那些我们原本设计来帮助的人，如：老师，在学学生，还有世界各地的自学者。\n这造成什么不同吗?麻省理工学院开放性网页评估小组正在研究使用这个网站如何改变个人的教学与学习经验，我们也想了解开放性网页可能产生的广泛影响。早期的研究结果显示出如下的结论：\n为了衡量长期效益，我们发现对麻省理工学院以及其他社会上教学机构第二阶段的任务将是:会不会有其他想法接近的机构也开始将教材放在网络上供大家自由免费取用?我们希望有一天藉由分享麻省理工学院的教材，搭配上发展开放性网页的出版过程，可以启发其他学院开放分享她们的教材，为人类社会建立一个全球性的知识网络。\n我们知道那些受益于开放分享知识的人，可能因身处于发展中国家，缺乏网络使用而受到阻碍，我们势必不能让这样的问题妨碍了对未来的远景，而是必须将其视之为挑战。那些世界顶尖的学校主管们，可不可以像我们一样，利用我们在校园内的工作来提升全世界人们的生活水准呢?历史已经证"}, {"id": "<urn:uuid:9e8f06a9-8c7d-46e9-83e5-339a1d771056>", "text": "- 24\n- Feb\n最近正在把Ubuntu Tweak的Web App从Ember.js从1.0 Pre 2升级至前不久刚刚发布的1.0 RC1，已经差不多接近尾声了。\n今天在Ubuntu Tweak里面调试的时候，发现了一个以前没有的奇怪的地方：\n如图，只要是当前被激活的分类，如Browser这个分类，都会被一圈虚线包围着，很难看：\n前端开发经验丰富的人肯定一眼就能看出来了，作为一个野生的前端开发人员，我判断这是我在升级至Ember.js 1.0 RC1后用了{{#linkTo}}这个handler后产生了a元素导致的，然后通过搜索focus关键词解决了问题，只需要在CSS里加这么一行：\n*:focus { outline: none; }\n这样就可以把它去掉了，然而它的后果是用Tab导航的时候就出现不了任何效果了，幸好这不是紧迫的问题。\n后来引申开去看了一些outline的资料，发现不同的浏览器之前对这种focus的outline的定义完全不一样，比如Safari会渲染出蓝色的Outline（为了和OS X的主题相适应）、而Android上的Browser则会渲染出橘黄色的Out"}, {"id": "<urn:uuid:5c1290d2-08a9-49dc-a181-b0fd42e458dc>", "text": "皇冠足球吧\nwww.chinashuangxing.com致力成为博彩行业领航者博狗博彩网\nwww.jjwaterwares.com现金博彩通 太阳城开户 网址代理 足球网址网上博彩\nwww.sdquandi.com提升球迷足球投注的准确率现金百家乐\nwww.zzqonline.com是数千万彩民的足球网址查询助手\n博彩通火车站这个地方，我 相信 对大多数人来说，都不算陌生，每个人都有着不同的感受与感知，对每个地方的火车站，都有着不同的 情感 ，虽说只是一次小旅途，但却 充实 着 生活 中的五味杂陈，博彩通想想也是，我们的生活不就是由这些 平淡 无奇的小旅途拼凑起来的吗？"}], "2": [{"id": "<urn:uuid:fcee412a-79e3-49ca-8d15-929cddd8104e>", "text": "工作不顺心时，很多人就想“裸辞”，潇洒走一回。但有没有计算一下“潇洒”的成本呢？昨天，记者请农业银行、中信银行、光大银行的理财师为25岁、35岁、45岁的人群，依据国际上流行的“全生涯仿真表”，模拟测算了一下“裸辞”之后的生存成本。\n通过测算，理财师\n们发现，如果人在25岁时，没有400万元以上的财产，是没有底气对老板说“不”的。而45岁以上的人，子女已长成，若是有了500万元的财富，对生活质量要求不高的话，也可以“裸辞”。35岁左右的人，上有老下有小，没有千万资产千万不要说“裸辞”，就算是换个工作都要格外谨慎。 25岁：“裸辞”后的日子不好过 不生病不娱乐一生得花543万\n80后小彭，大学毕业三年，没有一份工作能做到半年以上。几天前，他又在公司“消失”了，什么都不要就辞了职。\n农业银行武汉分行武汉农行理财师(AFP持证人)万承洁测算，现年25岁的小彭，若是60岁退休，80岁终老，期间必然面临购房、结婚、生育、子女教育、退休养老等一系列问题。通过全生涯仿真表测算，客户以现值每月1500元的生活费计算，加上通货膨胀率，到80岁共需生活成本112.8万元；如果在30岁生育一名子女，并供小孩"}, {"id": "<urn:uuid:d3358781-7603-470c-afea-92d1ce224bd1>", "text": "使用条款\n谢谢阁下到访本网站 www.benoy.com 。在使用本网站之前，请阅读以下用户使用条款。本网站由贝诺有限公司（下称“我们”）运营，贝诺有限公司是一家在英格兰注册成立的公司，其注册办事处位于Handley House, Northgate, Newark, Nottinghamshire NG24 1EH（公司注册编号 2734642），增值税注册编号为613 6259 50。我们运营本网站旨在宣传我们提供的服务，一经使用本网站，即表示阁下接受这些条件，在此情况下，我们将向阁下提供到访权。我们可能不时修改条款，请在到访或使用本网站时不断查阅使用条款。如果阁下在任何时间不愿接受这些条件，则阁下不得使用本网站。\n免责条款\n虽然我们尽量保证本网站信息的准确性，但我们无法确保本网站信息或材料的准确性或完整性，亦不就此做出保证。我们对第三方提供的内容概不负责，且仅向阁下提供到访该等内容的权利。我们并无义务验证该等信息内容，亦无义务编辑第三方提供的任何该等信息。我们并无认可、支持、声明或担保任何第三方详情的真实性、准确性或可靠性，且阁下承认对该等信息加以依赖的风险均将由阁下自行承担。\n"}, {"id": "<urn:uuid:beedbe0f-378a-42aa-b1f2-6f1ebf4a0b2a>", "text": "\n\n第 3 卷 第3 期，2006年7月\n社區的聲音\n俄勒岡州波特蘭非洲裔美國人健康村\nCorliss McKeever, MSW, Nancy Koroloff, PhD, Collaine Faddis, MPH\n建議在引用本文時注明下列出處：由McKeever C, Koroloff N, Faddis\nC所著的《俄勒岡州波特蘭非洲裔美國人健康村》[摘要]。2006年7月[引用日期]刊載於《慢性疾病預防》[網上期刊]。可從下面網址獲取：URL:\nhttp://www.cdc.gov/pcd/\nissues/2006/\njul/05_0211_zhs.htm。\n摘要\n俄勒岡州80%以上的非洲裔美國人居住在波特蘭大都會地區；非洲裔美國人占了該州人口的1.7%。儘管相對人口數量較少，該州的非洲裔美國人人口健康仍然有顯著的不均衡性。成立了非洲裔美國人健康聯合公司（African\nAmerican Health Coalition,\nInc）以實施措施，降低這些不均衡性並提高非洲裔美國人社區與地方機構和組織之間的溝通和信任。這些措施中的一項就是推出“非洲裔美國人健康村”（African\nA"}, {"id": "<urn:uuid:345bee04-dd18-44a0-9f12-0a1aa49b6851>", "text": "有关处理个人资料的信息\n根据法律D.Lgs. 196/2003 (保护个人资料数据的规定)第13条的精神，负责资料处理的人要告诉您：\na) 可能在实施以下事情时会处理您的个人资料：\n1. 合同义务: 向客人提供物品和服务;\n2. 法律义务：法律上必须履行的开发票、帐目和登记，象有要求的当局报告；\n3. 为汇集信用资料及其它与合同实施活动有关，通知银行机构及类似机构；\n4. 在逗留期间提供服务(秘书服务，交付信件，预订外部的服务) 或处理与逗留相继的事情(通知特别优惠、活动及类似的事情)。\n资料将用手工系统和/或自动化方式处理，实施此资料的存储、管理，并向与所说目的密切相关的地点、以基于我们掌握的资料传送，并且根据您与我们的及时沟通进行偶然的修正、综合和更新；\nb) 如果您拒绝a)一节中的1、2、3点，将会导致：\n1. 如果执行联系或某些操作时个人资料是必须的，则无法建立或继续联系，或不能执行某些操作；\n2. 当执行的某些操作相关的功能性目的需要报告这些个人资料时，不能执行某些操作；\n3. 对于将来更进一步展开的活动，缺乏数据的交流将不能执行联系。\nc) 您的资料除了负责处理的公司内的负"}, {"id": "<urn:uuid:3ed41e30-bca0-46d1-aea1-e512b2f18ff6>", "text": "北京市 海淀区 狮子座\n发消息 写留言\n|博客等级||加载中...|\n|今日访问||加载中...|\n|总访问量||加载中...|\n|最后登录||加载中...|\n1、1986年，吉林省德惠县某贸易公司经理被控诈骗，羁押一年半。张军律师出庭辩护，一审宣判被告无罪。\n2、1987年，长春市几个中学生在大学校园内流氓寻衅滋事案引发某高校学潮，张军律师担任第一被告的第一辩护人，与吉林大学多位著名教授律师一起有效化解矛盾，实现辩护效果。\n3、1992年，驻海南岛某部军官被控贪污，张军律师出庭一、二审法庭辩护，广州军区军事法院二审改判适用缓刑。\n4、2006年，大连市某高校著名教授被控猥亵幼女，张军律师担任侦查、审查起诉和审判阶段的辩护人，最终公检法三机关一致认定教授无罪，检察机关撤回起诉，公安机关撤销案件。\n一、刑事案件收费标准\n（一）刑事案件收费按照各办案阶段分别计件确定收费标准。\n1.侦查阶段，每件收费2000--10000元。\n2.审查起诉阶段，每件收费2000--10000元。\n3.一审阶段，每件收费4000--30000元。\n4.上述收费标准下浮不限。\n（二）二审、死刑复核、再审、申诉案"}, {"id": "<urn:uuid:4f7e7f81-35da-4f67-9bcc-6f961737c05f>", "text": "第3单元 传染病的传播\n我们常常被告知这些：打喷嚏或咳嗽时要捂住嘴巴，不要和病人共用一个杯子，在用餐前要先洗手，不要吃掉在地上的食物。为什么呢？\n原因其实很简单：这些惯例可以帮我们预防病菌的传播。细菌非常微小，而且它们能以各种方式被携带到各个地方，有的是通过像咳嗽或打喷嚏产生的“小点滴”传播的，有的是通过被污染了的食物或水源。\n当然，过分的惊恐其实是不必要的。并不是所有的疾病都如同流行性感冒一样易于传播的，而且不同的疾病有不同的的途径传播。\n以下是人类感染主要传染性疾病的一些途径。\n人与人之间传播\n一旦不小心，人就会将某些传染病传播给他人。\n小液滴\n人们能通过咳嗽或打喷嚏产生的点滴湿气传播感染性疾病。这些小点滴能携带某些特定的细菌。流行性感冒就是一种以小点滴液体传播的病毒。还有一种更危险的病是肺结核，它是一种复发性疾病。\n直接接触和人体体液\n还有一些能从一个人传播到另一个人的疾病并不是通过小滴液体传播的。小儿麻痹症和麻风病都是通过直接接触来传播的。有些疾病，如艾滋，通过性交传播。其他一些，像肝炎，是通过血液传播的。\n食物传播与水源传播\n被污染了的食物与水源都能传播传染性疾病给人类。\n水"}, {"id": "<urn:uuid:77a69345-fb2b-41a7-85cb-519402140d0c>", "text": "家住高陵县耿镇23岁的王妮娜，本年尾月初九和距其家不远的周家村小伙崇二娃举行了盛大的婚礼。耿镇沿渭河一带住民，听说是从避祸搬家过去的，本地人称之为“客货人”。“客货人”嫁女娶亲出格考究，娶亲嫁女必需吃两顿饭，上午是臊子面就四碟小菜。吃事后，看新居，打牌“挖坑”，打麻将，略施歇息。两个小时后，起头进入坐席，七碟子八碗九道车，一个酒盅轮番着喝，吃的是流水席，先等内家人退席就餐，等内家人走后，乡党亲戚起头入座，没了主人都是本人人也没了，呼爹喊娘，携儿带女退席占座，好不繁华。本地人家坐席待客以蒸馍为主，“客货人”则是以白米饭为主，并且必需是上午吃面、下战书吃米饭和馍馍。\n兔年大岁首年代一早上，家住临潼区渭河南岸魏庄村96岁的娥白叟，在儿子魏志高和孙子孙媳一家人的关心下，轻轻哆嗦着双手冲动地从67岁的儿媳杜手中接过红纸包裹着的100元压岁钱和新年的夸姣祝福。因为年前，白叟下炕时不妥心摔伤了腿，不克不迭下地，用饭喝水巨细便都由儿媳杜、儿子魏志高和三个孙子轮番照顾护士。他们泛泛喂白叟吉利红包送孩子也送白叟稀饭、泡奶面包，偶然点支烟让白叟过把烟瘾。大岁首年代一，儿子和儿媳给白叟特意买了她喜好吃的甑糕，"}, {"id": "<urn:uuid:16a645dc-8a0b-452c-b784-5755d7e0a53c>", "text": "|© UNICEF Malaysia/2008|\n|马来西亚中部马六甲科莱巴.贝莎中学的学生参加了一项在全校开展的活动，旨在提高预防艾滋病的意识。这个活动是联合国儿童基金会和教育部在各学校推广基于生活技能的教育项目的一部分。|\n提肖艾报道\n马来西亚吉隆坡，2009年7月22日 – 萨尔科齐（化名）10年之前开始过“上等社会”的生活，他和当地社区的其他男孩子们一起开始尝试大麻和埃利敏5号。在接下来的三年里，他沾染了各种非法毒品，包括海洛因和吗啡。\n吸食毒品使他在体验过极度的快感后跌入情绪的低谷。但是最终快感是不可能持续的。由于担心毒品会使他完全变成另一个人，萨尔科齐决定停止吸毒。萨尔科齐现在二十多岁，不吸毒，并在吉隆坡做生意。\n他说：“我现在看得更明白了。我珍惜我的生命，我希望能够实现更多人生的意义。”\n好奇害死人\n和很多其他的年轻人一样，萨尔科齐在开始吸毒的时候完全是出于好奇心。他回忆道：“我就是想试一下。我当时想，如果毒品是坏东西，那么为什么人们还吸毒呢？”\n|© UNICEF/2007/Nadchatram|\n|年轻人经常在青少年到成年人的过渡阶段尝试非法毒品。这个时期的年轻人不太"}, {"id": "<urn:uuid:e2452d93-d898-47af-aa3f-e96ff0b11a61>", "text": "中国“吊瓶森林”现象严重 大多数感冒无需输液\n大多感冒拉肚无需挂水\n专家：中国抗生素使用是欧美国家的4倍\n“三素一汤”是目前医疗界的一大特点，尤其是抗生素滥用，成了一个毒瘤。日前，在由国家食品药品监督管理局和清华大学国际传播研究中心主办的“食品药品安全报道高级研修班”上，北京协和医院主任药师张继春如是说。她认为，其实，绝大多数感冒和拉肚子都不需使用抗生素，不用吊水，抵制抗生素滥用，需要医生和病人共同努力。\n现象：“吊瓶森林”仍然严重\n抗生素滥用现象在每家大医院的输液室尤其明显，虽然现在已经过了感冒的旺季，但记者在南京各大医院输液室看到，输液的人并不少。“吊瓶森林”现象仍然存在。\n抗生素失效带来的恶果就是“超级细菌”越来越常见，难以治疗的感染病人越来越多。南京军区南京总医院呼吸科宋勇教授说，“基本上常用的抗生素对这些患者都没有效果，要试用很多种才能最终找出一两种有效。”许多医院消化科的大夫也感叹：现在治疗胃炎越来越困难了，一个感染幽门螺杆菌的普通胃炎患者，原来敏感性较强的抗生素一次性根治率可达90%多，如今使用同样的药物，根治率却往往下降到40%—60%。\n当前我国抗菌药物的实际使用强度"}, {"id": "<urn:uuid:5b8a9914-c823-4d1a-bb4e-746030ef991f>", "text": "Click on any phrase to play the video at that point.Close\n大家好，今天我想换一种方式来做这个演讲 我不想很正式地站在这里讲，而是通过聊天 同时，给大家看一些图片 都是截自“第二人生”的很逼真的生活场景 所以，希望你们能喜欢 同时，我也会尽量把大家的注意力 从这些奇特图片上吸引过来 我想先谈一下关于这个（第二人生）的大的构想 然后我会请约翰回来，这样我们可以更加互动的交谈、 思考和提问 我想大家关心的第一个问题会是： 为何要建立一个虚拟世界呢？ 我认为在一定程度上源于 我自己--一个疯狂到了一定程度 来发起这个项目的人\n先介绍一下我个人的背景资料 以及那些从小到大 真正触动我去尝试创立这个项目的因素 我是个读书很多，很有创造力的孩子，最初迷上了电子设备 随后是电脑编程，那时我年龄还很小。 我总是尝试去动手做东西 沉迷于拆装物件 以及任何手工可以完成的，用木头 电子器件、金属等物品做的东西 举个例子：我有一间卧室（这很有第二人生的感觉） 大家知道，每个十几岁的孩子，都拥有自己栖身的卧室 但是我想让卧室门能够像《星际旅行》中一样 上升"}, {"id": "<urn:uuid:2a1b5611-1085-4814-b25d-d1399a175326>", "text": "枪支弹药信息\n南非航空公司枪支运输的规定\n国内航班（南非共和国境内的航班以及从南非共和国出发的航班）\n离港（包括国际离港航班）\n不得在托运行李内夹带枪支，须同托运行李分开、放在适当上锁的枪支容器或盒中。\n弹药必须同武器分开，虽然根据航空条例允许放在托运行李中，但是应放在带锁的容器或弹药盒中，作为单独的行李托运。 托运行李中的弹药不得散放，也不得与枪支放在同一盒中。\n我们强烈建议，将弹药放在上锁的盒子中，可以单独交给枪支窗口检查，以避免托运行李检查过程中可能的延误。\n所有枪支弹药都必须 在接受检查时向航空公司检查人员申报。未申报托运行李内的枪支弹药将导致在托运行李强制安检期间被拒、以及被要求打开行李作进一步检查和安全处理或没收处理并被延后安排搭乘其他航班的后果。\n办理乘机登记手续的工作人员将发出相关的行李标签，然后指示枪主前往有关枪支窗口对枪支弹药进行检查和处理，以保证安全运上飞机。\n在有关枪支窗口验收过程中，将进行如下步骤的检查：\n- 枪主将须出示有效的枪支和弹药牌照或临时进口许可证。\n- 枪主将须申报运输的枪支是安全的空枪。\n- 保安人员会要求枪主打开其托运行李验证，弹药包装牢固以及"}, {"id": "<urn:uuid:eddb7d0f-fcd7-4d6b-b9aa-cd11651d6e9b>", "text": "\n\n本页节选自R.C. 梅特卡夫《致基督教国家的一封信：对应》。欲知更多信息，请登录www.ThinkAgain.us。\n《圣经》中的奴隶\n看来你不信基督教的一个原因是《圣经》里存在奴隶。几乎整个人类历史上都曾有奴隶存在。几个世纪来文化风俗不是一成不变的，而对待奴隶的态度也在随之改变。18世纪前废奴运动还很罕见。《旧约》的《出埃及记》中有很值得注意的最早记载。《旧约律法》帮助奴隶受到仁厚待遇。然而，在埃及，以色列人主要做砖工，条件很恶劣。摩西就带领约600，000以色列人及其家人逃出了埃及的樊笼。\n大英帝国奴隶在1834年由于威廉•威伯福斯和约翰•牛顿等人的不懈努力而获得解放。牛顿是无神论者，他没有任何道德基础去反对奴隶制。他到一艘奴隶船上当仆役，自己的待遇也不比奴隶好多少。后来他有了自己的奴隶船。在一次暴风雨的汹涌之后，约翰•牛顿经历了基督信仰的恩典，他自责参与奴隶贸易的做法。威廉•威伯福斯从1787年直到1833年去世之前都在孜孜不倦地设法实现废除奴隶制。在去世前几个月，他见证了英国议会通过《废除奴隶法案》。英国奴隶贸易的最终结束在很大程度上归功于威伯福斯和牛顿的不懈努力。威伯福斯"}, {"id": "<urn:uuid:444f25a2-d74f-4379-b182-80fd747aef7a>", "text": "桑塔.布鲁门 (Shanta Bloemen) 报道\n莫桑比克瓜拉瓜拉，2011 年 10 月 21 日—— 费立夫.路易斯.梅里美今年 15 岁，在三年前他长期患病的母亲去世以后，他的童年便过早地结束了。他承担起照顾年幼的弟弟妹妹的责任，其中一个还只是个婴儿。\n|联合国儿童基金会记者桥纳.费希尔 (Jonah Fisher) 报道了联合国儿童基金会与莫桑比克政府扩展国家食品补贴项目，使其惠及到贫困和弱势儿童的努力。 在Realplayer中播放|\n在母亲过世后，费立夫带着母亲生前留下的一点钱，按照母亲的嘱托离开了村子，也离开了那里不如意的生活。他穿过小河，在莫桑比克中部索法拉省的瓜拉瓜拉开始了新的生活。\n日常生存斗争\n他设法得到了一小块土地并精心照料，一些邻居帮他家建起了一座茅草屋顶的小房子。他们以自己种植的玉米和一个当地邻居的援助维持生计。这个邻居是当地儿童保护委员会的志愿者，会定期看望他们。\n|© UNICEF/2011/Mozambique|\n|梅里美一家由四个孤儿组成。自从孩子们失去了母亲，15 岁的费立夫便承担起照顾三个年幼的弟弟妹妹的责任。据估计，在莫桑比克，像这样完全由"}, {"id": "<urn:uuid:bd6a1a42-5792-4a12-a081-862baba71956>", "text": "\n\n您所访问的域名可以转让\n好域名只为有经济实力和战略眼光的企业或个人保留！\n出售报价\nEmail：email@example.com\nTel：13504220728\nQQ：3335980\n在线购买域名\n朋友，您是否因为自己的网站没有一个优秀的域名而觉得网站不显档次、不利于宣传推广从而遗憾或者焦急万分呢？您是\n否因为购买域名不知道如何过户或者为传统的邮寄证件和过户协议书的过户方式而头疼万分呢？来吧，这里能帮助您解决一切\n问题。优质的域名，全方位的域名咨询服务，在线免费自由过户的强大交易优势，一分钟解决困扰您好久的问题，让您手握好\n域名驰骋互联网。在这里，一切问题都不是问题！温暖服务是我们一贯的宗旨！\n© 2008 yayou.com.cn All Rights Reserved"}, {"id": "<urn:uuid:236f5fc4-c1a2-4ca7-a1b6-795f2b8e80fc>", "text": "隨著金融產業多元化與全球化的發展，以及國內金融機構購併、整合法源之制訂，國泰金融控股股份\n有限公司於民國九十年十二月三十一日正式成立，登記額定資本額新台幣一千二百億元。\n結合保險、證券、銀行等多樣化的金融機構，國泰金控架構起一個功能完整的經營平台。\n藉由遍佈全省之營業據點與銷售人員，發展共同行銷 (cross-selling)\n的策略，提供客戶一站購足 (one-stop shopping) 的服務。\n部門\n主管姓名\n職稱\n主要職掌\n總經理\n李長庚\n秉承董事會決定方針綜理本公司一切業務。\n稽核處\n潘慶明\n資深副總經理\n財務處\n陳晏如\n行銷規劃處\n孫至德\n策略規劃處\n鄧崇儀\n掌理公司經營策略規劃、購併策略研擬與執行、購併相關之國內外金融產業分析暨同業策略動態追蹤等事項。\n經濟研究處\n程淑芬\n掌理台灣與全球主要國家、地區總體經濟及金融市場之研究，對外發表對總體經濟及金融市場看法、提供子公司相關部門經濟及金融相關資訊以作為對外推展業務之參考、評估經濟模型建置等事項。\n風險管理處\n謝伯蒼\n資訊處\n何西霖\n副總經理\n行政處\n翁德雁\n掌理本公司人力資源、總務及勞工安全衛生工作之規劃與執行、股東會籌"}, {"id": "<urn:uuid:1515a53d-de20-4285-9d41-db2f3b15b395>", "text": "可是有一天，它的思維發生了轉變，它決定改變它的人生態度（確切點說應該是驢生態度），它每天都把垃圾踩到自己的腳下，而不是被垃圾所淹沒，並從垃圾中找些殘羹來維持自己的體能。終於有一天，垃圾成為它的墊腳石,使它重新回到了地面上。\n不 要抱怨你的不如意，不要抱怨你的男人窮，你的女人醜，不要抱怨你沒有一個好爸爸，不要抱怨你的工作差，工資少，不要抱怨你空懷一身絕技沒人賞識你，現實有 太多的不如意，就算生活給你的是垃圾，你同樣能把垃圾踩在腳底下，登上世界之巔。這個世界只在乎你是否到達了一定的高度，而不在乎你是踩在巨人的肩膀上上 去的，還是踩在垃圾上上去的。而事實上，踩在垃圾上上去的人更值得尊重。\n年輕，沒有失敗！看驢生豪邁，不過從頭再來‧‧‧‧‧‧\n人生不過如此，又有什麼值得你去傷悲的事，你就當它是踩在腳下的垃圾好了，讓它成為你人生成功的墊腳石。\n讓我們來看看一個人的簡歷。\n1818年（9歲），母親去世。\n1831年（22歲），經商失敗。\n1832年（23歲），竟選州會員落選。\n同年（23歲），工作丟了。想就讀法學院，但未獲入學資格。\n1833年（24歲），向朋友借錢經商。\n同年（24歲），再次破產"}, {"id": "<urn:uuid:43db4a2c-7990-4a36-aab8-d8e4459a26f6>", "text": "送交者: 余生 于 April 16, 2001 09:29:20:\n我的1989（9）\n余生\n（9）\n学校里也和以前不一样了。\n课是早就不上了。经常有同学约着一批批地去北京。当然，也有许多同学约\n着天南海北去旅游，反正坐火车不用买票了。\n我们学校的学生也象北京的学校那样成立了“学生自治联合会”，占领了学\n校广播站，天天广播北京的消息。\n小字报贴满了宿舍楼的大门。我大致看了看，大都是从北京的传单上抄的。\n什么“中国的四大官倒公司”、“邓小平的家族”、“学生的民主要求”等等。\n李铁映和邓小平的关系我就是从小字报知道的。\n我们宿舍的几个人又开始打扑克。但一般是边打扑克边看电视。或者通过收\n音机听“美国之音”等外国电台。\n我觉得在学校比在北京消息都灵通。电视和广播的报道不但全面，而且条理\n清晰，比我自己看到的乱糟糟的明白多了。\n但打扑克的几个人流动性也很大，谁出去几天，也不太在意。知道不是去北\n京，就是回家了，或者去哪儿旅游了。\n就这样过了几天。\n突然，学校里奔走相告：“绝食了！绝食了！”\n学校的广播站开动大喇叭广播北京学生的绝食宣言。号召同学们支持北京的\n同学。\n“到北京去！”成了大家的口"}, {"id": "<urn:uuid:537a6434-9cf5-47a1-b09c-dfc6f6801008>", "text": "服務條款當你連結及使用本網站時，表示你已同意其服務及使用條款。如你不希望受這些服務條款所約束，你或可選擇不瀏覽本網站。服務條款可能會隨時更新。這些更新會即時生效，而持續登入或使用本網站會被認定同意接受已更新的條款。\n定義:\n\"PPIB\" 即是Pacific Prime Insurance Brokers Limited，它的母公司及子公司包括快而保。\n\"用家\" 指任何瀏覽本網站的人。\n1. 網站用途\n1.1 PPIB與任何保險公司或第三者內容提供者的聯繫不應被視為一種建議或對他們服務的一種支持。\n1.2 當使用本網站或網站連結所提供的內容及服務時，用家須獨自 負上全部責任。如你對服務感到不滿，你應停止使用本網站。\n1.3 本網站所提供的產品及服務不能在香港以外地區銷售或售價 給那些不能循法律途徑簽定合同的人。PPIB對此並不會負上任何法律責任。\n1.4 用家不可防礙網站的運作，複製網站的一切內容以及收集有關用家的資料。\n2. 責任及賠償\n2.1 PPIB雖然盡力確保所提供資料的準確性及信賴性，但對此亦不能百分百作出保證，而PPIB將不會為任何因不準確或缺漏所造成的損失或破壞（包括一切侵"}, {"id": "<urn:uuid:f6c6eb79-0411-4330-94de-c46b1801f4a6>", "text": "約瑟的神奇彩衣\n|約瑟的神奇彩衣\n\n\n|首演地點||Colet Court學校\n\n\n（1968年3月1日）\n|語言||英語|\n|製作||勞伯史汀伍(Robert Stigwood)|\n|音樂||安德魯·洛伊·韋伯|\n|作詞||提姆·萊斯|\n《約瑟的神奇彩衣》（Joseph and the Amazing Technicolor Dreamcoat）是安德魯·洛伊·韋伯和提姆·萊斯（Tim Rice）於1967年推出的第一部音樂劇。該劇是洛伊韋伯的處女作，1968年起在倫敦上演，當時他僅僅20歲。正是這部戲開始了洛伊韋伯的音樂劇傳奇。約瑟的故事完全取材於《舊約聖經》的《創世紀》所描述，有關猶太民族的祖先約瑟的故事。故事講述約瑟特別受父親寵愛，因此招至他的11個兄長嫉妒，在他出外牧羊的一天，被賣給人口販子，並輾轉去到埃及。與此同時，他的兄長對父親謊稱約瑟意外死了。後來約瑟因為被人陷害而下了監牢，卻意外使他有機會為法老解夢，使埃及渡過長達七年的饑荒。最後在父親兄弟家 鄉糧食不繼前來埃及買糧之時重聚。\n劇中一首《無路可走》（Close Every Door to Me）生動地刻畫了約瑟被陷害後"}, {"id": "<urn:uuid:0c3982e9-4df8-4a4b-810b-665e6e8a8cae>", "text": "【文匯網訊】據中國新聞網4月25日報道，申思、祁宏、李明、江津這昔日「四大國腳」，作為中國足球第二批足壇反腐案涉案的球員，以非國家工作人員受賄罪，25日在瀋陽市中級人民法院出庭受審。「四大國腳」對於檢察機關指控的犯罪事實基本表示認可。但其辯護律師認為，他們都有主動交待犯罪事實的從輕情節，請求法院從輕處理。法院未當庭宣判。\n據官媒報道，在2003年末代甲A之戰中，天津泰達老總找到前上海中遠球員申思，拜託他讓天津獲勝保級，酬勞為800萬元。隨後申思找到江津、祁宏、李明3名國腳，3人表示領會。結果天津泰達2比1取勝上海中遠，成功保級。事後4人分別獲得200萬元酬謝。\n這4名前國腳在中國曾是家喻戶曉。申思曾擔任前國奧隊隊長；祁宏是中國隊唯一一次打入世界盃決賽階段的主要功臣；江津曾擔任中國明星足球隊教練，組織過一些慈善比賽；李明原效力山東魯能，後自由轉會加盟上海國際。\n遼寧省申揚律師事務所的曲柏傑是李明的辯護律師，他接受記者採訪時表示，東窗事發後，4被告人的受賄款有的部分花銷，有的原封不動，但最後他們都把受賄款主動上交給公安機關。\n曲柏傑說，案件中最關鍵的問題，也是在法庭上辯論最激烈的部分，是圍"}], "3": [{"id": "<urn:uuid:449241ec-16cd-4bdc-8371-6f87c481d148>", "text": "- 约炮应用遭苹果商店下架\n- 大学生玩网游骗女友50万\n- 武汉:别只顾蹭4G忘记下车\n- 默多克发微博唱衰Facebook\n- 叙利亚电子军入侵FT推特\n- 手机平台游戏收入远超掌机\n- Twitter宣布与NBA合作直播\n- 8美元将iPhone改成显微镜\n- 雅虎日本用户ID疑遭泄漏\n- 康宁推新强化玻璃“莲花”\n- HTC超凡体验广州站开幕!\n- 多家运营商加码抢先布局5G\n- LG和夏普成苹果屏幕供应商\n- 上海移动下月起规模测试4G\n- 谷歌无处不在窃取你的信息？\n- 中国收藏家持有1%比特币\n- 库克烦美国资金征税太高\n- 三星首创45nm嵌入式闪存\n- 谷歌眼镜每月推出软件更新\n- 加拿大监管机构拟调查谷歌\n- 约炮应用Bang with Friends遭苹果下架18日\n- 大学生玩网游骗女友50万 涉嫌诈骗被捕18日\n- 武汉4G网络覆盖公交线 忧乘客蹭网忘下车18日\n- 默多克:Facebook用户粘性下滑 有衰败先兆18日\n- 叙利亚电子军入侵金融时报Twitter账户18日\n- iOS和安卓平台游戏应用收入达掌机3倍18日\n- Twitter宣布与NBA合作发"}, {"id": "<urn:uuid:c60a150b-0eca-48f5-a9e4-bd00cf523e25>", "text": "‧軟體名稱：DeepBurner\n‧軟體下載：\n‧軟體分類：燒錄程式\n‧軟體性質：Freeware\n‧更新日期：2003-12-25\n‧最近版本：1.1\n‧作業系統：Windows XP/2000/Me/98/95/NT\n‧語言界面：英文\n‧購買金額：-\n‧試用限制：-\n‧原創公司：ASTONSOFT\n‧評 等：\n【軟體簡介】\nDeepBurner 的操作介面類似眾人愛用的 Nero 燒錄軟體，而且功能也不少。它運用精靈的方式，而且提供電腦使用者三種不同的燒錄型態，如「CD/DVD 檔案」、「自動開機光碟」、「印製光碟封面」，供常用燒錄的使用者能夠 EZ 的使用。\n【詳細說明】\n編輯／PChome 小編（2003-12-25）\nDeepBurner 這套軟體是一款新出品的燒錄軟體，它可以製作廣為國人熱愛使用的 CD 和 DVD 光碟，而且完全集合在 DeepBurner 裏。利用 DeepBurner 這套燒錄程式，我們可以自由且方便的把所有的影音檔和資料檔製作成 CD 和 DVD 的光碟，如同我們使用 NERO 一樣，等於是所有我們需要用到燒錄軟體的檔案都適用。\n它提供了高效率的作業"}, {"id": "<urn:uuid:1e56b9fc-7ac4-40ae-a937-448b99d068d8>", "text": "\n\n以积极的态度度过更年期,妇女进入更年期后,一切组织器官,包括大脑在内都会从形态到功能逐步产生退化,表示出人体各种功能和对内、外环境适应才能的下降.人的心理活动是大脑的功能之一,皇冠网,大脑的衰老也会表现为心理的衰老.所以一个人的朽迈包含心理跟生理两方面,而状态和功能的变更经常不是平行的关联.更年期妇女因为绝经的到来,动物神经功效杂乱,引起一系列症状.而积极的心理活动能影响大脑的生理功能,百家乐真人游戏,可推迟衰老的进展.有的人\"心理年龄\"大于生理年纪,表现为未老先衰;有的人生理春秋大于其\"心理年龄\",表现为\"老当益壮\".因此进入更年期呈现的一些景象,在妇女中存在很大差别.上述更年期妇女心理活动的特色提醒,能够通过踊跃的立场和本身的尽力而顺利地渡过更年期,并且可以使本人的\"心理年龄\"大大小于生理年龄,从而推迟衰老,到达延年益寿的目标.要做到这一点,须留神以下多少个方面:1)迷信地部署和准确看待日常的所有运动;对,周景龙的农夫职业博客(zhjl2552'职业博客) - 企业博客网\n\n\nzhjl2552.blog.bokee.net\n地域:金华\n文章归档\n<< 2011年>>\n01月02"}, {"id": "<urn:uuid:b0a084a0-54b8-4140-a107-00660f0bd101>", "text": "Debian GNU/Linux 4.0 正式發佈\n2007年04月08日\n經過 21 個月以來不斷的努力，Debian 計劃正式發佈命名爲\netch 的\nDebian GNU/Linux 4.0 版本。Debian GNU/Linux\n是一個共支持十一個處理器架構及包含了 KDE、GNOME 和 Xfce\n桌面環境的自由作業系統。此外，它亦內置了加密軟體。與其他軟體的兼容性亦隨著新增了對\nFHS 2.3 和 LSB 3.1 標準的支援而得到大大的提高。\nDebian GNU/Linux 4.0 的安裝過程亦較之前的版本來得順暢和整合，因此這個版本可以讓使用者直接在安裝過程中定義加密分區。新開發的圖形化安裝介面亦爲多 種語文，包括少數民族的文字，提供支援。現在 Debian GNU/Linux 安裝系統所支援的語言已增至 58 個。\n另外，Debian GNU/Linux 4.0 版亦提高了套件管理系統的保安及效率。APT 的安全機制能夠驗證從映射站台下載的套件是完好無缺和未被改動。套件索引檔更新時亦 由以往將整個新的索引檔重新下載一次的做法改善爲只下載更改了的部份，從而減少要從映射站"}, {"id": "<urn:uuid:75ff61f4-ded1-4266-9efd-171ba5da9d75>", "text": "很短的一段时间里，在不知不觉中深深吸了一口气喝了\n继电器 24v胡志明领导的积雨云积雨云云的白浮人 ，恢复在地面上，被打\n前一天她离开，她要像运行在让手机 变得憔悴的头短让它感到不寻常的\n但是，看着的烟花送我花，因为女士们的竞争和其他筛选的人群受到疲惫的身体和丢弃，无论多么美丽，甚至没有逗乐\n继电器 24v所以我想，为什么人们更容易的对手相信你是说，放弃了\n衣服，那是什么？“ 出现昨天的复音没有说上课不舒服的头脑整个\n在213教室的形式，由一个圆台周围是热空气流\n恩清除所有这一切，因为“正确”的银直观地感受到\n莱恩在菜单选择推荐的天然食品\n有一段时间它作为的笑他 今天吃了不少苦头，气氛...\n听起来很安静，低的时候寂寞，随着时间的推移，他打破了沉默\n继电器 24v炫的宝座上看到的大使\n提名香烟减去价值的材料，一个痣是不可能的要求 两个女人从未见过一个年轻的女人，她走到自己，面对对方，并开始了海军的待机 继电器 24v莉莎这个从来没有吃坏心，已知，从老简单的希望看到的，和过目不忘的王者，而不是慢慢地张开嘴\n继电器 24v高大的士兵盘问胎儿的愤怒等\n金博士医院的培训：（有点夸张）的报告\n男"}, {"id": "<urn:uuid:d04fa85b-9f20-41c9-8595-e71e8ed110b6>", "text": "【晴報專訊】「低俗，賣錢！」去年曾在本欄以此標題分析《低俗喜劇》的大賣原因，沒想到藝發局首屆舉辦的藝評獎，竟然靠此片「一炮而紅」，全賴一班評審選出由北京賈選凝惡批《低俗喜劇》的影評獲得冠軍，進一步激化中港矛盾，掀起一股低俗風。\n賈選凝大罵《低》片抹黑內地人，卻沒有否認劇情反映事實，實在是掩耳盜鈴。\n無意在此討論偏頗的言論，只是不想賈選凝藉香港人的公帑而獲得「精神勝利」，建議她將藝發局這次頒給她的五萬元獎金捐予慈善機構，以示跟低俗劃清界綫；同時，她更應該加入中產行列，跟隨財政司司長曾俊華去看法國電影、歎咖啡，寫法國的電影影評，別靠「低俗」賺錢，做一個高貴的才女。\n撰文︰查小欣"}, {"id": "<urn:uuid:51d8e6cf-63dc-411c-8413-babea65e4eca>", "text": "今天早上呢，是我們 中正大學通訊工程研究所 一起拍團拍的時間，10點半就要開始拍了，這次大概是大家最早到實驗室的時候，不然大家應該都是到下午才會慢慢出現在實驗室，不過還好，我都很早起床就去實驗室了，哈哈，今天照相還蠻好玩的，我的老師穿的很正式，終於看到老師穿西裝打領帶了，真的帥呆了，一堆女生搶著要跟侯老師合拍，還說跟老師拍完才可以畢業，結果我跟老師合拍的時候，老師說我還要讀四年，囧～，底下是我跟老師合拍，老師真的好高阿\nMonthly Archive for November, 2008\n在 Linux 系列 OS 安裝好之後，都會有支援一個 fuser 這一個指令，那有時候在 linux 底下 mount 隨身碟，或者是其他硬體的時候，有時候沒辦法讓您移除，會出現：『Device is busy』，那這個訊息是在保護確保你的資料有儲存到該裝置，有時候如果沒有正確移除，會造成資料遺失，或者是資料不完整，那基本上裝上任何一套 Linux 作業系統，都會有支援了，所以不必在另外安裝，那 FreeBSD 那就要在安裝 /usr/ports/sysutils/fuser 這一個 tool 這樣"}, {"id": "<urn:uuid:710b4f21-ce64-4a18-bd9f-e8fd04c6562c>", "text": "粗壮的腰身、乱蓬蓬的头发、寒酸的服装，47岁的英国妇女苏珊·博伊尔出现在《英国达人》选秀节目的舞台上。然而当她展开歌喉的时候，她姗姗来迟的成功终于降临。苏珊一夜之间红遍全球。\n这个来自苏格兰中南部小镇上的中年女人一直独身，一辈子也没有跟男生约会过。自从12岁喜欢上唱歌后，她一直梦想成为伊莲·佩姬一样的职业歌唱家。在接受媒体采访时苏珊说：“我参赛动机非常简单，第一：圆儿时的梦想；第二：通过节目找到一个伴侣。”\n苏姗的故事特别容易被包装成一个“有志者事竟成”的成功个案。诸如“宝剑锋从磨砺出，梅花香自苦寒来”，“只要功夫深，铁杵磨成针”，“成功在于再坚持一下的努力之中”等中外名句都可以用来做这个故事的注解。\n在中国，现在也有一个有点关联的故事在电视和网络上流传。一位名叫谢利华的41岁女性，北漂13年耗去父母300万，也是为圆歌唱梦想。自称为学生的谢利华现在最主要的舞台是菜市场，买菜的时候唱上几嗓子，赢得人们的热烈的掌声。参加高额的培训、向评委上供，请导演吃饭以及13年的生活费这是谢利华父母300万血汗钱的去向。谢立华每天都背着一个重达30多斤的大包，这里装着和她唱歌相关的所有东西，从不离身。"}, {"id": "<urn:uuid:7cdfdc3c-3352-4dab-908b-78db1206239e>", "text": "作为专业的桥式龙门加工中心制造厂家，我们的宗旨是“The value of Trust价值源于信任”，我们深知机床的可靠性对企业制造的影响，对于因操作不慎或者机床维护而造成的报警，以及各种配件服务，乃至普通的技术咨询。我们随时为你提供最快捷的响应。\n分布全国各地的技术服务中心和配件库为您提供坚强的服务后盾，可以享受良好的现场培训服务，这些服务标准已经为同类企业树立一个新的标杆。"}, {"id": "<urn:uuid:5b6114d1-d06f-49cc-a57e-53769564a2c7>", "text": "\n\n为了获得女子对自己的好感，姜键带着她游山玩水。年他所在的企业裁员，他下了岗。年月，公司接到举报，派员前来办事处查账。他原本是当涂一家企业的职工。柳明利用自己与姜键家人知道得清楚的关系，多次找到姜键的亲属，网上开户，耐心细致地做思想工作，动员他们劝说姜键认清形势，主动投案。\n侵占单位巨款玩失踪\n心爱的女人从人的总称社会形态“蒸发”让姜键心口隐隐作痛，更让他头痛的是借下的债务是要偿还的。。可他立志要闯出一番新天地。在柳明推心置腹的劝说下，姜键终于放下包袱，讲明自己目前在四川成都，应承向警方投案自首。\n目前，姜键已由广东佛山警方带回佛山审查处理。\n女网友拿钱后音信皆无\n有钱了，姜键的兴趣也从工作转移到了吃喝玩乐上，一桌席面、一场卡拉动辄数千甚至上万元。\n每人民警察察做工作幡然悔悟\n“清网举措”开始后，当涂县公安局在梳应该涂籍在外地犯罪后尚未归案的犯罪嫌疑人时，获悉姜键的信息，遂将规劝其投案自首的任务开赴了该局大陇派出所副所长柳明。\n\n\n
