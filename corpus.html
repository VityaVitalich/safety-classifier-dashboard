<style>
:root{--bg:#0f1115;--card:#171a21;--mut:#8b94a3;--line:#262b36;--accent:#5b8cff}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:#e6e9ef}
header{position:sticky;top:0;background:#0f1115ee;backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:14px 20px;z-index:5}
h1{font-size:17px;margin:0 0 10px}
.bar{display:flex;gap:18px;flex-wrap:wrap;align-items:center}
.bar label{color:var(--mut);margin-right:6px}
select,input{background:#15233f;color:#cfe;border:1px solid var(--accent);border-radius:6px;padding:5px 9px;font-size:13px}

.wrap{padding:18px 20px;max-width:1500px;margin:0 auto}
.note{font-size:12px;color:var(--mut)}
.warn{color:#ffcf6b}
.kpis{display:flex;gap:24px;flex-wrap:wrap;margin:4px 0 2px}
.kpi b{font-size:18px;color:#cfe}
table{border-collapse:collapse;width:100%;font-size:13px;margin-top:12px}
th,td{border-bottom:1px solid var(--line);padding:6px 10px;text-align:right}
th:first-child,td:first-child{text-align:left}
th{position:sticky;top:0;background:#141821;cursor:pointer;user-select:none;color:#cdd6e4}
tr:hover td{background:#141821}
.stack{display:flex;height:16px;width:250px;border-radius:3px;overflow:hidden;border:1px solid var(--line)}
.seg{height:100%;display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#0b0d10;overflow:hidden}
.pcts{font-size:11px;font-variant-numeric:tabular-nums;margin-top:3px;white-space:nowrap}
.pcts .sep{color:var(--mut);margin:0 4px}
.legend{display:inline-flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:11px;color:var(--mut)}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:3px;vertical-align:middle}
.pct{font-variant-numeric:tabular-nums}
.lname{color:var(--mut);margin-left:8px}
.hot{color:#ff8585}
td.dist{text-align:left}
.corpnav{margin:2px 0 8px;font-size:12px;color:var(--mut)}
.corpnav a{color:var(--accent);text-decoration:none;margin-right:12px}
.corpnav a.active{color:#e6e9ef;font-weight:700;text-decoration:underline;cursor:default}
.corpnav .lbl{margin-right:6px}
</style></head><body>

const COL=["#3fb950","#9ad14b","#e3c64a","#e8923a","#e8643a","#d6342c"]; // 0 safe -> 5 unsafe
const fmt=n=>n.toLocaleString();
let sort={k:"n",dir:-1};
function flagged(c,k){let s=0;for(let i=k;i<6;i++)s+=c.hist[i];return s;}
function legend(){document.getElementById("legend").innerHTML=
  COL.map((c,i)=>`<span><span class="sw" style="background:${c}"></span>${i}</span>`).join("");}
function render(){
  const k=+document.getElementById("thr").value, minn=+document.getElementById("minn").value;
  const q=document.getElementById("q").value.trim().toLowerCase();
  const G=D.global, gf=flagged(G,k);
  document.getElementById("sub").textContent=`· ${D.label} · ${D.encoder} · ${D.n_languages.toLocaleString()} language(s)`;
  document.getElementById("kpis").innerHTML=
    `<span class="kpi">total docs <b>${fmt(G.n)}</b></span>`+
    `<span class="kpi">flagged ≥${k} <b class="hot">${fmt(gf)}</b> (${(100*gf/G.n).toFixed(2)}%)</span>`+
    `<span class="kpi">languages shown <b id="nshown">–</b></span>`;
  document.getElementById("caveat").textContent=D.note;
  let rows=Object.entries(D.languages).map(([lang,c])=>({lang,n:c.n,fn:flagged(c,k),flag:c.n?flagged(c,k)/c.n:0,hist:c.hist}));
  rows=rows.filter(r=>r.n>=minn && (!q||r.lang.toLowerCase().includes(q)));
  const key=sort.k;
  rows.sort((a,b)=> key==="lang" ? a.lang.localeCompare(b.lang)*sort.dir
                  : key==="dist"? (b.flag-a.flag)*1 : (a[key]-b[key])*sort.dir);
  const NAMES=D.names||{};
  document.getElementById("rows").innerHTML=rows.map(r=>{
    const pct=r.hist.map(h=> r.n? 100*h/r.n : 0);
    const segs=pct.map((w,i)=>{const lbl=w>=10?Math.round(w):'';
      return `<span class="seg" style="width:${w.toFixed(2)}%;background:${COL[i]}">${lbl}</span>`;}).join("");
    const nums=pct.map((w,i)=>`<span style="color:${COL[i]}">${w.toFixed(1)}</span>`).join('<span class="sep">·</span>');
    const nm=NAMES[r.lang]?`<span class="lname">${NAMES[r.lang]}</span>`:'';
    const hot=r.flag>=0.30?' class="hot"':'';
    return `<tr><td><code>${r.lang}</code>${nm}</td><td>${fmt(r.n)}</td><td class="pct"${hot}>${(100*r.flag).toFixed(2)}% <span class="lname">${fmt(r.fn)}</span></td>`+
           `<td class="dist"><span class="stack" title="${r.hist.join(' / ')}">${segs}</span><div class="pcts">${nums}</div></td></tr>`;
  }).join("");
  document.getElementById("nshown").textContent=rows.length.toLocaleString();
  document.getElementById("foot").textContent=`Showing ${rows.length} of ${D.n_languages} languages (min docs filter). Click a header to sort.`;
}
document.querySelectorAll("th").forEach(th=>th.onclick=()=>{
  const k=th.dataset.k; sort.dir=(sort.k===k? -sort.dir : (k==="lang"?1:-1)); sort.k=k; render();});
["thr","minn","q"].forEach(id=>document.getElementById(id).addEventListener("input",render));
document.getElementById("exlink").href="examples.html?ds="+encodeURIComponent(D.examples_ds||"");
legend(); render();
</script></body></html>
